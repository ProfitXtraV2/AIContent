<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>VsichkiKazina — Content Autopilot</title>
<style>
  :root {
    --bg: #eef1f7; --card: #ffffff; --line: #e3e8f0; --ink: #1f2a3d;
    --muted: #64748b; --accent: #2563eb;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 14px rgba(16,24,40,.06);
    --ok-bg: #e7f8ee; --ok-line: #b6ead0; --ok-ink: #0f8a4d;
    --low-bg: #fef3e2; --low-line: #f6d9a8; --low-ink: #b3730a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  header { display: flex; align-items: baseline; justify-content: space-between;
           flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
  h1 { font-size: 1.35rem; margin: 0; letter-spacing: .2px; font-weight: 700; }
  h1 .dot { color: var(--accent); }
  .sub { color: var(--muted); font-size: .85rem; }
  a { color: var(--accent); }

  /* section wrapper — clear visual separation */
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
           box-shadow: var(--shadow); padding: 1.25rem 1.35rem; margin-bottom: 1.25rem; }
  .panel > .phead { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em;
                    color: var(--muted); font-weight: 600; margin: 0 0 .9rem; }

  .links { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 1.25rem; }
  .links a { text-decoration: none; font-size: .82rem; color: var(--ink);
             background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
             padding: .4rem .75rem; border-radius: 999px; transition: .15s; }
  .links a:hover { border-color: var(--accent); color: var(--accent); }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
           gap: 1rem; margin-bottom: 1.25rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
          box-shadow: var(--shadow); padding: 1.15rem 1.25rem; }
  .card .lbl { color: var(--muted); font-size: .72rem; text-transform: uppercase;
               letter-spacing: .09em; margin-bottom: .55rem; font-weight: 600; }
  .card .big { font-size: 2rem; font-weight: 700; line-height: 1; color: var(--ink); }
  .card .note { color: var(--muted); font-size: .8rem; margin-top: .5rem; }
  .buffer.ok { background: var(--ok-bg); border-color: var(--ok-line); }
  .buffer.ok .big { color: var(--ok-ink); }
  .buffer.low { background: var(--low-bg); border-color: var(--low-line); }
  .buffer.low .big { color: var(--low-ink); }
  .bar { height: 8px; background: #eaeef5; border-radius: 999px; margin-top: .7rem; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .buffer.ok .bar > i { background: var(--ok-ink); }
  .buffer.low .bar > i { background: var(--low-ink); }
  .pills { display: flex; flex-wrap: wrap; gap: .4rem; }
  .pill { font-size: .74rem; padding: .28rem .6rem; border-radius: 999px;
          background: #f1f4f9; color: var(--muted); }
  .pill b { color: var(--ink); }

  table { border-collapse: collapse; width: 100%; font-size: .86rem; }
  th, td { padding: .6rem .65rem; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: .7rem; text-transform: uppercase;
       letter-spacing: .06em; background: #f7f9fc; }
  th[title] { cursor: help; text-decoration: underline dotted; text-underline-offset: 3px; }
  thead th:first-child { border-top-left-radius: 8px; }
  thead th:last-child { border-top-right-radius: 8px; }
  tbody tr:hover { background: #f5f8ff; }
  tbody tr:last-child td { border-bottom: none; }

  .st { font-size: .73rem; padding: .18rem .55rem; border-radius: 999px; font-weight: 600;
        display: inline-block; }
  .st-drafted { background: #e7f8ee; color: #0f8a4d; }
  .st-approved { background: #e4f1ff; color: #1668c7; }
  .st-posted { background: #eef1f6; color: #64748b; }
  .st-failed { background: #fdeaea; color: #c0392b; }
  .st-in-progress { background: #fef3e2; color: #b3730a; }
  .op { font-size: .72rem; padding: .14rem .45rem; border-radius: 6px; font-weight: 600; white-space: nowrap; }
  .op-Strong { background: #e7f8ee; color: #0f8a4d; }
  .op-Good { background: #e4f1ff; color: #1668c7; }
  .op-Moderate { background: #fef3e2; color: #b3730a; }
  .op-Weak { background: #f1f4f9; color: #64748b; }
  .chk { font-size: .68rem; padding: .12rem .42rem; border-radius: 999px; white-space: nowrap; }
  .chk-ahrefs { background: #e7f8ee; color: #0f8a4d; }
  .chk-web { background: #e4f1ff; color: #1668c7; }
  .chk-none { background: #f1f4f9; color: #94a3b8; }
  .gem { font-size: .7rem; padding: .14rem .5rem; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .gem-pass { background: #e7f8ee; color: #0f8a4d; }
  .gem-warn { background: #fef3e2; color: #b3730a; }
  td .sugg { color: var(--muted); font-size: .82rem; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); padding: 1.25rem .2rem; }

  .tabs { display: flex; flex-wrap: wrap; gap: .3rem; border-bottom: 1px solid var(--line);
          margin: 0 0 1rem; }
  .tab { background: none; border: none; color: var(--muted); cursor: pointer;
         padding: .6rem .9rem; font-size: .88rem; border-bottom: 2px solid transparent;
         display: flex; align-items: center; gap: .45rem; font-weight: 500; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tab .badge { font-size: .72rem; background: #eef1f6; color: var(--muted);
                border-radius: 999px; padding: .05rem .5rem; min-width: 1.3rem; text-align: center; }
  .tab.active .badge { background: var(--accent); color: #fff; }
  .tab.deploy.active { color: #1668c7; border-bottom-color: #1668c7; }
  .tab.deploy.active .badge { background: #1668c7; }
  .tab.review.active { color: #0f8a4d; border-bottom-color: #0f8a4d; }
  .tab.review.active .badge { background: #0f8a4d; }
  .rlinks a { margin-right: .55rem; white-space: nowrap; text-decoration: none; }
  .rlinks a:hover { text-decoration: underline; }

  footer { color: var(--muted); font-size: .76rem; margin-top: 1rem; text-align: center; }

  .run-banner { display: flex; align-items: center; gap: .6rem; padding: .8rem 1.1rem;
                border-radius: 14px; margin-bottom: 1rem; font-size: .9rem;
                border: 1px solid var(--line); box-shadow: var(--shadow); }
  .run-banner.running { background: var(--ok-bg); border-color: var(--ok-line); color: #0f6b3d; }
  .run-banner.idle { background: var(--card); color: var(--muted); }
  .run-banner .live { width: 10px; height: 10px; border-radius: 50%; background: #16b866;
                      box-shadow: 0 0 0 0 rgba(22,184,102,.6); animation: pulse 1.4s infinite; flex: none; }
  .run-banner.idle .live { background: #b6bfce; animation: none; box-shadow: none; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(22,184,102,0); }
                     100% { box-shadow: 0 0 0 0 rgba(22,184,102,0); } }
  .run-banner a { margin-left: auto; white-space: nowrap; }
  .steps { display: flex; flex-wrap: wrap; gap: .4rem; margin: 0 0 1.25rem; }
  .step { font-size: .72rem; padding: .24rem .6rem; border-radius: 999px;
          border: 1px solid var(--line); background: var(--card); color: var(--muted); }
  .step.done { color: #0f8a4d; border-color: var(--ok-line); background: var(--ok-bg); }
  .step.done::before { content: "✓ "; }
  .step.current { color: #0f6b3d; border-color: #16b866; background: #d8f5e6;
                  animation: pulse 1.4s infinite; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <div id="runBanner" class="run-banner" style="display:none"></div>
  <div id="runSteps" class="steps" style="display:none"></div>
  <header>
    <h1><span class="dot">●</span> VsichkiKazina — Content Autopilot</h1>
    <div class="sub" id="site"></div>
  </header>

  <nav class="links" id="links"></nav>

  <section class="cards">
    <div class="card buffer" id="bufferCard">
      <div class="lbl">Buffer (written · unposted)</div>
      <div class="big" id="bufferBig">—</div>
      <div class="bar"><i id="bufferBar" style="width:0%"></i></div>
      <div class="note" id="bufferNote"></div>
    </div>
    <div class="card">
      <div class="lbl">Next scheduled run</div>
      <div class="big" id="nextRun" style="font-size:1.15rem">—</div>
      <div class="note" id="nextRunNote"></div>
    </div>
    <div class="card">
      <div class="lbl">Pipeline status</div>
      <div class="pills" id="counts"></div>
      <div class="note" id="lastGen"></div>
    </div>
  </section>

  <section class="panel">
    <div class="phead">Articles &amp; backlog</div>
    <div class="tabs" id="tabs"></div>
    <div id="tabContent"></div>
  </section>

  <footer id="footer"></footer>
</div>

<script>
const LABELS = {
  site: "Live site", repo: "Repo", prs: "Pull requests",
  routine: "Run / routine", backlog: "Topic backlog", queue: "Content queue"
};

// Hover explanations for table column headers (shown as native tooltips).
const TIPS = {
  volume: "Vol — monthly search volume in Bulgaria (Ahrefs): how many people search this keyword per month. Higher = more demand / potential traffic.",
  kd: "KD — Keyword Difficulty 0–100 (Ahrefs): how hard it is to rank #1. Higher = more competition.",
  opportunity: "Opportunity — our combined score from Vol × (1−KD): high volume + achievable difficulty = Strong. In short: is it worth writing?",
  gemini: "Gemini — cross-model AI-detection score. Green ✓ = ≥80% human-likeness (passed); amber = below the 80 target; '— not run' = not yet checked.",
  checked: "Checked — how the metrics were obtained: ✓ Ahrefs (real API data), web (fallback estimate), or unchecked.",
  intent: "Intent — search intent (Ahrefs): informational / commercial / transactional / navigational.",
  trend: "Trend — search-volume direction over time (up / flat / down).",
  source: "Source — where the topic came from: your backlog or the AI research bank.",
  keywords_or_terms: "The keywords this article/topic targets.",
  researched_keywords: "The keywords researched for this candidate.",
  status: "Lifecycle status of the article.",
  ahrefs_note: "Ahrefs verdict + a stronger-variant suggestion if the keyword is weak.",
  suggestion: "One-line rating / verdict for the keyword.",
  priority: "Your priority order (lower = written first).",
  query: "The article title / topic.",
  pr: "Pull request number.",
  links: "Links to the PR and the article's files in the repo.",
};

function nextRunFromSchedule(sched) {
  // cron fires at one or more fixed UTC hours/day. Find the next future occurrence.
  const now = new Date();
  const hours = sched.cron_utc_hours || [sched.cron_utc_hour];
  let best = null;
  for (let d = 0; d < 2; d++) {
    for (const h of hours) {
      const t = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(),
                                  now.getUTCDate() + d, h, sched.cron_utc_minute || 0, 0));
      if (t > now && (!best || t < best)) best = t;
    }
  }
  return best;
}

function fmtSofia(d) {
  return d.toLocaleString('bg-BG', { timeZone: 'Europe/Sofia', weekday: 'short',
    hour: '2-digit', minute: '2-digit', day: '2-digit', month: 'short' });
}

function humanIn(ms) {
  const m = Math.round(ms / 60000);
  if (m < 60) return `in ${m} min`;
  const h = Math.floor(m / 60), mm = m % 60;
  if (h < 24) return `in ${h}h ${mm}m`;
  return `in ${Math.round(h / 24)}d`;
}

function ago(iso) {
  if (!iso) return '';
  const ms = new Date() - new Date(iso);
  const m = Math.round(ms / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.floor(m / 60);
  return h < 24 ? `${h}h ${m % 60}m ago` : `${Math.round(h / 24)}d ago`;
}

// GitHub API contents endpoint is not CDN-cached, so run-status is fresh within
// seconds of a push (Pages copy is the fallback if the API is unavailable/rate-limited).
const RUNSTATUS_API =
  'https://api.github.com/repos/ProfitXtraV2/AIContent/contents/docs/data/run-status.json?ref=main';

function b64utf8(b64) {
  const bin = atob(b64.replace(/\n/g, ''));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

async function fetchRunStatus() {
  try {
    const j = await (await fetch(RUNSTATUS_API + '&_=' + Date.now(),
      { headers: { 'Accept': 'application/vnd.github.raw+json' } })).json();
    if (j && j.content) return JSON.parse(b64utf8(j.content));  // default JSON response
    if (j && j.state) return j;                                  // raw media type response
  } catch (e) { /* fall through */ }
  return (await fetch('./data/run-status.json?_=' + Date.now())).json();  // Pages fallback
}

// Open content PRs = articles awaiting review (drafts live in their PR until merged).
const PRS_API = 'https://api.github.com/repos/ProfitXtraV2/AIContent/pulls?state=open&per_page=50';
let PR_CACHE = null, TICK = 0;

async function fetchOpenPRs() {
  try {
    const arr = await (await fetch(PRS_API + '&_=' + Date.now())).json();
    if (!Array.isArray(arr)) return null;   // rate-limited responses are objects
    return arr
      .filter(p => ((p.head && p.head.ref) || '').startsWith('content/'))
      .map(p => ({ number: p.number, title: p.title, url: p.html_url,
                   branch: p.head.ref, created_at: p.created_at,
                   failed: /^\[FAILED\]/i.test(p.title || '') }));
  } catch (e) { return null; }
}

function renderPRs(rows) {
  if (!rows || !rows.length)
    return '<div class="empty">No open review PRs — drafted articles awaiting your review appear here.</div>';
  const body = rows.map(p => {
    const chip = p.failed ? '<span class="st st-failed">failed</span>'
                          : '<span class="st st-drafted">review</span>';
    return `<tr><td>${chip}</td>` +
      `<td><a href="${p.url}" target="_blank" rel="noopener">${p.title}</a></td>` +
      `<td><a href="${p.url}" target="_blank">#${p.number}</a></td><td>${ago(p.created_at)}</td></tr>`;
  }).join('');
  return `<table><thead><tr><th>Status</th><th>Article (PR)</th><th>PR</th><th>Opened</th></tr></thead><tbody>${body}</tbody></table>`;
}

function renderSteps(p) {
  const el = document.getElementById('runSteps');
  // Only show the stage tracker when the run is actually reporting a stage; otherwise a
  // static full row looks stuck. (Per-stage detail is best-effort — see "View run".)
  if (!p || !p.stages || p.stage_index == null) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  const idx = p.stage_index;
  el.innerHTML = p.stages.map((name, i) => {
    const cls = i < idx ? 'done' : (i === idx ? 'current' : '');
    return `<span class="step ${cls}">${name}</span>`;
  }).join('');
}

async function loadRunStatus() {
  const el = document.getElementById('runBanner');
  let r;
  try { r = await fetchRunStatus(); }
  catch (e) { el.style.display = 'none'; document.getElementById('runSteps').style.display = 'none'; return; }
  el.style.display = 'flex';
  // Each run is its own routine and can't reliably know its own URL, so link to the
  // Routines list (the running one is highlighted there) rather than a stale per-run URL.
  const link = `<a href="https://claude.ai/code/routines/trig_019cfW1QpXykZkwG8XrotCtQ" target="_blank" rel="noopener">View run ↗</a>`;
  if (r.state === 'running') {
    el.className = 'run-banner running';
    const p = r.progress || {};
    let where = '';
    if (p.article_total) where += ` — article ${p.article_index || 1}/${p.article_total}`;
    if (p.article_slug) where += `: ${p.article_slug}`;
    where += p.stage ? ` · ${p.stage}` : (p.article_total ? ' · writing…' : '');
    el.innerHTML = `<span class="live"></span><span><b>Run in progress</b>${where}` +
      `<span style="color:var(--muted)"> · started ${ago(r.run_started_utc)}</span></span>${link}`;
    renderSteps(p);
  } else {
    el.className = 'run-banner idle';
    const wrote = (r.articles_written != null) ? ` · wrote ${r.articles_written} article(s)` : '';
    el.innerHTML = `<span class="live"></span><span>Idle — last run ${ago(r.run_finished_utc)}${wrote}</span>${link}`;
    document.getElementById('runSteps').style.display = 'none';
  }
}

async function load() {
  loadRunStatus();
  let s;
  try { s = await (await fetch('./data/status.json?_=' + Date.now())).json(); }
  catch (e) { document.getElementById('bufferBig').textContent = 'no data'; return; }

  const meta = s.meta || {};
  const links = meta.links || {};
  document.getElementById('site').textContent = meta.brand ? meta.brand + ' · vsichkikazina.bg' : '';
  document.getElementById('links').innerHTML = Object.entries(links)
    .map(([k, v]) => `<a href="${v}" target="_blank" rel="noopener">${LABELS[k] || k} ↗</a>`).join('');

  // Buffer
  const b = s.buffer;
  const card = document.getElementById('bufferCard');
  card.className = 'card buffer ' + (b.ok ? 'ok' : 'low');
  document.getElementById('bufferBig').textContent = `${b.count} / ${b.target}`;
  document.getElementById('bufferBar').style.width = Math.min(100, 100 * b.count / b.target) + '%';
  document.getElementById('bufferNote').textContent = b.ok ? '✓ Buffer full' : `Need ${b.deficit} more`;

  // Next run
  const sched = meta.schedule;
  if (sched) {
    const nr = nextRunFromSchedule(sched);
    document.getElementById('nextRun').textContent = fmtSofia(nr);
    document.getElementById('nextRunNote').textContent = (sched.label || '') + ' · ' + humanIn(nr - new Date());
  } else {
    document.getElementById('nextRun').textContent = 'not scheduled';
  }

  // Counts
  document.getElementById('counts').innerHTML = Object.entries(s.counts)
    .map(([k, v]) => `<span class="pill">${k}: <b>${v}</b></span>`).join('');
  document.getElementById('lastGen').textContent = 'Data ' + (s.generated_utc || '');

  // Everything is driven from main's content-queue.md + topic-backlog.md (via status.json).
  const allRows = s.rows || [];
  const backlog = s.backlog || [];
  const research = s.research || [];
  const base = s.articles_base_url || '';
  const repo = (meta.links && meta.links.repo) || 'https://github.com/ProfitXtraV2/AIContent';
  const REVIEW_STATES = ['in-progress', 'drafted', 'failed'];   // need attention before deploy
  const HIDE_BACKLOG = ['written', 'used', 'queued'];           // consumed → drop from backlog
  const TABS = [
    { key: 'deploy', cls: 'deploy', label: 'Articles ready to deploy',
      rows: allRows.filter(r => r.status === 'approved'), kind: 'article' },
    { key: 'review', cls: 'review', label: 'Articles for review',
      rows: allRows.filter(r => REVIEW_STATES.includes(r.status)), kind: 'article' },
    { key: 'backlog', cls: '', label: 'Backlog keywords',
      rows: backlog.filter(r => !HIDE_BACKLOG.includes((r.status || 'open').toLowerCase())), kind: 'backlog' },
    { key: 'research', cls: '', label: 'AI backlog keywords',
      rows: research.filter(r => (r.status || 'candidate') !== 'used'), kind: 'research' },
  ];

  function articleLinks(r) {
    const parts = [];
    if (r.pr && r.pr.startsWith('#'))
      parts.push(`<a href="${repo}/pull/${r.pr.slice(1)}" target="_blank" rel="noopener">PR ${r.pr}</a>`);
    if (r.folder && base) parts.push(`<a href="${base}${r.folder}" target="_blank" rel="noopener">📁 files</a>`);
    return `<span class="rlinks">${parts.join('') || '—'}</span>`;
  }

  function geminiBadge(v) {
    v = (v || '').trim().toLowerCase();
    if (!v) return '<span class="chk chk-none">— not run</span>';
    if (v.startsWith('skip')) return '<span class="chk chk-none">skipped</span>';
    const n = parseInt(((v.match(/(\d+)/) || [])[1]));
    if (isNaN(n)) return `<span class="chk chk-none">${v}</span>`;
    // normalise to human-likeness (higher = better); "ai Y" means Y% AI ⇒ 100−Y human.
    const hl = v.startsWith('ai') ? (100 - n) : n;
    const pass = hl >= 80;
    return `<span class="gem ${pass ? 'gem-pass' : 'gem-warn'}">${pass ? '✓ ' : ''}${hl}% human</span>`;
  }

  function renderArticles(rows) {
    if (!rows.length) return '<div class="empty">Nothing here right now.</div>';
    const cols = [['status','Status'],['type','Type'],['query','Article'],
      ['keywords_or_terms','Keywords used'],['volume','Vol'],['kd','KD'],['opportunity','Opportunity'],
      ['source','Source'],['gemini','Gemini'],['links','Links']];
    const body = rows.map(r => '<tr>' + cols.map(([c]) => {
      if (c === 'links') return `<td>${articleLinks(r)}</td>`;
      if (c === 'gemini') return `<td>${geminiBadge(r.gemini)}</td>`;
      if (c === 'opportunity') return `<td>${opChip(r.opportunity)}</td>`;
      let v = r[c] || '';
      if (c === 'status') v = `<span class="st st-${v}">${v}</span>`;
      const cls = (c === 'volume' || c === 'kd') ? ' class="num"' : '';
      return `<td${cls}>${v}</td>`;
    }).join('') + '</tr>').join('');
    return `<table><thead><tr>${cols.map(([c, h]) => `<th${TIPS[c] ? ' title="' + TIPS[c] + '"' : ''}>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;
  }

  function opChip(o) {
    if (!o) return '<span class="op op-Weak">n/a</span>';
    return `<span class="op op-${o.band}">${o.band} · ${o.score}</span>`;
  }
  function chkBadge(v) {
    v = (v || 'none').toLowerCase();
    if (v === 'ahrefs') return '<span class="chk chk-ahrefs">✓ Ahrefs</span>';
    if (v === 'web') return '<span class="chk chk-web">web</span>';
    return '<span class="chk chk-none">unchecked</span>';
  }
  const byOpp = (a, b) => (b.opportunity ? b.opportunity.score : -1) - (a.opportunity ? a.opportunity.score : -1);

  function renderBacklog(rows) {
    if (!rows.length) return '<div class="empty">No pending backlog keywords — add topics to topic-backlog.md.</div>';
    const cols = [['priority','#'],['type','Type'],['query','Topic'],['keywords_or_terms','Keywords'],
      ['volume','Vol'],['kd','KD'],['opportunity','Opportunity'],['checked','Checked'],
      ['ahrefs_note','Ahrefs verdict / suggestion'],['status','Status']];
    const body = [...rows].sort(byOpp).map(r => '<tr>' + cols.map(([c]) => {
      if (c === 'opportunity') return `<td>${opChip(r.opportunity)}</td>`;
      if (c === 'checked') return `<td>${chkBadge(r.checked)}</td>`;
      if (c === 'ahrefs_note') return `<td class="sugg">${r.ahrefs_note || ''}</td>`;
      if (c === 'status') return `<td><span class="st st-${r.status === 'failed' ? 'failed' : 'in-progress'}">${r.status || 'open'}</span></td>`;
      const cls = (c === 'volume' || c === 'kd') ? ' class="num"' : '';
      return `<td${cls}>${r[c] || ''}</td>`;
    }).join('') + '</tr>').join('');
    return `<table><thead><tr>${cols.map(([c, h]) => `<th${TIPS[c] ? ' title="' + TIPS[c] + '"' : ''}>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;
  }

  function renderResearch(rows) {
    if (!rows.length) return '<div class="empty">No AI-researched topics yet — the run refreshes this bank each day.</div>';
    const cols = [['type','Type'],['query','Topic'],['researched_keywords','Keywords'],
      ['volume','Vol'],['kd','KD'],['opportunity','Opportunity'],['trend','Trend'],
      ['checked','Checked'],['suggestion','Rating / suggestion'],['status','Status']];
    const body = [...rows].sort(byOpp).map(r => '<tr>' + cols.map(([c]) => {
      if (c === 'opportunity') return `<td>${opChip(r.opportunity)}</td>`;
      if (c === 'checked') return `<td>${chkBadge(r.checked)}</td>`;
      if (c === 'suggestion') return `<td class="sugg">${r.suggestion || r.source_rationale || ''}</td>`;
      const cls = (c === 'volume' || c === 'kd') ? ' class="num"' : '';
      return `<td${cls}>${r[c] || ''}</td>`;
    }).join('') + '</tr>').join('');
    return `<table><thead><tr>${cols.map(([c, h]) => `<th${TIPS[c] ? ' title="' + TIPS[c] + '"' : ''}>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;
  }

  const tabsEl = document.getElementById('tabs');
  const contentEl = document.getElementById('tabContent');
  function activate(key) {
    TABS.forEach(t => {
      document.getElementById('tab-' + t.key).classList.toggle('active', t.key === key);
    });
    const t = TABS.find(x => x.key === key);
    contentEl.innerHTML = t.kind === 'backlog' ? renderBacklog(t.rows)
      : t.kind === 'research' ? renderResearch(t.rows)
      : t.kind === 'prs' ? renderPRs(t.rows)
      : renderArticles(t.rows);
  }
  tabsEl.innerHTML = TABS.map(t =>
    `<button class="tab ${t.cls}" id="tab-${t.key}" onclick="__activate('${t.key}')">` +
    `${t.label}<span class="badge">${t.rows.length}</span></button>`).join('');
  window.__activate = activate;
  const firstNonEmpty = TABS.find(t => t.rows.length) || TABS[TABS.length - 1];
  activate(firstNonEmpty.key);

  document.getElementById('footer').textContent =
    'Autopilot keeps ≥10 written-but-unposted articles ready · dashboard regenerates each run.';
}
load();
// 90s cadence keeps GitHub API usage (run-status every tick + PRs every 3rd tick)
// under the 60 req/hr unauthenticated limit, with graceful fallbacks if hit.
setInterval(load, 90000);
</script>
</body>
</html>
