<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" role="img" aria-label="Как работят безплатните завъртания на Eye of Horus: 3+ скатера дават 12 завъртания, дивата карта Хор зарежда плочите, а ниските символи се надграждат към символа Око на Хор">
  <title>Eye of Horus: как работят 12-те безплатни завъртания</title>
  <defs>
    <linearGradient id="bgf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f6ef"/>
      <stop offset="100%" stop-color="#eee6d2"/>
    </linearGradient>
  </defs>

  <rect width="600" height="260" rx="12" ry="12" fill="url(#bgf)"/>

  <text x="300" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle">12-те безплатни завъртания стъпка по стъпка</text>

  <!-- Step 1 -->
  <rect x="30" y="70" width="160" height="110" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="110" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="600">1. Задействане</text>
  <text x="110" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="19" fill="#1e40af" text-anchor="middle" font-weight="800">3+ скатера</text>
  <text x="110" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="700">= 12 завъртания</text>

  <!-- Arrow 1 -->
  <text x="205" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#9ca3af" text-anchor="middle">›</text>

  <!-- Step 2 -->
  <rect x="220" y="70" width="160" height="110" rx="10" fill="#fefce8" stroke="#d9b84a" stroke-width="1.5"/>
  <text x="300" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="600">2. Дива карта Хор</text>
  <text x="300" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8a6d1a" text-anchor="middle" font-weight="700">зарежда плочите</text>
  <text x="300" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#a16207" text-anchor="middle">и добавя завъртания</text>

  <!-- Arrow 2 -->
  <text x="395" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#9ca3af" text-anchor="middle">›</text>

  <!-- Step 3 -->
  <rect x="410" y="70" width="160" height="110" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="490" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="600">3. Надграждане</text>
  <text x="490" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#166534" text-anchor="middle" font-weight="700">ниските символи</text>
  <text x="490" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#15803d" text-anchor="middle" font-weight="800">към Око на Хор</text>

  <text x="300" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#57534e" text-anchor="middle">Затова късните завъртания плащат повече от първите: полето</text>
  <text x="300" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#57534e" text-anchor="middle">се пълни със скъпи символи, а Хор се разпъва по цялата колона.</text>

  <text x="300" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#a8a29e" text-anchor="middle">18+ Играйте отговорно · схемата описва механиката, не обещава резултат</text>
</svg>
