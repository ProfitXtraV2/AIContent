<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" role="img" aria-label="Безплатните завъртания на Juicy Fruits: 3 плюс диаманта дават 6 завъртания, всеки следващи 3 диаманта добавят 1 до 3 завъртания и уголемяват короната към пълен екран около 1200 пъти залога">
  <title>Juicy Fruits: как работят безплатните завъртания и короната</title>
  <defs>
    <linearGradient id="bgf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6f6"/>
      <stop offset="100%" stop-color="#f4e6e6"/>
    </linearGradient>
  </defs>

  <rect width="600" height="260" rx="12" ry="12" fill="url(#bgf)"/>

  <text x="300" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#9d174d" text-anchor="middle">Безплатните завъртания и короната</text>

  <!-- Step 1 -->
  <rect x="30" y="70" width="160" height="110" rx="10" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
  <text x="110" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="600">1. Задействане</text>
  <text x="110" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#9d174d" text-anchor="middle" font-weight="800">3+ диаманта</text>
  <text x="110" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#be185d" text-anchor="middle" font-weight="700">= 6 завъртания</text>

  <text x="205" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#9ca3af" text-anchor="middle">›</text>

  <!-- Step 2 -->
  <rect x="220" y="70" width="160" height="110" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="300" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="600">2. Всеки 3 диаманта</text>
  <text x="300" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#b45309" text-anchor="middle" font-weight="700">+1 до 3 завъртания</text>
  <text x="300" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a16207" text-anchor="middle">короната расте</text>

  <text x="395" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#9ca3af" text-anchor="middle">›</text>

  <!-- Step 3 -->
  <rect x="410" y="70" width="160" height="110" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="490" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="600">3. Пълен екран</text>
  <text x="490" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#166534" text-anchor="middle" font-weight="700">корона 5×5</text>
  <text x="490" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#15803d" text-anchor="middle" font-weight="800">~1200x</text>

  <text x="300" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#57534e" text-anchor="middle">Силата на играта е разрастващата се корона, не струпвания</text>
  <text x="300" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#57534e" text-anchor="middle">или множители. Волатилността е висока, таван 5000x.</text>

  <text x="300" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#a8a29e" text-anchor="middle">18+ Играйте отговорно · схемата описва механиката, не обещава резултат</text>
</svg>
