<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="Aviator RTP 97% и домашно предимство 3%: при €1000 оборот €970 се връщат на играча, €30 остават за казиното">
  <title>Aviator RTP 97% и домашно предимство 3%</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="playerBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="houseBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="320" rx="12" ry="12" fill="url(#bg)"/>

  <!-- Header -->
  <text x="300" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#1e3a5f" text-anchor="middle">Aviator: RTP и домашно предимство</text>

  <!-- RTP / House edge labels -->
  <text x="50" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600">Връщане към играча (RTP)</text>
  <text x="550" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600" text-anchor="end">Домашно предимство</text>

  <!-- Proportion bar background -->
  <rect x="50" y="90" width="500" height="48" rx="8" fill="#e5e7eb"/>

  <!-- Player portion: 97% of 500px = 485px -->
  <rect x="50" y="90" width="485" height="48" rx="8" fill="url(#playerBar)"/>

  <!-- House portion: 3% of 500px = 15px -->
  <rect x="535" y="90" width="15" height="48" rx="0" fill="url(#houseBar)"/>
  <!-- Round right edge of house bar -->
  <rect x="543" y="90" width="7" height="48" rx="4" fill="url(#houseBar)"/>

  <!-- Bar percentage labels -->
  <text x="270" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">97%</text>
  <text x="553" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3%</text>

  <!-- Divider -->
  <line x1="50" y1="165" x2="550" y2="165" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Concrete example heading -->
  <text x="300" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Пример: €1000 оборот</text>

  <!-- Two boxes: player and house -->
  <!-- Player box -->
  <rect x="50" y="205" width="220" height="76" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="600">Обратно към играча</text>
  <text x="160" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#1d4ed8" text-anchor="middle">€970</text>
  <text x="160" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle">(средно, дългосрочно)</text>

  <!-- House box -->
  <rect x="330" y="205" width="220" height="76" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="440" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="600">За казиното</text>
  <text x="440" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#dc2626" text-anchor="middle">€30</text>
  <text x="440" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ef4444" text-anchor="middle">(домашно предимство 3%)</text>

  <!-- Arrow between boxes -->
  <text x="300" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#9ca3af" text-anchor="middle">+</text>

  <!-- Footer note -->
  <text x="300" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · RTP е дългосрочна статистика, не прогноза за следващия рунд</text>
</svg>
