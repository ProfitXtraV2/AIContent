<svg viewBox="0 0 660 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Три инструмента за отговорна игра: лимити в профила предварително, самоизключване при нужда, НАП регистър постоянно">
  <title>Инструменти за отговорна игра</title>
  <!-- background card -->
  <rect x="16" y="16" width="628" height="238" rx="12" fill="#f0fdf4"/>

  <!-- title -->
  <text x="330" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#14532d">Инструменти за отговорна игра — ескалационна пътека</text>

  <!-- BOX 1: Лимити -->
  <rect x="24" y="58" width="182" height="168" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="50" cy="80" r="14" fill="#16a34a"/>
  <text x="50" y="85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="white">1</text>
  <text x="116" y="85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#15803d">Лимити в профила</text>
  <line x1="40" y1="97" x2="190" y2="97" stroke="#86efac" stroke-width="1"/>
  <text x="115" y="117" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#166534">лимит на депозита</text>
  <text x="115" y="137" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#166534">лимит на загубата</text>
  <text x="115" y="157" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#166534">лимит на времето</text>
  <text x="115" y="204" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-style="italic" fill="#166534">Задай предварително</text>

  <!-- Arrow 1 -->
  <line x1="206" y1="142" x2="228" y2="142" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="228,136 238,142 228,148" fill="#9ca3af"/>

  <!-- BOX 2: Самоизключване -->
  <rect x="238" y="58" width="182" height="168" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <circle cx="264" cy="80" r="14" fill="#ca8a04"/>
  <text x="264" y="85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="white">2</text>
  <text x="329" y="85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#854d0e">Самоизключване</text>
  <line x1="254" y1="97" x2="404" y2="97" stroke="#fde68a" stroke-width="1"/>
  <text x="329" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#713f12">При конкретен оператор</text>
  <text x="329" y="143" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#713f12">Не се отменя предсрочно</text>
  <text x="329" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#713f12">по телефона</text>
  <text x="329" y="204" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-style="italic" fill="#92400e">при нужда</text>

  <!-- Arrow 2 -->
  <line x1="420" y1="142" x2="442" y2="142" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="442,136 452,142 442,148" fill="#9ca3af"/>

  <!-- BOX 3: НАП регистър -->
  <rect x="452" y="58" width="182" height="168" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="478" cy="80" r="14" fill="#dc2626"/>
  <text x="478" y="85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="white">3</text>
  <text x="543" y="85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">НАП регистър</text>
  <line x1="468" y1="97" x2="618" y2="97" stroke="#fca5a5" stroke-width="1"/>
  <text x="543" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#7f1d1d">Национален регистър</text>
  <text x="543" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#7f1d1d">на уязвимите лица</text>
  <text x="543" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#7f1d1d">Подаден писмено</text>
  <text x="543" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#7f1d1d">от засегнатото лице</text>
  <text x="543" y="204" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-style="italic" fill="#991b1b">постоянно</text>
</svg>
