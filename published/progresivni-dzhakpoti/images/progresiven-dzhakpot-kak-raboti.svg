<svg viewBox="0 0 620 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="620" height="400" fill="#F8F6F2" rx="12"/>

  <!-- Title -->
  <text x="310" y="34" font-size="16" font-weight="700" fill="#1A1A2E" text-anchor="middle">Как работи прогресивният джакпот</text>
  <text x="310" y="52" font-size="10" fill="#999" text-anchor="middle">числата са примерни (ориентировъчни) — виж правилата на конкретната игра</text>

  <!-- ===== SECTION 1: Bet allocation ===== -->
  <text x="28" y="74" font-size="12" font-weight="700" fill="#1A1A2E">Откъде идват парите в пула</text>

  <!-- Arrow flow box -->
  <!-- Bet box -->
  <rect x="28" y="88" width="100" height="52" fill="#1A1A2E" rx="8"/>
  <text x="78" y="110" font-size="13" font-weight="700" fill="#F5D060" text-anchor="middle">€1.00</text>
  <text x="78" y="128" font-size="11" fill="#CCCCCC" text-anchor="middle">Залогът</text>

  <!-- Arrow right -->
  <line x1="130" y1="114" x2="165" y2="114" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
    <marker id="arrow-gold" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C7A020"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2952C7"/>
    </marker>
  </defs>

  <!-- Split branches — upper: jackpot -->
  <line x1="165" y1="114" x2="165" y2="93" stroke="#C7A020" stroke-width="2"/>
  <line x1="165" y1="93" x2="220" y2="93" stroke="#C7A020" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <!-- Upper label -->
  <text x="165" y="87" font-size="9.5" fill="#C7A020" text-anchor="middle">2%</text>
  <!-- Jackpot box -->
  <rect x="222" y="76" width="148" height="36" fill="#FFF8DC" stroke="#C7A020" stroke-width="1.5" rx="6"/>
  <text x="296" y="93" font-size="11" font-weight="700" fill="#C7A020" text-anchor="middle">€0.02 → Джакпот пул</text>
  <text x="296" y="107" font-size="10" fill="#888" text-anchor="middle">стотинка по стотинка</text>

  <!-- Split branches — lower: base game -->
  <line x1="165" y1="114" x2="165" y2="135" stroke="#2952C7" stroke-width="2"/>
  <line x1="165" y1="135" x2="220" y2="135" stroke="#2952C7" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <!-- Lower label -->
  <text x="165" y="149" font-size="9.5" fill="#2952C7" text-anchor="middle">98%</text>
  <!-- Base game box -->
  <rect x="222" y="120" width="148" height="36" fill="#EEF2FF" stroke="#2952C7" stroke-width="1.5" rx="6"/>
  <text x="296" y="137" font-size="11" font-weight="700" fill="#2952C7" text-anchor="middle">€0.98 → Базова игра</text>
  <text x="296" y="151" font-size="10" fill="#888" text-anchor="middle">редовни печалби</text>

  <!-- Scale-up note -->
  <rect x="390" y="76" width="202" height="80" fill="#FFFBEE" stroke="#E0C060" stroke-width="1" rx="8"/>
  <text x="491" y="95" font-size="11" font-weight="700" fill="#1A1A2E" text-anchor="middle">500 завъртания × €1</text>
  <line x1="420" y1="103" x2="562" y2="103" stroke="#DDD" stroke-width="1"/>
  <text x="491" y="120" font-size="13" font-weight="700" fill="#C7A020" text-anchor="middle">€10 в пула</text>
  <text x="491" y="136" font-size="10" fill="#777" text-anchor="middle">само от един играч</text>
  <text x="491" y="150" font-size="10" fill="#777" text-anchor="middle">за сесия от 500 завъртания</text>

  <!-- Divider -->
  <line x1="28" y1="178" x2="592" y2="178" stroke="#DDDDDD" stroke-width="1"/>

  <!-- ===== SECTION 2: RTP comparison ===== -->
  <text x="28" y="200" font-size="12" font-weight="700" fill="#1A1A2E">Базов RTP: прогресивна vs. обикновена ротативка</text>

  <!-- Bar chart labels -->
  <text x="28" y="228" font-size="11" fill="#333">Прогресивна</text>
  <text x="28" y="268" font-size="11" fill="#333">Обикновена</text>

  <!-- Bar 1: Progressive RTP 88-93% -->
  <rect x="130" y="212" width="195" height="26" fill="#F5D060" rx="4"/>
  <text x="335" y="230" font-size="11" font-weight="700" fill="#1A1A2E">88–93%</text>

  <!-- Bar 2: Regular RTP ~96% -->
  <rect x="130" y="252" width="268" height="26" fill="#2952C7" rx="4"/>
  <text x="350" y="270" font-size="11" font-weight="700" fill="#FFFFFF">~96%</text>

  <!-- Scale ticks -->
  <line x1="130" y1="294" x2="496" y2="294" stroke="#CCC" stroke-width="1"/>
  <text x="130" y="308" font-size="9" fill="#AAA" text-anchor="middle">85%</text>
  <text x="252" y="308" font-size="9" fill="#AAA" text-anchor="middle">90%</text>
  <text x="374" y="308" font-size="9" fill="#AAA" text-anchor="middle">95%</text>
  <text x="496" y="308" font-size="9" fill="#AAA" text-anchor="middle">100%</text>
  <line x1="130" y1="290" x2="130" y2="294" stroke="#CCC" stroke-width="1"/>
  <line x1="252" y1="290" x2="252" y2="294" stroke="#CCC" stroke-width="1"/>
  <line x1="374" y1="290" x2="374" y2="294" stroke="#CCC" stroke-width="1"/>
  <line x1="496" y1="290" x2="496" y2="294" stroke="#CCC" stroke-width="1"/>

  <!-- Explanation -->
  <rect x="28" y="320" width="564" height="40" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" rx="6"/>
  <text x="310" y="336" font-size="10.5" fill="#555" text-anchor="middle">Разликата финансира джакпот пула — добавиш ли приноса му, теоретичната стойност</text>
  <text x="310" y="351" font-size="10.5" fill="#555" text-anchor="middle">се доближава до обикновена игра, но голямото попадение се реализира рядко.</text>

  <!-- Footer -->
  <text x="310" y="390" font-size="9.5" fill="#BBBBBB" text-anchor="middle">18+ Играйте отговорно · vsichkikazina.bg</text>
</svg>
