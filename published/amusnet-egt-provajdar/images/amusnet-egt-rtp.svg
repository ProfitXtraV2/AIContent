<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Обявени RTP на класически заглавия на Amusnet: Shining Crown 96.37%, 40 Super Hot 95.81%, 20 Super Hot 95.79%, Flaming Hot 95.53%, спрямо ориентир около 96% за модерните слотове; повечето седят на или под средното">
  <title>Обявени RTP на класически заглавия на Amusnet спрямо ~96%</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="above" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="below" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" rx="12" ry="12" fill="url(#bg)"/>

  <text x="300" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle">Обявен RTP на класики на Amusnet</text>
  <text x="300" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">повечето седят на или под средното за модерните слотове (~96%)</text>

  <!-- 96% reference line: track 120..520 maps RTP 95.00..96.50; 96.00 at x = 120 + (96.00-95.00)*266.67 = 387 -->
  <line x1="387" y1="70" x2="387" y2="250" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="387" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4b5563" text-anchor="middle">~96%</text>

  <!-- Row 1: Shining Crown 96.37% -> x_end = 120 + 1.37*266.67 = 485 (above line) -->
  <text x="112" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#374151" font-weight="600" text-anchor="end">Shining Crown</text>
  <rect x="120" y="80" width="400" height="22" rx="5" fill="#e5e7eb"/>
  <rect x="120" y="80" width="365" height="22" rx="5" fill="url(#above)"/>
  <text x="533" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#15803d" text-anchor="start">96.37%</text>

  <!-- Row 2: 40 Super Hot 95.81% -> x_end = 120 + 0.81*266.67 = 336 -->
  <text x="112" y="127" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#374151" font-weight="600" text-anchor="end">40 Super Hot</text>
  <rect x="120" y="114" width="400" height="22" rx="5" fill="#e5e7eb"/>
  <rect x="120" y="114" width="216" height="22" rx="5" fill="url(#below)"/>
  <text x="533" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#b45309" text-anchor="start">95.81%</text>

  <!-- Row 3: 20 Super Hot 95.79% -> x_end = 120 + 0.79*266.67 = 331 -->
  <text x="112" y="161" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#374151" font-weight="600" text-anchor="end">20 Super Hot</text>
  <rect x="120" y="148" width="400" height="22" rx="5" fill="#e5e7eb"/>
  <rect x="120" y="148" width="211" height="22" rx="5" fill="url(#below)"/>
  <text x="533" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#b45309" text-anchor="start">95.79%</text>

  <!-- Row 4: Flaming Hot 95.53% -> x_end = 120 + 0.53*266.67 = 261 -->
  <text x="112" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#374151" font-weight="600" text-anchor="end">Flaming Hot</text>
  <rect x="120" y="182" width="400" height="22" rx="5" fill="#e5e7eb"/>
  <rect x="120" y="182" width="141" height="22" rx="5" fill="url(#below)"/>
  <text x="533" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#b45309" text-anchor="start">95.53%</text>

  <text x="300" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Скала 95.00%–96.50% · източник: Wizard of Odds</text>

  <line x1="60" y1="262" x2="540" y2="262" stroke="#d1d5db" stroke-width="1"/>
  <text x="300" y="284" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Част от заглавията се доставят и в по-нискорейтингови версии (около 90%) · операторът избира коя да пусне</text>
  <text x="300" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · Провери реалния RTP в инфо-панела на конкретното казино</text>
</svg>
