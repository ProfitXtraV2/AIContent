<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Plinko RTP по студио: BGaming и Stake 99% с домашно предимство 1%, Spribe 97% с домашно предимство 3%; при 1000 евро оборот средно се връщат около 990 евро или около 970 евро; нивото на риск и броят редове не менят RTP">
  <title>Plinko: RTP по студио и домашно предимство</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="rtpBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#22c1c3"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="12" ry="12" fill="url(#bg)"/>

  <text x="300" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f766e" text-anchor="middle">Plinko: RTP по студио и домашно предимство</text>
  <text x="300" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">нивото на риск и броят редове не менят RTP</text>

  <!-- BGaming / Stake 99% -->
  <text x="50" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600">BGaming и Stake</text>
  <text x="550" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#b91c1c" font-weight="700" text-anchor="end">домашно предимство 1%</text>
  <rect x="50" y="94" width="500" height="40" rx="8" fill="#e5e7eb"/>
  <rect x="50" y="94" width="500" height="40" rx="8" fill="url(#rtpBar)"/>
  <rect x="545" y="94" width="5" height="40" rx="2" fill="#ef4444"/>
  <text x="297" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">RTP 99%</text>

  <!-- Spribe 97% -->
  <text x="50" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600">Spribe</text>
  <text x="550" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#b91c1c" font-weight="700" text-anchor="end">домашно предимство 3%</text>
  <rect x="50" y="174" width="500" height="40" rx="8" fill="#e5e7eb"/>
  <rect x="50" y="174" width="490" height="40" rx="8" fill="url(#rtpBar)"/>
  <rect x="535" y="174" width="15" height="40" rx="2" fill="#ef4444"/>
  <text x="292" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">RTP 97%</text>

  <line x1="50" y1="238" x2="550" y2="238" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="300" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Пример: 1000 евро оборот (средно, дългосрочно)</text>

  <rect x="50" y="276" width="235" height="66" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
  <text x="167" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="600">при RTP 99%</text>
  <text x="167" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#0e7490" text-anchor="middle">~990 € обратно</text>

  <rect x="315" y="276" width="235" height="66" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
  <text x="432" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="600">при RTP 97%</text>
  <text x="432" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#0e7490" text-anchor="middle">~970 € обратно</text>
</svg>
