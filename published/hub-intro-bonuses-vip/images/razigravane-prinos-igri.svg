<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" role="img" aria-label="Таблица на принос към оборота при разиграване: ротативки 100%, маси и казино на живо — наполовина или изключени; срок обичайно 7–30 дни">
  <!-- background card -->
  <rect x="20" y="20" width="620" height="210" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>

  <!-- Title -->
  <text x="330" y="54" text-anchor="middle" font-size="16" font-weight="700" fill="#212529" font-family="sans-serif">Принос към оборота при разиграване</text>

  <!-- Divider 1 -->
  <line x1="40" y1="68" x2="620" y2="68" stroke="#dee2e6" stroke-width="1"/>

  <!-- Column headers -->
  <text x="44" y="87" font-size="12" fill="#6c757d" font-family="sans-serif">Вид игра</text>
  <text x="620" y="87" text-anchor="end" font-size="12" fill="#6c757d" font-family="sans-serif">Принос</text>

  <!-- Row 1: Slots -->
  <text x="44" y="112" font-size="15" fill="#212529" font-family="sans-serif">Ротативки</text>
  <rect x="520" y="97" width="100" height="26" rx="13" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="570" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#155724" font-family="sans-serif">100%</text>

  <!-- Divider 2 -->
  <line x1="40" y1="132" x2="620" y2="132" stroke="#dee2e6" stroke-width="1"/>

  <!-- Row 2: Tables / Live Casino -->
  <text x="44" y="157" font-size="15" fill="#212529" font-family="sans-serif">Маси и казино на живо</text>
  <rect x="428" y="143" width="192" height="26" rx="13" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="524" y="160" text-anchor="middle" font-size="12" fill="#856404" font-family="sans-serif">наполовина / изключени</text>

  <!-- Divider 3 -->
  <line x1="40" y1="178" x2="620" y2="178" stroke="#dee2e6" stroke-width="1"/>

  <!-- Row 3: Timeframe -->
  <text x="44" y="200" font-size="13" fill="#6c757d" font-family="sans-serif">Срок за разиграване</text>
  <text x="620" y="200" text-anchor="end" font-size="13" fill="#212529" font-family="sans-serif">обичайно 7–30 дни</text>

  <!-- Footer -->
  <text x="330" y="222" text-anchor="middle" font-size="11" fill="#adb5bd" font-family="sans-serif">Стойностите са ориентировъчни — проверете условията на конкретния оператор</text>
</svg>
