<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" role="img" aria-label="Инфографика: скрита цена на стартовия бонус — примерна оферта 150% до 300 € при депозит 200 € дава 17 500 € изискван оборот за 14 дни">
  <title>Стартов бонус при ново казино: скритото изискване за оборот</title>
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="680" height="360" rx="12" ry="12" fill="#f9f9fb"/>

  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">Стартов бонус при ново казино: скритото изискване</text>
  <text x="340" y="48" text-anchor="middle" font-size="11" fill="#888">Пример: оферта „150% до 300 €" · депозит 200 € · числата са примерни</text>
  <line x1="40" y1="58" x2="640" y2="58" stroke="#e0e0e8" stroke-width="1"/>

  <!-- Step 1: Deposit + Bonus -->
  <rect x="40" y="72" width="180" height="130" rx="9" fill="#eef4ff" stroke="#b8d0f8" stroke-width="1.5"/>
  <text x="130" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#1a5ac8">① Основа</text>
  <text x="130" y="112" text-anchor="middle" font-size="12" fill="#444">Депозит: 200 €</text>
  <text x="130" y="129" text-anchor="middle" font-size="12" fill="#444">Бонус 150%: 300 €</text>
  <line x1="65" y1="138" x2="195" y2="138" stroke="#1a5ac8" stroke-width="1.5"/>
  <text x="130" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#1a5ac8">500 €</text>
  <text x="130" y="176" text-anchor="middle" font-size="10" fill="#777">база (депозит + бонус)</text>
  <text x="130" y="191" text-anchor="middle" font-size="10" fill="#aaa">основа за превъртане</text>

  <!-- Arrow 1 → 2 -->
  <text x="237" y="142" text-anchor="middle" font-size="18" fill="#bbb">→</text>
  <text x="237" y="157" text-anchor="middle" font-size="10" fill="#ccc">×35</text>

  <!-- Step 2: Required wagering -->
  <rect x="258" y="72" width="164" height="130" rx="9" fill="#fef9c3" stroke="#fde047" stroke-width="1.5"/>
  <text x="340" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#854d0e">② Оборот</text>
  <text x="340" y="112" text-anchor="middle" font-size="12" fill="#444">500 € × 35</text>
  <line x1="278" y1="120" x2="402" y2="120" stroke="#854d0e" stroke-width="1.5"/>
  <text x="340" y="148" text-anchor="middle" font-size="22" font-weight="700" fill="#854d0e">17 500 €</text>
  <text x="340" y="167" text-anchor="middle" font-size="10" fill="#777">изискван оборот</text>
  <text x="340" y="182" text-anchor="middle" font-size="10" fill="#aaa">преди теглене на печалба</text>
  <text x="340" y="196" text-anchor="middle" font-size="10" fill="#aaa">срок: 14 дни</text>

  <!-- Arrow 2 → 3 -->
  <text x="440" y="142" text-anchor="middle" font-size="18" fill="#bbb">→</text>

  <!-- Step 3: Reality check -->
  <rect x="460" y="72" width="182" height="130" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="551" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">③ Реалността</text>
  <text x="551" y="112" text-anchor="middle" font-size="10" fill="#555">При таван на тегленето</text>
  <text x="551" y="126" text-anchor="middle" font-size="10" fill="#555">и срок 14 дни:</text>
  <line x1="480" y1="134" x2="622" y2="134" stroke="#991b1b" stroke-width="1.5"/>
  <text x="551" y="154" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">17 500 € оборот</text>
  <text x="551" y="169" text-anchor="middle" font-size="10" fill="#777">за кратък срок</text>
  <text x="551" y="183" text-anchor="middle" font-size="10" fill="#555">= висок риск при умерен играч</text>
  <text x="551" y="197" text-anchor="middle" font-size="10" fill="#aaa">числото на банера не го казва</text>

  <!-- What to check section -->
  <rect x="40" y="220" width="600" height="100" rx="9" fill="#f8f8fc" stroke="#d0d0e0" stroke-width="1"/>
  <text x="340" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Какво да провериш в условията на ново казино</text>

  <rect x="58" y="249" width="170" height="24" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="143" y="265" text-anchor="middle" font-size="10" fill="#1d4ed8">✓ Лиценз от НАП</text>

  <rect x="238" y="249" width="204" height="24" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="340" y="265" text-anchor="middle" font-size="10" fill="#166534">✓ База: само бонус или депозит+бонус?</text>

  <rect x="452" y="249" width="170" height="24" rx="5" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="537" y="265" text-anchor="middle" font-size="10" fill="#9a3412">✓ Таван на тегленето</text>

  <rect x="58" y="281" width="170" height="24" rx="5" fill="#fef9c3" stroke="#fde047" stroke-width="1"/>
  <text x="143" y="297" text-anchor="middle" font-size="10" fill="#854d0e">✓ Срок за разиграване</text>

  <rect x="238" y="281" width="204" height="24" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="340" y="297" text-anchor="middle" font-size="10" fill="#991b1b">✓ Тест с малка сума (напр. 20 €)</text>

  <rect x="452" y="281" width="170" height="24" rx="5" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="537" y="297" text-anchor="middle" font-size="10" fill="#6b21a8">✓ Доставчици и RTP</text>

  <!-- RG footer -->
  <text x="340" y="344" text-anchor="middle" font-size="9" fill="#bbb">18+ Играйте отговорно · числата са примерни за целите на илюстрацията</text>
</svg>
