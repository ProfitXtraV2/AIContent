name: approve-on-merge
on:
  pull_request:
    types: [closed]
permissions:
  contents: write
# Merges often land seconds apart; run one approval at a time so pushes don't race.
concurrency:
  group: approve-on-merge
  cancel-in-progress: false
jobs:
  approve:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'content/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Approve merged article + rebuild feed
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          FOLDER="${BRANCH#content/}"
          echo "Approving folder: $FOLDER"
          git config user.name "VK Approver"
          git config user.email "approver@vsichkikazina.local"
          # status.json / published/ are generated, so a rejected push is never merged:
          # reset to the new main and regenerate everything on top of it.
          for attempt in 1 2 3 4 5; do
            git fetch origin -q
            git reset -q --hard origin/main
            python3 scripts/mark_approved.py "$FOLDER"
            python3 scripts/build_feed.py
            python3 scripts/build_dashboard.py
            git add VsichkiKazina/content-queue.md docs/data published/
            if git diff --cached --quiet; then
              echo "nothing to approve (already approved/posted)"
              exit 0
            fi
            git commit -q -m "board($FOLDER): approve on PR merge -> feed"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), retrying on fresh main"
            sleep $((attempt * 5))
          done
          echo "::error::could not push approval for $FOLDER after 5 attempts"
          exit 1
