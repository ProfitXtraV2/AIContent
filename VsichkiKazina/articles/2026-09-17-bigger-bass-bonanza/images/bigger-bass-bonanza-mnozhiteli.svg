<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Множителната стълба на Bigger Bass Bonanza: на всеки 4-ти събран рибар +10 завъртания и множител x2 при първия ретригер, x3 при втория и x10 при третия, максимум три ретригера">
  <title>Bigger Bass Bonanza: ретригери и множители x2, x3, x10</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef7f3"/>
      <stop offset="100%" stop-color="#d8ede2"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" rx="12" ry="12" fill="url(#bg2)"/>
  <text x="300" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#0f5132" text-anchor="middle">Ретригери и множители в безплатните завъртания</text>
  <text x="300" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="middle">На всеки 4-ти събран рибар: +10 завъртания и по-висок множител</text>

  <!-- Step 1: x2 -->
  <rect x="60" y="230" width="140" height="70" rx="8" fill="url(#step)"/>
  <text x="130" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1-ви ретригер</text>
  <text x="130" y="288" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">x2</text>

  <!-- Step 2: x3 -->
  <rect x="230" y="185" width="140" height="115" rx="8" fill="url(#step)"/>
  <text x="300" y="217" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2-ри ретригер</text>
  <text x="300" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">x3</text>

  <!-- Step 3: x10 -->
  <rect x="400" y="120" width="140" height="180" rx="8" fill="url(#step)"/>
  <text x="470" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3-ти ретригер</text>
  <text x="470" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">x10</text>
  <text x="470" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#d1fae5" text-anchor="middle">таван на множителя</text>

  <!-- +10 labels -->
  <text x="130" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0f766e" text-anchor="middle">+10 завъртания</text>
  <text x="300" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0f766e" text-anchor="middle">+10 завъртания</text>
  <text x="470" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0f766e" text-anchor="middle">+10 завъртания</text>

  <line x1="55" y1="300" x2="545" y2="300" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="300" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Максимум 3 ретригера · същата стълба като в базовия Big Bass Bonanza · 18+ Играйте отговорно</text>
</svg>
