<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Wild Wild Riches: обявеният RTP се доставя в три версии 96.77%, 95% и 90%, операторът избира коя да пусне; при 96.77% и 1000 евро оборот средно 968 евро се връщат на играча, 32 евро остават за казиното; висока волатилност, максимална печалба 4608 пъти залога">
  <title>Wild Wild Riches: конфигурируем RTP (96.77% / 95% / 90%) и домашно предимство</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="playerBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="houseBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="12" ry="12" fill="url(#bg)"/>

  <text x="300" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">Wild Wild Riches: RTP и домашно предимство</text>
  <text x="300" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">обявеният RTP е конфигурируем: 96.77% / 95% / 90% (операторът избира версията)</text>

  <text x="50" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600">Връщане към играча (най-висока версия)</text>
  <text x="550" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600" text-anchor="end">Домашно предимство</text>

  <rect x="50" y="94" width="500" height="48" rx="8" fill="#e5e7eb"/>
  <rect x="50" y="94" width="500" height="48" rx="8" fill="url(#playerBar)"/>
  <!-- House portion: 3.23% of 500px = 16.15 ~ 16px -->
  <rect x="534" y="94" width="16" height="48" rx="4" fill="url(#houseBar)"/>

  <text x="292" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">96.77%</text>
  <text x="542" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">3.23%</text>

  <line x1="50" y1="168" x2="550" y2="168" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="300" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Пример: €1000 оборот при версия 96.77%</text>

  <rect x="50" y="207" width="220" height="74" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="160" y="233" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#166534" text-anchor="middle" font-weight="600">Обратно към играча</text>
  <text x="160" y="261" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#15803d" text-anchor="middle">~€968</text>
  <text x="160" y="276" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#22c55e" text-anchor="middle">(средно, дългосрочно)</text>

  <rect x="330" y="207" width="220" height="74" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="440" y="233" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="600">За казиното</text>
  <text x="440" y="261" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#dc2626" text-anchor="middle">~€32</text>
  <text x="440" y="276" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ef4444" text-anchor="middle">(домашно предимство ~3.23%)</text>

  <text x="300" y="251" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#9ca3af" text-anchor="middle">+</text>

  <text x="300" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Висока волатилност · макс. печалба 4608 пъти залога · при версия 90% плащаш по-скъпо · 18+ Играйте отговорно</text>
  <text x="300" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">RTP е дългосрочна статистика, не прогноза за следващото завъртане · проверявай реалната версия в инфо-панела</text>
</svg>
