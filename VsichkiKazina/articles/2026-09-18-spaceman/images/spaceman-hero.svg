<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="Абстрактна композиция: възходяща крива на множител, която стига до точка на осребряване и след това рязко се срива, метафора за cash-out момента в crash играта Spaceman">
  <title>Spaceman: абстрактна метафора за покачващ се множител и cash-out</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1030"/>
      <stop offset="55%" stop-color="#141a44"/>
      <stop offset="100%" stop-color="#1b2350"/>
    </linearGradient>
    <linearGradient id="rise" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="760" height="320" rx="18" ry="18" fill="url(#sky)"/>

  <!-- faint stars -->
  <g fill="#8ea0d6" fill-opacity="0.6">
    <circle cx="90" cy="60" r="2"/>
    <circle cx="180" cy="42" r="1.6"/>
    <circle cx="300" cy="70" r="2.2"/>
    <circle cx="470" cy="48" r="1.6"/>
    <circle cx="150" cy="120" r="1.6"/>
    <circle cx="700" cy="80" r="2"/>
    <circle cx="640" cy="52" r="1.6"/>
  </g>

  <!-- baseline -->
  <line x1="60" y1="262" x2="700" y2="262" stroke="#3a4585" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- area fill under the rising curve -->
  <path d="M60 262 C 200 258, 360 232, 470 150 S 560 40, 560 40 L 560 262 Z" fill="url(#fill)"/>

  <!-- rising multiplier curve up to the cash-out point -->
  <path d="M60 262 C 200 258, 360 232, 470 150 S 560 44, 560 44" fill="none" stroke="url(#rise)" stroke-width="6" stroke-linecap="round"/>

  <!-- crash: the drop after the peak (dashed, falling away) -->
  <path d="M560 44 C 588 92, 604 150, 612 232" fill="none" stroke="#f87171" stroke-width="4" stroke-linecap="round" stroke-dasharray="3,11" stroke-opacity="0.85"/>

  <!-- cash-out marker at the peak -->
  <circle cx="560" cy="44" r="30" fill="url(#glow)"/>
  <circle cx="560" cy="44" r="12" fill="#facc15"/>
  <circle cx="560" cy="44" r="5" fill="#0b1030"/>

  <!-- small ascending ticks along the base (multiplier growth, abstract, no numbers) -->
  <g fill="#a78bfa" fill-opacity="0.55">
    <rect x="120" y="250" width="12" height="12" rx="2"/>
    <rect x="210" y="242" width="12" height="20" rx="2"/>
    <rect x="300" y="230" width="12" height="32" rx="2"/>
    <rect x="390" y="212" width="12" height="50" rx="2"/>
    <rect x="480" y="184" width="12" height="78" rx="2"/>
  </g>

  <text x="34" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8ea0d6">18+ Играйте отговорно</text>
</svg>
