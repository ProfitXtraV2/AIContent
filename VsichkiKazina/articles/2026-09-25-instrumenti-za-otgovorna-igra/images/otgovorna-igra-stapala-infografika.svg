<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 466" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Стъпала на инструментите за отговорна игра по обхват">
  <rect x="6" y="6" width="748" height="454" rx="16" fill="#0f172a"/>
  <text x="30" y="40" fill="#f8fafc" font-size="20" font-weight="700">Инструменти за отговорна игра: стъпала по обхват</text>
  <text x="30" y="62" fill="#94a3b8" font-size="13">отгоре надолу: от меко ограничение в профила до национално самоизключване</text>

  <!-- Step 1 -->
  <rect x="30" y="80" width="700" height="54" rx="9" fill="#1e293b"/>
  <rect x="30" y="80" width="7" height="54" rx="3" fill="#10b981"/>
  <circle cx="66" cy="107" r="15" fill="#10b981"/>
  <text x="66" y="112" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">1</text>
  <text x="92" y="103" fill="#f1f5f9" font-size="16" font-weight="700">Лимити (депозит · загуба · залог)</text>
  <text x="92" y="123" fill="#94a3b8" font-size="13">намаляваш веднага, вдигаш след 24–72 часа</text>

  <!-- Step 2 -->
  <rect x="30" y="148" width="700" height="54" rx="9" fill="#1e293b"/>
  <rect x="30" y="148" width="7" height="54" rx="3" fill="#22d3ee"/>
  <circle cx="66" cy="175" r="15" fill="#22d3ee"/>
  <text x="66" y="180" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">2</text>
  <text x="92" y="171" fill="#f1f5f9" font-size="16" font-weight="700">Reality check и сесиен лимит</text>
  <text x="92" y="191" fill="#94a3b8" font-size="13">напомняне на всеки 15, 30 или 60 минути</text>

  <!-- Step 3 -->
  <rect x="30" y="216" width="700" height="54" rx="9" fill="#1e293b"/>
  <rect x="30" y="216" width="7" height="54" rx="3" fill="#eab308"/>
  <circle cx="66" cy="243" r="15" fill="#eab308"/>
  <text x="66" y="248" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">3</text>
  <text x="92" y="239" fill="#f1f5f9" font-size="16" font-weight="700">Пауза (cool-off)</text>
  <text x="92" y="259" fill="#94a3b8" font-size="13">24 часа · 7 дни · 30 дни; профилът се отваря сам</text>

  <!-- Step 4 -->
  <rect x="30" y="284" width="700" height="54" rx="9" fill="#1e293b"/>
  <rect x="30" y="284" width="7" height="54" rx="3" fill="#f97316"/>
  <circle cx="66" cy="311" r="15" fill="#f97316"/>
  <text x="66" y="316" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">4</text>
  <text x="92" y="307" fill="#f1f5f9" font-size="16" font-weight="700">Самоизключване при оператора</text>
  <text x="92" y="327" fill="#94a3b8" font-size="13">по-дълъг или неопределен срок, без предсрочна отмяна</text>

  <!-- Step 5 -->
  <rect x="30" y="352" width="700" height="54" rx="9" fill="#1e293b"/>
  <rect x="30" y="352" width="7" height="54" rx="3" fill="#ef4444"/>
  <circle cx="66" cy="379" r="15" fill="#ef4444"/>
  <text x="66" y="384" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">5</text>
  <text x="92" y="375" fill="#f1f5f9" font-size="16" font-weight="700">Национален регистър на уязвимите лица (НАП)</text>
  <text x="92" y="395" fill="#94a3b8" font-size="13">минимум 1 година; важи за всички лицензирани оператори</text>

  <text x="30" y="438" fill="#64748b" font-size="12">18+ · Инструментите са безплатни и са знак за контрол, не за слабост</text>
</svg>
