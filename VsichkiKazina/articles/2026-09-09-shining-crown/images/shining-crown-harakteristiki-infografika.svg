<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 640" font-family="'Segoe UI',Arial,sans-serif" role="img" aria-label="Основни характеристики на Shining Crown: 5x3, 10 линии, RTP 96.37%, волатилност ниска до средна, wild корона, scatter звезда и долар, Gamble и Jackpot Cards">
  <rect width="820" height="640" fill="#14120b"/>
  <rect x="0" y="0" width="820" height="74" fill="#1e1a0d"/>
  <text x="40" y="36" fill="#f4c430" font-size="26" font-weight="700">Shining Crown накратко</text>
  <text x="40" y="60" fill="#d8cfa8" font-size="14">EGT / Amusnet, 2014 г. · класически плодов слот · публични данни на доставчика</text>

  <!-- spec grid -->
  <g font-size="15">
    <!-- row labels -->
    <rect x="40" y="96" width="350" height="58" rx="6" fill="#201c10"/>
    <text x="58" y="122" fill="#d8cfa8">Барабани и линии</text>
    <text x="58" y="144" fill="#ffffff" font-size="18" font-weight="700">5 × 3, 10 фиксирани линии</text>

    <rect x="410" y="96" width="370" height="58" rx="6" fill="#201c10"/>
    <text x="428" y="122" fill="#d8cfa8">RTP (оригинал)</text>
    <text x="428" y="144" fill="#6fd19b" font-size="18" font-weight="700">~96.37%</text>

    <rect x="40" y="166" width="350" height="58" rx="6" fill="#201c10"/>
    <text x="58" y="192" fill="#d8cfa8">Задържа средно от 1 €</text>
    <text x="58" y="214" fill="#ffffff" font-size="18" font-weight="700">~3.6 цента (дългосрочно)</text>

    <rect x="410" y="166" width="370" height="58" rx="6" fill="#201c10"/>
    <text x="428" y="192" fill="#d8cfa8">Максимална печалба</text>
    <text x="428" y="214" fill="#f4c430" font-size="18" font-weight="700">до 5 000× залога</text>

    <rect x="40" y="236" width="350" height="58" rx="6" fill="#201c10"/>
    <text x="58" y="262" fill="#d8cfa8">Волатилност</text>
    <text x="58" y="284" fill="#ffffff" font-size="18" font-weight="700">ниска до средна</text>

    <rect x="410" y="236" width="370" height="58" rx="6" fill="#201c10"/>
    <text x="428" y="262" fill="#d8cfa8">Gamble (хи-ло на цвят)</text>
    <text x="428" y="284" fill="#ffffff" font-size="18" font-weight="700">до 5 последователни пъти</text>
  </g>

  <line x1="40" y1="318" x2="780" y2="318" stroke="#3a331c" stroke-width="1"/>

  <!-- symbols -->
  <text x="40" y="348" fill="#f4c430" font-size="18" font-weight="700">Специални символи</text>
  <g font-size="15">
    <text x="40" y="378" fill="#ffffff" font-weight="700">Корона (wild)</text>
    <text x="40" y="400" fill="#d8cfa8">замества символите; разтяга се вертикално на барабани 2, 3 и 4</text>
    <text x="40" y="430" fill="#ffffff" font-weight="700">Звезда (scatter)</text>
    <text x="40" y="452" fill="#d8cfa8">пада на барабани 1, 3, 5; плаща от всяка позиция</text>
    <text x="40" y="482" fill="#ffffff" font-weight="700">Долар $ (scatter)</text>
    <text x="40" y="504" fill="#d8cfa8">от всяка позиция, по собствена таблица (без безплатни завъртания)</text>
  </g>

  <!-- jackpot cards -->
  <text x="40" y="544" fill="#f4c430" font-size="18" font-weight="700">Jackpot Cards (прогресив, произволно задействане)</text>
  <g font-size="15" text-anchor="middle">
    <rect x="40" y="558" width="170" height="40" rx="6" fill="#2a2512"/>
    <text x="125" y="583" fill="#d8cfa8">♣ спатия (най-малко)</text>
    <rect x="220" y="558" width="170" height="40" rx="6" fill="#30291400"/>
    <rect x="220" y="558" width="170" height="40" rx="6" fill="#332c15"/>
    <text x="305" y="583" fill="#d8cfa8">♦ каро</text>
    <rect x="400" y="558" width="170" height="40" rx="6" fill="#3c3318"/>
    <text x="485" y="583" fill="#d8cfa8">♥ купа</text>
    <rect x="580" y="558" width="200" height="40" rx="6" fill="#47391a"/>
    <text x="680" y="583" fill="#f4c430" font-weight="700">♠ пика (най-голямо)</text>
  </g>

  <text x="40" y="624" fill="#b5ac84" font-size="13">Конфигурируем RTP: производни 40 Shining Crown ~95.98% / Cash Heat ~96.50%.</text>
  <text x="780" y="624" fill="#f4c430" font-size="13" font-weight="700" text-anchor="end">18+ Играйте отговорно</text>
</svg>
