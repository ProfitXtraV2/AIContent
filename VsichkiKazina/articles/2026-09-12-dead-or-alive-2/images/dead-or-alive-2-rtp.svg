<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Илюстративно: официалният RTP на Dead or Alive 2 е 96.80%; от него 68.6% се връщат в основната игра и 28.2% във фрий спиновете; при обявен RTP 96.80% и 1000 евро оборот средно 968 евро се връщат на играча, 32 евро остават за казиното; реалната версия се проверява в инфо-панела">
  <title>Илюстративно: RTP на Dead or Alive 2 96.80%</title>
  <defs>
    <linearGradient id="doa2bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="doa2player" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="doa2house" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <clipPath id="doa2clip">
      <rect x="50" y="98" width="500" height="48" rx="8" ry="8"/>
    </clipPath>
  </defs>

  <rect width="600" height="360" rx="12" ry="12" fill="url(#doa2bg)"/>

  <text x="300" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#065f46" text-anchor="middle">Dead or Alive 2: официален RTP 96.80% (NetEnt)</text>
  <text x="300" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">илюстративен пример при обявен RTP 96.80%; операторът може да пусне друга версия</text>

  <text x="50" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600">Връщане към играча (RTP)</text>
  <text x="550" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600" text-anchor="end">Домашно предимство</text>

  <!-- Single rounded track via clip: player 0-484px (96.80%), house 484-500px (3.2%), no seam -->
  <g clip-path="url(#doa2clip)">
    <rect x="50" y="98" width="500" height="48" fill="#e5e7eb"/>
    <rect x="50" y="98" width="484" height="48" fill="url(#doa2player)"/>
    <rect x="534" y="98" width="16" height="48" fill="url(#doa2house)"/>
  </g>

  <text x="292" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">96.80%</text>

  <text x="300" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151" text-anchor="middle">От обявените 96.80%: 68.6% в основната игра, 28.2% във фрий спиновете</text>

  <line x1="50" y1="194" x2="550" y2="194" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="300" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Пример: €1000 оборот</text>

  <rect x="50" y="232" width="220" height="76" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="160" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#065f46" text-anchor="middle" font-weight="600">Обратно към играча</text>
  <text x="160" y="288" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#047857" text-anchor="middle">~€968</text>
  <text x="160" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#059669" text-anchor="middle">(средно, дългосрочно)</text>

  <rect x="330" y="232" width="220" height="76" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="440" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="600">За казиното</text>
  <text x="440" y="288" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#dc2626" text-anchor="middle">~€32</text>
  <text x="440" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ef4444" text-anchor="middle">(домашно предимство ~3.2%)</text>

  <text x="300" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#9ca3af" text-anchor="middle">+</text>

  <text x="300" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · Провери реалния RTP в инфо-панела на конкретното казино</text>
</svg>
