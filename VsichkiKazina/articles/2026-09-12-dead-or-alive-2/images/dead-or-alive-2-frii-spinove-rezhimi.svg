<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img" aria-label="Сравнение на трите режима безплатни завъртания в Dead or Alive 2: Old Saloon с 12 завъртания и 2x множител и sticky wilds; High Noon Saloon с 12 завъртания и множители 2x или 3x и sticky wilds; Train Heist с 12 завъртания и множител до 16x, който расте с една стъпка при всеки wild, откъдето идва таванът от 100 000х">
  <title>Dead or Alive 2: трите режима безплатни завъртания</title>
  <defs>
    <linearGradient id="modebg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
  </defs>

  <rect width="680" height="340" rx="12" ry="12" fill="url(#modebg)"/>

  <text x="340" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#7c2d12" text-anchor="middle">Dead or Alive 2: трите режима безплатни завъртания</text>
  <text x="340" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">и трите стартират с 12 завъртания, но с различни механики</text>

  <!-- Card 1: Old Saloon -->
  <rect x="20" y="74" width="200" height="226" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="20" y="74" width="200" height="40" rx="10" fill="#b45309"/>
  <rect x="20" y="104" width="200" height="10" fill="#b45309"/>
  <text x="120" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Old Saloon</text>
  <text x="120" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">12 завъртания</text>
  <text x="120" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#b45309" text-anchor="middle">2x множител</text>
  <text x="120" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151" text-anchor="middle">sticky wilds</text>
  <text x="120" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151" text-anchor="middle">класическият режим</text>

  <!-- Card 2: High Noon Saloon -->
  <rect x="240" y="74" width="200" height="226" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="240" y="74" width="200" height="40" rx="10" fill="#c2410c"/>
  <rect x="240" y="104" width="200" height="10" fill="#c2410c"/>
  <text x="340" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">High Noon Saloon</text>
  <text x="340" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">12 завъртания</text>
  <text x="340" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#c2410c" text-anchor="middle">множители 2x/3x</text>
  <text x="340" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151" text-anchor="middle">sticky wilds</text>
  <text x="340" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151" text-anchor="middle">по-рисков режим</text>

  <!-- Card 3: Train Heist -->
  <rect x="460" y="74" width="200" height="226" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="460" y="74" width="200" height="40" rx="10" fill="#991b1b"/>
  <rect x="460" y="104" width="200" height="10" fill="#991b1b"/>
  <text x="560" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Train Heist</text>
  <text x="560" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">12 завъртания</text>
  <text x="560" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#991b1b" text-anchor="middle">множител до 16x</text>
  <text x="560" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151" text-anchor="middle">+1 при всеки wild</text>
  <text x="560" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151" text-anchor="middle">таванът 100 000х е тук</text>

  <text x="340" y="326" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · Волатилността на играта е екстремно висока</text>
</svg>
