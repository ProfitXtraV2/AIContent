<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Как работи бонусът Lockdown Spins в San Quentin: 3, 4 или 5 скатера дават съответно 1, 2 или 3 Jumping Wilds; когато Jumping Wild попадне на реел с Razor Split множителят му се удвоява до максимум 512 пъти">
  <title>San Quentin: Lockdown Spins — скатери, Jumping Wilds и множител до ×512</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef1f4"/>
      <stop offset="100%" stop-color="#dde3ea"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" rx="12" ry="12" fill="url(#bg2)"/>
  <text x="300" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="middle">Lockdown Spins: скатери и Jumping Wilds</text>
  <text x="300" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Стражевите кули (скатери) пускат бонуса и дават начални Jumping Wilds</text>

  <!-- 3 scatters -->
  <rect x="45" y="80" width="160" height="86" rx="10" fill="url(#card)"/>
  <text x="125" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">3 скатера</text>
  <text x="125" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#fbbf24" text-anchor="middle">1 Jumping Wild</text>

  <!-- 4 scatters -->
  <rect x="220" y="80" width="160" height="86" rx="10" fill="url(#card)"/>
  <text x="300" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">4 скатера</text>
  <text x="300" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#fbbf24" text-anchor="middle">2 Jumping Wilds</text>

  <!-- 5 scatters -->
  <rect x="395" y="80" width="160" height="86" rx="10" fill="url(#card)"/>
  <text x="475" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">5 скатера</text>
  <text x="475" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#fbbf24" text-anchor="middle">3 Jumping Wilds</text>

  <!-- arrow down -->
  <text x="300" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle">▼</text>

  <!-- multiplier explanation -->
  <rect x="70" y="210" width="460" height="86" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="300" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#334155" text-anchor="middle">Jumping Wild върху реел с Razor Split удвоява множителя си</text>
  <text x="300" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#b45309" text-anchor="middle" font-weight="600">множителят остава до края на рунда, до таван</text>
  <text x="300" y="288" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#d97706" text-anchor="middle">×512</text>

  <text x="300" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Броят завъртания зависи от отворените Enhancer Cells · таванният сценарий е рядък · 18+ Играйте отговорно</text>
</svg>
