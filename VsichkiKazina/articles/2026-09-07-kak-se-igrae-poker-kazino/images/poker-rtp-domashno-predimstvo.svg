<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" role="img" aria-label="Покер RTP и домашно предимство: при хипотетичен RTP 98% и €100 залог, €2 остават за казиното (числата са илюстративни)">
  <title>Покер RTP и домашно предимство — илюстративен пример</title>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="playerBar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="houseBar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect width="600" height="260" rx="12" ry="12" fill="url(#bg3)"/>

  <text x="300" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e3a5f" text-anchor="middle">Покер RTP и домашно предимство</text>
  <text x="300" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Числата са илюстративни; реалните зависят от играта и нейната таблица</text>

  <!-- Bar -->
  <rect x="50" y="64" width="500" height="44" rx="8" fill="#e5e7eb"/>
  <!-- Player: 98% = 490px -->
  <rect x="50" y="64" width="490" height="44" rx="8" fill="url(#playerBar2)"/>
  <!-- House: 2% = 10px -->
  <rect x="540" y="64" width="10" height="44" rx="0" fill="url(#houseBar2)"/>
  <rect x="546" y="64" width="4" height="44" rx="2" fill="url(#houseBar2)"/>

  <text x="270" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">RTP ≈ 98%</text>
  <text x="552" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2%</text>

  <!-- Labels -->
  <text x="50" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151">Връщане към играча</text>
  <text x="550" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151" text-anchor="end">Домашно предимство</text>

  <!-- Divider -->
  <line x1="50" y1="138" x2="550" y2="138" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Example boxes -->
  <text x="300" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Пример: €100 залог</text>

  <rect x="50" y="170" width="215" height="68" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="157" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="600">Обратно към играча</text>
  <text x="157" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#1d4ed8" text-anchor="middle">≈ €98</text>

  <rect x="335" y="170" width="215" height="68" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="443" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="600">За казиното</text>
  <text x="443" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#dc2626" text-anchor="middle">≈ €2</text>

  <text x="300" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · RTP е дългосрочна статистика върху много раздавания, не гаранция</text>
</svg>
