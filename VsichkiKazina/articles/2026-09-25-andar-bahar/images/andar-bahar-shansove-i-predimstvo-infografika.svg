<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-label="Инфографика: шансове и домашно предимство при Andar Bahar. Страната с първата карта печели около 51.5% от ръцете, плаща 0.90:1 при домашно предимство 2.15%. Другата страна печели около 48.5%, плаща 1:1 (равни пари) при домашно предимство 3.00%. Числата за залог от 20 евро са примерни.">
  <rect x="8" y="8" width="704" height="394" rx="18" fill="#0f172a"/>

  <text x="32" y="42" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">Andar Bahar: шансове и цена на залога</text>
  <text x="32" y="64" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Двете страни не са 50/50, затова се плащат различно (най-разпространена схема)</text>

  <text x="32" y="104" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">Дял спечелени ръце (%)</text>

  <!-- gridlines 0..60% -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="200" y1="122" x2="200" y2="250"/>
    <line x1="360" y1="122" x2="360" y2="250"/>
    <line x1="520" y1="122" x2="520" y2="250"/>
    <line x1="680" y1="122" x2="680" y2="250"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">
    <text x="200" y="266">0%</text>
    <text x="360" y="266">20%</text>
    <text x="520" y="266">40%</text>
    <text x="680" y="266">60%</text>
  </g>

  <!-- first-card side: 51.5% -->
  <text x="32" y="151" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Страната с</text>
  <text x="32" y="167" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">първата карта</text>
  <rect x="200" y="138" width="412" height="26" rx="4" fill="#34d399"/>
  <text x="210" y="156" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">≈51.5%</text>
  <text x="200" y="188" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">плаща 0.90:1 · домашно предимство 2.15%</text>

  <!-- other side: 48.5% -->
  <text x="32" y="221" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Другата страна</text>
  <rect x="200" y="208" width="388" height="26" rx="4" fill="#38bdf8"/>
  <text x="210" y="226" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">≈48.5%</text>
  <text x="200" y="258" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">плаща 1:1 (равни пари) · домашно предимство 3.00%</text>

  <!-- note box -->
  <rect x="32" y="292" width="656" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="48" y="318" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Първата раздадена карта може сама да е съвпадението,</text>
  <text x="48" y="338" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1">затова страната, която тегли първа, печели малко по-често и плаща по-малко.</text>

  <!-- footer -->
  <text x="32" y="384" font-family="Arial, sans-serif" font-size="11" fill="#64748b">18+ Играйте отговорно</text>
  <text x="688" y="384" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="end">числата за залог от €20 са примерни</text>
</svg>
