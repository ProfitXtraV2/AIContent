<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" font-family="Arial, 'DejaVu Sans', sans-serif" role="img" aria-labelledby="svgtitle svgdesc">
  <title id="svgtitle">Как работи PaySafeCard в онлайн казино: три стъпки за депозит и контрастът депозит ДА срещу теглене НЕ</title>
  <desc id="svgdesc">Три стъпки: купи ваучер, въведи 16-цифрен PIN, депозитът е моментален. Депозит: ДА (моментален). Теглене: НЕ (нужен друг метод). Номинали 10 до 100 евро, примерни.</desc>

  <!-- card -->
  <rect x="4" y="4" width="712" height="472" rx="16" fill="#ffffff" stroke="#d7dee8" stroke-width="2"/>

  <!-- title -->
  <text x="360" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Как работи PaySafeCard в казино</text>

  <!-- STEP 1 -->
  <rect x="51" y="80" width="190" height="110" rx="12" fill="#eef4ff" stroke="#b9cdf0" stroke-width="1.5"/>
  <circle cx="146" cy="108" r="15" fill="#2563eb"/>
  <text x="146" y="113" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
  <text x="146" y="152" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Купи ваучер</text>

  <!-- arrow 1->2 -->
  <path d="M247 135 L259 135 M255 130 L260 135 L255 140" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- STEP 2 -->
  <rect x="265" y="80" width="190" height="110" rx="12" fill="#eef4ff" stroke="#b9cdf0" stroke-width="1.5"/>
  <circle cx="360" cy="108" r="15" fill="#2563eb"/>
  <text x="360" y="113" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>
  <text x="360" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Въведи</text>
  <text x="360" y="167" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">16-цифрен PIN</text>

  <!-- arrow 2->3 -->
  <path d="M461 135 L473 135 M469 130 L474 135 L469 140" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- STEP 3 -->
  <rect x="479" y="80" width="190" height="110" rx="12" fill="#eef4ff" stroke="#b9cdf0" stroke-width="1.5"/>
  <circle cx="574" cy="108" r="15" fill="#2563eb"/>
  <text x="574" y="113" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text>
  <text x="574" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Депозитът е</text>
  <text x="574" y="167" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">моментален</text>

  <!-- CONTRAST PANELS -->
  <!-- deposit YES -->
  <rect x="24" y="222" width="315" height="138" rx="12" fill="#e7f6ec" stroke="#1a7f37" stroke-width="2"/>
  <text x="181" y="266" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">Депозит: ДА</text>
  <text x="181" y="294" text-anchor="middle" font-size="14" fill="#166534">(моментален)</text>
  <text x="181" y="330" text-anchor="middle" font-size="13" fill="#3f6b4c">Заредиш ли €50, това е таванът</text>

  <!-- withdrawal NO -->
  <rect x="381" y="222" width="315" height="138" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="538" y="266" text-anchor="middle" font-size="18" font-weight="700" fill="#a4231a">Теглене: НЕ</text>
  <text x="538" y="294" text-anchor="middle" font-size="14" fill="#a4231a">(нужен друг метод)</text>
  <text x="538" y="330" text-anchor="middle" font-size="13" fill="#8a4038">карта / банка / портфейл</text>

  <!-- note -->
  <text x="360" y="400" text-anchor="middle" font-size="13" fill="#64748b">Номинали €10 – €100 (примерни, варират по държава)</text>

  <!-- 18+ RG -->
  <text x="360" y="452" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">18+ Играйте отговорно</text>
</svg>
