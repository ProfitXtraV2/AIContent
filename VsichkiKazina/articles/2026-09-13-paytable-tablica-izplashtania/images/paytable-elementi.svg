<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="'Segoe UI',Roboto,Arial,sans-serif" role="img" aria-label="Какво съдържа таблицата с изплащания на слот: полета по редове">
  <rect x="0" y="0" width="720" height="470" rx="16" fill="#0f1b2d"/>
  <rect x="16" y="16" width="688" height="438" rx="12" fill="#152238"/>
  <text x="40" y="52" fill="#f4f7fb" font-size="22" font-weight="700">Какво съдържа таблицата с изплащания</text>
  <text x="40" y="76" fill="#8aa0be" font-size="13">Информационният екран (i) на един слот, по полета</text>

  <!-- rows -->
  <g>
    <rect x="40" y="96" width="6" height="44" rx="3" fill="#e0a43b"/>
    <text x="60" y="116" fill="#eaf0f8" font-size="17" font-weight="600">Стойност на символите</text>
    <text x="60" y="135" fill="#9fb4d0" font-size="13.5">високи и ниски; таблицата казва колко (3, 4 или 5) плащат</text>
  </g>
  <g>
    <rect x="40" y="152" width="6" height="44" rx="3" fill="#e0a43b"/>
    <text x="60" y="172" fill="#eaf0f8" font-size="17" font-weight="600">×залог или ×залог на линия</text>
    <text x="60" y="191" fill="#9fb4d0" font-size="13.5">примерно: €1 на 20 линии = €0,05 на линия</text>
  </g>
  <g>
    <rect x="40" y="208" width="6" height="44" rx="3" fill="#4fa3d1"/>
    <text x="60" y="228" fill="#eaf0f8" font-size="17" font-weight="600">Линии, начини или „навсякъде"</text>
    <text x="60" y="247" fill="#9fb4d0" font-size="13.5">фиксирани линии, 243/1024 начина или pay-anywhere/клъстър</text>
  </g>
  <g>
    <rect x="40" y="264" width="6" height="44" rx="3" fill="#4fa3d1"/>
    <text x="60" y="284" fill="#eaf0f8" font-size="17" font-weight="600">Специални символи</text>
    <text x="60" y="303" fill="#9fb4d0" font-size="13.5">wild, scatter, bonus; праг за бонуса, примерно 3+ scatter</text>
  </g>
  <g>
    <rect x="40" y="320" width="6" height="44" rx="3" fill="#57b98a"/>
    <text x="60" y="340" fill="#eaf0f8" font-size="17" font-weight="600">RTP и волатилност</text>
    <text x="60" y="359" fill="#9fb4d0" font-size="13.5">дългосрочна статистика, примерно 96,42%; скала ниска–висока</text>
  </g>
  <g>
    <rect x="40" y="376" width="6" height="44" rx="3" fill="#57b98a"/>
    <text x="60" y="396" fill="#eaf0f8" font-size="17" font-weight="600">Таван на печалбата</text>
    <text x="60" y="415" fill="#9fb4d0" font-size="13.5">горна граница, примерно 5000× залога, а не обещание</text>
  </g>

  <text x="40" y="446" fill="#6f86a6" font-size="12">Числата са примерни · 18+ Играйте отговорно</text>
</svg>
