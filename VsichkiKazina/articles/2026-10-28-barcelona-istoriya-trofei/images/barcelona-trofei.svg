<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" role="img" aria-label="Инфографика: ключови години и трофеи на Барселона към 2026 г.">
  <defs>
    <style>
      .bg{fill:#f6f7f9;}
      .card{fill:#ffffff;stroke:#dde1e8;stroke-width:1;}
      .title{fill:#1a2330;font-family:'Segoe UI',Arial,sans-serif;font-size:24px;font-weight:700;}
      .sub{fill:#5f6a7a;font-family:'Segoe UI',Arial,sans-serif;font-size:13px;}
      .yr{fill:#8a1538;font-family:'Segoe UI',Arial,sans-serif;font-size:17px;font-weight:700;}
      .lbl{fill:#2a3545;font-family:'Segoe UI',Arial,sans-serif;font-size:14px;}
      .colh{fill:#154284;font-family:'Segoe UI',Arial,sans-serif;font-size:14px;font-weight:700;}
      .big{fill:#1a2330;font-family:'Segoe UI',Arial,sans-serif;font-size:32px;font-weight:800;}
      .tl{fill:#2a3545;font-family:'Segoe UI',Arial,sans-serif;font-size:13px;}
      .foot{fill:#5f6a7a;font-family:'Segoe UI',Arial,sans-serif;font-size:13px;}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="820" height="580"/>
  <rect class="card" x="8" y="8" width="804" height="564" rx="14"/>

  <text class="title" x="410" y="48" text-anchor="middle">Барселона: години и трофеи</text>
  <text class="sub" x="410" y="70" text-anchor="middle">към 2026 г.</text>

  <line x1="40" y1="88" x2="780" y2="88" stroke="#dde1e8" stroke-width="1"/>

  <!-- Left column: key years -->
  <text class="colh" x="40" y="118">Ключови години</text>

  <text class="yr"  x="40"  y="154">1899</text>
  <text class="lbl" x="160" y="154">Основан от Жоан Гампер</text>

  <text class="yr"  x="40"  y="196">1957</text>
  <text class="lbl" x="160" y="196">Стадион „Камп Ноу"</text>

  <text class="yr"  x="40"  y="238">1992</text>
  <text class="lbl" x="160" y="238">Първа европейска купа</text>

  <text class="yr"  x="40"  y="280">2009</text>
  <text class="lbl" x="160" y="280">Секстъпъл: 6 трофея</text>

  <text class="yr"  x="40"  y="322">2015</text>
  <text class="lbl" x="160" y="322">Пети европейски трофей</text>

  <!-- Divider -->
  <line x1="470" y1="104" x2="470" y2="400" stroke="#dde1e8" stroke-width="1"/>

  <!-- Right column: trophies -->
  <text class="colh" x="640" y="118" text-anchor="middle">Трофеи</text>

  <text class="big" x="520" y="166" text-anchor="middle">29</text>
  <text class="tl"  x="556" y="166">титли в Ла Лига</text>

  <text class="big" x="520" y="210" text-anchor="middle">32</text>
  <text class="tl"  x="556" y="210">Купи на краля (рекорд)</text>

  <text class="big" x="520" y="254" text-anchor="middle">16</text>
  <text class="tl"  x="556" y="254">Суперкупи на Испания (рекорд)</text>

  <text class="big" x="520" y="298" text-anchor="middle">5</text>
  <text class="tl"  x="556" y="298">Шампионска лига</text>

  <text class="big" x="520" y="342" text-anchor="middle">4</text>
  <text class="tl"  x="556" y="342">Купи на носителите (рекорд)</text>

  <text class="big" x="520" y="386" text-anchor="middle">3</text>
  <text class="tl"  x="556" y="386">световни клубни титли</text>

  <!-- Footer strip -->
  <line x1="40" y1="478" x2="780" y2="478" stroke="#dde1e8" stroke-width="1"/>
  <text class="foot" x="40"  y="508">„Més que un club" · Ла Масия от 1979 г.</text>
  <text class="foot" x="780" y="508" text-anchor="end">18+ Играйте отговорно</text>
</svg>
