<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="'Segoe UI',Roboto,Arial,sans-serif">
<rect x="6" y="6" width="708" height="338" rx="18" fill="#0f2340"/>
<text x="30" y="44" fill="#eaf1fb" font-size="21" font-weight="700">Три числа за един слот</text>
<text x="30" y="68" fill="#b3c6de" font-size="14">Мерят различни неща · всяко отговаря на различен въпрос</text>
<rect x="30" y="90" width="214" height="196" rx="12" fill="#16305a"/>
<rect x="30" y="90" width="214" height="7" rx="3" fill="#f5a623"/>
<text x="48" y="132" fill="#eaf1fb" font-size="18" font-weight="700">RTP</text>
<text x="48" y="162" fill="#c7d5ea" font-size="14">колко връща</text>
<text x="48" y="182" fill="#c7d5ea" font-size="14">дългосрочно</text>
<rect x="48" y="202" width="70" height="34" rx="8" fill="#f5a623"/>
<text x="83" y="224" fill="#0f2340" font-size="16" font-weight="700" text-anchor="middle">96%</text>
<text x="48" y="262" fill="#8fa6c4" font-size="12.5">(пример)</text>
<rect x="260" y="90" width="214" height="196" rx="12" fill="#16305a"/>
<rect x="260" y="90" width="214" height="7" rx="3" fill="#2ec5b6"/>
<text x="278" y="132" fill="#eaf1fb" font-size="18" font-weight="700">Волатилност</text>
<text x="278" y="162" fill="#c7d5ea" font-size="14">колко разсеяно</text>
<text x="278" y="182" fill="#c7d5ea" font-size="14">е връщането</text>
<rect x="278" y="202" width="125" height="34" rx="8" fill="#2ec5b6"/>
<text x="340" y="224" fill="#0f2340" font-size="16" font-weight="700" text-anchor="middle">ниска–висока</text>
<rect x="490" y="90" width="214" height="196" rx="12" fill="#16305a" stroke="#ffd36b" stroke-width="2"/>
<rect x="490" y="90" width="214" height="7" rx="3" fill="#ffd36b"/>
<text x="508" y="132" fill="#eaf1fb" font-size="18" font-weight="700">Хит честота</text>
<text x="508" y="162" fill="#c7d5ea" font-size="14">колко често</text>
<text x="508" y="182" fill="#c7d5ea" font-size="14">пада печалба</text>
<rect x="508" y="202" width="70" height="34" rx="8" fill="#ffd36b"/>
<text x="543" y="224" fill="#0f2340" font-size="16" font-weight="700" text-anchor="middle">25%</text>
<text x="508" y="262" fill="#8fa6c4" font-size="12.5">≈ едно на четири</text>
<text x="30" y="332" fill="#7fe3d6" font-size="13.5" font-weight="600">Печалба под залога също се брои · диапазон 3–40% · примерни числа · 18+</text>
</svg>