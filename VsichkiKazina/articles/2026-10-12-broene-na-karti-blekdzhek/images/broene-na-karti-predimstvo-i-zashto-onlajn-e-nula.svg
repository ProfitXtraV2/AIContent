<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 632" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Броене на карти в блекджек: стойностите по Хай-Ло (2 до 6 = +1; 7, 8, 9 = 0; 10, J, Q, K, A = −1), размерът на предимството на всеки €100 (казино около 0,5% или €0,50 загуба срещу опитен брояч около 1% или около €1 в полза), и защо онлайн срещу RNG и CSM проникването и предимството падат до нула">
  <rect x="6" y="6" width="748" height="620" rx="16" fill="#0f172a"/>
  <text x="30" y="42" fill="#f8fafc" font-size="20" font-weight="700">Броене на карти: предимството и защо онлайн е нула</text>
  <text x="30" y="64" fill="#94a3b8" font-size="13">работи само на жива маса с ръчно тесте; числата са ориентировъчни и зависят от правилата</text>

  <!-- Panel A: Hi-Lo values -->
  <text x="30" y="98" fill="#f8fafc" font-size="15" font-weight="700">Системата Хай-Ло: стойност на всяка карта</text>
  <rect x="30" y="110" width="222" height="54" rx="9" fill="#1e293b"/>
  <rect x="30" y="110" width="7" height="54" rx="3" fill="#22c55e"/>
  <text x="52" y="143" fill="#e2e8f0" font-size="14">карти 2 до 6</text>
  <text x="230" y="146" fill="#22c55e" font-size="24" font-weight="700" text-anchor="end">+1</text>
  <rect x="269" y="110" width="222" height="54" rx="9" fill="#1e293b"/>
  <rect x="269" y="110" width="7" height="54" rx="3" fill="#64748b"/>
  <text x="291" y="143" fill="#e2e8f0" font-size="14">7, 8, 9</text>
  <text x="469" y="146" fill="#cbd5e1" font-size="24" font-weight="700" text-anchor="end">0</text>
  <rect x="508" y="110" width="222" height="54" rx="9" fill="#1e293b"/>
  <rect x="508" y="110" width="7" height="54" rx="3" fill="#f97316"/>
  <text x="530" y="143" fill="#e2e8f0" font-size="14">10, J, Q, K, A</text>
  <text x="708" y="146" fill="#f97316" font-size="24" font-weight="700" text-anchor="end">−1</text>
  <text x="30" y="184" fill="#94a3b8" font-size="12">Цялото тесте се сумира до 0 (балансиран брояч от ниво 1).</text>
  <text x="30" y="201" fill="#94a3b8" font-size="12">Реален брой = текущ брой ÷ неизиграни тестета (напр. +6 ÷ 3 ≈ +2).</text>

  <!-- Panel B: edge size -->
  <text x="30" y="235" fill="#f8fafc" font-size="15" font-weight="700">Размерът на предимството (на всеки €100 заложени)</text>
  <text x="30" y="261" fill="#e2e8f0" font-size="13">Казино · основна стратегия, 4+ тестета ≈ 0,5%</text>
  <rect x="30" y="269" width="140" height="30" rx="6" fill="#475569"/>
  <text x="180" y="290" fill="#f1f5f9" font-size="14" font-weight="700">€0,50 средна загуба</text>
  <text x="30" y="323" fill="#e2e8f0" font-size="13">Опитен брояч · 6 тестета ≈ 1%</text>
  <rect x="30" y="331" width="280" height="30" rx="6" fill="#10b981"/>
  <text x="320" y="352" fill="#f1f5f9" font-size="14" font-weight="700">≈ €1 в твоя полза</text>
  <text x="30" y="385" fill="#94a3b8" font-size="12">При осем тестета казиното държи малко повече, ≈ 0,57%.</text>
  <text x="30" y="402" fill="#94a3b8" font-size="12">От лек минус към лек плюс; дисперсията е голяма в кратък срок.</text>

  <!-- Panel C: penetration live vs online -->
  <text x="30" y="436" fill="#f8fafc" font-size="15" font-weight="700">Проникването решава: на живо срещу онлайн</text>
  <rect x="30" y="448" width="340" height="104" rx="9" fill="#1e293b"/>
  <rect x="30" y="448" width="7" height="104" rx="3" fill="#22c55e"/>
  <text x="52" y="476" fill="#f1f5f9" font-size="15" font-weight="700">На живо · ръчно тесте</text>
  <text x="52" y="500" fill="#94a3b8" font-size="12.5">дълбоко проникване, тестето пази памет</text>
  <text x="52" y="534" fill="#22c55e" font-size="19" font-weight="700">предимство е възможно</text>
  <rect x="390" y="448" width="340" height="104" rx="9" fill="#1e293b"/>
  <rect x="390" y="448" width="7" height="104" rx="3" fill="#f97316"/>
  <text x="412" y="476" fill="#f1f5f9" font-size="15" font-weight="700">Онлайн RNG · машина CSM</text>
  <text x="412" y="500" fill="#94a3b8" font-size="12.5">разбъркване всяка ръка, проникване = 0</text>
  <text x="412" y="534" fill="#f97316" font-size="19" font-weight="700">предимство = 0</text>

  <line x1="30" y1="576" x2="730" y2="576" stroke="#334155" stroke-width="1"/>
  <text x="30" y="596" fill="#94a3b8" font-size="12">Числата зависят от правилата (S17/H17, брой тестета, проникване) и са примерни.</text>
  <text x="30" y="616" fill="#64748b" font-size="12">18+ Хазартът може да пристрасти. Играйте отговорно.</text>
</svg>
