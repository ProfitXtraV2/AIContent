<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="'Segoe UI',Arial,sans-serif" role="img" aria-label="Хоризонтална стълбовидна диаграма с типичното домашно предимство по игри: блекджек с основна стратегия 0,5%, бакара на банкера 1,06%, крапс 1,4%, европейска рулетка 2,70%, американска рулетка 5,26%, ротативки 2 до 10 процента и кено 20 до 40 процента.">
  <rect x="2" y="2" width="756" height="466" rx="18" fill="#ffffff" stroke="#d8dee9"/>
  <text x="380" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2a44">Типично домашно предимство по игри</text>
  <text x="380" y="58" text-anchor="middle" font-size="14" fill="#5b6678">Дял от залога, който казиното задържа в дългосрочен план.</text>
  <text x="380" y="78" text-anchor="middle" font-size="14" fill="#5b6678">По-ниският процент означава по-евтина игра.</text>

  <!-- baseline axis -->
  <line x1="262" y1="88" x2="262" y2="420" stroke="#c7cfdb" stroke-width="1"/>

  <g font-size="14" fill="#1f2a44">
    <!-- r1 blackjack -->
    <text x="250" y="111" text-anchor="end">Блекджек (осн. стратегия)</text>
    <rect x="262" y="92" width="6" height="28" rx="3" fill="#2e8b57"/>
    <text x="630" y="111" font-size="14" font-weight="700" fill="#2e8b57">0,5%</text>

    <!-- r2 baccarat banker -->
    <text x="250" y="161" text-anchor="end">Бакара (банкер)</text>
    <rect x="262" y="142" width="10" height="28" rx="3" fill="#2e8b57"/>
    <text x="630" y="161" font-size="14" font-weight="700" fill="#2e8b57">1,06%</text>

    <!-- r3 craps -->
    <text x="250" y="211" text-anchor="end">Крапс (pass line)</text>
    <rect x="262" y="192" width="13" height="28" rx="3" fill="#2e8b57"/>
    <text x="630" y="211" font-size="14" font-weight="700" fill="#2e8b57">1,4%</text>

    <!-- r4 euro roulette -->
    <text x="250" y="261" text-anchor="end">Европейска рулетка</text>
    <rect x="262" y="242" width="24" height="28" rx="3" fill="#3a7ca5"/>
    <text x="630" y="261" font-size="14" font-weight="700" fill="#3a7ca5">2,70%</text>

    <!-- r5 american roulette -->
    <text x="250" y="311" text-anchor="end">Американска рулетка</text>
    <rect x="262" y="292" width="47" height="28" rx="3" fill="#d9892f"/>
    <text x="630" y="311" font-size="14" font-weight="700" fill="#d9892f">5,26%</text>

    <!-- r6 slots band 2-10 -->
    <text x="250" y="361" text-anchor="end">Ротативки / слотове</text>
    <rect x="280" y="342" width="72" height="28" rx="3" fill="#c0504d"/>
    <text x="630" y="361" font-size="14" font-weight="700" fill="#c0504d">2%–10%</text>

    <!-- r7 keno band 20-40 -->
    <text x="250" y="411" text-anchor="end">Кено</text>
    <rect x="442" y="392" width="180" height="28" rx="3" fill="#a83232"/>
    <text x="630" y="411" font-size="14" font-weight="700" fill="#a83232">20%–40%</text>
  </g>

  <text x="380" y="446" text-anchor="middle" font-size="12" fill="#8a94a6">Типични стойности, зависят от правилата и таблицата за изплащане · 18+ Играйте отговорно</text>
</svg>
