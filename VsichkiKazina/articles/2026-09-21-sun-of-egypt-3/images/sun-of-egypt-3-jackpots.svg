<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" role="img" aria-label="Петте нива на джакпота в Sun of Egypt 3, всичките фиксирани множители на залога: Mini 20 пъти, Minor 50 пъти, Major 150 пъти, Grand 2000 пъти и Royal 10 000 пъти. Royal се печели само при напълване на цялата решетка от 15 позиции и е максималната печалба в играта.">
  <title>Sun of Egypt 3: петте нива на джакпота</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#fdf0d5"/>
    </linearGradient>
    <linearGradient id="royal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="tier" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="700" height="420" rx="14" ry="14" fill="url(#bg)"/>
  <text x="350" y="36" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#78350f" text-anchor="middle">Sun of Egypt 3: петте нива на джакпота</text>
  <text x="350" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#a16207" text-anchor="middle">фиксирани множители на общия залог · раздават се в Hold and Win</text>

  <!-- Royal -->
  <rect x="30" y="74" width="640" height="60" rx="10" fill="url(#royal)"/>
  <text x="48" y="111" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Royal</text>
  <text x="350" y="106" font-family="system-ui, sans-serif" font-size="11.5" fill="#fff7ed" text-anchor="middle">пълна решетка (15 позиции)</text>
  <text x="350" y="122" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#fef3c7" text-anchor="middle">максималната печалба</text>
  <text x="652" y="112" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="end">10 000×</text>

  <!-- Grand -->
  <rect x="30" y="140" width="640" height="60" rx="10" fill="url(#tier)" opacity="0.95"/>
  <text x="48" y="177" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Grand</text>
  <text x="652" y="178" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="end">2 000×</text>

  <!-- Major -->
  <rect x="30" y="206" width="640" height="60" rx="10" fill="url(#tier)" opacity="0.86"/>
  <text x="48" y="243" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Major</text>
  <text x="652" y="244" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="end">150×</text>

  <!-- Minor -->
  <rect x="30" y="272" width="640" height="60" rx="10" fill="url(#tier)" opacity="0.77"/>
  <text x="48" y="309" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Minor</text>
  <text x="652" y="310" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="end">50×</text>

  <!-- Mini -->
  <rect x="30" y="338" width="640" height="60" rx="10" fill="url(#tier)" opacity="0.68"/>
  <text x="48" y="375" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Mini</text>
  <text x="652" y="376" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="end">20×</text>
</svg>
