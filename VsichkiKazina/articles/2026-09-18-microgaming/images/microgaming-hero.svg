  <rect width="760" height="320" rx="16" ry="16" fill="url(#bgg)"/>

  <text x="40" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Microgaming</text>
  <text x="40" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">студиото, което започна онлайн казиното</text>

  <!-- browser window: the first online casino in a browser (left) -->
  <g>
    <rect x="48" y="110" width="214" height="158" rx="12" fill="#111a33" stroke="#3b3170" stroke-width="2"/>
    <rect x="48" y="110" width="214" height="30" rx="12" fill="#1e2647"/>
    <circle cx="66" cy="125" r="4" fill="#f43f5e"/>
    <circle cx="82" cy="125" r="4" fill="#fbbf24"/>
    <circle cx="98" cy="125" r="4" fill="#22d3ee"/>
    <!-- reels -->
    <rect x="70" y="156" width="52" height="92" rx="8" fill="url(#reel)" opacity="0.85"/>
    <rect x="130" y="156" width="52" height="92" rx="8" fill="url(#reel)" opacity="0.7"/>
    <rect x="190" y="156" width="52" height="92" rx="8" fill="url(#reel)" opacity="0.85"/>
    <rect x="84" y="170" width="24" height="24" rx="5" fill="#e0e7ff" opacity="0.9"/>
    <rect x="84" y="204" width="24" height="24" rx="5" fill="#c7d2fe" opacity="0.6"/>
    <rect x="144" y="186" width="24" height="24" rx="5" fill="#e0e7ff" opacity="0.85"/>
    <rect x="204" y="170" width="24" height="24" rx="5" fill="#c7d2fe" opacity="0.7"/>
    <rect x="204" y="204" width="24" height="24" rx="5" fill="#c7d2fe" opacity="0.6"/>
  </g>

  <!-- connective lines from browser to the shared pool via casino nodes (right) -->
  <g stroke="#6366f1" stroke-width="2.5" fill="none" opacity="0.75">
    <path d="M262 150 C 330 130, 380 120, 470 126"/>
    <path d="M262 190 C 350 190, 420 190, 520 190"/>
    <path d="M262 230 C 330 250, 380 262, 470 254"/>
  </g>

  <!-- casino nodes feeding one shared progressive pool -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="452" y="110" width="40" height="32" rx="6" fill="#1e2647" stroke="#6366f1" stroke-width="2"/>
    <rect x="452" y="174" width="40" height="32" rx="6" fill="#1e2647" stroke="#6366f1" stroke-width="2"/>
    <rect x="452" y="238" width="40" height="32" rx="6" fill="#1e2647" stroke="#6366f1" stroke-width="2"/>
    <path d="M492 126 C 560 126, 600 170, 640 184" stroke="#22d3ee" stroke-width="2.5" fill="none" opacity="0.8"/>
    <path d="M492 190 L 636 190" stroke="#22d3ee" stroke-width="2.5" fill="none" opacity="0.8"/>
    <path d="M492 254 C 560 254, 600 210, 640 196" stroke="#22d3ee" stroke-width="2.5" fill="none" opacity="0.8"/>
  </g>

  <!-- the one shared progressive pool -->
  <circle cx="672" cy="190" r="42" fill="url(#pool)"/>
  <circle cx="672" cy="190" r="42" fill="none" stroke="#fde68a" stroke-width="2" opacity="0.6"/>
  <ellipse cx="672" cy="176" rx="26" ry="9" fill="#fde68a" opacity="0.55"/>
  <ellipse cx="672" cy="188" rx="26" ry="9" fill="#fcd34d" opacity="0.7"/>
  <ellipse cx="672" cy="200" rx="26" ry="9" fill="#f59e0b" opacity="0.85"/>

  <text x="40" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">няколко казина хранят един общ прогресивен пул</text>
  <text x="720" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">18+ Играйте отговорно</text>
</svg>
