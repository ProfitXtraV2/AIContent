<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="Абстрактна метафора за Microgaming: стилизиран браузър прозорец с барабани отляво, свързан през мрежа от няколко казино възела към един общ прогресивен джакпот пул отдясно, без лога и без числа">
  <title>Microgaming: браузърът, който започна онлайн казиното, и общата джакпот мрежа</title>
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
