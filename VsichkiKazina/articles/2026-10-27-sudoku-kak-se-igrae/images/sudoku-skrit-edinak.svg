<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-label="Примерен квадрат 3 на 3 в судоку, който показва скрит единак: четворката е кандидат на три места, но в два от тях редът или колоната вече има четворка, затова остава само едно поле за нея. Цифрите са примерни.">
  <rect x="1" y="1" width="718" height="428" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="34" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" fill="#1f2937">Скрит единак: цифрата има само едно място</text>
  <text x="34" y="72" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#6b7280">Четворката е възможна на три места в квадрата, но две са заети от реда или колоната.</text>

  <!-- 3x3 grid: origin (40,100), cell 78 -->
  <!-- eliminated-cell backgrounds -->
  <rect x="118" y="100" width="78" height="78" fill="#fde8e8"/>
  <rect x="40" y="178" width="78" height="78" fill="#fde8e8"/>
  <!-- survivor-cell background -->
  <rect x="118" y="256" width="78" height="78" fill="#e4f2e4"/>

  <!-- grid cell borders -->
  <g stroke="#9ca3af" stroke-width="1">
    <rect x="40" y="100" width="78" height="78" fill="none"/>
    <rect x="118" y="100" width="78" height="78" fill="none"/>
    <rect x="196" y="100" width="78" height="78" fill="none"/>
    <rect x="40" y="178" width="78" height="78" fill="none"/>
    <rect x="118" y="178" width="78" height="78" fill="none"/>
    <rect x="196" y="178" width="78" height="78" fill="none"/>
    <rect x="40" y="256" width="78" height="78" fill="none"/>
    <rect x="118" y="256" width="78" height="78" fill="none"/>
    <rect x="196" y="256" width="78" height="78" fill="none"/>
  </g>
  <!-- thick outer border -->
  <rect x="40" y="100" width="234" height="234" fill="none" stroke="#1f2937" stroke-width="2.5"/>

  <!-- given digits (illustrative, grey) -->
  <text x="79" y="152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#9ca3af">2</text>
  <text x="157" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#9ca3af">7</text>
  <text x="235" y="308" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#9ca3af">9</text>

  <!-- candidate 4 in eliminated cell (118,100): small grey 4, struck -->
  <text x="130" y="122" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#b0b4bb">4</text>
  <line x1="126" y1="120" x2="140" y2="108" stroke="#d64545" stroke-width="2"/>
  <!-- candidate 4 in eliminated cell (40,178): small grey 4, struck -->
  <text x="52" y="200" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#b0b4bb">4</text>
  <line x1="48" y1="198" x2="62" y2="186" stroke="#d64545" stroke-width="2"/>

  <!-- survivor: big green 4 in (118,256) -->
  <text x="157" y="308" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#2f7d32">4</text>

  <!-- legend -->
  <rect x="312" y="118" width="22" height="22" rx="4" fill="#e4f2e4" stroke="#2f7d32" stroke-width="1.5"/>
  <text x="360" y="134" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">остава само тук: скритият единак</text>

  <rect x="312" y="160" width="22" height="22" rx="4" fill="#fde8e8" stroke="#d64545" stroke-width="1.5"/>
  <text x="360" y="176" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">редът или колоната вече има 4</text>

  <text x="313" y="219" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#b0b4bb">4</text>
  <text x="360" y="218" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">кандидат: възможна цифра (бележка)</text>

  <text x="313" y="262" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#9ca3af">2 7 9</text>
  <text x="360" y="262" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">вече дадени цифри в квадрата</text>

  <line x1="34" y1="388" x2="686" y2="388" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="34" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#9ca3af">Цифрите са примерни и показват само как работи техниката, не конкретно поле.</text>
</svg>
