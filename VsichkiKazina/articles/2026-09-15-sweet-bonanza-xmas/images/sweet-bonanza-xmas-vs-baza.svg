<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Какво сменя коледната версия на Sweet Bonanza: новото е само визията (коледна тема); RTP около 96.5%, мрежа 6 на 5, множители 2x до 100x, висока волатилност и каскадна механика остават същите като базовата игра">
  <title>Sweet Bonanza Xmas vs базовата Sweet Bonanza — какво се сменя</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6fbf7"/>
      <stop offset="100%" stop-color="#eef4ef"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" rx="12" ry="12" fill="url(#bg2)"/>
  <text x="300" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#14532d" text-anchor="middle">Коледната версия: какво се сменя и какво остава</text>

  <!-- Left column: changes -->
  <rect x="30" y="58" width="255" height="250" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="157" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">Ново (само визия)</text>
  <text x="50" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#166534">Коледна тема</text>
  <text x="50" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#166534">Снежни плодове, бонбони</text>
  <text x="50" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#166534">Близалки като захарни пръчки</text>
  <text x="50" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#166534">Празничен фон и звук</text>
  <text x="157" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="30" text-anchor="middle">🎄</text>

  <!-- Right column: unchanged -->
  <rect x="315" y="58" width="255" height="250" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="442" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#3730a3" text-anchor="middle">Същото (математика)</text>
  <text x="335" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#3730a3">RTP около 96.5% (конфигурируем)</text>
  <text x="335" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#3730a3">Мрежа 6 × 5, pay-anywhere</text>
  <text x="335" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#3730a3">Каскада (tumble)</text>
  <text x="335" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#3730a3">Бомби 2x–100x (само в бонуса)</text>
  <text x="335" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#3730a3">Висока волатилност</text>
  <text x="442" y="284" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#3730a3" text-anchor="middle">не се подобрява</text>

  <text x="300" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · По-коледно не значи по-щедро · провери реалния RTP в инфо-панела</text>
</svg>
