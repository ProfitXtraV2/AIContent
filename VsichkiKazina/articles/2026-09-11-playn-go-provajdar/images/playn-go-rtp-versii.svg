<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="Book of Dead в няколко версии на RTP, от които операторът избира: 96.21% по подразбиране, 94.25%, 91.25%, 87.25% и 84.18% най-ниска конфигурация">
  <title>Book of Dead — обявени RTP версии, от които операторът пуска една</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="lo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="640" height="380" rx="12" ry="12" fill="url(#bg)"/>

  <text x="320" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle">Book of Dead: една игра, няколко версии на RTP</text>
  <text x="320" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">операторът избира коя конфигурация да пусне · скала 80%–97%</text>

  <!-- track x 150..560 (width 410), scale 80..97 (range 17) -->
  <!-- Row 1: 96.21% -> (16.21/17)*410 = 391 -->
  <text x="138" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#15803d" font-weight="600" text-anchor="end">по подразбиране</text>
  <rect x="150" y="80" width="410" height="22" rx="5" fill="#e5e7eb"/>
  <rect x="150" y="80" width="391" height="22" rx="5" fill="url(#hi)"/>
  <text x="570" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#15803d" text-anchor="start">96.21%</text>

  <!-- Row 2: 94.25% -> (14.25/17)*410 = 344 -->
  <rect x="150" y="120" width="410" height="22" rx="5" fill="#e5e7eb"/>
  <rect x="150" y="120" width="344" height="22" rx="5" fill="url(#lo)"/>
  <text x="570" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#b45309" text-anchor="start">94.25%</text>

  <!-- Row 3: 91.25% -> (11.25/17)*410 = 271 -->
  <rect x="150" y="160" width="410" height="22" rx="5" fill="#e5e7eb"/>
  <rect x="150" y="160" width="271" height="22" rx="5" fill="url(#lo)"/>
  <text x="570" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#b45309" text-anchor="start">91.25%</text>

  <!-- Row 4: 87.25% -> (7.25/17)*410 = 175 -->
  <rect x="150" y="200" width="410" height="22" rx="5" fill="#e5e7eb"/>
  <rect x="150" y="200" width="175" height="22" rx="5" fill="url(#lo)"/>
  <text x="570" y="216" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#b45309" text-anchor="start">87.25%</text>

  <!-- Row 5: 84.18% -> (4.18/17)*410 = 101 -->
  <text x="138" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#b45309" font-weight="600" text-anchor="end">най-ниска</text>
  <rect x="150" y="240" width="410" height="22" rx="5" fill="#e5e7eb"/>
  <rect x="150" y="240" width="101" height="22" rx="5" fill="url(#lo)"/>
  <text x="570" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#b45309" text-anchor="start">84.18%</text>

  <line x1="60" y1="292" x2="580" y2="292" stroke="#d1d5db" stroke-width="1"/>
  <text x="320" y="314" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Само версията с 96.21% е над средното за модерните слотове (~96%)</text>
  <text x="320" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · Провери реалния RTP в инфо-панела на конкретното казино</text>
</svg>
