<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="Sweet Bonanza 1000 RTP 95.52% и домашно предимство 4.48%: при €1000 оборот средно €955.20 се връщат на играча, €44.80 остават за казиното">
  <title>Sweet Bonanza 1000: RTP 95.52% и домашно предимство 4.48%</title>
  <defs>
    <linearGradient id="sb1kbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="sb1kPlayer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="sb1kHouse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect width="600" height="320" rx="12" ry="12" fill="url(#sb1kbg)"/>

  <text x="300" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#831843" text-anchor="middle">Sweet Bonanza 1000: RTP и домашно предимство</text>

  <text x="50" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600">Връщане към играча (RTP)</text>
  <text x="550" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600" text-anchor="end">Домашно предимство</text>

  <rect x="50" y="90" width="500" height="48" rx="8" fill="#e5e7eb"/>
  <!-- Player 95.52% fills the track; house 4.48% overlays the right ~22px -->
  <rect x="50" y="90" width="500" height="48" rx="8" fill="url(#sb1kPlayer)"/>
  <!-- House portion: 4.48% of 500px = 22.4 ≈ 22px, flush right -->
  <rect x="528" y="90" width="22" height="48" rx="4" fill="url(#sb1kHouse)"/>

  <text x="289" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">95.52%</text>
  <text x="539" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">4.48%</text>

  <line x1="50" y1="165" x2="550" y2="165" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="300" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Пример: €1000 оборот (версия по подразбиране 95.52%)</text>

  <rect x="50" y="205" width="220" height="76" rx="10" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
  <text x="160" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#9d174d" text-anchor="middle" font-weight="600">Обратно към играча</text>
  <text x="160" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#be185d" text-anchor="middle">~€955.20</text>
  <text x="160" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#db2777" text-anchor="middle">(средно, дългосрочно)</text>

  <rect x="330" y="205" width="220" height="76" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="440" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="600">За казиното</text>
  <text x="440" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#dc2626" text-anchor="middle">~€44.80</text>
  <text x="440" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ef4444" text-anchor="middle">(домашно предимство 4.48%)</text>

  <text x="300" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#9ca3af" text-anchor="middle">+</text>

  <text x="300" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · Операторът може да зареди по-нисък RTP, провери инфо-панела</text>
</svg>
