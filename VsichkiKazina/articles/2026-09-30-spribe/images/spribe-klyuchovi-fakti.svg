<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-label="Ключови факти за Spribe: студио с грузински корени, основано 2018 г., изпълнителен директор Давид Натрошвили, екипи в Грузия, Украйна, Полша и Естония; лицензи MGA и UKGC; флагман Aviator от 2019 г. с crash механика и функция provably fair; turbo игри Mines, Plinko, Dice, HiLo, Goal, Keno, Mini Roulette и Balloon; работещи RTP варианти на Aviator от 94.32% до 97.30%, които операторът настройва">
  <rect x="8" y="8" width="704" height="524" rx="18" fill="#0f172a"/>

  <text x="32" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">Spribe: ключови факти</text>
  <text x="32" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Грузински корени · основано 2018 г. · CEO Давид Натрошвили</text>

  <rect x="32" y="90" width="320" height="78" rx="12" fill="#111f38"/>
  <text x="52" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">Флагман</text>
  <text x="52" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">Aviator <tspan font-size="13" font-weight="normal" fill="#94a3b8">· crash, 2019</tspan></text>

  <rect x="368" y="90" width="320" height="78" rx="12" fill="#111f38"/>
  <text x="388" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">Тип игри</text>
  <text x="388" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">instant / turbo</text>

  <text x="32" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">Лицензи и коректност</text>
  <text x="32" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e2e8f0">Лицензи: <tspan font-weight="bold" fill="#f8fafc">MGA</tspan> · <tspan font-weight="bold" fill="#f8fafc">UKGC</tspan></text>
  <text x="32" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e2e8f0">Aviator: функция <tspan font-weight="bold" fill="#f8fafc">provably fair</tspan> (проверим рунд)</text>

  <text x="32" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">Turbo и instant игри</text>
  <text x="32" y="314" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e2e8f0">Mines · Plinko · Dice · HiLo · Goal</text>
  <text x="32" y="336" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e2e8f0">Keno · Mini Roulette · Balloon</text>

  <text x="32" y="376" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">RTP е число, което операторът настройва</text>
  <rect x="32" y="390" width="656" height="60" rx="12" fill="#111f38"/>
  <text x="52" y="416" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">Работещи варианти на Aviator</text>
  <text x="52" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#4ade80">94.32% <tspan fill="#94a3b8" font-size="14" font-weight="normal">до</tspan> 97.30%</text>

  <rect x="32" y="470" width="656" height="42" rx="8" fill="#111f38"/>
  <text x="52" y="488" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Публично обявени числа (студиото + независими бази); активният RTP се вижда</text>
  <text x="52" y="504" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">в инфо-панела на конкретното казино. 18+ Играйте отговорно.</text>
</svg>
