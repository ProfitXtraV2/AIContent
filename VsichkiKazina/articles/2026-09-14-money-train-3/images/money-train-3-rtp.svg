<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Segoe UI',Roboto,Arial,sans-serif">
  <rect x="8" y="8" width="704" height="444" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text x="32" y="48" font-size="25" font-weight="700" fill="#0f172a">Money Train 3: RTP и таван</text>
