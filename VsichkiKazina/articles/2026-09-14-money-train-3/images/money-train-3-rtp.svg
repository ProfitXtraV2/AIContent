  <text x="688" y="192" font-size="13" text-anchor="end" fill="#475569">€39 за казиното · домашно предимство 3.90%</text>

  <!-- Section 2: max win ceiling -->
  <text x="32" y="234" font-size="16" font-weight="600" fill="#0f172a">Максимална печалба (× залога)</text>

