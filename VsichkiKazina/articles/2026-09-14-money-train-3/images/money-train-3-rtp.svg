  <text x="32" y="314" font-size="14" fill="#334155">Money Train 3</text>
  <rect x="176" y="298" width="360" height="28" rx="6" fill="#d97706"/>
  <text x="546" y="318" font-size="15" font-weight="700" fill="#b45309">100 000×</text>

  <text x="32" y="360" font-size="13" fill="#64748b">По-висок таван идва с по-остра волатилност (много висока, 5/5), не с по-добри шансове.</text>
  <text x="32" y="382" font-size="13" fill="#64748b">Възможни са по-ниски конфигурации (94.00%, 90.00%); провери инфо-панела на казиното.</text>
  <text x="32" y="410" font-size="12" fill="#94a3b8">Числата са примерни.</text>
  <text x="688" y="410" font-size="12" text-anchor="end" font-weight="600" fill="#94a3b8">18+ Играйте отговорно</text>
