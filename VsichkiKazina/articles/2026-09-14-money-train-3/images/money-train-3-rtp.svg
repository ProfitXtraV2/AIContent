  <rect x="32" y="126" width="656" height="46" rx="8" fill="#334155"/>
  <rect x="32" y="126" width="630" height="46" rx="8" fill="#2f9e6f"/>
  <rect x="648" y="126" width="14" height="46" fill="#334155"/>
