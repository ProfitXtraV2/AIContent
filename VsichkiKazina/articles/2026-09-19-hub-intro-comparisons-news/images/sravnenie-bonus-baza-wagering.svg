<svg viewBox="0 0 660 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Сравнение на две бонус бази: 35x превъртане върху депозит+бонус спрямо 35x само върху бонус">
  <title>Превъртане: базата удвоява оборота</title>
  <!-- background card -->
  <rect x="16" y="16" width="628" height="268" rx="12" fill="#f5f7fa"/>

  <!-- title -->
  <text x="330" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1a1a2e">Превъртане: базата определя реалния оборот</text>

  <!-- left column card (35x on deposit+bonus) -->
  <rect x="28" y="60" width="286" height="196" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="171" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">35x върху депозит + бонус</text>
  <text x="171" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151">База: €200 + €200 = €400</text>
  <line x1="44" y1="118" x2="298" y2="118" stroke="#93c5fd" stroke-width="1"/>
  <text x="171" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280">изискван оборот</text>
  <text x="171" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#1d4ed8">€14 000</text>
  <text x="171" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b91c1c">⚠ двойно по-трудно условие</text>

  <!-- right column card (35x on bonus only) -->
  <rect x="346" y="60" width="286" height="196" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="489" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#15803d">35x само върху бонус</text>
  <text x="489" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151">База: €200 (само бонусът)</text>
  <line x1="362" y1="118" x2="616" y2="118" stroke="#86efac" stroke-width="1"/>
  <text x="489" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280">изискван оборот</text>
  <text x="489" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#16a34a">€7 000</text>
  <text x="489" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#15803d">✓ по-леко условие</text>

  <!-- VS label in gap -->
  <text x="330" y="165" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#9ca3af">vs</text>

  <!-- note -->
  <text x="330" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#9ca3af">числата са примерни (35x и 100% до €500 — от текста)</text>
</svg>
