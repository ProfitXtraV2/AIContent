<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-label="Какви лични данни събира онлайн казиното и какви права имаш по GDPR. Три групи данни: самоличност (име, документ, адрес, дата на раждане), финансови (карта или сметка за депозит и теглене), поведенчески (история на залозите, IP, устройство, време на сесии). Причината е KYC и AML, тоест законово задължение. Правата ти по GDPR: достъп, корекция, преносимост, възражение срещу маркетинг. Границата: правото на изтриване е ограничено, защото AML изисква съхранение обикновено около пет години. При лицензиран оператор има политика за поверителност, отговорник по данните и надзор на КЗЛД.">
  <title>Лични данни в онлайн казино и правата по GDPR</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
  </defs>

  <rect width="720" height="470" rx="14" ry="14" fill="url(#bg)"/>

  <text x="360" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700" fill="#1f2937" text-anchor="middle">Лични данни в онлайн казино и правата ти</text>
  <text x="360" y="53" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">какво събират, защо и какви лостове ти дава GDPR</text>

  <!-- Three data tiles -->
  <rect x="40" y="68" width="204" height="78" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="56" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">Самоличност</text>
  <text x="56" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#2563eb">име, документ за самоличност,</text>
  <text x="56" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#2563eb">адрес, дата на раждане</text>

  <rect x="258" y="68" width="204" height="78" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.3"/>
  <text x="274" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#4338ca">Финансови</text>
  <text x="274" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#4f46e5">карта или сметка за</text>
  <text x="274" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#4f46e5">депозит и теглене</text>

  <rect x="476" y="68" width="204" height="78" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.3"/>
  <text x="492" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">Поведенчески</text>
  <text x="492" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#7c3aed">история на залозите, IP,</text>
  <text x="492" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#7c3aed">устройство, време на сесии</text>

  <!-- Why band -->
  <rect x="40" y="158" width="640" height="38" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="360" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#b45309" text-anchor="middle">Защо: верификация (KYC) и срещу изпиране на пари (AML), законово задължение</text>

  <!-- Rights band -->
  <rect x="40" y="206" width="640" height="56" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="360" y="229" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">Твоите права по GDPR</text>
  <text x="360" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#059669" text-anchor="middle">достъп · корекция · преносимост · възражение срещу маркетинг</text>

  <!-- Limit band -->
  <rect x="40" y="272" width="640" height="44" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="360" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Границата: правото на изтриване е ограничено</text>
  <text x="360" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle">AML изисква съхранение на KYC и транзакциите обикновено около пет години</text>

  <!-- НАП/КЗЛД banner -->
  <rect x="40" y="326" width="640" height="50" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="360" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">Лицензиран оператор: политика за поверителност, отговорник по данните, надзор на КЗЛД</text>
  <text x="360" y="366" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#059669" text-anchor="middle">първо провери лиценза от НАП, после прочети политиката за поверителност</text>

  <text x="360" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · личните данни са цена, която също заслужава внимание</text>
</svg>
