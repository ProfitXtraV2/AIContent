<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-label="Инфографика: Мартингейл — при база €1 и таван €500 след 10 поредни загуби единайсетият залог изисква €1024, но масата не го приема. Оставаш с реализирана загуба.">
  <title>Мартингейл: защо се разбива при таван на масата</title>

  <!-- Background -->
  <rect width="680" height="400" rx="12" fill="#faf8fb"/>

  <!-- Header -->
  <rect x="0" y="0" width="680" height="60" rx="12" fill="#7b2d8b"/>
  <rect x="0" y="48" width="680" height="12" fill="#7b2d8b"/>
  <text x="340" y="26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Мартингейл: стратегията, която не може да победи тавана</text>
  <text x="340" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#e8c8f5">База €1 · Таван на масата €500 · 10 поредни загуби</text>

  <!-- Chart area -->
  <!-- Y axis: 0 to €1200 (with €500 table limit line and €1024 mark) -->
  <!-- Chart: x from 90 to 640, y from 75 to 310 (height 235) -->
  <!-- Scale: €1200 = 235px → 1px = €5.11 → €500 = 97.5px from bottom, €1024 = 199.9px -->

  <!-- Grid lines -->
  <!-- €1200 baseline (top of chart) → y=75 -->
  <!-- €1000 → y = 310 - (1000/1200)*235 = 310-195.8 = 114.2 ≈ 114 -->
  <line x1="90" y1="114" x2="645" y2="114" stroke="#e8d5f0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="82" y="118" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#7b6a95">€1000</text>

  <!-- €200 → y = 310 - (200/1200)*235 = 310-39.2 = 270.8 ≈ 271 -->
  <line x1="90" y1="271" x2="645" y2="271" stroke="#e8d5f0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="82" y="275" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#7b6a95">€200</text>

  <!-- Baseline y=310 -->
  <line x1="90" y1="310" x2="645" y2="310" stroke="#7b6a95" stroke-width="1.5"/>
  <text x="82" y="314" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#7b6a95">€0</text>

  <!-- Bets: 10 losing bets + 1 blocked -->
  <!-- Bar width = 44, gap = 4; start x=97 -->
  <!-- Bet amounts: €1, €2, €4, €8, €16, €32, €64, €128, €256, €512, €1024(blocked) -->
  <!-- Heights (from y=310): each amount/1200 * 235 -->

  <!-- Bet 1: €1 → h=0.2 (barely visible, make min 3) -->
  <rect x="97" y="307" width="44" height="3" rx="2" fill="#27ae60"/>
  <text x="119" y="303" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#1e8449">€1</text>
  <text x="119" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#555">×1</text>

  <!-- Bet 2: €2 → h=0.4 → min 4 -->
  <rect x="145" y="306" width="44" height="4" rx="2" fill="#27ae60"/>
  <text x="167" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#1e8449">€2</text>
  <text x="167" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#555">×2</text>

  <!-- Bet 3: €4 → h=0.8 → min 4 -->
  <rect x="193" y="306" width="44" height="5" rx="2" fill="#27ae60"/>
  <text x="215" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#1e8449">€4</text>
  <text x="215" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#555">×3</text>

  <!-- Bet 4: €8 → h=1.6 -->
  <rect x="241" y="308" width="44" height="7" rx="2" fill="#f39c12"/>
  <text x="263" y="304" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#b7770d">€8</text>
  <text x="263" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#555">×4</text>

  <!-- Bet 5: €16 → h=3.1 -->
  <rect x="289" y="306" width="44" height="10" rx="2" fill="#f39c12"/>
  <text x="311" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#b7770d">€16</text>
  <text x="311" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#555">×5</text>

  <!-- Bet 6: €32 → h=6.3 -->
  <rect x="337" y="302" width="44" height="15" rx="2" fill="#f39c12"/>
  <text x="359" y="298" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#b7770d">€32</text>
  <text x="359" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#555">×6</text>

  <!-- Bet 7: €64 → h=12.5 -->
  <rect x="385" y="294" width="44" height="22" rx="2" fill="#e67e22"/>
  <text x="407" y="289" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#935116">€64</text>
  <text x="407" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#555">×7</text>

  <!-- Bet 8: €128 → h=25.1 -->
  <rect x="433" y="282" width="44" height="44" rx="2" fill="#e74c3c"/>
  <text x="455" y="277" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#c0392b">€128</text>
  <text x="455" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#555">×8</text>

  <!-- Bet 9: €256 → h=50.2 -->
  <rect x="481" y="258" width="44" height="88" rx="2" fill="#e74c3c"/>
  <text x="503" y="253" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#c0392b">€256</text>
  <text x="503" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#555">×9</text>

  <!-- Bet 10: €512 → h=100.3 → bar goes from 310-100=210 to 310 -->
  <!-- €512 is just above the €500 limit (y=212) -->
  <rect x="529" y="208" width="44" height="102" rx="2" fill="#e74c3c"/>
  <text x="551" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#c0392b">€512</text>
  <text x="551" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#555">×10</text>

  <!-- Bet 11: €1024 blocked -->
  <!-- Ghost bar showing €1024 (would go off screen) — show partial with X -->
  <rect x="577" y="75" width="44" height="235" rx="2" fill="#ccb0dd" opacity="0.4" stroke="#9b59b6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="599" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#7b2d8b">€1024</text>
  <!-- X mark -->
  <line x1="577" y1="120" x2="621" y2="160" stroke="#e74c3c" stroke-width="3"/>
  <line x1="621" y1="120" x2="577" y2="160" stroke="#e74c3c" stroke-width="3"/>
  <text x="599" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#c0392b">БЛОКИРАН</text>
  <text x="599" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#7b2d8b">×11</text>

  <!-- Table limit label (at true €500 position y=212) -->
  <rect x="432" y="205" width="148" height="14" rx="3" fill="#e74c3c" opacity="0.9"/>
  <text x="506" y="216" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" fill="#ffffff">— ТАВАН НА МАСАТА €500 —</text>

  <!-- Result box at bottom -->
  <rect x="90" y="333" width="560" height="52" rx="8" fill="#7b2d8b"/>
  <text x="340" y="351" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">10 поредни загуби → оставаш с реализирана загуба</text>
  <text x="340" y="368" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#e8c8f5">Единайсетият залог (€1 024) надхвърля тавана от €500 — масата не го приема.</text>
  <text x="340" y="382" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#d4b0e8">Числата са от текста на статията. 18+ Играйте отговорно.</text>
</svg>
