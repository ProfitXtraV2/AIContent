<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="Илюстративно: обявен RTP около 96% и домашно предимство около 4%; при €1000 оборот средно €960 се връщат на играча, €40 остават за казиното; реалната стойност зависи от заглавието и версията">
  <title>Илюстративно: обявен RTP ~96% и домашно предимство ~4%</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="playerBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="houseBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect width="600" height="320" rx="12" ry="12" fill="url(#bg)"/>

  <text x="300" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#4c1d95" text-anchor="middle">Обявен RTP ~96% (илюстративно)</text>
  <text x="300" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">реалният RTP зависи от заглавието и версията</text>

  <text x="50" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600">Връщане към играча (RTP)</text>
  <text x="550" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600" text-anchor="end">Домашно предимство</text>

  <rect x="50" y="94" width="500" height="48" rx="8" fill="#e5e7eb"/>
  <!-- Player fills track; house overlays right 4% = 20px flush -->
  <rect x="50" y="94" width="500" height="48" rx="8" fill="url(#playerBar)"/>
  <!-- House portion: 4% of 500px = 20px -->
  <rect x="530" y="94" width="20" height="48" rx="4" fill="url(#houseBar)"/>

  <text x="290" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">~96%</text>
  <text x="540" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">~4%</text>

  <line x1="50" y1="168" x2="550" y2="168" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="300" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Пример: €1000 оборот</text>

  <rect x="50" y="207" width="220" height="74" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="160" y="233" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#5b21b6" text-anchor="middle" font-weight="600">Обратно към играча</text>
  <text x="160" y="261" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#6d28d9" text-anchor="middle">~€960</text>
  <text x="160" y="276" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#7c3aed" text-anchor="middle">(средно, дългосрочно)</text>

  <rect x="330" y="207" width="220" height="74" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="440" y="233" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="600">За казиното</text>
  <text x="440" y="261" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#dc2626" text-anchor="middle">~€40</text>
  <text x="440" y="276" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ef4444" text-anchor="middle">(домашно предимство ~4%)</text>

  <text x="300" y="251" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#9ca3af" text-anchor="middle">+</text>

  <text x="300" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · Провери реалния RTP в инфо-панела на конкретното казино</text>
</svg>
