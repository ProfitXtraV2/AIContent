<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Максимални печалби в пъти залога на популярни заглавия на Apollo Games: Mad Mechanic Deluxe до 2,000x, Pandora до 500x, Turbo Slots до 500x, Blood до 500x, Four Fruits 2 до 316x, Midnight Fruits до 174x">
  <title>Максимални печалби (таван) на популярни заглавия на Apollo Games</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" rx="12" ry="12" fill="url(#bg)"/>

  <text x="320" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#3730a3" text-anchor="middle">Максимална печалба (таван) на заглавия на Apollo</text>
  <text x="320" y="53" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">в пъти залога · повечето тавани са скромни, Mad Mechanic Deluxe е изключението</text>

  <!-- scale 0..2000x over track 180..560 (380px); w = maxwin/2000*380 -->
  <!-- Row 1: Mad Mechanic Deluxe 2,000x -> w = 380 -->
  <text x="172" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151" font-weight="600" text-anchor="end">Mad Mechanic Deluxe</text>
  <rect x="180" y="80" width="380" height="24" rx="5" fill="#e5e7eb"/>
  <rect x="180" y="80" width="380" height="24" rx="5" fill="url(#bar)"/>
  <text x="572" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#4338ca" text-anchor="start">2,000x</text>

  <!-- Row 2: Pandora 500x -> w = 95 -->
  <text x="172" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151" font-weight="600" text-anchor="end">Pandora</text>
  <rect x="180" y="120" width="380" height="24" rx="5" fill="#e5e7eb"/>
  <rect x="180" y="120" width="95" height="24" rx="5" fill="url(#bar)"/>
  <text x="572" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#4338ca" text-anchor="start">500x</text>

  <!-- Row 3: Turbo Slots 500x -> w = 95 -->
  <text x="172" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151" font-weight="600" text-anchor="end">Turbo Slots</text>
  <rect x="180" y="160" width="380" height="24" rx="5" fill="#e5e7eb"/>
  <rect x="180" y="160" width="95" height="24" rx="5" fill="url(#bar)"/>
  <text x="572" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#4338ca" text-anchor="start">500x</text>

  <!-- Row 4: Blood 500x -> w = 95 -->
  <text x="172" y="216" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151" font-weight="600" text-anchor="end">Blood</text>
  <rect x="180" y="200" width="380" height="24" rx="5" fill="#e5e7eb"/>
  <rect x="180" y="200" width="95" height="24" rx="5" fill="url(#bar)"/>
  <text x="572" y="216" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#4338ca" text-anchor="start">500x</text>

  <!-- Row 5: Four Fruits 2 316x -> w = 60 -->
  <text x="172" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151" font-weight="600" text-anchor="end">Four Fruits 2</text>
  <rect x="180" y="240" width="380" height="24" rx="5" fill="#e5e7eb"/>
  <rect x="180" y="240" width="60" height="24" rx="5" fill="url(#bar)"/>
  <text x="572" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#4338ca" text-anchor="start">316x</text>

  <!-- Row 6: Midnight Fruits 174x -> w = 33 -->
  <text x="172" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151" font-weight="600" text-anchor="end">Midnight Fruits</text>
  <rect x="180" y="280" width="380" height="24" rx="5" fill="#e5e7eb"/>
  <rect x="180" y="280" width="33" height="24" rx="5" fill="url(#bar)"/>
  <text x="572" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#4338ca" text-anchor="start">174x</text>

  <line x1="40" y1="325" x2="600" y2="325" stroke="#d1d5db" stroke-width="1"/>
  <text x="320" y="347" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Скала 0–2,000x · таванът е рядък резултат, не очаквана печалба</text>
  <text x="320" y="369" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">RTP е отделен показател и е конфигурируем (85%–99%) · операторът избира версията</text>
  <text x="320" y="391" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · Провери реалния RTP в инфо-панела на конкретното казино</text>
</svg>
