<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-label="Инфографика за Evolution. Основана през 2006 година в Швеция, водещ доставчик на казино на живо и game show формати. Примерни RTP стойности по категория в дълъг период: живо блекджек около 99,29 процента, живо бакара около 98,94 процента, рулетка на живо около 97,30 процента, а game show форматите около 95 до 96 процента. Тоест масите на живо връщат повече от шоутата. Флагмани: Crazy Time, Monopoly Live, Lightning Roulette, Funky Time, Dream Catcher, Mega Ball. Стойностите са примерни и зависят от версията и играта.">
  <rect x="8" y="8" width="704" height="374" rx="18" fill="#0f172a"/>

  <text x="32" y="42" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">Evolution: портфолио и RTP</text>
  <text x="32" y="64" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Масите на живо връщат повече от game show форматите</text>

  <text x="32" y="98" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Основана</text>
  <text x="688" y="98" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">2006, Швеция</text>

  <text x="32" y="132" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">Примерен RTP по категория (в дълъг период)</text>

  <g stroke="#1e293b" stroke-width="1">
    <line x1="32" y1="146" x2="688" y2="146"/>
    <line x1="32" y1="174" x2="688" y2="174"/>
    <line x1="32" y1="202" x2="688" y2="202"/>
    <line x1="32" y1="230" x2="688" y2="230"/>
  </g>

  <text x="48" y="166" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Живо блекджек (най-висок RTP)</text>
  <text x="688" y="166" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="end">≈ 99,29%</text>

  <text x="48" y="194" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Живо бакара</text>
  <text x="688" y="194" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="end">≈ 98,94%</text>

  <text x="48" y="222" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Рулетка на живо</text>
  <text x="688" y="222" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">≈ 97,30%</text>

  <text x="48" y="250" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Game show формати (най-нисък RTP)</text>
  <text x="688" y="250" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="end">≈ 95–96%</text>

  <text x="32" y="290" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">Флагмани на живо</text>
  <text x="32" y="312" font-family="Arial, sans-serif" font-size="12.5" fill="#cbd5e1">Crazy Time · Monopoly Live · Lightning Roulette</text>
  <text x="32" y="330" font-family="Arial, sans-serif" font-size="12.5" fill="#cbd5e1">Funky Time · Dream Catcher · Mega Ball</text>

  <rect x="32" y="346" width="656" height="24" rx="6" fill="#111f38"/>
  <text x="44" y="362" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Стойностите са примерни и зависят от версията и играта. 18+ Играйте отговорно.</text>
</svg>
