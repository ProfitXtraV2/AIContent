<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Book of Ra Deluxe RTP: стандартна версия 95,10% и по-ниска версия 94,26%; при €1000 оборот при 95,10% средно ~€951 се връщат на играча, ~€49 остават за казиното">
  <title>Book of Ra Deluxe: RTP версии и €-разпределение</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="playerBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="houseBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" rx="12" ry="12" fill="url(#bg)"/>

  <text x="320" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#78350f" text-anchor="middle">Book of Ra Deluxe: RTP и €-разпределение</text>

  <text x="45" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600">Връщане към играча (стандартна версия)</text>
  <text x="595" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600" text-anchor="end">За казиното</text>

  <rect x="45" y="84" width="550" height="46" rx="8" fill="#e5e7eb"/>
  <rect x="45" y="84" width="550" height="46" rx="8" fill="url(#playerBar)"/>
  <!-- house sliver: visual only, ~4,9% of 550px ≈ 27px flush right -->
  <rect x="568" y="84" width="27" height="46" rx="4" fill="url(#houseBar)"/>

  <text x="308" y="113" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">95,10%</text>

  <!-- version chips -->
  <rect x="45" y="150" width="260" height="34" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="175" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="600">Стандартна версия: 95,10%</text>
  <rect x="335" y="150" width="260" height="34" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="465" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="600">По-ниска версия: 94,26%</text>

  <line x1="45" y1="204" x2="595" y2="204" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="320" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Пример: €1000 оборот при версия 95,10% (примерни числа, дългосрочно)</text>

  <rect x="45" y="244" width="250" height="78" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="170" y="271" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="600">Обратно към играча</text>
  <text x="170" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#b45309" text-anchor="middle">~€951</text>
  <text x="170" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#d97706" text-anchor="middle">(средно, дългосрочно)</text>

  <rect x="345" y="244" width="250" height="78" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="470" y="271" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="600">За казиното</text>
  <text x="470" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#dc2626" text-anchor="middle">~€49</text>
  <text x="470" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ef4444" text-anchor="middle">(при версия 95,10%)</text>

  <text x="320" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#9ca3af" text-anchor="middle">+</text>

  <text x="320" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · Операторът зарежда RTP версията — провери инфо-панела</text>
</svg>
