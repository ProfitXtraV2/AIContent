<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Как работи бонусът на Book of Ra Deluxe: 3 или повече книги пускат 10 безплатни завъртания; в началото се избира един случаен разширяващ се символ, който покрива цяла колона; 3 книги в бонуса добавят още 10 завъртания">
  <title>Book of Ra Deluxe: бонусът в три стъпки</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
  </defs>

  <rect width="640" height="300" rx="12" ry="12" fill="url(#bg2)"/>
  <text x="320" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#78350f" text-anchor="middle">Бонусът на Book of Ra Deluxe в три стъпки</text>

  <!-- step 1 -->
  <rect x="30" y="66" width="176" height="150" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="60" cy="96" r="15" fill="#f59e0b"/>
  <text x="60" y="101" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <text x="118" y="132" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#b45309" text-anchor="middle">3+</text>
  <text x="118" y="160" font-family="system-ui, sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="600">книги на екрана</text>
  <text x="118" y="184" font-family="system-ui, sans-serif" font-size="11" fill="#a16207" text-anchor="middle">навсякъде по петте</text>
  <text x="118" y="199" font-family="system-ui, sans-serif" font-size="11" fill="#a16207" text-anchor="middle">колони (scatter)</text>

  <!-- arrow -->
  <text x="222" y="148" font-family="system-ui, sans-serif" font-size="26" fill="#9ca3af" text-anchor="middle">→</text>

  <!-- step 2 -->
  <rect x="238" y="66" width="176" height="150" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <circle cx="268" cy="96" r="15" fill="#eab308"/>
  <text x="268" y="101" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  <text x="326" y="132" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#a16207" text-anchor="middle">10</text>
  <text x="326" y="160" font-family="system-ui, sans-serif" font-size="13" fill="#854d0e" text-anchor="middle" font-weight="600">безплатни завъртания</text>
  <text x="326" y="184" font-family="system-ui, sans-serif" font-size="11" fill="#a16207" text-anchor="middle">избира се 1 случаен</text>
  <text x="326" y="199" font-family="system-ui, sans-serif" font-size="11" fill="#a16207" text-anchor="middle">разширяващ се символ</text>

  <!-- arrow -->
  <text x="430" y="148" font-family="system-ui, sans-serif" font-size="26" fill="#9ca3af" text-anchor="middle">→</text>

  <!-- step 3 -->
  <rect x="446" y="66" width="176" height="150" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="476" cy="96" r="15" fill="#f59e0b"/>
  <text x="476" y="101" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  <text x="534" y="130" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">символът се разгъва</text>
  <text x="534" y="152" font-family="system-ui, sans-serif" font-size="12" fill="#92400e" text-anchor="middle">и покрива цяла колона,</text>
  <text x="534" y="169" font-family="system-ui, sans-serif" font-size="12" fill="#92400e" text-anchor="middle">плаща по цялата ширина</text>
  <text x="534" y="192" font-family="system-ui, sans-serif" font-size="11" fill="#a16207" text-anchor="middle">3 книги в бонуса → още 10</text>

  <text x="320" y="252" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Каква ще е серията зависи изцяло от това колко често пада точно избраният символ.</text>
  <text x="320" y="282" font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · висока волатилност — бонусът идва рядко</text>
</svg>
