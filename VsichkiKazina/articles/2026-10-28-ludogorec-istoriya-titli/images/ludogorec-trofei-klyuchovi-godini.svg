<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img" aria-label="Инфографика: ключови години и трофеи на Лудогорец">
  <defs>
    <style>
      .bg{fill:#f5f8f6;}
      .card{fill:#ffffff;stroke:#dce5e0;stroke-width:1;}
      .title{fill:#15241c;font-family:'Segoe UI',Arial,sans-serif;font-size:24px;font-weight:700;}
      .sub{fill:#5c6b63;font-family:'Segoe UI',Arial,sans-serif;font-size:13px;}
      .yr{fill:#0b6b3a;font-family:'Segoe UI',Arial,sans-serif;font-size:17px;font-weight:700;}
      .lbl{fill:#243a30;font-family:'Segoe UI',Arial,sans-serif;font-size:14px;}
      .colh{fill:#0b6b3a;font-family:'Segoe UI',Arial,sans-serif;font-size:14px;font-weight:700;}
      .big{fill:#0b6b3a;font-family:'Segoe UI',Arial,sans-serif;font-size:40px;font-weight:800;}
      .tl{fill:#243a30;font-family:'Segoe UI',Arial,sans-serif;font-size:14px;font-weight:600;}
      .ts{fill:#5c6b63;font-family:'Segoe UI',Arial,sans-serif;font-size:11px;}
      .foot{fill:#5c6b63;font-family:'Segoe UI',Arial,sans-serif;font-size:13px;}
      .foot b{fill:#15241c;font-weight:700;}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="760" height="540"/>
  <rect class="card" x="8" y="8" width="744" height="524" rx="14"/>

  <text class="title" x="380" y="48" text-anchor="middle">Лудогорец: години и трофеи</text>
  <text class="sub" x="380" y="70" text-anchor="middle">към лятото на 2025 г.</text>

  <line x1="40" y1="88" x2="720" y2="88" stroke="#dce5e0" stroke-width="1"/>

  <!-- Left column: key years -->
  <text class="colh" x="40" y="118">Ключови години</text>

  <text class="yr"  x="40"  y="152">1945</text>
  <text class="lbl" x="128" y="152">Основан (градската линия)</text>

  <text class="yr"  x="40"  y="192">2010</text>
  <text class="lbl" x="128" y="192">Купен от Кирил Домусчиев</text>

  <text class="yr"  x="40"  y="232">2011</text>
  <text class="lbl" x="128" y="232">Влизане в А група (елит)</text>

  <text class="yr"  x="40"  y="272">2011/12</text>
  <text class="lbl" x="128" y="272">Требъл в дебютния сезон</text>

  <text class="yr"  x="40"  y="312">2014/15</text>
  <text class="lbl" x="128" y="312">Групи на Шампионската лига</text>

  <!-- Divider -->
  <line x1="452" y1="104" x2="452" y2="336" stroke="#dce5e0" stroke-width="1"/>

  <!-- Right column: trophies -->
  <text class="colh" x="606" y="118" text-anchor="middle">Трофеи</text>

  <text class="big" x="606" y="166" text-anchor="middle">14</text>
  <text class="tl"  x="606" y="188" text-anchor="middle">поредни титли</text>
  <text class="ts"  x="606" y="206" text-anchor="middle">2011/12-2024/25</text>

  <text class="big" x="606" y="256" text-anchor="middle">4</text>
  <text class="tl"  x="606" y="278" text-anchor="middle">Купи на България</text>

  <text class="big" x="606" y="322" text-anchor="middle">9</text>
  <text class="tl"  x="606" y="344" text-anchor="middle">Суперкупи (рекорд)</text>

  <!-- Footer strip -->
  <line x1="40" y1="470" x2="720" y2="470" stroke="#dce5e0" stroke-width="1"/>
  <text class="foot" x="40"  y="500">Стадион <tspan font-weight="700" fill="#15241c">Хювефарма Арена</tspan> · над 10 000 места</text>
  <text class="foot" x="720" y="500" text-anchor="end">18+ Играйте отговорно</text>
</svg>
