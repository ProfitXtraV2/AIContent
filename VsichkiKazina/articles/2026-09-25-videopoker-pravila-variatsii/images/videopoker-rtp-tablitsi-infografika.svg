<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Дългосрочен RTP по платежна таблица при видеопокер">
  <rect x="6" y="6" width="708" height="398" rx="16" fill="#0f172a"/>
  <text x="32" y="42" fill="#f8fafc" font-size="20" font-weight="700">Дългосрочен RTP по платежна таблица</text>
  <text x="32" y="66" fill="#94a3b8" font-size="13">при оптимална игра · съкратена ос (скала 96–101%) · числата са ориентировъчни</text>

  <!-- 100% reference line -->
  <line x1="566" y1="84" x2="566" y2="330" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="566" y="80" fill="#cbd5e1" font-size="12" text-anchor="middle">100%</text>

  <!-- Row 1: JoB 9/6 99.54 -->
  <text x="32" y="108" fill="#e2e8f0" font-size="14">Jacks or Better 9/6</text>
  <rect x="270" y="92" width="262" height="26" rx="5" fill="#d97706"/>
  <text x="526" y="110" fill="#ffffff" font-size="14" font-weight="700" text-anchor="end">99.54%</text>

  <!-- Row 2: JoB 9/5 98.45 -->
  <text x="32" y="164" fill="#e2e8f0" font-size="14">Jacks or Better 9/5</text>
  <rect x="270" y="148" width="181" height="26" rx="5" fill="#d97706"/>
  <text x="445" y="166" fill="#ffffff" font-size="14" font-weight="700" text-anchor="end">98.45%</text>

  <!-- Row 3: JoB 8/5 97.30 -->
  <text x="32" y="220" fill="#e2e8f0" font-size="14">Jacks or Better 8/5</text>
  <rect x="270" y="204" width="96" height="26" rx="5" fill="#b45309"/>
  <text x="360" y="222" fill="#ffffff" font-size="14" font-weight="700" text-anchor="end">97.30%</text>

  <!-- Row 4: Deuces Wild пълна 100.76 -->
  <text x="32" y="276" fill="#e2e8f0" font-size="14">Deuces Wild (пълна)</text>
  <rect x="270" y="260" width="352" height="26" rx="5" fill="#059669"/>
  <text x="616" y="278" fill="#ffffff" font-size="14" font-weight="700" text-anchor="end">100.76%</text>

  <!-- Row 5: Double Bonus 10/7 пълна 100.17 -->
  <text x="32" y="332" fill="#e2e8f0" font-size="14">Double Bonus 10/7 (пълна)</text>
  <rect x="270" y="316" width="309" height="26" rx="5" fill="#059669"/>
  <text x="573" y="334" fill="#ffffff" font-size="14" font-weight="700" text-anchor="end">100.17%</text>

  <text x="32" y="384" fill="#64748b" font-size="12">Оранжево = в полза на казиното · зелено = рядка пълна таблица в лека полза на играча</text>
  <text x="688" y="384" fill="#64748b" font-size="12" text-anchor="end">18+</text>
</svg>
