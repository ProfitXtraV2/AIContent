<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Jackpot Cards: четири нива по боите на картите, от най-малкото (спатия) до най-голямото (пика); бонусът се пуска на случаен принцип и събираш 3 карти от една боя">
  <title>Jackpot Cards: четирите нива по боите</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="12" ry="12" fill="url(#bg)"/>

  <text x="300" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#fde68a" text-anchor="middle">Jackpot Cards: четирите нива</text>
  <text x="300" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">от най-малкото (спатия) до най-голямото (пика)</text>

  <!-- Rung 4 (largest) Пика ♠ -->
  <rect x="60" y="72" width="480" height="46" rx="8" fill="#7c3aed" opacity="0.92"/>
  <text x="86" y="101" font-family="Georgia, serif" font-size="26" fill="#ffffff">&#9824;</text>
  <text x="120" y="101" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Пика</text>
  <text x="520" y="101" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#ede9fe" text-anchor="end">най-голямото ниво</text>

  <!-- Rung 3 Купа ♥ -->
  <rect x="60" y="126" width="420" height="46" rx="8" fill="#db2777" opacity="0.9"/>
  <text x="86" y="155" font-family="Georgia, serif" font-size="26" fill="#ffffff">&#9829;</text>
  <text x="120" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Купа</text>

  <!-- Rung 2 Каро ♦ -->
  <rect x="60" y="180" width="360" height="46" rx="8" fill="#ea580c" opacity="0.9"/>
  <text x="86" y="209" font-family="Georgia, serif" font-size="26" fill="#ffffff">&#9830;</text>
  <text x="120" y="209" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Каро</text>

  <!-- Rung 1 (smallest) Спатия ♣ -->
  <rect x="60" y="234" width="300" height="46" rx="8" fill="#0891b2" opacity="0.9"/>
  <text x="86" y="263" font-family="Georgia, serif" font-size="26" fill="#ffffff">&#9827;</text>
  <text x="120" y="263" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Спатия</text>
  <text x="366" y="263" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cffafe">най-малкото ниво</text>

  <rect x="40" y="298" width="520" height="34" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="300" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#e2e8f0" text-anchor="middle">Бонус: 12 обърнати карти · събери 3 от една боя, за да вземеш нивото ѝ</text>

  <text x="300" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">18+ Играйте отговорно · джакпотът се пуска на случаен принцип и се пада изключително рядко</text>
</svg>
