<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-label="Илюстративно: RTP на NetEnt обикновено 96%–98,5% по заглавие; при обявен RTP около 96% и €1000 оборот средно €960 се връщат на играча, €40 остават за казиното; реалната стойност се проверява в инфо-панела">
  <title>Илюстративно: RTP на NetEnt обикновено 96%–98,5%</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="playerBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="houseBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect width="600" height="330" rx="12" ry="12" fill="url(#bg)"/>

  <text x="300" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#075985" text-anchor="middle">RTP на NetEnt: обикновено 96%–98,5% по заглавие</text>
  <text x="300" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">илюстративен пример при обявен RTP ~96%; реалната стойност зависи от версията</text>

  <text x="50" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600">Връщане към играча (RTP)</text>
  <text x="550" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600" text-anchor="end">Домашно предимство</text>

  <rect x="50" y="98" width="500" height="48" rx="8" fill="#e5e7eb"/>
  <rect x="50" y="98" width="500" height="48" rx="8" fill="url(#playerBar)"/>
  <!-- House portion: 4% of 500px = 20px -->
  <rect x="530" y="98" width="20" height="48" rx="4" fill="url(#houseBar)"/>

  <text x="290" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">~96%</text>

  <line x1="50" y1="172" x2="550" y2="172" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="300" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Пример: €1000 оборот</text>

  <rect x="50" y="211" width="220" height="74" rx="10" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="160" y="237" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#075985" text-anchor="middle" font-weight="600">Обратно към играча</text>
  <text x="160" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#0369a1" text-anchor="middle">~€960</text>
  <text x="160" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#0ea5e9" text-anchor="middle">(средно, дългосрочно)</text>

  <rect x="330" y="211" width="220" height="74" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="440" y="237" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="600">За казиното</text>
  <text x="440" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#dc2626" text-anchor="middle">~€40</text>
  <text x="440" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ef4444" text-anchor="middle">(домашно предимство ~4%)</text>

  <text x="300" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#9ca3af" text-anchor="middle">+</text>

  <text x="300" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · Провери реалния RTP в инфо-панела на конкретното казино</text>
</svg>
