<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" role="img" aria-label="Домашно предимство по залог в крапс: залог за коефициент 0%, don't pass 1.36%, pass line 1.41%, place 6/8 1.52%, field 2.78%, place 4/10 6.67%, any 7 16.67%">
  <title>Крапс: домашно предимство по залог</title>
  <defs>
