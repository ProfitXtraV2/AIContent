  <text x="214" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#4d7c0f">1.52%</text>

  <!-- Row 5: Field 2.78% -> 66.7px -->
  <text x="162" y="267" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155" text-anchor="end">Field</text>
  <rect x="170" y="254" width="67" height="24" rx="3" fill="#d97706"/>
  <text x="245" y="271" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#b45309">2.78%</text>

  <!-- Row 6: Place 4/10 6.67% -> 160px -->
