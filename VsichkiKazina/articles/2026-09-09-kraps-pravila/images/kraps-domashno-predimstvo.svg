    </linearGradient>
  </defs>

  <rect width="640" height="430" rx="12" ry="12" fill="url(#bgc)"/>
  <text x="320" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Домашно предимство по залог в крапс</text>
  <text x="320" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">колкото по-къса лентата, толкова по-евтин залогът (мащаб 0–17%)</text>

  <!-- Row 1: Залог за коефициент 0.00% -->
