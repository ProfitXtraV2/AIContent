  <text x="211" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#15803d">1.36%</text>

  <!-- Row 3: Pass line 1.41% -> 33.8px -->
  <text x="162" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155" text-anchor="end">Pass line</text>
