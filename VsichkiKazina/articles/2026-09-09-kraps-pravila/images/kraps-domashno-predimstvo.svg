  <line x1="170" y1="386" x2="570" y2="386" stroke="#e2e8f0" stroke-width="1"/>
  <text x="320" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Източник: Wizard of Odds · 18+ Играйте отговорно</text>
