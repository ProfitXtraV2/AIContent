<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="720" height="336" role="img" aria-label="Депозитът с банкова карта е моментален и влиза за секунди след 3-D Secure, а тегленето по карта отнема обикновено 1–5 работни дни в зависимост от банката и казиното; първото теглене изисква KYC верификация. Примерни срокове.">
  <title>Депозит с карта: моментален спрямо теглене по карта 1–5 работни дни</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
  </defs>

  <rect width="720" height="336" rx="14" ry="14" fill="url(#bg)"/>

  <text x="360" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">Карта: колко бързо влизат и излизат парите</text>
  <text x="360" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">депозит спрямо теглене по банкова карта</text>

  <!-- Deposit card (left) -->
  <rect x="40" y="88" width="300" height="112" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <rect x="40" y="88" width="300" height="6" rx="3" fill="#10b981"/>
  <text x="190" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#047857" text-anchor="middle">Депозит с карта</text>
  <text x="190" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#059669" text-anchor="middle">моментален</text>
  <text x="190" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">влиза за секунди след 3-D Secure</text>

  <!-- Withdrawal card (right) -->
  <rect x="380" y="88" width="300" height="112" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="380" y="88" width="300" height="6" rx="3" fill="#f59e0b"/>
  <text x="530" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#b45309" text-anchor="middle">Теглене по карта</text>
  <text x="530" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#d97706" text-anchor="middle">1–5 работни дни</text>
  <text x="530" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">зависи от банката и казиното</text>

  <!-- KYC note bar -->
  <rect x="40" y="222" width="640" height="56" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="360" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#3730a3" text-anchor="middle">Първото теглене изисква KYC верификация</text>
  <text x="360" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4338ca" text-anchor="middle">(лична карта, понякога адрес и снимка на картата)</text>

  <text x="360" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · примерни срокове, зависят от банката и казиното</text>
</svg>
