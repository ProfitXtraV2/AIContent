<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" role="img" aria-label="Tombstone R.I.P. RTP 96.08% и домашно предимство 3.92%: при €1000 оборот средно €961 се връщат на играча, €39 остават за казиното; много висока волатилност, максимална печалба 300 000 пъти залога">
  <title>Tombstone R.I.P.: RTP 96.08% и домашно предимство 3.92%</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="playerBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="houseBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect width="700" height="360" rx="12" ry="12" fill="url(#bg)"/>

  <text x="350" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">Tombstone R.I.P.: RTP и домашно предимство</text>
  <text x="350" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">обявен RTP по подразбиране (операторът може да пусне версия 94.08%)</text>

  <text x="100" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600">Връщане към играча (RTP)</text>
  <text x="600" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600" text-anchor="end">Домашно предимство</text>

  <rect x="100" y="100" width="500" height="48" rx="8" fill="#e5e7eb"/>
  <rect x="100" y="100" width="500" height="48" rx="8" fill="url(#playerBar)"/>
  <!-- House portion: 3.92% of 500px = 19.6 ~ 20px -->
  <rect x="580" y="100" width="20" height="48" rx="4" fill="url(#houseBar)"/>

  <text x="340" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">96.08%</text>
  <text x="590" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">3.92%</text>

  <line x1="100" y1="176" x2="600" y2="176" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="350" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Пример: €1000 оборот</text>

  <rect x="100" y="216" width="240" height="76" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="220" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="600">Обратно към играча</text>
  <text x="220" y="271" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#1d4ed8" text-anchor="middle">~€961</text>
  <text x="220" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle">(средно, дългосрочно)</text>

  <rect x="360" y="216" width="240" height="76" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="480" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="600">За казиното</text>
  <text x="480" y="271" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#dc2626" text-anchor="middle">~€39</text>
  <text x="480" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ef4444" text-anchor="middle">(домашно предимство 3.92%)</text>

  <text x="350" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#9ca3af" text-anchor="middle">+</text>

  <text x="350" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Много висока „insane" волатилност · честота на печалба 9.08% · макс. печалба 300 000 пъти залога</text>
  <text x="350" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">RTP е дългосрочна статистика, не прогноза за следващото завъртане · 18+ Играйте отговорно</text>
</svg>
