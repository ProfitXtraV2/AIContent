<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Множителната ролка на Aztec Gems: стойности 1x, 2x, 3x, 5x, 10x и 15x; 15x е таванът и води до максималните 375x от залога">
  <title>Aztec Gems: множителната ролка (1x до 15x)</title>
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7faf9"/>
      <stop offset="100%" stop-color="#eaf1ef"/>
    </linearGradient>
    <linearGradient id="mbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="mbarTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" rx="12" ry="12" fill="url(#bgm)"/>

  <text x="300" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#0f5257" text-anchor="middle">Aztec Gems: множителната ролка</text>
  <text x="300" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#6b7280" text-anchor="middle" font-style="italic">На всяко завъртане ролката спира на една стойност и умножава печелившата линия</text>

  <!-- Row 1x -->
  <text x="112" y="99" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#374151" text-anchor="end">1x</text>
  <rect x="130" y="83" width="25" height="22" rx="4" fill="url(#mbar)"/>
  <text x="165" y="99" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">без увеличение</text>

  <!-- Row 2x -->
  <text x="112" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#374151" text-anchor="end">2x</text>
  <rect x="130" y="119" width="51" height="22" rx="4" fill="url(#mbar)"/>

  <!-- Row 3x -->
  <text x="112" y="171" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#374151" text-anchor="end">3x</text>
  <rect x="130" y="155" width="76" height="22" rx="4" fill="url(#mbar)"/>

  <!-- Row 5x -->
  <text x="112" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#374151" text-anchor="end">5x</text>
  <rect x="130" y="191" width="127" height="22" rx="4" fill="url(#mbar)"/>

  <!-- Row 10x -->
  <text x="112" y="243" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#374151" text-anchor="end">10x</text>
  <rect x="130" y="227" width="253" height="22" rx="4" fill="url(#mbar)"/>

  <!-- Row 15x (cap, highlighted) -->
  <text x="112" y="279" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#b45309" text-anchor="end">15x</text>
  <rect x="130" y="262" width="380" height="24" rx="4" fill="url(#mbarTop)"/>
  <text x="320" y="279" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">таван на множителя</text>

  <line x1="130" y1="300" x2="510" y2="300" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="300" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">15x върху най-високата линия дава тавана от 375x залога · нулира се всяко завъртане</text>
  <text x="300" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · високите стойности се падат най-рядко</text>
</svg>
