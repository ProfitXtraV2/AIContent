<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="Aztec Gems RTP 96.52% и домашно предимство 3.48%: при €1000 оборот средно €965.20 се връщат на играча, €34.80 остават за казиното">
  <title>Aztec Gems: RTP 96.52% и домашно предимство 3.48%</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7faf9"/>
      <stop offset="100%" stop-color="#eaf1ef"/>
    </linearGradient>
    <linearGradient id="playerBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="houseBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="600" height="320" rx="12" ry="12" fill="url(#bg)"/>

  <text x="300" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#0f5257" text-anchor="middle">Aztec Gems: RTP и домашно предимство</text>

  <text x="50" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600">Връщане към играча (RTP)</text>
  <text x="550" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600" text-anchor="end">Домашно предимство</text>

  <rect x="50" y="90" width="500" height="48" rx="8" fill="#e5e7eb"/>
  <!-- Player portion 96.52% fills the track; house 3.48% overlays the right 17px -->
  <rect x="50" y="90" width="500" height="48" rx="8" fill="url(#playerBar)"/>
  <!-- House portion: 3.48% of 500px = 17.4 ≈ 17px, flush right -->
  <rect x="533" y="90" width="17" height="48" rx="4" fill="url(#houseBar)"/>

  <text x="291" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">96.52%</text>
  <text x="541" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">3.48%</text>

  <line x1="50" y1="165" x2="550" y2="165" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="300" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Пример: €1000 оборот при обявен RTP 96.52%</text>

  <rect x="50" y="205" width="220" height="76" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="160" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="600">Обратно към играча</text>
  <text x="160" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="800" fill="#0d9488" text-anchor="middle">~€965.20</text>
  <text x="160" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#14b8a6" text-anchor="middle">(средно, дългосрочно)</text>

  <rect x="330" y="205" width="220" height="76" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="440" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="600">За казиното</text>
  <text x="440" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="800" fill="#d97706" text-anchor="middle">~€34.80</text>
  <text x="440" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle">(домашно предимство 3.48%)</text>

  <text x="300" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#9ca3af" text-anchor="middle">+</text>

  <text x="300" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · Операторът може да зареди по-нисък RTP, провери инфо-панела</text>
</svg>
