<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Ефект на правилата върху възвръщаемостта на играча при блекджек</title>
<desc id="d">Хоризонтални ленти: едно тесте +0,48%, късно предаване +0,08%, европейски без hole card -0,11%, удвояване само на 10 и 11 -0,18%, дилърът тегли на soft 17 -0,22%, блекджек 7:5 -0,45%, блекджек 6:5 -1,39%, блекджек 1:1 -2,27%.</desc>
<rect x="0" y="0" width="760" height="560" rx="12" fill="#ffffff"/>
<text x="24" y="42" font-size="22" font-weight="700" fill="#1a2433">Как правилата местят предимството на казиното</text>
<text x="24" y="66" font-size="14" fill="#475467">Ефект върху възвръщаемостта на играча, спрямо база:</text>
<text x="24" y="85" font-size="14" fill="#475467">осем тестета, стоп на soft 17, удвояване след раздвояване</text>
