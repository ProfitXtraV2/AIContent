<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" width="720" height="352" role="img" aria-label="Блокировката на хазарта в Revolut се включва веднага, а изключването минава през период на изчакване до 48 часа, който дори поддръжката не може да заобиколи. Блокировката спира картови плащания към хазартни търговци по кода на категорията, но не блокира банкови преводи.">
  <title>Revolut: блокировка на хазарта, включване веднага, изключване до 48 часа</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
  </defs>

  <rect width="720" height="352" rx="14" ry="14" fill="url(#bg)"/>

  <text x="360" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">Блокировката на хазарта в Revolut</text>
  <text x="360" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">инструмент за самоконтрол, вграден в сметката</text>

  <!-- Enable card (left) -->
  <rect x="40" y="88" width="300" height="112" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <rect x="40" y="88" width="300" height="6" rx="3" fill="#10b981"/>
  <text x="190" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#047857" text-anchor="middle">Включване</text>
  <text x="190" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#059669" text-anchor="middle">веднага</text>
  <text x="190" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">решението да спреш се зачита веднага</text>

  <!-- Disable card (right) -->
  <rect x="380" y="88" width="300" height="112" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="380" y="88" width="300" height="6" rx="3" fill="#f59e0b"/>
  <text x="530" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#b45309" text-anchor="middle">Изключване</text>
  <text x="530" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#d97706" text-anchor="middle">до 48 часа</text>
  <text x="530" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">период на изчакване; поддръжката не го заобикаля</text>

  <!-- MCC note bar -->
  <rect x="40" y="222" width="640" height="62" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="360" y="247" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#3730a3" text-anchor="middle">Спира картови плащания към хазартни търговци (по MCC)</text>
  <text x="360" y="269" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4338ca" text-anchor="middle">не блокира банкови преводи или търговец с друг код на категорията</text>

  <text x="360" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · ако усетиш, че играта излиза извън контрол, включи блокировката</text>
</svg>
