<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-label="Инфографика: домашно предимство при Ultimate Texas Hold'em. Element of risk около 0.53% спрямо целия оборот, срещу 2.185% спрямо Антето, при оптимална стратегия. Размери на вдигането Play: 4x преди флопа, 2x след флопа, 1x на ривъра или пас.">
  <rect x="8" y="8" width="704" height="414" rx="18" fill="#0f172a"/>

  <text x="32" y="42" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">Ultimate Texas Hold'em: цена на играта</text>
  <text x="32" y="64" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Домашно предимство при оптимална стратегия и размерите на вдигането Play</text>

  <text x="32" y="104" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">Домашно предимство (%)</text>

  <!-- gridlines 0..3% -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="200" y1="122" x2="200" y2="232"/>
    <line x1="360" y1="122" x2="360" y2="232"/>
    <line x1="520" y1="122" x2="520" y2="232"/>
    <line x1="680" y1="122" x2="680" y2="232"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">
    <text x="200" y="248">0%</text>
    <text x="360" y="248">1%</text>
    <text x="520" y="248">2%</text>
    <text x="680" y="248">3%</text>
  </g>

  <!-- element of risk bar: 0.53% -->
  <text x="32" y="151" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">спрямо оборота</text>
  <rect x="200" y="134" width="85" height="24" rx="4" fill="#34d399"/>
  <text x="295" y="151" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">0.53% (element of risk)</text>

  <!-- ante bar: 2.185% -->
  <text x="32" y="201" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">спрямо Антето</text>
  <rect x="200" y="184" width="350" height="24" rx="4" fill="#38bdf8"/>
  <text x="560" y="201" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">2.185%</text>

  <!-- raise ladder -->
  <rect x="32" y="278" width="656" height="86" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="48" y="305" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">Вдигаш Play само веднъж, размерът пада с всеки етап</text>

  <g font-family="Arial, sans-serif">
    <text x="120" y="340" font-size="26" font-weight="bold" fill="#38bdf8" text-anchor="middle">4x</text>
    <text x="120" y="358" font-size="12" fill="#cbd5e1" text-anchor="middle">преди флопа</text>
    <text x="360" y="340" font-size="26" font-weight="bold" fill="#93c5fd" text-anchor="middle">2x</text>
    <text x="360" y="358" font-size="12" fill="#cbd5e1" text-anchor="middle">след флопа</text>
    <text x="600" y="340" font-size="26" font-weight="bold" fill="#a5b4fc" text-anchor="middle">1x</text>
    <text x="600" y="358" font-size="12" fill="#cbd5e1" text-anchor="middle">на ривъра или пас</text>
  </g>
  <g stroke="#334155" stroke-width="1">
    <line x1="240" y1="322" x2="240" y2="356"/>
    <line x1="480" y1="322" x2="480" y2="356"/>
  </g>

  <!-- footer -->
  <text x="32" y="398" font-family="Arial, sans-serif" font-size="11" fill="#64748b">18+ Играйте отговорно</text>
  <text x="688" y="398" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="end">RTP спрямо оборота ≈ 99.47% в дълъг период</text>
</svg>
