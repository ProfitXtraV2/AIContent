<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Най-големите джакпоти в Тото 2 – 6 от 49 (2019–2026)</title>
  <desc id="d">Шест рекордни джакпота в 6 от 49 по години, с дължина на лентата пропорционална на сумата в лева и преизчисление в евро по курс 1,95583.</desc>
  <rect x="0" y="0" width="760" height="500" rx="16" fill="#f7f8fb"/>
  <text x="32" y="46" font-size="22" font-weight="700" fill="#1b2a41">Рекордни джакпоти в 6 от 49</text>
  <text x="32" y="70" font-size="13" fill="#55627a">Подредени по година. Дължината на лентата е пропорционална на сумата в лева.</text>

  <text x="32" y="112" font-size="15" font-weight="700" fill="#1b2a41">2019 · 20-и тираж</text>
  <text x="32" y="130" font-size="12" fill="#55627a">разделен между четирима</text>
  <rect x="200" y="96" width="324" height="34" rx="4" fill="#7f8fa6"/>
  <text x="210" y="118" font-size="13" font-weight="700" fill="#ffffff">9 501 430,40 лв. (≈ 4 858 004 €)</text>

  <text x="32" y="168" font-size="15" font-weight="700" fill="#1b2a41">2022 · 31-ви тираж</text>
  <text x="32" y="186" font-size="12" fill="#55627a">един фиш, Сливен</text>
  <rect x="200" y="152" width="400" height="34" rx="4" fill="#c0392b"/>
  <text x="210" y="174" font-size="13" font-weight="700" fill="#ffffff">11 715 401,70 лв. (≈ 5 989 990 €)</text>

  <text x="32" y="224" font-size="15" font-weight="700" fill="#1b2a41">2023 · 76-и тираж</text>
  <text x="32" y="242" font-size="12" fill="#55627a">един участник</text>
  <rect x="200" y="208" width="330" height="34" rx="4" fill="#7f8fa6"/>
  <text x="210" y="230" font-size="13" font-weight="700" fill="#ffffff">9 667 090,20 лв. (≈ 4 942 705 €)</text>

  <text x="32" y="280" font-size="15" font-weight="700" fill="#1b2a41">2024 · тираж 39</text>
  <text x="32" y="298" font-size="12" fill="#55627a">един играч</text>
  <rect x="200" y="264" width="345" height="34" rx="4" fill="#7f8fa6"/>
  <text x="210" y="286" font-size="13" font-weight="700" fill="#ffffff">10 095 908,40 лв. (≈ 5 161 956 €)</text>

  <text x="32" y="336" font-size="15" font-weight="700" fill="#1b2a41">2025 · тираж 23</text>
  <text x="32" y="354" font-size="12" fill="#55627a">един участник</text>
  <rect x="200" y="320" width="386" height="34" rx="4" fill="#7f8fa6"/>
  <text x="210" y="342" font-size="13" font-weight="700" fill="#ffffff">11 304 948,90 лв. (≈ 5 780 129 €)</text>

  <text x="32" y="392" font-size="15" font-weight="700" fill="#1b2a41">2026 · тираж 21</text>
  <text x="32" y="410" font-size="12" fill="#55627a">един фиш, София</text>
  <rect x="200" y="376" width="386" height="34" rx="4" fill="#2c6e9b"/>
  <text x="210" y="398" font-size="13" font-weight="700" fill="#ffffff">5 778 403 € (≈ 11 301 574 лв.)</text>

  <line x1="32" y1="436" x2="728" y2="436" stroke="#d5dae4" stroke-width="1"/>
  <text x="32" y="460" font-size="12" fill="#55627a">≈ преизчисление по фиксирания курс 1,95583. Източници: БСТ, profit.bg, dir.bg.</text>
  <text x="32" y="480" font-size="12" fill="#55627a">По-голям джакпот не означава по-голям шанс: 1 към 13 983 816 за всяка комбинация.</text>
  <text x="728" y="480" font-size="12" font-weight="700" fill="#c0392b" text-anchor="end">18+ Играйте отговорно</text>
</svg>
