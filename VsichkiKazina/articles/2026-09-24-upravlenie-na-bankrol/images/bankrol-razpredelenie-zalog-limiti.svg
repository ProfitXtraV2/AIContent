<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-label="Инфографика: разпределение на примерен банкрол от €200 - размер на залог, сесиен банкрол, стоп-загуба и печеливш лимит">
  <title>Разпределение на банкрол: пример за €200</title>
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="720" height="470" rx="14" ry="14" fill="#f7f8fb"/>

  <!-- Title -->
  <text x="360" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2036">Разпределение на банкрол: пример за €200</text>
  <text x="360" y="59" text-anchor="middle" font-size="11" fill="#8a8fa3">Единичен залог, сесии, стоп-загуба и печеливш лимит</text>

  <!-- Divider -->
  <line x1="40" y1="72" x2="680" y2="72" stroke="#e2e5ee" stroke-width="1"/>

  <!-- Hero bankroll -->
  <text x="360" y="98" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#6b7280">ОБЩ БАНКРОЛ (ПРИМЕРЕН)</text>
  <text x="360" y="132" text-anchor="middle" font-size="30" font-weight="700" fill="#2563eb">€200</text>

  <!-- Row 1: stake size -->
  <rect x="40" y="160" width="640" height="62" rx="10" fill="#ffffff" stroke="#e6e9f2" stroke-width="1"/>
  <rect x="40" y="160" width="5" height="62" fill="#2563eb"/>
  <text x="64" y="185" font-size="12" fill="#6b7280">Размер на залог (единичен, начало 1–2%)</text>
  <text x="64" y="209" font-size="16" font-weight="700" fill="#1f2937">1% = €2  ·  2% = €4  ·  до 5% = €10</text>

  <!-- Row 2: session bankroll -->
  <rect x="40" y="230" width="640" height="62" rx="10" fill="#ffffff" stroke="#e6e9f2" stroke-width="1"/>
  <rect x="40" y="230" width="5" height="62" fill="#0d9488"/>
  <text x="64" y="255" font-size="12" fill="#6b7280">Сесиен банкрол</text>
  <text x="64" y="279" font-size="16" font-weight="700" fill="#1f2937">€200 ÷ 4 сесии = €50 на сесия</text>

  <!-- Row 3: stop-loss -->
  <rect x="40" y="300" width="640" height="62" rx="10" fill="#ffffff" stroke="#e6e9f2" stroke-width="1"/>
  <rect x="40" y="300" width="5" height="62" fill="#d97706"/>
  <text x="64" y="325" font-size="12" fill="#6b7280">Стоп-загуба (лимит за загуба)</text>
  <text x="64" y="349" font-size="16" font-weight="700" fill="#1f2937">€50 на сесия, после спираш за вечерта</text>

  <!-- Row 4: win-limit -->
  <rect x="40" y="370" width="640" height="62" rx="10" fill="#ffffff" stroke="#e6e9f2" stroke-width="1"/>
  <rect x="40" y="370" width="5" height="62" fill="#16a34a"/>
  <text x="64" y="395" font-size="12" fill="#6b7280">Печеливш лимит</text>
  <text x="64" y="419" font-size="16" font-weight="700" fill="#1f2937">при баланс €75 изтегли поне вложените €50</text>

  <!-- Footer RG note -->
  <text x="360" y="454" text-anchor="middle" font-size="10" fill="#a2a7b8">18+ Играйте отговорно · числата са примерни</text>
</svg>
