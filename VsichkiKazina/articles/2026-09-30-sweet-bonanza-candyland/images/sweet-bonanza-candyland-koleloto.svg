<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 486" role="img" aria-label="Разпределение на колелото на Sweet Bonanza CandyLand: 54 сегмента общо. Число 1: 23 сегмента, 42.59%. Число 2: 15 сегмента, 27.78%. Число 5: 7 сегмента, 12.96%. Sugar Bomb: 3 сегмента, 5.56%. Bubble Surprise: 3 сегмента, 5.56%. Candy Drop: 2 сегмента, 3.70%. Sweet Spins: 1 сегмент, 1.85%. Максимална печалба 20 000 пъти залога с таван 500 000 евро. RTP варира между 91.59% и 96.83% според позицията.">
  <rect x="8" y="8" width="704" height="470" rx="18" fill="#0f172a"/>

  <text x="32" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">Sweet Bonanza CandyLand: колелото</text>
  <text x="32" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Pragmatic Play Live · 54 сегмента · шест залога + модификатор Sugar Bomb</text>

  <text x="32" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#93c5fd">Вероятност колелото да спре на всеки изход</text>

  <!-- rows: label (x=32) · % right-aligned at x=372 · bar from x=380, scale 7.23 px per % -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12">
