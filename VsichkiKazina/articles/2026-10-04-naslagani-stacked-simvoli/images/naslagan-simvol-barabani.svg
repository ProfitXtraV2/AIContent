<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="Инфографика: примерен слот с 5 барабана и 3 реда. На първия барабан пада наслаган символ - цяла колона от три еднакви знака. Барабани 2 и 3 повтарят същия символ, тъй че всичките 10 линии тръгват с едно и също начало. Барабани 4 и 5 имат различни символи. Числата са примерни.">
  <style>
    .card{fill:#f7f8fa;stroke:#d9dee5;stroke-width:1.5}
    .title{font-family:'Segoe UI',Arial,sans-serif;font-size:21px;font-weight:700;fill:#1f2733}
    .sub{font-family:'Segoe UI',Arial,sans-serif;font-size:14px;fill:#6b7684}
    .cell{fill:#eef1f4;stroke:#d2d8df;stroke-width:1.5}
    .hit{fill:#cfe8d6;stroke:#8ccfa3;stroke-width:1.5}
    .stack{fill:#bfe2cb;stroke:#5fb584;stroke-width:2}
    .symhit{font-family:'Segoe UI',Arial,sans-serif;font-size:26px;fill:#2f7d4f;font-weight:700}
    .sym{font-family:'Segoe UI',Arial,sans-serif;font-size:24px;fill:#9aa4b0}
    .reellbl{font-family:'Segoe UI',Arial,sans-serif;font-size:12px;fill:#8a94a0}
    .note{font-family:'Segoe UI',Arial,sans-serif;font-size:14px;font-weight:700;fill:#1f2733}
    .tag{font-family:'Segoe UI',Arial,sans-serif;font-size:12px;fill:#6b7684}
  </style>
  <rect class="card" x="8" y="8" width="704" height="404" rx="16"/>
  <text class="title" x="360" y="44" text-anchor="middle">Наслаган символ: пълен барабан с едно и също лице</text>
  <text class="sub" x="360" y="68" text-anchor="middle">примерен слот с 5 барабана и 3 реда, 10 линии</text>

  <!-- reel 1: full stack of the same symbol -->
  <rect class="stack" x="92"  y="92"  width="96" height="64" rx="6"/>
  <rect class="stack" x="92"  y="166" width="96" height="64" rx="6"/>
  <rect class="stack" x="92"  y="240" width="96" height="64" rx="6"/>
  <text class="symhit" x="140" y="133" text-anchor="middle">✦</text>
  <text class="symhit" x="140" y="207" text-anchor="middle">✦</text>
  <text class="symhit" x="140" y="281" text-anchor="middle">✦</text>
  <!-- reel 2: same symbol repeats on middle row -->
  <rect class="cell" x="202" y="92"  width="96" height="64" rx="6"/>
  <rect class="hit"  x="202" y="166" width="96" height="64" rx="6"/>
  <rect class="cell" x="202" y="240" width="96" height="64" rx="6"/>
  <text class="sym"    x="250" y="132" text-anchor="middle">●</text>
  <text class="symhit" x="250" y="207" text-anchor="middle">✦</text>
  <text class="sym"    x="250" y="280" text-anchor="middle">▲</text>
  <!-- reel 3: same symbol repeats on middle row -->
  <rect class="cell" x="312" y="92"  width="96" height="64" rx="6"/>
  <rect class="hit"  x="312" y="166" width="96" height="64" rx="6"/>
  <rect class="cell" x="312" y="240" width="96" height="64" rx="6"/>
  <text class="sym"    x="360" y="132" text-anchor="middle">◆</text>
  <text class="symhit" x="360" y="207" text-anchor="middle">✦</text>
  <text class="sym"    x="360" y="280" text-anchor="middle">●</text>
  <!-- reel 4 (normal) -->
  <rect class="cell" x="422" y="92"  width="96" height="64" rx="6"/>
  <rect class="cell" x="422" y="166" width="96" height="64" rx="6"/>
  <rect class="cell" x="422" y="240" width="96" height="64" rx="6"/>
  <text class="sym" x="470" y="132" text-anchor="middle">▲</text>
  <text class="sym" x="470" y="206" text-anchor="middle">●</text>
  <text class="sym" x="470" y="280" text-anchor="middle">◆</text>
  <!-- reel 5 (normal) -->
  <rect class="cell" x="532" y="92"  width="96" height="64" rx="6"/>
  <rect class="cell" x="532" y="166" width="96" height="64" rx="6"/>
  <rect class="cell" x="532" y="240" width="96" height="64" rx="6"/>
  <text class="sym" x="580" y="132" text-anchor="middle">◆</text>
  <text class="sym" x="580" y="206" text-anchor="middle">▲</text>
  <text class="sym" x="580" y="280" text-anchor="middle">●</text>

  <text class="reellbl" x="140" y="326" text-anchor="middle">барабан 1 (стек)</text>
  <text class="reellbl" x="250" y="326" text-anchor="middle">барабан 2</text>
  <text class="reellbl" x="360" y="326" text-anchor="middle">барабан 3</text>
  <text class="reellbl" x="470" y="326" text-anchor="middle">барабан 4</text>
  <text class="reellbl" x="580" y="326" text-anchor="middle">барабан 5</text>

  <text class="note" x="360" y="362" text-anchor="middle">Една колона дава на всичките 10 линии еднакво начало.</text>
  <text class="tag" x="360" y="392" text-anchor="middle">Числата са примерни · 18+ Играйте отговорно</text>
</svg>
