<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" role="img" aria-label="Схема: seed към алгоритъм към поток от числа към изход в играта. Числата са примерни.">
  <rect x="0" y="0" width="760" height="264" fill="#f4f7f9"/>
  <rect x="8" y="8" width="744" height="248" rx="12" fill="#ffffff" stroke="#cdd9e0" stroke-width="1"/>
  <text x="380" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1f2933">Как PRNG прави случайност: seed, алгоритъм, поток, изход</text>

  <!-- boxes -->
  <g font-family="Arial, Helvetica, sans-serif">
    <!-- box 1 -->
    <rect x="18" y="92" width="160" height="92" rx="10" fill="#eef4f7" stroke="#9fb9c6" stroke-width="1.5"/>
    <text x="98" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#15466b">1. Seed</text>
    <text x="98" y="144" text-anchor="middle" font-size="11.5" fill="#33414c">начална стойност</text>
    <text x="98" y="162" text-anchor="middle" font-size="11.5" fill="#33414c">(часовник, клик)</text>

    <!-- box 2 -->
    <rect x="202" y="92" width="160" height="92" rx="10" fill="#eef4f7" stroke="#9fb9c6" stroke-width="1.5"/>
    <text x="282" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#15466b">2. Алгоритъм</text>
    <text x="282" y="144" text-anchor="middle" font-size="11.5" fill="#33414c">PRNG обработва</text>
    <text x="282" y="162" text-anchor="middle" font-size="11.5" fill="#33414c">стъпка по стъпка</text>

    <!-- box 3 -->
    <rect x="386" y="92" width="160" height="92" rx="10" fill="#eef4f7" stroke="#9fb9c6" stroke-width="1.5"/>
    <text x="466" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#15466b">3. Поток числа</text>
    <text x="466" y="145" text-anchor="middle" font-size="12" fill="#33414c">4 · 9 · 1 · 7 · 2 · 8</text>
    <text x="466" y="163" text-anchor="middle" font-size="10.5" fill="#6b7a86">(примерни)</text>

    <!-- box 4 -->
    <rect x="570" y="92" width="160" height="92" rx="10" fill="#e7f0ea" stroke="#79ab90" stroke-width="1.5"/>
    <text x="650" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6b47">4. Изход</text>
    <text x="650" y="144" text-anchor="middle" font-size="11.5" fill="#33414c">барабани, карта,</text>
    <text x="650" y="162" text-anchor="middle" font-size="11.5" fill="#33414c">число на играта</text>
  </g>

  <!-- arrows -->
  <g fill="#5a7684">
    <polygon points="180,138 196,138 196,132 200,140 196,148 196,142 180,142"/>
    <polygon points="364,138 380,138 380,132 384,140 380,148 380,142 364,142"/>
    <polygon points="548,138 564,138 564,132 568,140 564,148 564,142 548,142"/>
  </g>

  <text x="18" y="216" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5a6b76">Един и същ seed дава една и съща редица, затова seed-ът се сменя постоянно.</text>
  <text x="742" y="240" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#8a5a1f">18+ Играйте отговорно</text>
</svg>
