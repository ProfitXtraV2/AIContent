<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" role="img" aria-label="Инфографика за Big Time Gaming. Австралийско студио за слотове, основано през 2011 година в Сидни; изобретателят на механиката Megaways. Механики: Megaways с до 117 649 начина за печалба, каскади и растящ множител в бонуса. RTP по подразбиране в дълъг период: Bonanza около 96 процента, White Rabbit около 97,24 до 97,77 процента според версията, Extra Chilli около 96,19 процента. Операторът може да пусне версия с по-нисък RTP. Максимален потенциал до 50 000 пъти залога при Who Wants To Be A Millionaire Megaways и до 40 960 пъти при Lil Devil, което е таван, не очаквана печалба. Стойностите са примерни и зависят от версията и играта.">
  <rect x="8" y="8" width="704" height="436" rx="18" fill="#0f172a"/>

  <text x="32" y="42" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">Big Time Gaming: портфолио и механики</text>
  <text x="32" y="64" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Изобретателят на Megaways. RTP зависи от версията, не от рекламата.</text>

  <text x="32" y="98" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Основана</text>
  <text x="688" y="98" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">2011, Сидни, Австралия</text>

  <text x="32" y="124" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Механики</text>
  <text x="688" y="124" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">Megaways · каскади · растящ множител</text>

  <text x="32" y="150" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Начини за печалба (Megaways)</text>
  <text x="688" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">до 117 649 (7 на шеста)</text>

  <text x="32" y="184" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">RTP по подразбиране (в дълъг период)</text>

  <g stroke="#1e293b" stroke-width="1">
    <line x1="32" y1="198" x2="688" y2="198"/>
    <line x1="32" y1="226" x2="688" y2="226"/>
    <line x1="32" y1="254" x2="688" y2="254"/>
  </g>

  <text x="48" y="218" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Bonanza (висока волатилност)</text>
  <text x="688" y="218" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="end">≈ 96,00%</text>

  <text x="48" y="246" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">White Rabbit (според версията)</text>
  <text x="688" y="246" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="end">≈ 97,24–97,77%</text>

  <text x="48" y="274" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Extra Chilli</text>
  <text x="688" y="274" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">≈ 96,19%</text>

  <text x="32" y="302" font-family="Arial, sans-serif" font-size="12" fill="#fbbf24">Операторът може да пусне версия с по-нисък RTP (feature-buy / multi-tier).</text>

  <text x="32" y="336" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">Максимален потенциал</text>
  <text x="32" y="358" font-family="Arial, sans-serif" font-size="12.5" fill="#cbd5e1">До 50 000x (WWTBAM Megaways) и до 40 960x (Lil Devil).</text>
  <text x="32" y="378" font-family="Arial, sans-serif" font-size="12.5" fill="#cbd5e1">Таван, не очаквана печалба.</text>

  <rect x="32" y="410" width="656" height="24" rx="6" fill="#111f38"/>
  <text x="44" y="426" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">RTP зависи от конкретното заглавие/версия. 18+ Играйте отговорно.</text>
</svg>
