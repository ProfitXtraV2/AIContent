<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" width="760" height="610" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Закон за хазарта: промените 2025–2026 по дати</title>
<desc id="d">Времева линия на промените в Закона за хазарта: 01.01.2025 служебно вписване на рисковите групи; 27.03.2025 заличаване от регистъра не по-рано от 12 месеца; 17.06.2025 по-строги изисквания към лицензиантите; 01.01.2026 залози и печалби само в евро; 01.08.2026 лиценз за афилиейти и блокиране до 24 часа; 23.09.2026 – 23.10.2026 проект за пълна забрана на рекламата, който не е приет.</desc>
<rect x="0" y="0" width="760" height="610" rx="14" fill="#f7f8fb"/>
<text x="32" y="48" font-size="22" font-weight="700" fill="#14213d">Закон за хазарта: промените 2025–2026</text>
<text x="32" y="76" font-size="14" fill="#4a5568">Дати на влизане в сила по текста на ЗХ</text>
<line x1="184" y1="108" x2="184" y2="436" stroke="#9aa5b8" stroke-width="3"/>
<line x1="184" y1="436" x2="184" y2="512" stroke="#c05621" stroke-width="3" stroke-dasharray="6 6"/>
<circle cx="184" cy="124" r="8" fill="#1d4ed8"/>
<text x="164" y="129" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="end">01.01.2025</text>
<text x="212" y="125" font-size="15" font-weight="700" fill="#14213d">Служебно вписване на рисковите групи (чл. 10е)</text>
<text x="212" y="146" font-size="13" fill="#4a5568">В регистъра на уязвимите лица, вписва ги НАП</text>
<circle cx="184" cy="200" r="8" fill="#1d4ed8"/>
<text x="164" y="205" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="end">27.03.2025</text>
<text x="164" y="224" font-size="13" fill="#4a5568" text-anchor="end">ДВ бр. 26</text>
<text x="212" y="201" font-size="15" font-weight="700" fill="#14213d">Заличаване: не по-рано от 12 месеца</text>
<text x="212" y="222" font-size="13" fill="#4a5568">след искането за вписване в регистъра</text>
<circle cx="184" cy="276" r="8" fill="#1d4ed8"/>
<text x="164" y="281" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="end">17.06.2025</text>
<text x="164" y="300" font-size="13" fill="#4a5568" text-anchor="end">ДВ бр. 49</text>
<text x="212" y="277" font-size="15" font-weight="700" fill="#14213d">По-строги изисквания към лицензиантите</text>
<text x="212" y="298" font-size="13" fill="#4a5568">Засегнати са операторите; за играча пряка промяна няма</text>
<circle cx="184" cy="352" r="8" fill="#1d4ed8"/>
<text x="164" y="357" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="end">01.01.2026</text>
<text x="212" y="353" font-size="15" font-weight="700" fill="#14213d">Залози и печалби само в евро (чл. 3, ал. 4)</text>
<text x="212" y="374" font-size="13" fill="#4a5568">Фиксиран курс: 1,95583 лв. за 1 евро</text>
<circle cx="184" cy="428" r="8" fill="#1d4ed8"/>
<text x="164" y="433" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="end">01.08.2026</text>
<text x="164" y="452" font-size="13" fill="#4a5568" text-anchor="end">ДВ бр. 69</text>
<text x="212" y="429" font-size="15" font-weight="700" fill="#14213d">Лиценз за афилиейти: 6 000 евро годишно + 10 на сто</text>
<text x="212" y="450" font-size="13" fill="#4a5568">Нелицензирани сайтове: блокиране до 24 часа (чл. 17, ал. 6)</text>
<rect x="200" y="480" width="532" height="58" rx="8" fill="#fff4ec" stroke="#c05621" stroke-dasharray="5 4"/>
<circle cx="184" cy="504" r="8" fill="#ffffff" stroke="#c05621" stroke-width="3"/>
<text x="164" y="509" font-size="15" font-weight="700" fill="#c05621" text-anchor="end">23.09.2026 –</text>
<text x="164" y="528" font-size="13" fill="#4a5568" text-anchor="end">23.10.2026</text>
<text x="212" y="505" font-size="15" font-weight="700" fill="#14213d">ПРОЕКТ, НЕ ЗАКОН: пълна забрана на рекламата</text>
<text x="212" y="526" font-size="13" fill="#4a5568">Обществена консултация; текстът не е приет</text>
<text x="32" y="582" font-size="12" fill="#4a5568">Източник: Закон за хазарта (ДВ), strategy.bg · 18+ Играйте отговорно · Всички Казина</text>
</svg>
