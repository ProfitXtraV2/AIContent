<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 430" width="740" height="430" role="img" aria-label="Четирите нива на бонуса Chamber of Spins в Immortal Romance и как се отключват според броя влизания: Amber е достъпна веднага с 10 безплатни игри и множител 5x на всяка печалба; Troy се отключва след 5 задействания с 15 игри и прилепи с множители 2x или 3x, които се комбинират до 6x; Michael идва след 10 задействания с 20 игри и въртящи барабани с множител до 5x; Sarah е последна след 15 задействания с 25 игри и дива лоза на трети барабан.">
  <title>Chamber of Spins: четирите нива и как се отключват</title>
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="row" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="740" height="430" rx="14" ry="14" fill="#faf7ff"/>
  <rect x="0" y="0" width="740" height="64" rx="14" ry="14" fill="url(#hdr)"/>
  <rect x="0" y="40" width="740" height="24" fill="url(#hdr)"/>
  <text x="370" y="30" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">Chamber of Spins: четирите нива</text>
  <text x="370" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#e9d5ff" text-anchor="middle">отключват се според броя влизания в бонуса · 3+ скатера го пускат</text>

  <!-- column headers -->
  <text x="150" y="86" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">НИВО</text>
  <text x="330" y="86" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">ОТКЛЮЧВА СЕ</text>
  <text x="452" y="86" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">ИГРИ</text>
  <text x="595" y="86" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">ОСОБЕНОСТ</text>

  <!-- Row Amber -->
  <rect x="24" y="96" width="692" height="66" rx="10" fill="url(#row)" opacity="0.72"/>
  <text x="44" y="136" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#ffffff">Amber</text>
  <text x="330" y="135" font-family="system-ui, sans-serif" font-size="13" fill="#f5f3ff" text-anchor="middle">веднага</text>
  <text x="452" y="135" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">10</text>
  <text x="500" y="135" font-family="system-ui, sans-serif" font-size="12" fill="#f5f3ff">5x на всяка печалба</text>

  <!-- Row Troy -->
  <rect x="24" y="170" width="692" height="66" rx="10" fill="url(#row)" opacity="0.8"/>
  <text x="44" y="210" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#ffffff">Troy</text>
  <text x="330" y="209" font-family="system-ui, sans-serif" font-size="13" fill="#f5f3ff" text-anchor="middle">след 5 задействания</text>
  <text x="452" y="209" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">15</text>
  <text x="500" y="209" font-family="system-ui, sans-serif" font-size="12" fill="#f5f3ff">прилепи 2x/3x, до 6x</text>

  <!-- Row Michael -->
  <rect x="24" y="244" width="692" height="66" rx="10" fill="url(#row)" opacity="0.88"/>
  <text x="44" y="284" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#ffffff">Michael</text>
  <text x="330" y="283" font-family="system-ui, sans-serif" font-size="13" fill="#f5f3ff" text-anchor="middle">след 10 задействания</text>
  <text x="452" y="283" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">20</text>
  <text x="500" y="283" font-family="system-ui, sans-serif" font-size="12" fill="#f5f3ff">въртящи барабани, до 5x</text>

  <!-- Row Sarah -->
  <rect x="24" y="318" width="692" height="66" rx="10" fill="url(#row)"/>
  <text x="44" y="358" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#ffffff">Sarah</text>
  <text x="330" y="357" font-family="system-ui, sans-serif" font-size="13" fill="#f5f3ff" text-anchor="middle">след 15 задействания</text>
  <text x="452" y="357" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">25</text>
  <text x="500" y="357" font-family="system-ui, sans-serif" font-size="12" fill="#f5f3ff">дива лоза на 3-ти барабан</text>

  <text x="370" y="410" font-family="system-ui, sans-serif" font-size="11" fill="#a78bca" text-anchor="middle">RTP 96.86% е дългосрочна статистика, не обещание за сесията. 18+ Играйте отговорно.</text>
</svg>
