<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 552" role="img" aria-label="Инфографика за Monopoly Big Baller на Evolution. Живо бинго: теглят се 20 топки от 60, карти 5x5 с 25 числа, печели линия ред, колона или диагонал. Golden Balls носят множители: Standard 10x до 20x, Line 20x до 50x, Global 2x до 3x. Максимална линия: Chance карта до 199 към 1, Free Space карта до 39 към 1. Достатъчно бонус топки водят до 3D разходка по дъската с Mr Monopoly, данъчни полета минус 10 до 20 процента и удвояване при минаване през GO. RTP на стандартна карта около 96,10 процента, висока волатилност, общ таван 500 000 евро. Множителите се плащат от базовия RTP, не отгоре.">
  <rect x="8" y="8" width="704" height="536" rx="18" fill="#0f172a"/>

  <text x="32" y="42" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">Monopoly Big Baller: как се смята</text>
  <text x="32" y="64" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Живо бинго · 20 топки от 60 · карти 5x5 · колело и дъска отгоре.</text>

  <text x="32" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fbbf24">Основни данни</text>
  <g stroke="#1e293b" stroke-width="1">
    <line x1="32" y1="110" x2="688" y2="110"/>
    <line x1="32" y1="138" x2="688" y2="138"/>
    <line x1="32" y1="166" x2="688" y2="166"/>
    <line x1="32" y1="194" x2="688" y2="194"/>
    <line x1="32" y1="222" x2="688" y2="222"/>
  </g>
  <text x="48" y="128" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Теглене / карта</text>
  <text x="688" y="128" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">20 топки от 60 · карта 5x5</text>
  <text x="48" y="156" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">RTP (стандартна карта)</text>
  <text x="688" y="156" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="end">≈ 96,10%</text>
  <text x="48" y="184" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Волатилност</text>
  <text x="688" y="184" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">висока</text>
  <text x="48" y="212" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Общ таван</text>
  <text x="688" y="212" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">€500 000</text>

  <text x="32" y="256" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fbbf24">Golden Balls: множители</text>
  <text x="32" y="278" font-family="Arial, sans-serif" font-size="12.5" fill="#cbd5e1">Standard: 10x – 20x (усилва число).</text>
  <text x="32" y="298" font-family="Arial, sans-serif" font-size="12.5" fill="#cbd5e1">Line: 20x – 50x (усилва цяла линия).</text>
  <text x="32" y="318" font-family="Arial, sans-serif" font-size="12.5" fill="#cbd5e1">Global: 2x – 3x (върху всичко).</text>

  <text x="392" y="256" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fbbf24">Макс. линия по карта</text>
  <text x="392" y="278" font-family="Arial, sans-serif" font-size="12.5" fill="#cbd5e1">Chance карта: до 199:1 (рядко).</text>
  <text x="392" y="298" font-family="Arial, sans-serif" font-size="12.5" fill="#cbd5e1">Free Space карта: до 39:1 (по-често).</text>
  <text x="392" y="318" font-family="Arial, sans-serif" font-size="12.5" fill="#cbd5e1">Дъска: данъци −10–20% · GO удвоява.</text>

  <line x1="32" y1="344" x2="688" y2="344" stroke="#1e293b" stroke-width="1"/>

  <text x="32" y="378" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fbbf24">Честният ъгъл</text>
  <text x="32" y="400" font-family="Arial, sans-serif" font-size="12.5" fill="#f8fafc">Бингото, колелото и дъската не менят предимството на къщата.</text>
  <text x="32" y="418" font-family="Arial, sans-serif" font-size="12.5" fill="#f8fafc">Множителите се плащат от базовия RTP, не отгоре на него.</text>
  <text x="32" y="436" font-family="Arial, sans-serif" font-size="12.5" fill="#f8fafc">Повече карти = по-голям залог, не по-добро предимство.</text>

  <rect x="32" y="470" width="656" height="24" rx="6" fill="#111f38"/>
  <text x="44" y="486" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Официални и примерни стойности; RTP по вид карта зависи от версията при оператора. 18+ Играйте отговорно.</text>
</svg>
