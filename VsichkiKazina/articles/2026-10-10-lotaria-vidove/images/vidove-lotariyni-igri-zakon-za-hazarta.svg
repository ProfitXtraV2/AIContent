<text class="tx" x="16" y="86">Само предметни награди, поне 50%</text>
<text class="tx" x="16" y="110">Организатор: само с нестопанска</text>
<text class="tx" x="16" y="130">цел, еднократно, благотворително</text>
<text class="no" x="16" y="162">✗ Не може онлайн</text>
</g>

<g transform="translate(32,284)">
<rect width="338" height="180" rx="10" fill="#fff" stroke="#d5dde6"/>
<text class="ct" x="16" y="30">Числова лотарийна игра</text>
<text class="ar" x="322" y="30" text-anchor="end">чл. 54–57</text>
<text class="tx" x="16" y="62">Тото: % от постъпленията, поне 50%</text>
<text class="tx" x="16" y="86">Лото и кено: по коефициент</text>
<text class="tx" x="16" y="110">Бинго: поне 50% от постъпленията</text>
<text class="tx" x="16" y="130">Залагате на числа или знаци</text>
<text class="yes" x="16" y="162">✓ Може онлайн</text>
</g>

<g transform="translate(390,284)">
<rect width="338" height="180" rx="10" fill="#fff" stroke="#d5dde6"/>
<text class="ct" x="16" y="30">Моментна лотария (скреч)</text>
<text class="ar" x="322" y="30" text-anchor="end">чл. 59</text>
<text class="tx" x="16" y="62">Резултатът е под защитно покритие</text>
<text class="tx" x="16" y="86">Печалбите са фиксирани</text>
<text class="tx" x="16" y="110">Поне 50% от стойността на</text>
