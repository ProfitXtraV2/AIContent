<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="Инфографика: домашно предимство при Казино война с шест тестета. Ако винаги отиваш на война — около 2.88%. Ако винаги се предаваш — около 3.70%. Страничният залог за равенство — около 18.65%. Правилото: при равенство обявявай война. Числата за залог от 10 евро са примерни.">
  <rect x="8" y="8" width="704" height="404" rx="18" fill="#0f172a"/>

  <text x="32" y="42" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">Казино война: цена по стратегия (6 тестета)</text>
  <text x="32" y="64" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Домашно предимство според избора при равенство и на страничния залог</text>

  <text x="32" y="104" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">Домашно предимство (%)</text>

  <!-- gridlines 0..20% -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="200" y1="122" x2="200" y2="268"/>
    <line x1="320" y1="122" x2="320" y2="268"/>
    <line x1="440" y1="122" x2="440" y2="268"/>
    <line x1="560" y1="122" x2="560" y2="268"/>
    <line x1="680" y1="122" x2="680" y2="268"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">
    <text x="200" y="284">0%</text>
    <text x="320" y="284">5%</text>
    <text x="440" y="284">10%</text>
    <text x="560" y="284">15%</text>
    <text x="680" y="284">20%</text>
  </g>

  <!-- always war 2.88% -->
  <text x="32" y="151" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Винаги война</text>
  <rect x="200" y="136" width="69" height="24" rx="4" fill="#34d399"/>
  <text x="279" y="153" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">2.88%</text>

  <!-- always surrender 3.70% -->
  <text x="32" y="191" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Винаги предаване</text>
  <rect x="200" y="176" width="89" height="24" rx="4" fill="#fbbf24"/>
  <text x="299" y="193" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">3.70%</text>

  <!-- tie side bet 18.65% -->
  <text x="32" y="231" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Залог за равенство</text>
  <rect x="200" y="216" width="448" height="24" rx="4" fill="#f87171"/>
  <text x="640" y="233" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="end">18.65%</text>

  <!-- rule box -->
  <rect x="32" y="308" width="656" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="48" y="334" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">Правилото: при равенство обявявай война</text>
  <text x="48" y="356" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1">Войната е по-евтина от предаването при всяко равенство; страничният залог е за настроение.</text>

  <!-- footer -->
  <text x="32" y="398" font-family="Arial, sans-serif" font-size="11" fill="#64748b">18+ Играйте отговорно</text>
  <text x="688" y="398" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="end">RTP при война ≈ 97.12% в дълъг период · числата за €10 са примерни</text>
</svg>
