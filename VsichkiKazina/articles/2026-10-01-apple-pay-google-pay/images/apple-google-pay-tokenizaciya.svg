<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" width="720" height="352" role="img" aria-label="При Apple Pay и Google Pay депозитът е моментален и картовите данни не стигат до казиното благодарение на токенизация и биометрично потвърждение. Тегленето обаче обикновено се връща по свързаната карта, а не към самия портфейл.">
  <title>Apple Pay / Google Pay: сигурен депозит, но теглене по свързаната карта</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
  </defs>

  <rect width="720" height="352" rx="14" ry="14" fill="url(#bg)"/>

  <text x="360" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">Мобилен портфейл: сигурен вход, но изход по картата</text>
  <text x="360" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Apple Pay и Google Pay са слой върху картата ти</text>

  <!-- Deposit card (left) -->
  <rect x="40" y="88" width="300" height="118" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <rect x="40" y="88" width="300" height="6" rx="3" fill="#10b981"/>
  <text x="190" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#047857" text-anchor="middle">Депозит</text>
  <text x="190" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#059669" text-anchor="middle">моментален</text>
  <text x="190" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">картовите данни не стигат до казиното</text>
  <text x="190" y="193" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">(токенизация + биометрия)</text>

  <!-- Withdrawal card (right) -->
  <rect x="380" y="88" width="300" height="118" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="380" y="88" width="300" height="6" rx="3" fill="#f59e0b"/>
  <text x="530" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#b45309" text-anchor="middle">Теглене</text>
  <text x="530" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#d97706" text-anchor="middle">по свързаната карта</text>
  <text x="530" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">обикновено не към самия портфейл</text>
  <text x="530" y="193" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">(метод за влизане, често само за него)</text>

  <!-- Compatibility note bar -->
  <rect x="40" y="228" width="640" height="56" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="360" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#3730a3" text-anchor="middle">Нужни са едновременно: казино, банка и устройство, които го поддържат</text>
  <text x="360" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4338ca" text-anchor="middle">ако липсва някое от трите, методът не се появява в касата</text>

  <text x="360" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · срокове за теглене по карта са примерни, зависят от банката и казиното</text>
</svg>
