<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Fire Joker RTP 96.15% и домашно предимство 3.85%: при €1000 оборот средно €961.50 се връщат на играча, €38.50 остават за казиното; висока волатилност, максимална печалба 800 пъти залога, множител до 10 пъти">
  <title>Fire Joker: RTP 96.15% и домашно предимство 3.85%</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="playerBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="houseBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" rx="12" ry="12" fill="url(#bg)"/>

  <text x="300" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#7c2d12" text-anchor="middle">Fire Joker: RTP и домашно предимство</text>
  <text x="300" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">стандартен RTP (операторът може да пусне по-ниска версия)</text>

  <text x="50" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600">Връщане към играча (RTP)</text>
  <text x="550" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600" text-anchor="end">Домашно предимство</text>

  <rect x="50" y="94" width="500" height="48" rx="8" fill="#e5e7eb"/>
  <rect x="50" y="94" width="500" height="48" rx="8" fill="url(#playerBar)"/>
  <!-- House portion: 3.85% of 500px = 19.25 ~ 19px -->
  <rect x="531" y="94" width="19" height="48" rx="4" fill="url(#houseBar)"/>

  <text x="290" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">96.15%</text>
  <text x="540" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">3.85%</text>

  <line x1="50" y1="168" x2="550" y2="168" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="300" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Пример: €1000 оборот (числата са примерни)</text>

  <rect x="50" y="207" width="220" height="74" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="160" y="233" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="600">Обратно към играча</text>
  <text x="160" y="261" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#b45309" text-anchor="middle">~€961.50</text>
  <text x="160" y="276" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#d97706" text-anchor="middle">(средно, дългосрочно)</text>

  <rect x="330" y="207" width="220" height="74" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="440" y="233" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="600">За казиното</text>
  <text x="440" y="261" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#dc2626" text-anchor="middle">~€38.50</text>
  <text x="440" y="276" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ef4444" text-anchor="middle">(домашно предимство ~3.85%)</text>

  <text x="300" y="251" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#9ca3af" text-anchor="middle">+</text>

  <text x="300" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Висока волатилност · макс. печалба 800 пъти залога · множител до 10 пъти</text>
  <text x="300" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · RTP е дългосрочна статистика, не прогноза за завъртане</text>
</svg>
