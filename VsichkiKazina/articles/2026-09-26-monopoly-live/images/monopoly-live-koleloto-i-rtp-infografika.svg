<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-label="Инфографика за Monopoly Live на Evolution. Съставът на колелото от 54 полета: число 1 на 22 полета, число 2 на 15 полета, число 5 на 7 полета, число 10 на 4 полета, Chance на 2 полета, бонус 2 Rolls на 3 полета, бонус 4 Rolls на 1 поле. Общо 48 числови полета и 6 специални. RTP и таван на печалбата в дълъг период: най-добрият залог връща около 96,2 процента, бонус залозите връщат по-малко, таван на печалбата 500 000 евро на залог. Съставът и процентите зависят от версията.">
  <rect x="8" y="8" width="704" height="394" rx="18" fill="#0f172a"/>

  <text x="32" y="42" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">Monopoly Live: колелото и RTP</text>
  <text x="32" y="64" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Числата заемат повечето полета; бонус залозите връщат най-малко в дълъг период</text>

  <text x="32" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">54 полета на колелото</text>

  <text x="48" y="126" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Число 1</text>
  <text x="350" y="126" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">22 полета</text>
  <text x="48" y="150" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Число 2</text>
  <text x="350" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">15 полета</text>
  <text x="48" y="174" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Число 5</text>
  <text x="350" y="174" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">7 полета</text>
  <text x="48" y="198" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Число 10</text>
  <text x="350" y="198" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">4 полета</text>

  <text x="384" y="126" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Chance</text>
  <text x="688" y="126" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">2 полета</text>
  <text x="384" y="150" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Бонус „2 Rolls"</text>
  <text x="688" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">3 полета</text>
  <text x="384" y="174" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Бонус „4 Rolls"</text>
  <text x="688" y="174" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">1 поле</text>
  <text x="384" y="198" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Числови / специални</text>
  <text x="688" y="198" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">48 / 6</text>

  <text x="48" y="224" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">48 полета за числата · 6 специални (2 Chance + 4 бонус)</text>

  <text x="32" y="256" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">RTP и таван на печалбата (в дълъг период)</text>

  <g stroke="#1e293b" stroke-width="1">
    <line x1="32" y1="268" x2="688" y2="268"/>
    <line x1="32" y1="296" x2="688" y2="296"/>
    <line x1="32" y1="324" x2="688" y2="324"/>
  </g>

  <text x="48" y="288" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Най-добър залог (RTP)</text>
  <text x="688" y="288" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">≈ 96,2%</text>
  <text x="48" y="316" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Бонус залозите (2/4 Rolls)</text>
  <text x="688" y="316" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">връщат по-малко</text>
  <text x="48" y="344" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Таван на печалбата</text>
  <text x="688" y="344" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">500 000 € на залог</text>

  <rect x="32" y="360" width="656" height="24" rx="6" fill="#111f38"/>
  <text x="44" y="376" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Съставът и процентите зависят от версията. Множителите са примерни. 18+ Играйте отговорно.</text>
</svg>
