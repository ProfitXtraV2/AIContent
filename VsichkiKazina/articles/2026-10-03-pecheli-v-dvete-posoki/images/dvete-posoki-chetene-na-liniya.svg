<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-label="Примерна схема: една линия с три еднакви символа се чете отляво надясно (барабани 1-2-3) и отдясно наляво (барабани 3-4-5) като две отделни печалби. Числата и подредбата са примерни.">
  <style>
    .card{fill:#f7f8fa;stroke:#d9dee5;stroke-width:1.5}
    .title{font-family:'Segoe UI',Arial,sans-serif;font-size:24px;font-weight:700;fill:#1f2733}
    .sub{font-family:'Segoe UI',Arial,sans-serif;font-size:14px;fill:#6b7684}
    .lbl{font-family:'Segoe UI',Arial,sans-serif;font-size:15px;font-weight:700;fill:#3a4452}
    .reel{fill:#eef1f4;stroke:#d2d8df;stroke-width:1.5}
    .hit{fill:#cfe8d6;stroke:#8ccfa3;stroke-width:1.5}
    .num{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;fill:#8a94a0}
    .arrow{stroke:#b9711a;stroke-width:3;fill:none}
    .dir{font-family:'Segoe UI',Arial,sans-serif;font-size:14px;font-weight:700;fill:#b9711a}
    .tag{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;fill:#6b7684}
    .sym{font-family:'Segoe UI',Arial,sans-serif;font-size:22px;fill:#2f7d4f;font-weight:700}
  </style>
  <rect class="card" x="8" y="8" width="704" height="414" rx="16"/>
  <text class="title" x="360" y="50" text-anchor="middle">Една линия, разчетена от двата края</text>
  <text class="sub" x="360" y="74" text-anchor="middle">подредбата е примерна</text>

  <!-- Row A: left-to-right win on reels 1-2-3 -->
  <text class="lbl" x="40" y="128" text-anchor="start">Печалба отляво</text>
  <g>
    <rect class="hit"  x="40"  y="140" width="112" height="56" rx="6"/>
    <rect class="hit"  x="160" y="140" width="112" height="56" rx="6"/>
    <rect class="hit"  x="280" y="140" width="112" height="56" rx="6"/>
    <rect class="reel" x="400" y="140" width="112" height="56" rx="6"/>
    <rect class="reel" x="520" y="140" width="112" height="56" rx="6"/>
    <text class="sym" x="96"  y="177" text-anchor="middle">★</text>
    <text class="sym" x="216" y="177" text-anchor="middle">★</text>
    <text class="sym" x="336" y="177" text-anchor="middle">★</text>
  </g>
  <line class="arrow" x1="56" y1="214" x2="376" y2="214" marker-end="url(#ar)"/>
  <text class="dir" x="640" y="219" text-anchor="end">отляво надясно (1-2-3)</text>

  <!-- Row B: right-to-left win on reels 5-4-3 -->
  <text class="lbl" x="40" y="286" text-anchor="start">Печалба отдясно</text>
  <g>
    <rect class="reel" x="40"  y="298" width="112" height="56" rx="6"/>
    <rect class="reel" x="160" y="298" width="112" height="56" rx="6"/>
    <rect class="hit"  x="280" y="298" width="112" height="56" rx="6"/>
    <rect class="hit"  x="400" y="298" width="112" height="56" rx="6"/>
    <rect class="hit"  x="520" y="298" width="112" height="56" rx="6"/>
    <text class="sym" x="336" y="335" text-anchor="middle">★</text>
    <text class="sym" x="456" y="335" text-anchor="middle">★</text>
    <text class="sym" x="576" y="335" text-anchor="middle">★</text>
  </g>
  <line class="arrow" x1="616" y1="372" x2="296" y2="372" marker-end="url(#al)"/>
  <text class="dir" x="40" y="377" text-anchor="start">отдясно наляво (5-4-3)</text>

  <text class="tag" x="360" y="410" text-anchor="middle">18+ Играйте отговорно</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#b9711a"/></marker>
    <marker id="al" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#b9711a"/></marker>
  </defs>
</svg>
