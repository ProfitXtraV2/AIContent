<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" font-family="'DejaVu Sans','Segoe UI',Arial,sans-serif" role="img" aria-label="Starlight Princess накратко: мрежа 6 на 5 с печалби навсякъде при 8 или повече символа, каскади, множители от 2 до 500 пъти, 15 безплатни завъртания при 4 или повече скатера, максимална печалба 5000 пъти залога, висока волатилност">
  <title>Starlight Princess накратко — основни параметри</title>
  <rect x="8" y="8" width="704" height="356" rx="16" fill="#faf9fc" stroke="#e3e0ec" stroke-width="1.5"/>
  <text x="28" y="46" font-size="21" font-weight="700" fill="#241b46">Starlight Princess накратко</text>
  <line x1="28" y1="62" x2="692" y2="62" stroke="#e3e0ec" stroke-width="1.5"/>

  <g>
    <text x="28" y="98" font-size="14" fill="#6b6580">Мрежа</text>
    <text x="250" y="98" font-size="14.5" font-weight="700" fill="#241b46">6×5, печалби навсякъде (8+ еднакви символа)</text>

    <text x="28" y="140" font-size="14" fill="#6b6580">Механика</text>
    <text x="250" y="140" font-size="14.5" font-weight="700" fill="#241b46">Каскади (tumble) в рамките на едно завъртане</text>

    <text x="28" y="182" font-size="14" fill="#6b6580">Множители</text>
    <text x="250" y="182" font-size="14.5" font-weight="700" fill="#241b46">2x до 500x, сумират се в края на каскадата</text>

    <text x="28" y="224" font-size="14" fill="#6b6580">Безплатни завъртания</text>
    <text x="250" y="224" font-size="14.5" font-weight="700" fill="#241b46">15, при 4+ scatter символа</text>

    <text x="28" y="266" font-size="14" fill="#6b6580">Макс. печалба</text>
    <text x="250" y="266" font-size="14.5" font-weight="700" fill="#241b46">5,000x залога (рядко събитие)</text>

    <text x="28" y="308" font-size="14" fill="#6b6580">Волатилност</text>
    <text x="250" y="308" font-size="14.5" font-weight="700" fill="#b23a2e">Висока (дълги сухи серии)</text>
  </g>
  <g stroke="#eeecf3" stroke-width="1">
    <line x1="28" y1="114" x2="692" y2="114"/>
    <line x1="28" y1="156" x2="692" y2="156"/>
    <line x1="28" y1="198" x2="692" y2="198"/>
    <line x1="28" y1="240" x2="692" y2="240"/>
    <line x1="28" y1="282" x2="692" y2="282"/>
  </g>
  <text x="28" y="348" font-size="11" fill="#8a8499">18+ Играйте отговорно · Провайдър: Pragmatic Play · параметрите се проверяват в инфо-панела.</text>
</svg>
