<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Пример: €1 000 залог при RTP 96% — очаквано връщане ~€960, задържане ~€40">
  <title>RTP на практика: €1 000 залог, 96% RTP</title>
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a7f5e;stop-opacity:1"/>
      <stop offset="96%" style="stop-color:#1a7f5e;stop-opacity:1"/>
      <stop offset="96%" style="stop-color:#c0392b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="#f8f9fa" rx="12"/>

  <!-- Title -->
  <text x="300" y="36" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1a1a2e" text-anchor="middle">Сметка на реален бюджет (числата са примерни)</text>
  <text x="300" y="58" font-family="Arial,sans-serif" font-size="13" fill="#555" text-anchor="middle">Залог €1 000 · RTP 96% · Домашно предимство 4%</text>

  <!-- Main bar -->
  <rect x="40" y="80" width="520" height="56" rx="8" fill="url(#barGrad)"/>

  <!-- Labels on bar -->
  <text x="230" y="114" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">~€960 → обратно към играчите (96%)</text>
  <text x="567" y="101" font-family="Arial,sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">€40</text>
  <text x="567" y="118" font-family="Arial,sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">(4%)</text>

  <!-- Divider marker -->
  <line x1="540" y1="78" x2="540" y2="138" stroke="#fff" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Two boxes below -->
  <rect x="40" y="158" width="248" height="110" rx="10" fill="#1a7f5e" opacity="0.12" stroke="#1a7f5e" stroke-width="1.5"/>
  <text x="164" y="183" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#1a7f5e" text-anchor="middle">Очаквано връщане</text>
  <text x="164" y="220" font-family="Arial,sans-serif" font-size="38" font-weight="900" fill="#1a7f5e" text-anchor="middle">~€960</text>
  <text x="164" y="248" font-family="Arial,sans-serif" font-size="12" fill="#1a7f5e" text-anchor="middle">дългосрочно, след много игра</text>

  <rect x="312" y="158" width="248" height="110" rx="10" fill="#c0392b" opacity="0.10" stroke="#c0392b" stroke-width="1.5"/>
  <text x="436" y="183" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#c0392b" text-anchor="middle">Задържане на казиното</text>
  <text x="436" y="220" font-family="Arial,sans-serif" font-size="38" font-weight="900" fill="#c0392b" text-anchor="middle">~€40</text>
  <text x="436" y="248" font-family="Arial,sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">средно за много играчи</text>

  <!-- Note -->
  <rect x="40" y="286" width="520" height="38" rx="7" fill="#fff3cd" stroke="#e0c070" stroke-width="1"/>
  <text x="300" y="302" font-family="Arial,sans-serif" font-size="12" fill="#856404" text-anchor="middle" font-weight="600">⚠ Дисперсията за една сесия е много по-голяма от тези €40.</text>
  <text x="300" y="318" font-family="Arial,sans-serif" font-size="11" fill="#856404" text-anchor="middle">Можете да приключите на плюс ИЛИ да загубите целия бюджет по-рано.</text>

  <!-- RG note -->
  <text x="300" y="337" font-family="Arial,sans-serif" font-size="9.5" fill="#999" text-anchor="middle">18+ Играйте отговорно · vsichkikazina.bg</text>
</svg>
