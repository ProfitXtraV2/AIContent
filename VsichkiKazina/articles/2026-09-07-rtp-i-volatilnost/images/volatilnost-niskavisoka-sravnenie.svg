<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" width="620" height="340" role="img" aria-label="Ниска срещу висока волатилност: честота на печалба и среден размер">
  <title>Ниска vs Висока волатилност — сравнение</title>

  <!-- Background -->
  <rect width="620" height="340" fill="#f8f9fa" rx="12"/>

  <!-- Title -->
  <text x="310" y="36" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1a1a2e" text-anchor="middle">Волатилност: честота срещу размер (числата са примерни)</text>
  <text x="310" y="56" font-family="Arial,sans-serif" font-size="12" fill="#777" text-anchor="middle">Едно и също RTP — два напълно различни ритъма на игра</text>

  <!-- Column headers -->
  <rect x="180" y="68" width="190" height="34" rx="7" fill="#2563a8"/>
  <text x="275" y="89" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Ниска волатилност</text>

  <rect x="384" y="68" width="190" height="34" rx="7" fill="#7b2d8b"/>
  <text x="479" y="89" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Висока волатилност</text>

  <!-- Row 1: Win frequency -->
  <rect x="20" y="112" width="150" height="62" rx="6" fill="#e9ecef" stroke="#ced4da" stroke-width="1"/>
  <text x="95" y="136" font-family="Arial,sans-serif" font-size="12" fill="#555" text-anchor="middle" font-weight="600">Честота</text>
  <text x="95" y="152" font-family="Arial,sans-serif" font-size="12" fill="#555" text-anchor="middle">на печалба</text>
  <text x="95" y="167" font-family="Arial,sans-serif" font-size="10" fill="#888" text-anchor="middle">(при завъртане)</text>

  <rect x="180" y="112" width="190" height="62" rx="6" fill="#e8f0fb" stroke="#2563a8" stroke-width="1.5"/>
  <text x="275" y="137" font-family="Arial,sans-serif" font-size="30" font-weight="900" fill="#2563a8" text-anchor="middle">~70%</text>
  <text x="275" y="163" font-family="Arial,sans-serif" font-size="12" fill="#2563a8" text-anchor="middle">чести печалби</text>

  <rect x="384" y="112" width="190" height="62" rx="6" fill="#f5e8fb" stroke="#7b2d8b" stroke-width="1.5"/>
  <text x="479" y="137" font-family="Arial,sans-serif" font-size="30" font-weight="900" fill="#7b2d8b" text-anchor="middle">~40%</text>
  <text x="479" y="163" font-family="Arial,sans-serif" font-size="12" fill="#7b2d8b" text-anchor="middle">редки печалби</text>

  <!-- Row 2: Average win size -->
  <rect x="20" y="186" width="150" height="62" rx="6" fill="#e9ecef" stroke="#ced4da" stroke-width="1"/>
  <text x="95" y="210" font-family="Arial,sans-serif" font-size="12" fill="#555" text-anchor="middle" font-weight="600">Средна</text>
  <text x="95" y="226" font-family="Arial,sans-serif" font-size="12" fill="#555" text-anchor="middle">печалба</text>
  <text x="95" y="241" font-family="Arial,sans-serif" font-size="10" fill="#888" text-anchor="middle">(% от залога)</text>

  <rect x="180" y="186" width="190" height="62" rx="6" fill="#e8f0fb" stroke="#2563a8" stroke-width="1.5"/>
  <text x="275" y="211" font-family="Arial,sans-serif" font-size="30" font-weight="900" fill="#2563a8" text-anchor="middle">~60%</text>
  <text x="275" y="237" font-family="Arial,sans-serif" font-size="12" fill="#2563a8" text-anchor="middle">от залога</text>

  <rect x="384" y="186" width="190" height="62" rx="6" fill="#f5e8fb" stroke="#7b2d8b" stroke-width="1.5"/>
  <text x="479" y="211" font-family="Arial,sans-serif" font-size="30" font-weight="900" fill="#7b2d8b" text-anchor="middle">~200%</text>
  <text x="479" y="237" font-family="Arial,sans-serif" font-size="12" fill="#7b2d8b" text-anchor="middle">от залога</text>

  <!-- Row 3: Rhythm -->
  <rect x="20" y="260" width="150" height="48" rx="6" fill="#e9ecef" stroke="#ced4da" stroke-width="1"/>
  <text x="95" y="280" font-family="Arial,sans-serif" font-size="12" fill="#555" text-anchor="middle" font-weight="600">Ритъм</text>
  <text x="95" y="298" font-family="Arial,sans-serif" font-size="10" fill="#888" text-anchor="middle">на сесията</text>

  <rect x="180" y="260" width="190" height="48" rx="6" fill="#e8f0fb" stroke="#2563a8" stroke-width="1.5"/>
  <text x="275" y="280" font-family="Arial,sans-serif" font-size="13" fill="#2563a8" text-anchor="middle" font-weight="600">Плавен, предвидим</text>
  <text x="275" y="297" font-family="Arial,sans-serif" font-size="11" fill="#2563a8" text-anchor="middle">балансът се движи бавно</text>

  <rect x="384" y="260" width="190" height="48" rx="6" fill="#f5e8fb" stroke="#7b2d8b" stroke-width="1.5"/>
  <text x="479" y="280" font-family="Arial,sans-serif" font-size="13" fill="#7b2d8b" text-anchor="middle" font-weight="600">Дълги суши + редки удари</text>
  <text x="479" y="297" font-family="Arial,sans-serif" font-size="11" fill="#7b2d8b" text-anchor="middle">нужен по-голям бюджет</text>

  <!-- RG note -->
  <text x="310" y="328" font-family="Arial,sans-serif" font-size="9.5" fill="#999" text-anchor="middle">18+ Играйте отговорно · vsichkikazina.bg</text>
</svg>
