<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="Ходът на една ръка карибски покер: залагате анте, раздават се по 5 карти и една карта на дилъра е открита, после единственото решение е пас или залог. При пас губите само анте. При залог, равен на двойно анте, ако дилърът не се квалифицира анте плаща 1:1 и залогът се връща; ако се квалифицира и го биете, анте плаща 1:1 плюс залог по таблицата; ако се квалифицира и губите, губите анте и залог; при равенство залозите се връщат.">
  <rect x="8" y="8" width="704" height="404" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="8" y="8" width="704" height="56" rx="16" fill="#0f766e"/>
  <rect x="8" y="40" width="704" height="24" fill="#0f766e"/>
  <text x="360" y="44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Ходът на една ръка карибски покер</text>

  <!-- top mini-flow -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="24" y="82" width="180" height="46" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="114" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Залагате анте</text>

    <text x="218" y="111" text-anchor="middle" font-size="22" font-weight="700" fill="#94a3b8">&#8594;</text>

    <rect x="232" y="82" width="240" height="46" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="352" y="104" text-anchor="middle" font-size="12.5" fill="#0f172a">5 карти на всеки,</text>
    <text x="352" y="120" text-anchor="middle" font-size="12.5" fill="#0f172a">1 карта на дилъра е открита</text>

    <text x="486" y="111" text-anchor="middle" font-size="22" font-weight="700" fill="#94a3b8">&#8594;</text>

    <rect x="500" y="82" width="196" height="46" rx="10" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.5"/>
    <text x="598" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#155e75">Вашето решение</text>
  </g>

  <text x="360" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#475569">Решението ви е едно: пас или залог. Останалото зависи от дилъра.</text>

  <!-- Panel L: ПАС -->
  <rect x="24" y="172" width="190" height="222" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <rect x="24" y="172" width="190" height="38" rx="12" fill="#b91c1c"/>
  <rect x="24" y="192" width="190" height="18" fill="#b91c1c"/>
  <text x="119" y="197" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">ПАС</text>
  <text x="40" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937">Отказвате се преди</text>
  <text x="40" y="259" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937">залога.</text>
  <text x="40" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Губите само анте;</text>
  <text x="40" y="307" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">ръката приключва.</text>

  <!-- Panel R: ЗАЛОГ -->
  <rect x="230" y="172" width="466" height="222" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="230" y="172" width="466" height="38" rx="12" fill="#15803d"/>
  <rect x="230" y="192" width="466" height="18" fill="#15803d"/>
  <text x="463" y="197" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">ЗАЛОГ = 2× анте</text>
  <text x="250" y="236" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#166534">Дилърът квалифицира ли се? (поне асо и поп)</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="11.5">
    <circle cx="256" cy="266" r="5" fill="#64748b"/>
    <text x="270" y="270" fill="#1f2937">Не се квалифицира: анте 1:1, залогът се връща</text>

    <circle cx="256" cy="298" r="5" fill="#15803d"/>
    <text x="270" y="302" fill="#1f2937">Квалифицира се и го биете: анте 1:1 + залог по таблицата</text>

    <circle cx="256" cy="330" r="5" fill="#b91c1c"/>
    <text x="270" y="334" fill="#1f2937">Квалифицира се и губите: анте и залог отиват</text>

    <circle cx="256" cy="362" r="5" fill="#64748b"/>
    <text x="270" y="366" fill="#1f2937">Равенство: двата залога се връщат</text>
  </g>
</svg>
