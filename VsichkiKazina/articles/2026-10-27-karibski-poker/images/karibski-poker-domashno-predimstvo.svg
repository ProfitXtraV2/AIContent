<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" role="img" aria-label="Домашното предимство на карибския покер: 5,224% върху анте, 2,555% спрямо всички заложени пари, средно около 2,045 анте на ръка; пример при анте 10 евро, залог 20 евро, общо 30 евро в игра, очаквана загуба около 52 цента на ръка">
  <rect x="8" y="8" width="704" height="336" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="8" y="8" width="704" height="56" rx="16" fill="#0f766e"/>
  <rect x="8" y="40" width="704" height="24" fill="#0f766e"/>
  <text x="360" y="44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Домашното предимство на карибския покер</text>

  <!-- three stat tiles -->
  <g font-family="Arial, Helvetica, sans-serif">
    <!-- tile 1 -->
    <rect x="24" y="84" width="213" height="118" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <text x="130" y="128" text-anchor="middle" font-size="36" font-weight="700" fill="#0f766e">5,224%</text>
    <text x="130" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#134e4a">върху анте</text>
    <text x="130" y="180" text-anchor="middle" font-size="12.5" fill="#475569">при правилна игра</text>

    <!-- tile 2 -->
    <rect x="253" y="84" width="213" height="118" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="359" y="128" text-anchor="middle" font-size="36" font-weight="700" fill="#0f172a">2,555%</text>
    <text x="359" y="156" text-anchor="middle" font-size="13.5" fill="#334155">спрямо всички</text>
    <text x="359" y="176" text-anchor="middle" font-size="13.5" fill="#334155">заложени пари</text>

    <!-- tile 3 -->
    <rect x="482" y="84" width="213" height="118" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="588" y="128" text-anchor="middle" font-size="36" font-weight="700" fill="#0f172a">≈ 2,045</text>
    <text x="588" y="156" text-anchor="middle" font-size="13.5" fill="#334155">средно заложени</text>
    <text x="588" y="176" text-anchor="middle" font-size="13.5" fill="#334155">анте на ръка</text>
  </g>

  <!-- example strip -->
  <rect x="24" y="222" width="671" height="86" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="44" y="252" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#92400e">Пример при анте €10</text>
  <text x="44" y="276" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f2937">Залог €20, общо €30 в игра на ръка.</text>
  <text x="44" y="297" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f2937">Очаквана загуба в дългосрочен план: около 52 цента на ръка спрямо анте.</text>

  <text x="695" y="334" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#94a3b8">18+ Играйте отговорно</text>
</svg>
