<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Функциите на 5 Lions Megaways: три или повече скатера задействат безплатни завъртания с избор от конфигурации и wild множители до 40 пъти; платените входове са ante bet с плюс 25 процента залог за удвоен шанс и bonus buy за 100 пъти залога, чието наличие зависи от региона">
  <title>5 Lions Megaways: бонус и платени функции</title>
  <defs>
    <linearGradient id="bgf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
