<text x="40" y="488" font-size="14" fill="#1f2a44">Система 10 = 210 комбинации за 189,00 €, т.е. пак по 0,90 € на комбинация.</text>
<text x="40" y="514" font-size="14" font-weight="700" fill="#9a4d00">Системата купува повече комбинации, но шансът на всеки евро не се мени.</text>
