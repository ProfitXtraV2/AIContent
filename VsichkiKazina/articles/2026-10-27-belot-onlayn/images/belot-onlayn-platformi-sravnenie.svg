  <line x1="24" y1="472" x2="736" y2="472" stroke="#2a3d57" stroke-width="1"/>
  <text x="32" y="492" fill="#6f8db0" font-size="12">Числата са по публичните данни на самите платформи · 18+ Играйте отговорно</text>
