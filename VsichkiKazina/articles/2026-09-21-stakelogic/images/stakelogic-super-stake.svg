<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Как работи Super Stake на Stakelogic: включваш опционалния бутон на всяко завъртане, залогът се удвоява ×2 (или ×2.5 при Mega Super Stake), получаваш по-голям шанс да задействаш бонуса или безплатните завъртания, но домашното предимство не се мени и в дългосрочен план плащаш пропорционално повече за същия тип резултат.">
  <title>Super Stake: удвоен залог срещу по-голям шанс за бонус</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f7fb"/>
      <stop offset="100%" stop-color="#e8edf6"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="720" height="420" rx="14" ry="14" fill="url(#bg)"/>
  <text x="360" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#1e293b" text-anchor="middle">Super Stake: как работи бутонът</text>
  <text x="360" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">собствена механика на Stakelogic · опционален бет-буст</text>

  <!-- Step 1 -->
  <rect x="30" y="86" width="200" height="78" rx="10" fill="url(#step)"/>
  <text x="130" y="118" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Включваш бутона</text>
  <text x="130" y="142" font-family="system-ui, sans-serif" font-size="12" fill="#dbeafe" text-anchor="middle">на всяко завъртане</text>
  <text x="243" y="130" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#94a3b8" text-anchor="middle">›</text>

  <!-- Step 2 -->
  <rect x="260" y="86" width="200" height="78" rx="10" fill="url(#gold)"/>
  <text x="360" y="120" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">Залог ×2</text>
  <text x="360" y="144" font-family="system-ui, sans-serif" font-size="12" fill="#fef3c7" text-anchor="middle">Mega Super Stake ×2.5</text>
  <text x="473" y="130" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#94a3b8" text-anchor="middle">›</text>

  <!-- Step 3 -->
  <rect x="490" y="86" width="200" height="78" rx="10" fill="url(#step)"/>
  <text x="590" y="118" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">По-голям шанс</text>
  <text x="590" y="142" font-family="system-ui, sans-serif" font-size="12" fill="#dbeafe" text-anchor="middle">за бонуса / завъртанията</text>

  <!-- Caveat band -->
  <rect x="30" y="196" width="660" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="234" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#b91c1c">Но домашното предимство НЕ се мени.</text>
  <text x="60" y="264" font-family="system-ui, sans-serif" font-size="13" fill="#334155">Допълнителният залог е калкулиран в математиката на играта.</text>
  <text x="60" y="288" font-family="system-ui, sans-serif" font-size="13" fill="#334155">В дългосрочен план плащаш пропорционално повече за същия тип резултат.</text>
  <text x="60" y="320" font-family="system-ui, sans-serif" font-size="13" fill="#334155">Влизаш по-често в бонуса, но и изразходваш бюджета си по-бързо.</text>

  <text x="360" y="380" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Super Stake не е начин да биеш казиното. 18+ Играйте отговорно.</text>
</svg>
