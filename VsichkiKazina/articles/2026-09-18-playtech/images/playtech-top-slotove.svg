  <line x1="24" y1="312" x2="736" y2="312" stroke="#d1d5db" stroke-width="1"/>
  <text x="32" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">Макс. печалба = теоретичен таван, не обещание · при джакпот игрите реалната голяма печалба е мрежовият прогресив</text>
  <text x="32" y="351" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">Buffalo Blitz: макс. печалба е спорна (racingpost 300x; други бази до 10 000x) · провери реалния RTP в инфо-панела</text>
  <text x="32" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af">18+ Играйте отговорно · източник: racingpost.com</text>
</svg>
