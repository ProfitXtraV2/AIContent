<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="Абстрактна метафора за Playtech като голям доставчик: свързани панели за казино, живо казино, покер и бинго и стълбица от четири нива на прогресивен джакпот">
  <title>Playtech: свързани продуктови панели и стълбица от четири джакпот нива</title>
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f2036"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="ladder" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="760" height="320" rx="16" ry="16" fill="url(#bgg)"/>

  <!-- interconnected product panels (casino / live / poker / bingo) — abstract, no logos -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.55">
    <line x1="90" y1="150" x2="180" y2="110"/>
    <line x1="90" y1="150" x2="180" y2="205"/>
    <line x1="180" y1="110" x2="270" y2="150"/>
    <line x1="180" y1="205" x2="270" y2="150"/>
    <line x1="180" y1="110" x2="180" y2="205"/>
  </g>
  <g opacity="0.92">
    <rect x="58" y="126" width="64" height="48" rx="7" fill="url(#panel)"/>
    <rect x="148" y="86" width="64" height="48" rx="7" fill="url(#panel)"/>
    <rect x="148" y="181" width="64" height="48" rx="7" fill="url(#panel)"/>
    <rect x="238" y="126" width="64" height="48" rx="7" fill="url(#panel)"/>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#dbeafe" text-anchor="middle">
    <text x="90" y="154">казино</text>
    <text x="180" y="114">живо</text>
    <text x="180" y="209">покер</text>
    <text x="270" y="154">бинго</text>
  </g>

  <!-- jackpot-tier ladder: four ascending steps sharing a base -->
  <g>
    <rect x="470" y="222" width="52" height="26" rx="4" fill="url(#ladder)" opacity="0.7"/>
    <rect x="530" y="192" width="52" height="56" rx="4" fill="url(#ladder)" opacity="0.8"/>
    <rect x="590" y="156" width="52" height="92" rx="4" fill="url(#ladder)" opacity="0.9"/>
    <rect x="650" y="112" width="52" height="136" rx="4" fill="url(#ladder)"/>
    <line x1="470" y1="256" x2="702" y2="256" stroke="#334155" stroke-width="2"/>
  </g>
  <text x="586" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#94a3b8" text-anchor="middle">четири нива, общ фонд</text>

  <text x="58" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#f8fafc">Playtech</text>
  <text x="58" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">доставчик на казино, живо казино, покер и мрежи от джакпоти</text>

  <text x="702" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">18+ Играйте отговорно</text>
</svg>
