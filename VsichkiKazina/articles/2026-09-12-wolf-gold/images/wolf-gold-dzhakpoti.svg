<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-label="Трите фиксирани джакпота на Wolf Gold, примерни стойности при залог €1: Mini 30x = €30, Major 100x = €100, Mega 1000x = €1000; фиксирани суми, финансирани от оборота, не прогресивни">
  <title>Wolf Gold: трите фиксирани джакпота (30x / 100x / 1000x)</title>
  <defs>
    <linearGradient id="jbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="mini" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="major" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="mega" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="600" height="330" rx="12" ry="12" fill="url(#jbg)"/>

  <text x="300" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#374151" text-anchor="middle">Wolf Gold: трите фиксирани джакпота</text>
  <text x="300" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">примерни стойности при залог €1; кратни на залога, от оборота (визуализацията не е в мащаб)</text>

  <!-- Mega (top) -->
  <rect x="175" y="82" width="360" height="44" rx="8" fill="url(#mega)"/>
  <text x="50" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#92400e">Mega</text>
  <text x="523" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="end">1000x · €1000</text>

  <!-- Major (middle) -->
  <rect x="175" y="146" width="190" height="44" rx="8" fill="url(#major)"/>
  <text x="50" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Major</text>
  <text x="377" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="start">100x · €100</text>

  <!-- Mini (bottom) -->
  <rect x="175" y="210" width="90" height="44" rx="8" fill="url(#mini)"/>
  <text x="50" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#92400e">Mini</text>
  <text x="277" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#92400e" text-anchor="start">30x · €30</text>

  <line x1="50" y1="274" x2="550" y2="274" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="300" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Фиксирани джакпоти: не растат като прогресивните; стигат се вътре в Money Respin</text>
  <text x="300" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно</text>
</svg>
