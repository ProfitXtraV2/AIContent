<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Сравнение: какво получава играчът при лицензиран оператор с лиценз от НАП спрямо нелицензиран с лиценз от Кюрасао">
  <rect x="0" y="0" width="720" height="470" fill="#FAF8F3"/>

  <!-- Title -->
  <text x="360" y="40" text-anchor="middle" font-size="21" font-weight="bold" fill="#1F1A17">Лицензиран (НАП) срещу нелицензиран (Кюрасао)</text>
  <text x="360" y="63" text-anchor="middle" font-size="13" fill="#5B534C">Какво получава играчът при спор</text>

  <!-- Left column: Licensed (green) -->
  <rect x="24" y="82" width="330" height="300" rx="10" fill="#FFFFFF" stroke="#2E7D46" stroke-width="1.5"/>
  <rect x="24" y="82" width="330" height="42" rx="10" fill="#2E7D46"/>
  <rect x="24" y="104" width="330" height="20" fill="#2E7D46"/>
  <text x="189" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Лицензиран оператор (НАП)</text>

  <text x="48" y="158" font-size="14" fill="#2E7D46" font-weight="bold">✓</text>
  <text x="70" y="158" font-size="13.5" fill="#1F1A17">Защита по Закона за хазарта</text>

  <text x="48" y="200" font-size="14" fill="#2E7D46" font-weight="bold">✓</text>
  <text x="70" y="200" font-size="13.5" fill="#1F1A17">Жалба до НАП при спор</text>

  <text x="48" y="242" font-size="14" fill="#2E7D46" font-weight="bold">✓</text>
  <text x="70" y="242" font-size="13.5" fill="#1F1A17">НАП упражнява надзор</text>

  <text x="48" y="284" font-size="14" fill="#2E7D46" font-weight="bold">✓</text>
  <text x="70" y="284" font-size="13.5" fill="#1F1A17">Институция, пред която да</text>
  <text x="70" y="302" font-size="13.5" fill="#1F1A17">отнесете спора</text>

  <text x="48" y="344" font-size="14" fill="#2E7D46" font-weight="bold">✓</text>
  <text x="70" y="344" font-size="13.5" fill="#1F1A17">Вписан в регистъра на НАП</text>

  <!-- Right column: Unlicensed (red) -->
  <rect x="366" y="82" width="330" height="300" rx="10" fill="#FFFFFF" stroke="#B02A26" stroke-width="1.5"/>
  <rect x="366" y="82" width="330" height="42" rx="10" fill="#B02A26"/>
  <rect x="366" y="104" width="330" height="20" fill="#B02A26"/>
  <text x="531" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Нелицензиран (Кюрасао)</text>

  <text x="390" y="158" font-size="14" fill="#B02A26" font-weight="bold">✗</text>
  <text x="412" y="158" font-size="13.5" fill="#1F1A17">Не важи на българския пазар</text>

  <text x="390" y="200" font-size="14" fill="#B02A26" font-weight="bold">✗</text>
  <text x="412" y="200" font-size="13.5" fill="#1F1A17">НАП не приема жалби срещу него</text>

  <text x="390" y="242" font-size="14" fill="#B02A26" font-weight="bold">✗</text>
  <text x="412" y="242" font-size="13.5" fill="#1F1A17">НАП не упражнява надзор върху него</text>

  <text x="390" y="284" font-size="14" fill="#B02A26" font-weight="bold">✗</text>
  <text x="412" y="284" font-size="13.5" fill="#1F1A17">Няма български механизъм за жалба</text>

  <text x="390" y="344" font-size="14" fill="#B02A26" font-weight="bold">✗</text>
  <text x="412" y="344" font-size="13.5" fill="#1F1A17">Не фигурира в регистъра на НАП</text>

  <!-- Bonus comparison strip (verbatim numbers from 05b) -->
  <rect x="24" y="398" width="672" height="46" rx="8" fill="#FFFFFF" stroke="#D8D0C6" stroke-width="1"/>
  <text x="40" y="418" font-size="12.5" fill="#5B534C">Бонус при NV Casino:</text>
  <text x="40" y="437" font-size="13.5" font-weight="bold" fill="#1F1A17">€2 000 + 225 FS &#183; превъртане x40 върху бонуса &#183; x30 върху печалбите от FS</text>
  <text x="686" y="428" text-anchor="end" font-size="11.5" fill="#B02A26" font-weight="bold">без регулаторна защита</text>

  <!-- Footer note -->
  <text x="24" y="462" font-size="11" fill="#5B534C">18+ Хазартът може да пристрасти. Играйте отговорно.</text>
</svg>
