  <text x="48" y="192" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Mahjong Ways 2 (висока волатилност)</text>
  <text x="688" y="192" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="end">≈ 96,95%</text>

  <text x="48" y="220" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Mahjong Ways</text>
  <text x="688" y="220" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="end">≈ 96,92%</text>

  <text x="48" y="248" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Fortune Tiger (таван ≈ 2 500x)</text>
  <text x="688" y="248" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">≈ 96,81%</text>

  <text x="48" y="276" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Fortune Ox (таван ≈ 2 000x)</text>
  <text x="688" y="276" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">≈ 96,75%</text>

