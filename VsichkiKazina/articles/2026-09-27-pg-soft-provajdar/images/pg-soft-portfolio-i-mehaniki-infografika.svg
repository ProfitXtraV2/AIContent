  <text x="32" y="124" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Механики</text>
  <text x="688" y="124" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">Ways · каскади · множители</text>

  <text x="32" y="158" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">RTP по подразбиране (в дълъг период)</text>

