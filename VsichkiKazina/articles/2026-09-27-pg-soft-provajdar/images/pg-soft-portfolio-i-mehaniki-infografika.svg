<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 442" role="img" aria-label="Инфографика за PG Soft. Мобилен доставчик на слотове, основан през 2015 година във Валета, Малта. Механики: Ways, каскадни завъртания и растящ множител. RTP по подразбиране в дълъг период: Mahjong Ways 2 около 96,95 процента, Mahjong Ways около 96,92 процента, Fortune Tiger около 96,81 процента, Fortune Ox около 96,75 процента, Wild Bandito около 96,73 процента. Операторът може да пусне версия с около 1 или 2 процента по-нисък RTP. Максималният потенциал при Mahjong Ways 2 стига до 100 000 пъти залога, което е таван, не очаквана печалба. Стойностите са примерни и зависят от версията и играта.">
  <rect x="8" y="8" width="704" height="426" rx="18" fill="#0f172a"/>

  <text x="32" y="42" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">PG Soft: портфолио и механики</text>
  <text x="32" y="64" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Мобилен доставчик на слотове. RTP зависи от версията, не от рекламата.</text>

  <text x="32" y="98" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Основана</text>
