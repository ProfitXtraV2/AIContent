  <text x="32" y="332" font-family="Arial, sans-serif" font-size="12" fill="#fbbf24">Операторът може да пусне версия с около 1% или 2% по-нисък RTP.</text>

  <text x="32" y="366" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">Максимален потенциал</text>
