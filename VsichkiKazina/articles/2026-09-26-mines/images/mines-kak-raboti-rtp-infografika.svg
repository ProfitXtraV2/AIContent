<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-label="Инфографика за Mines на Spribe. Как работи един рунд: 1 избери брой мини, обикновено от 1 до 24; 2 мрежа 5 на 5 равна на 25 полета, отваряй поле по поле; 3 всяко безопасно поле качва множителя; 4 cash-out по всяко време, мина значи загуба на залога. Ключови числа в дълъг период: посочен от Spribe RTP около 97 процента, таван на печалбата около x10 000, домашно предимство около 3 процента. Повече мини означава по-висок риск и по-висок множител. Високоволатилна игра.">
  <rect x="8" y="8" width="704" height="434" rx="18" fill="#0f172a"/>

  <text x="32" y="42" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">Mines: как работи един рунд</text>
  <text x="32" y="64" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Ти нагласяш риска чрез броя мини и решаваш кога да спреш</text>

  <text x="32" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">Как работи един рунд</text>

  <line x1="48" y1="133" x2="48" y2="207" stroke="#334155" stroke-width="2"/>

  <circle cx="48" cy="122" r="11" fill="#334155"/>
  <text x="48" y="126" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">1</text>
  <text x="70" y="126" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Избери брой мини (обикновено 1 до 24)</text>

  <circle cx="48" cy="154" r="11" fill="#334155"/>
  <text x="48" y="158" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">2</text>
  <text x="70" y="158" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Мрежа 5x5 = 25 полета; отваряй поле по поле</text>

  <circle cx="48" cy="186" r="11" fill="#334155"/>
  <text x="48" y="190" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">3</text>
  <text x="70" y="190" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Всяко безопасно поле качва множителя</text>

  <circle cx="48" cy="218" r="11" fill="#334155"/>
  <text x="48" y="222" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">4</text>
  <text x="70" y="222" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Cash-out по всяко време · мина = загуба на залога</text>

  <text x="32" y="256" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">Ключови числа (в дълъг период)</text>

  <g stroke="#1e293b" stroke-width="1">
    <line x1="32" y1="284" x2="688" y2="284"/>
    <line x1="32" y1="312" x2="688" y2="312"/>
  </g>

  <text x="48" y="276" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">RTP (посочен от Spribe)</text>
  <text x="688" y="276" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">≈ 97%</text>

  <text x="48" y="304" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Таван на печалбата (според версията)</text>
  <text x="688" y="304" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">≈ x10 000</text>

  <text x="48" y="332" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Домашно предимство</text>
  <text x="688" y="332" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">≈ 3%</text>

  <rect x="32" y="352" width="656" height="56" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="48" y="377" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">Повече мини = по-висок риск и по-висок множител</text>
  <text x="48" y="397" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">Числата зависят от версията; RTP около 97% важи за версията на Spribe.</text>

  <text x="32" y="428" font-family="Arial, sans-serif" font-size="11" fill="#64748b">18+ Играйте отговорно</text>
  <text x="688" y="428" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="end">Високоволатилна игра · числата за множителите са примерни</text>
</svg>
