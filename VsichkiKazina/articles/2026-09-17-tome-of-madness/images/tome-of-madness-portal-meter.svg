<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Праговете на Portal Meter в Tome of Madness: 7 събрани символа дават 2 специални wild-а, 14 добавят ефекта Abyss който изтрива ред или колона, 27 добавят Void който маха един символ, 42 задействат безплатния рунд Other World">
  <title>Tome of Madness: праговете на Portal Meter (7, 14, 27, 42)</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3f0fa"/>
      <stop offset="100%" stop-color="#e4dcf3"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="12" ry="12" fill="url(#bg2)"/>
  <text x="300" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#5b21b6" text-anchor="middle">Праговете на Portal Meter</text>
  <text x="300" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4b5563" text-anchor="middle">Пълни се от печелившите каскади · нулира се при завъртане без печалба</text>

  <!-- Step 7 -->
  <rect x="40" y="250" width="120" height="70" rx="8" fill="url(#step)"/>
  <text x="100" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">7</text>
  <text x="100" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#ede9fe" text-anchor="middle">2 специални wild</text>

  <!-- Step 14 -->
  <rect x="180" y="210" width="120" height="110" rx="8" fill="url(#step)"/>
  <text x="240" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">14</text>
  <text x="240" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Abyss</text>
  <text x="240" y="284" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#ede9fe" text-anchor="middle">изтрива ред</text>
  <text x="240" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#ede9fe" text-anchor="middle">или колона</text>

  <!-- Step 27 -->
  <rect x="320" y="165" width="120" height="155" rx="8" fill="url(#step)"/>
  <text x="380" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">27</text>
  <text x="380" y="219" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Void</text>
  <text x="380" y="239" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#ede9fe" text-anchor="middle">маха всички</text>
  <text x="380" y="253" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#ede9fe" text-anchor="middle">от 1 символ</text>

  <!-- Step 42 -->
  <rect x="460" y="110" width="120" height="210" rx="8" fill="url(#step)"/>
  <text x="520" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">42</text>
  <text x="520" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fde68a" text-anchor="middle">Other World</text>
  <text x="520" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fde68a" text-anchor="middle">Free Round</text>
  <text x="520" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#ede9fe" text-anchor="middle">безплатен рунд</text>

  <line x1="35" y1="320" x2="585" y2="320" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="300" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Всеки праг добавя и по 2 специални wild · 18+ Играйте отговорно</text>
</svg>
