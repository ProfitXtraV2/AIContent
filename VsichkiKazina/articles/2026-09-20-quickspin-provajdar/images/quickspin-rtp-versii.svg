<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 366" width="620" height="366" role="img" aria-label="Илюстративно: при обявен RTP около 96% и €1000 оборот средно €960 се връщат на играча, €40 остават за казиното (домашно предимство ~4%); много заглавия на Quickspin имат по няколко RTP версии (Big Bad Wolf 90%/97%, Sakura Fortune 90%/96%), а версията избира операторът, затова се проверява в инфо-панела">
  <title>Илюстративно: RTP на Quickspin зависи от версията на оператора</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="playerBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="houseBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect width="620" height="366" rx="12" ry="12" fill="url(#bg)"/>

  <text x="310" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f766e" text-anchor="middle">Quickspin: RTP зависи от версията на оператора</text>
  <text x="310" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">илюстративен пример при обявен RTP ~96%; операторът избира коя версия да пусне</text>

  <text x="50" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155" font-weight="600">Връщане към играча (RTP)</text>
  <text x="570" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155" font-weight="600" text-anchor="end">Домашно предимство</text>

  <rect x="50" y="98" width="520" height="48" rx="8" fill="#e2e8f0"/>
  <!-- Player bar 499px (~96%) + house bar 21px (~4%) = 520px, flush -->
  <rect x="50" y="98" width="499" height="48" rx="8" fill="url(#playerBar)"/>
  <rect x="549" y="98" width="21" height="48" rx="4" fill="url(#houseBar)"/>

  <text x="299" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">~96%</text>

  <line x1="50" y1="172" x2="570" y2="172" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="310" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-style="italic">Пример: €1000 оборот</text>

  <rect x="50" y="211" width="240" height="74" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="170" y="237" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="600">Обратно към играча</text>
  <text x="170" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#0e7490" text-anchor="middle">~€960</text>
  <text x="170" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#0d9488" text-anchor="middle">(средно, дългосрочно)</text>

  <rect x="330" y="211" width="240" height="74" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="450" y="237" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="600">За казиното</text>
  <text x="450" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#dc2626" text-anchor="middle">~€40</text>
  <text x="450" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ef4444" text-anchor="middle">(домашно предимство ~4%)</text>

  <text x="310" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle">+</text>

  <text x="310" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">По няколко RTP версии на игра: Big Bad Wolf 90%/97% · Sakura Fortune 90%/96%</text>
  <text x="310" y="346" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">18+ Играйте отговорно · версията избира операторът, провери инфо-панела</text>
</svg>
