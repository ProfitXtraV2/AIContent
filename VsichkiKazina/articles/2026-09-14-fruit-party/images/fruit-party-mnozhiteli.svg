<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" width="600" height="310" role="img" aria-label="Множители във Fruit Party: в основната игра случаен x2 върху печеливши символи, в безплатните завъртания x2 или x4; в един клъстер се умножават помежду си до таван 256x">
  <title>Множители във Fruit Party: x2 и x2/x4 се умножават до таван 256x</title>
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf5"/>
      <stop offset="100%" stop-color="#fef6e7"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="600" height="310" rx="12" ry="12" fill="url(#bgm)"/>

  <text x="300" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#7c2d12" text-anchor="middle">Множители във Fruit Party</text>

  <rect x="40" y="62" width="250" height="88" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="165" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="600">Основна игра</text>
  <text x="165" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#b45309" text-anchor="middle">случаен x2</text>
  <text x="165" y="141" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#a16207" text-anchor="middle">върху печеливш символ</text>

  <rect x="310" y="62" width="250" height="88" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="435" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="600">Безплатни завъртания</text>
  <text x="435" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#b45309" text-anchor="middle">x2 или x4</text>
  <text x="435" y="141" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#a16207" text-anchor="middle">същата механика</text>

  <text x="300" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Няколко множителя в един клъстер се умножават помежду си</text>

  <rect x="170" y="198" width="260" height="66" rx="10" fill="url(#cap)"/>
  <text x="300" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#fffbeb" text-anchor="middle" font-weight="600">горна граница</text>
  <text x="300" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">таван 256x</text>

  <text x="300" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Множителите разтягат вариацията, не RTP-то · 18+ Играйте отговорно</text>
</svg>
