<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" role="img" aria-label="Как работят безплатните завъртания в Book of Dead: 3 или повече книги дават 10 безплатни завъртания; играта избира един символ, който се разширява на цял барабан и плаща без линия; още 3 книги в бонуса добавят 10 завъртания; максимум 5000 пъти залога">
  <title>Book of Dead — път до безплатните завъртания и разширяващия се символ</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
  </defs>

  <rect width="680" height="320" rx="12" ry="12" fill="url(#bg)"/>
  <text x="340" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle">Book of Dead: пътят до големия удар</text>

  <!-- Box 1 -->
  <rect x="30" y="80" width="180" height="110" rx="10" fill="#ffffff" stroke="#d1a054" stroke-width="1.5"/>
  <text x="120" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="#b45309" text-anchor="middle">3+</text>
  <text x="120" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">книги</text>
  <text x="120" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">книгата е wild и scatter</text>

  <!-- Arrow 1 -->
  <line x1="216" y1="135" x2="244" y2="135" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="244,130 254,135 244,140" fill="#9ca3af"/>

  <!-- Box 2 -->
  <rect x="260" y="80" width="180" height="110" rx="10" fill="#ffffff" stroke="#d1a054" stroke-width="1.5"/>
  <text x="350" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="#b45309" text-anchor="middle">10</text>
  <text x="350" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">безплатни завъртания</text>
  <text x="350" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">избира се 1 специален символ</text>

  <!-- Arrow 2 -->
  <line x1="446" y1="135" x2="474" y2="135" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="474,130 484,135 474,140" fill="#9ca3af"/>

  <!-- Box 3 -->
  <rect x="490" y="80" width="180" height="110" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="580" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#15803d" text-anchor="middle">символът</text>
  <text x="580" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">се разширява</text>
  <text x="580" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">покрива цял барабан, без линия</text>

  <text x="340" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4b5563" text-anchor="middle">Още 3 книги в бонуса добавят +10 завъртания · максимална печалба 5000x залога (рядко)</text>

  <line x1="60" y1="252" x2="620" y2="252" stroke="#d1d5db" stroke-width="1"/>
  <text x="340" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Висока волатилност · почти цялата печалба идва в безплатните завъртания</text>
  <text x="340" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · Провери реалния RTP в инфо-панела на конкретното казино</text>
</svg>
