<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="xBomb множителят във Fire in the Hole xBomb расте с +1 при всяка експлозия: първата експлозия дава x2, втората x3, а следващите продължават нагоре, докато траят срутванията">
  <title>Fire in the Hole xBomb: как расте xBomb множителят</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="stepReal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="stepEx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="640" height="340" rx="12" ry="12" fill="url(#bg2)"/>

  <text x="320" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#7c2d12" text-anchor="middle">xBomb: множителят расте с +1 на всяка експлозия</text>
  <text x="320" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Всяка експлозия на xBomb добавя +1, докато траят срутванията</text>

  <!-- ascending steps: baseline of each rung climbs left→right -->
  <!-- step 1: x2 (stated) -->
  <rect x="30" y="236" width="116" height="64" rx="10" fill="url(#stepReal)"/>
  <text x="88" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="800" fill="#ffffff" text-anchor="middle">x2</text>
  <text x="88" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#fff7ed" text-anchor="middle">1-ва експлозия</text>

  <!-- step 2: x3 (stated) -->
  <rect x="186" y="186" width="116" height="64" rx="10" fill="url(#stepReal)"/>
  <text x="244" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="800" fill="#ffffff" text-anchor="middle">x3</text>
  <text x="244" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#fff7ed" text-anchor="middle">2-ра експлозия</text>

  <!-- step 3: x4 (illustrative) -->
  <rect x="342" y="136" width="116" height="64" rx="10" fill="url(#stepEx)"/>
  <text x="400" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="800" fill="#ffffff" text-anchor="middle">x4</text>
  <text x="400" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#fffbeb" text-anchor="middle">3-та (примерно)</text>

  <!-- step 4: x5 (illustrative) -->
  <rect x="498" y="86" width="116" height="64" rx="10" fill="url(#stepEx)"/>
  <text x="556" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="800" fill="#ffffff" text-anchor="middle">x5</text>
  <text x="556" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#fffbeb" text-anchor="middle">4-та (примерно)</text>

  <!-- +1 connectors -->
  <text x="166" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">+1</text>
  <text x="322" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">+1</text>
  <text x="478" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">+1</text>

  <text x="320" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · x2 и x3 са по данни на играта; по-високите стъпки са примерни</text>
</svg>
