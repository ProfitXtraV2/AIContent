<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="Абстрактна метафора за Novomatic: отворена книга със златен разширяващ се символ до стилизирани барабани от казино зала, без лога и без числа">
  <title>Novomatic: класиката от залата, пренесена онлайн</title>
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1206"/>
      <stop offset="100%" stop-color="#3b1d0a"/>
    </linearGradient>
    <linearGradient id="reel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#8a5a1c"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4e6c8"/>
      <stop offset="100%" stop-color="#dcc290"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd977"/>
      <stop offset="100%" stop-color="#e0a92e"/>
    </linearGradient>
  </defs>

  <rect width="760" height="320" rx="16" ry="16" fill="url(#bgg)"/>

  <!-- stylised reel columns (abstract slot cabinet, no symbols/logos) -->
  <g opacity="0.92">
    <rect x="44" y="150" width="48" height="122" rx="8" fill="url(#reel)" opacity="0.55"/>
    <rect x="104" y="132" width="48" height="140" rx="8" fill="url(#reel)" opacity="0.72"/>
    <rect x="164" y="150" width="48" height="122" rx="8" fill="url(#reel)" opacity="0.55"/>
    <!-- expanding symbol filling the middle reel -->
    <rect x="112" y="140" width="32" height="30" rx="5" fill="#ffe9b0" opacity="0.9"/>
    <rect x="112" y="176" width="32" height="30" rx="5" fill="#ffe9b0" opacity="0.75"/>
    <rect x="112" y="212" width="32" height="30" rx="5" fill="#ffe9b0" opacity="0.6"/>
    <rect x="54" y="176" width="24" height="24" rx="5" fill="#f4e6c8" opacity="0.6"/>
    <rect x="174" y="176" width="24" height="24" rx="5" fill="#f4e6c8" opacity="0.6"/>
  </g>

  <!-- open book (the "book" mechanic), abstract -->
  <g>
    <polygon points="560,126 448,146 448,232 560,240" fill="url(#page)" stroke="#b7935a" stroke-width="1.5"/>
    <polygon points="560,126 672,146 672,232 560,240" fill="url(#page)" stroke="#b7935a" stroke-width="1.5"/>
    <line x1="560" y1="126" x2="560" y2="240" stroke="#a97e45" stroke-width="2.5"/>
    <!-- abstract page lines (no letters) -->
    <line x1="470" y1="166" x2="545" y2="158" stroke="#c9ab74" stroke-width="2"/>
    <line x1="470" y1="182" x2="545" y2="176" stroke="#c9ab74" stroke-width="2"/>
    <line x1="470" y1="198" x2="545" y2="193" stroke="#c9ab74" stroke-width="2"/>
    <line x1="575" y1="158" x2="650" y2="166" stroke="#c9ab74" stroke-width="2"/>
    <line x1="575" y1="176" x2="650" y2="182" stroke="#c9ab74" stroke-width="2"/>
    <line x1="575" y1="193" x2="650" y2="198" stroke="#c9ab74" stroke-width="2"/>
    <!-- golden expanding symbol rising off the book -->
    <polygon points="560,150 574,172 560,194 546,172" fill="url(#gold)" stroke="#a97e45" stroke-width="1"/>
    <polygon points="560,96 583,132 560,168 537,132" fill="url(#gold)" opacity="0.85" stroke="#a97e45" stroke-width="1"/>
  </g>

  <text x="272" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#fbe7c6">Novomatic</text>
  <text x="272" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e6cfa3">класиката от залата, пренесена онлайн</text>

  <text x="716" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9a978" text-anchor="end">18+ Играйте отговорно</text>
</svg>
