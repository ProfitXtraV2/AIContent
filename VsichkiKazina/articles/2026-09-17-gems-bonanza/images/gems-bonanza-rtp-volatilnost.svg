<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 372" width="700" height="372" role="img" aria-label="Gems Bonanza RTP 96.51% и домашно предимство 3.49%: при €1000 оборот средно €965 се връщат на играча, €35 остават за казиното; висока волатилност 5/5, максимална печалба 10 000 пъти залога">
  <title>Gems Bonanza: RTP 96.51% и домашно предимство 3.49%</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="playerBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="houseBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect width="700" height="372" rx="12" ry="12" fill="url(#bg)"/>

  <text x="350" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">Gems Bonanza: RTP и домашно предимство</text>
  <text x="350" y="53" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">обявен RTP по подразбиране (операторът може да пусне друга версия, виж инфо-панела)</text>

  <text x="50" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600">Връщане към играча (RTP)</text>
  <text x="650" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600" text-anchor="end">Домашно предимство</text>

  <rect x="50" y="96" width="600" height="48" rx="8" fill="#e5e7eb"/>
  <rect x="50" y="96" width="600" height="48" rx="8" fill="url(#playerBar)"/>
  <!-- House portion: 3.49% of 600px = 21px -->
  <rect x="629" y="96" width="21" height="48" rx="4" fill="url(#houseBar)"/>

  <text x="339" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">96.51%</text>
  <text x="639" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">3.49%</text>

  <line x1="50" y1="172" x2="650" y2="172" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="350" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Пример: €1000 оборот (примерни числа)</text>

  <rect x="50" y="211" width="270" height="74" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="185" y="237" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#166534" text-anchor="middle" font-weight="600">Обратно към играча</text>
  <text x="185" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#15803d" text-anchor="middle">~€965</text>
  <text x="185" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#22c55e" text-anchor="middle">(средно, дългосрочно)</text>

  <text x="350" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#9ca3af" text-anchor="middle">+</text>

  <rect x="380" y="211" width="270" height="74" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="515" y="237" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="600">За казиното</text>
  <text x="515" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#dc2626" text-anchor="middle">~€35</text>
  <text x="515" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ef4444" text-anchor="middle">(домашно предимство 3.49%)</text>

  <rect x="50" y="301" width="600" height="30" rx="8" fill="#eef2ff"/>
  <text x="350" y="321" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4338ca" text-anchor="middle">Волатилност: висока (5/5) · клъстер печалби 8×8 · макс. печалба 10 000 пъти залога</text>

  <text x="350" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">RTP е дългосрочна статистика, не прогноза за следващото завъртане · 18+ Играйте отговорно</text>
</svg>
