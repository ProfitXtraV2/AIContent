<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-label="Ключови факти за AvatarUX: студио от 2019 г., базирано в Малта, дружества Epic88, дистрибуция през Yggdrasil YG Masters и Relax Gaming; сигнатурна механика PopWins, при която печелившите символи се пукат и всеки се заменя с два нови, решетката расте и начините за печалба се умножават; топ заглавия PopRocks, CherryPop, TikiPop, HippoPop и BountyPop; висока волатилност; RTP на CherryPop, публикуван като 96.14% и 96.2% в различни бази, което показва, че активният RTP зависи от версията и казиното">
  <rect x="8" y="8" width="704" height="544" rx="18" fill="#0f172a"/>

  <text x="32" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">AvatarUX и PopWins: ключови факти</text>
  <text x="32" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Основано 2019 г. · Малта · дружества Epic88</text>

  <rect x="32" y="90" width="320" height="78" rx="12" fill="#111f38"/>
  <text x="52" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">Механика</text>
  <text x="52" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">PopWins</text>

  <rect x="368" y="90" width="320" height="78" rx="12" fill="#111f38"/>
  <text x="388" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">Волатилност</text>
  <text x="388" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">висока</text>

  <text x="32" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">Как работи PopWins</text>
  <text x="32" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e2e8f0">Печелившите символи се „пукат" и всеки се заменя с два нови;</text>
  <text x="32" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e2e8f0">решетката расте, а начините за печалба се умножават.</text>

  <text x="32" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">Дистрибуция</text>
  <text x="32" y="314" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e2e8f0">Yggdrasil (YG Masters) · Relax Gaming</text>

  <text x="32" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">Топ заглавия</text>
  <text x="32" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e2e8f0">PopRocks · CherryPop · TikiPop · HippoPop · BountyPop</text>

  <text x="32" y="418" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">RTP е число, което операторът настройва</text>
  <rect x="32" y="432" width="656" height="60" rx="12" fill="#111f38"/>
  <text x="52" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">CherryPop по различни бази</text>
  <text x="52" y="482" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#4ade80">96.14% <tspan fill="#94a3b8" font-size="14" font-weight="normal">и</tspan> 96.2%</text>

  <rect x="32" y="502" width="656" height="42" rx="8" fill="#111f38"/>
  <text x="52" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Публично обявени числа (студиото + независими бази); активният RTP се вижда</text>
  <text x="52" y="536" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">в инфо-панела на конкретното казино. 18+ Играйте отговорно.</text>
</svg>
