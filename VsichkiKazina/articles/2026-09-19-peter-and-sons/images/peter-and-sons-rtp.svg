<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" width="660" height="360" role="img" aria-label="Обявени RTP на топ заглавия на Peter & Sons: Barbarossa: Dragon Empire 96.57%, Voodoo Hex 96.3%, Xibalba 96.2%, Steamworks 96.17% и Dragon Blox GigaBlox 95.9%. Мащабът е между 95% и 97%.">
  <title>Peter &amp; Sons: обявени RTP на топ заглавия</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="660" height="360" rx="12" ry="12" fill="url(#bg)"/>

  <text x="330" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#5b21b6" text-anchor="middle">Peter &amp; Sons: обявени RTP на топ заглавия</text>
  <text x="330" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">мащаб 95%–97% · реалната стойност зависи от версията, която операторът пуска</text>

  <!-- axis baseline x=280 (=95%), per 1% = 175px, x=630 = 97% -->
  <line x1="280" y1="76" x2="280" y2="300" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Barbarossa: Dragon Empire = 96.57% -->
  <text x="18" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151" font-weight="600">Barbarossa: Dragon Empire</text>
  <rect x="280" y="90" width="275" height="22" rx="4" fill="url(#bar)"/>
  <text x="563" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">96.57%</text>

  <!-- Voodoo Hex = 96.3% -->
  <text x="18" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151" font-weight="600">Voodoo Hex</text>
  <rect x="280" y="134" width="228" height="22" rx="4" fill="url(#bar)"/>
  <text x="516" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">96.3%</text>

  <!-- Xibalba = 96.2% -->
  <text x="18" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151" font-weight="600">Xibalba</text>
  <rect x="280" y="178" width="210" height="22" rx="4" fill="url(#bar)"/>
  <text x="498" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">96.2%</text>

  <!-- Steamworks = 96.17% -->
  <text x="18" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151" font-weight="600">Steamworks</text>
  <rect x="280" y="222" width="205" height="22" rx="4" fill="url(#bar)"/>
  <text x="493" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">96.17%</text>

  <!-- Dragon Blox GigaBlox = 95.9% -->
  <text x="18" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151" font-weight="600">Dragon Blox GigaBlox</text>
  <rect x="280" y="266" width="158" height="22" rx="4" fill="url(#bar)"/>
  <text x="446" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">95.9%</text>

  <line x1="280" y1="300" x2="630" y2="300" stroke="#cbd5e1" stroke-width="1"/>
  <text x="280" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af">95%</text>
  <text x="630" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af" text-anchor="end">97%</text>

  <text x="330" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">RTP е дългосрочна статистика, не прогноза · 18+ Играйте отговорно</text>
</svg>
