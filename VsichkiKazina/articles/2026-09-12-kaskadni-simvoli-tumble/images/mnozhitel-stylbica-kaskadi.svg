<svg viewBox="0 0 640 372" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="640" height="372" fill="#F8F6F2" rx="12"/>

  <defs>
    <marker id="mx" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#999999"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="320" y="34" font-size="16" font-weight="700" fill="#1A1A2E" text-anchor="middle">Множителят расте с всяка каскада</text>
  <text x="320" y="53" font-size="10.5" fill="#999999" text-anchor="middle">пример Gonzo's Quest — поредните падания качват множителя</text>

  <!-- ===== Group 1: base game ===== -->
  <text x="28" y="84" font-size="12.5" font-weight="700" fill="#1A1A2E">Основна игра</text>

  <!-- chips row 1 (y 94..138) -->
  <!-- chip 1 -->
  <rect x="118" y="94" width="74" height="44" fill="#FFF8DC" stroke="#C7A020" stroke-width="1.5" rx="8"/>
  <text x="155" y="122" font-size="16" font-weight="700" fill="#C7A020" text-anchor="middle">1x</text>
  <line x1="196" y1="116" x2="224" y2="116" stroke="#999999" stroke-width="2" marker-end="url(#mx)"/>
  <!-- chip 2 -->
  <rect x="228" y="94" width="74" height="44" fill="#F5D060" rx="8"/>
  <text x="265" y="122" font-size="16" font-weight="700" fill="#1A1A2E" text-anchor="middle">2x</text>
  <line x1="306" y1="116" x2="334" y2="116" stroke="#999999" stroke-width="2" marker-end="url(#mx)"/>
  <!-- chip 3 -->
  <rect x="338" y="94" width="74" height="44" fill="#F5D060" rx="8"/>
  <text x="375" y="122" font-size="16" font-weight="700" fill="#1A1A2E" text-anchor="middle">3x</text>
  <line x1="416" y1="116" x2="444" y2="116" stroke="#999999" stroke-width="2" marker-end="url(#mx)"/>
  <!-- chip 4 -->
  <rect x="448" y="94" width="74" height="44" fill="#C7A020" rx="8"/>
  <text x="485" y="122" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">5x</text>

  <!-- ===== Group 2: free spins ===== -->
  <text x="28" y="182" font-size="12.5" font-weight="700" fill="#1A1A2E">Безплатни завъртания (Free Fall, 10 на брой)</text>

  <!-- chips row 2 (y 192..236) -->
  <rect x="118" y="192" width="74" height="44" fill="#FFF8DC" stroke="#C7A020" stroke-width="1.5" rx="8"/>
  <text x="155" y="220" font-size="16" font-weight="700" fill="#C7A020" text-anchor="middle">3x</text>
  <line x1="196" y1="214" x2="224" y2="214" stroke="#999999" stroke-width="2" marker-end="url(#mx)"/>
  <rect x="228" y="192" width="74" height="44" fill="#F5D060" rx="8"/>
  <text x="265" y="220" font-size="16" font-weight="700" fill="#1A1A2E" text-anchor="middle">6x</text>
  <line x1="306" y1="214" x2="334" y2="214" stroke="#999999" stroke-width="2" marker-end="url(#mx)"/>
  <rect x="338" y="192" width="74" height="44" fill="#F5D060" rx="8"/>
  <text x="375" y="220" font-size="16" font-weight="700" fill="#1A1A2E" text-anchor="middle">9x</text>
  <line x1="416" y1="214" x2="444" y2="214" stroke="#999999" stroke-width="2" marker-end="url(#mx)"/>
  <rect x="448" y="192" width="74" height="44" fill="#C7A020" rx="8"/>
  <text x="485" y="220" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">15x</text>

  <!-- note box -->
  <rect x="28" y="260" width="584" height="56" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" rx="8"/>
  <text x="320" y="283" font-size="11" fill="#555555" text-anchor="middle">Множителят се нулира в началото на всяко ново платено завъртане.</text>
  <text x="320" y="301" font-size="11" fill="#555555" text-anchor="middle">Големите стойности идват в бонус режима, не в обикновеното въртене.</text>

  <!-- Footer -->
  <text x="320" y="358" font-size="9.5" fill="#BBBBBB" text-anchor="middle">18+ Играйте отговорно · vsichkikazina.bg</text>
</svg>
