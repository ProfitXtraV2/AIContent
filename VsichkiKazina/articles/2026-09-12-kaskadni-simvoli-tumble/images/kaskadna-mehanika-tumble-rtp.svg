<svg viewBox="0 0 640 384" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="640" height="384" fill="#F8F6F2" rx="12"/>

  <!-- Title -->
  <text x="320" y="34" font-size="16" font-weight="700" fill="#1A1A2E" text-anchor="middle">Как работи каскадата (tumble)</text>
  <text x="320" y="53" font-size="10.5" fill="#999999" text-anchor="middle">едно платено завъртане, няколко печалби (последователността е примерна)</text>

  <!-- Vertical connector line through the step circles -->
  <line x1="48" y1="92" x2="48" y2="236" stroke="#C7A020" stroke-width="2"/>

  <!-- Step 1 -->
  <circle cx="48" cy="92" r="14" fill="#1A1A2E"/>
  <text x="48" y="97" font-size="13" font-weight="700" fill="#F5D060" text-anchor="middle">1</text>
  <text x="76" y="89" font-size="12.5" font-weight="600" fill="#1A1A2E">Печалба се формира от достатъчно еднакви символа</text>
  <text x="76" y="105" font-size="10.5" fill="#777777">по линия, навсякъде (pay-anywhere) или в клъстер</text>

  <!-- Step 2 -->
  <circle cx="48" cy="140" r="14" fill="#1A1A2E"/>
  <text x="48" y="145" font-size="13" font-weight="700" fill="#F5D060" text-anchor="middle">2</text>
  <text x="76" y="137" font-size="12.5" font-weight="600" fill="#1A1A2E">Печелившите символи изчезват от екрана</text>
  <text x="76" y="153" font-size="10.5" fill="#777777">на тяхно място остават празни позиции</text>

  <!-- Step 3 -->
  <circle cx="48" cy="188" r="14" fill="#1A1A2E"/>
  <text x="48" y="193" font-size="13" font-weight="700" fill="#F5D060" text-anchor="middle">3</text>
  <text x="76" y="185" font-size="12.5" font-weight="600" fill="#1A1A2E">Нови символи падат отгоре в празните места</text>
  <text x="76" y="201" font-size="10.5" fill="#777777">без ново плащане, в същото завъртане</text>

  <!-- Step 4 -->
  <circle cx="48" cy="236" r="14" fill="#C7A020"/>
  <text x="48" y="241" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="76" y="233" font-size="12.5" font-weight="600" fill="#1A1A2E">Нова печалба? Веригата плаща пак и се повтаря</text>
  <text x="76" y="249" font-size="10.5" fill="#777777">спира, щом падне подредба без печеливша комбинация</text>

  <!-- Divider -->
  <line x1="28" y1="272" x2="612" y2="272" stroke="#DDDDDD" stroke-width="1"/>

  <!-- RTP note box -->
  <rect x="28" y="288" width="584" height="60" fill="#EEF2FF" stroke="#2952C7" stroke-width="1.5" rx="8"/>
  <text x="320" y="312" font-size="12.5" font-weight="700" fill="#2952C7" text-anchor="middle">Каскадата не добавя пари извън RTP-то</text>
  <text x="320" y="332" font-size="11" fill="#333333" text-anchor="middle">Обявеният RTP не се променя от механиката: слот с 96% връща тези 96%</text>
  <text x="320" y="346" font-size="11" fill="#333333" text-anchor="middle">в дългосрочен план със или без каскади, само на по-накъсани серии.</text>

  <!-- Footer -->
  <text x="320" y="374" font-size="9.5" fill="#BBBBBB" text-anchor="middle">18+ Играйте отговорно · vsichkikazina.bg</text>
</svg>
