<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 448" width="720" height="448" role="img" aria-label="Как работи Hold and Win на Playson: 6 или повече символа Sun или Power задействат бонуса; получаваш 3 повторни завъртания, които се нулират на всеки нов символ, докато напълниш всичките 15 позиции на екрана; наградите са четири фиксирани джакпота: Grand (най-силният изход, рядък), Major, Minor и Mini (пада най-често, малък).">
  <title>Hold and Win: път до наградата и четирите джакпота</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f7fb"/>
      <stop offset="100%" stop-color="#e8edf6"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="720" height="448" rx="14" ry="14" fill="url(#bg)"/>
  <text x="360" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#1e293b" text-anchor="middle">Hold and Win: как се стига до наградата</text>
  <text x="360" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">механика на Playson · заключваш символи, докато напълниш екрана</text>

  <!-- Step 1 -->
  <rect x="40" y="80" width="190" height="70" rx="10" fill="url(#step)"/>
  <text x="135" y="112" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">6+</text>
  <text x="135" y="136" font-family="system-ui, sans-serif" font-size="13" fill="#dbeafe" text-anchor="middle">символа Sun / Power</text>
  <!-- arrow -->
  <text x="248" y="124" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#94a3b8" text-anchor="middle">›</text>

  <!-- Step 2 -->
  <rect x="265" y="80" width="190" height="70" rx="10" fill="url(#step)"/>
  <text x="360" y="112" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  <text x="360" y="136" font-family="system-ui, sans-serif" font-size="13" fill="#dbeafe" text-anchor="middle">повторни завъртания</text>
  <!-- arrow -->
  <text x="473" y="124" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#94a3b8" text-anchor="middle">›</text>

  <!-- Step 3 -->
  <rect x="490" y="80" width="190" height="70" rx="10" fill="url(#step)"/>
  <text x="585" y="112" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">15</text>
  <text x="585" y="136" font-family="system-ui, sans-serif" font-size="13" fill="#dbeafe" text-anchor="middle">позиции на екрана</text>

  <text x="360" y="182" font-family="system-ui, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Броячът се нулира на всеки нов символ, докато напълниш всичките 15 позиции.</text>
  <text x="360" y="202" font-family="system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Наградите са четири фиксирани джакпота:</text>

  <!-- Jackpot: Grand (top) -->
  <rect x="60" y="216" width="600" height="44" rx="9" fill="url(#gold)"/>
  <text x="78" y="244" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Grand</text>
  <text x="642" y="244" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff7ed" text-anchor="end">най-силният изход · рядък</text>

  <!-- Jackpot: Major -->
  <rect x="60" y="268" width="600" height="44" rx="9" fill="url(#step)" opacity="0.92"/>
  <text x="78" y="296" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Major</text>
  <text x="642" y="296" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#dbeafe" text-anchor="end">голям · по-рядък</text>

  <!-- Jackpot: Minor -->
  <rect x="60" y="320" width="600" height="44" rx="9" fill="url(#step)" opacity="0.82"/>
  <text x="78" y="348" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Minor</text>
  <text x="642" y="348" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#dbeafe" text-anchor="end">среден · по-чест</text>

  <!-- Jackpot: Mini -->
  <rect x="60" y="372" width="600" height="44" rx="9" fill="url(#step)" opacity="0.72"/>
  <text x="78" y="400" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Mini</text>
  <text x="642" y="400" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#dbeafe" text-anchor="end">малък · пада най-често</text>

  <text x="360" y="434" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Джакпотите не менят RTP на базовата игра. 18+ Играйте отговорно.</text>
</svg>
