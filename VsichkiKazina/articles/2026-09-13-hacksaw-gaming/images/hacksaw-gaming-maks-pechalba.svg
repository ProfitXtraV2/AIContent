<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" role="img" aria-label="Максимална печалба при четири слота на Hacksaw Gaming: Wanted Dead or a Wild 12,500 пъти залога, RIP City 12,500 пъти залога, Chaos Crew 10,000 пъти залога, Le Bandit 10,000 пъти залога">
  <title>Hacksaw Gaming: максимална печалба по заглавие (в пъти залога)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="698" height="358" rx="12" ry="12" fill="url(#bg)" stroke="#e5e7eb" stroke-width="1"/>

  <text x="24" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a">Hacksaw Gaming: максимална печалба по заглавие</text>
  <text x="24" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6b7280">в пъти залога · таван, а не очакване</text>

  <!-- Row 1: Wanted Dead or a Wild — 12,500 -->
  <text x="24" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#374151">Wanted Dead or a Wild</text>
  <rect x="250" y="82" width="360" height="30" rx="6" fill="url(#bar)"/>
  <text x="600" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="end">12,500</text>

  <!-- Row 2: RIP City — 12,500 -->
  <text x="24" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#374151">RIP City</text>
  <rect x="250" y="136" width="360" height="30" rx="6" fill="url(#bar)"/>
  <text x="600" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="end">12,500</text>

  <!-- Row 3: Chaos Crew — 10,000 (288px = 360*10000/12500) -->
  <text x="24" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#374151">Chaos Crew</text>
  <rect x="250" y="190" width="288" height="30" rx="6" fill="url(#bar)"/>
  <text x="528" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="end">10,000</text>

  <!-- Row 4: Le Bandit — 10,000 -->
  <text x="24" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#374151">Le Bandit</text>
  <rect x="250" y="244" width="288" height="30" rx="6" fill="url(#bar)"/>
  <text x="528" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="end">10,000</text>

  <line x1="24" y1="296" x2="676" y2="296" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="24" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">Максималната печалба е таван, а не очакване, и не зависи от RTP версията, която операторът е пуснал.</text>
  <text x="24" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af">18+ Играйте отговорно · високата волатилност значи дълги серии без печалба</text>
</svg>
