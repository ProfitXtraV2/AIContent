<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Схема: при RTP 96% дългосрочно 96 от всеки 100 заложени се връщат на играчите, а 4% са домашното предимство">
  <rect x="0" y="0" width="720" height="300" fill="#ffffff"/>
  <rect x="8" y="8" width="704" height="284" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <text x="360" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Какво е RTP: дългосрочно разпределение на заложеното</text>
  <text x="360" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">Пример при RTP 96% (илюстративно)</text>

  <!-- 4% callout above the thin amber segment -->
  <text x="662" y="86" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#92600c">4% домашно предимство</text>
  <line x1="657" y1="92" x2="657" y2="104" stroke="#92600c" stroke-width="1.5"/>

  <!-- bar -->
  <rect x="50" y="104" width="595" height="52" fill="#1a7f5a"/>
  <rect x="645" y="104" width="25" height="52" fill="#b7791f"/>
  <text x="347" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff">96% обратно към играчите (дългосрочно)</text>

  <text x="360" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#334155">RTP е дългосрочна статистика върху милиони завъртания, не обещание за една вечер.</text>
  <text x="360" y="224" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#475569">Останалите 4% са домашното предимство на казиното.</text>
  <text x="360" y="266" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">18+ Играйте отговорно.</text>
</svg>
