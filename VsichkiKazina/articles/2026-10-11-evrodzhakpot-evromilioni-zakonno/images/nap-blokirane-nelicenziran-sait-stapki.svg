<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="'Segoe UI',Roboto,Arial,sans-serif" role="img" aria-label="Как НАП блокира сайт за хазарт без лиценз: решение на изпълнителния директор, тридневен срок след публикуване на nra.bg, сезиране на Софийския районен съд, блокиране от българските доставчици на домейна и поддомейните, обявяване в секция Онлайн хазарт.">
  <rect x="0" y="0" width="760" height="400" rx="16" fill="#0f172a"/>
  <rect x="16" y="16" width="728" height="368" rx="12" fill="#ffffff"/>

  <text x="40" y="52" font-size="21" font-weight="700" fill="#0f172a">Как НАП спира сайт за хазарт без лиценз</text>
  <text x="40" y="74" font-size="13" fill="#64748b">Публичен списък на страниците без валиден лиценз по Закона за хазарта.</text>

  <!-- Step 1 -->
  <rect x="40" y="92" width="200" height="92" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <circle cx="64" cy="116" r="12" fill="#4338ca"/>
  <text x="64" y="120" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="84" y="120" font-size="13" font-weight="700" fill="#3730a3">Решение</text>
  <text x="56" y="144" font-size="12" fill="#1e293b">Изпълнителният директор</text>
  <text x="56" y="161" font-size="12" fill="#1e293b">на НАП издава решение</text>
  <text x="56" y="178" font-size="12" fill="#1e293b">за конкретния сайт.</text>

  <text x="258" y="142" font-size="20" fill="#94a3b8" text-anchor="middle">→</text>

  <!-- Step 2 -->
  <rect x="280" y="92" width="200" height="92" rx="10" fill="#fef9c3" stroke="#fde68a" stroke-width="1"/>
  <circle cx="304" cy="116" r="12" fill="#ca8a04"/>
  <text x="304" y="120" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="324" y="120" font-size="13" font-weight="700" fill="#854d0e">Срок 3 дни</text>
  <text x="296" y="144" font-size="12" fill="#1e293b">След публикуване на</text>
  <text x="296" y="161" font-size="12" fill="#1e293b">решението на nra.bg</text>
  <text x="296" y="178" font-size="12" fill="#1e293b">сайтът има 3 дни да спре.</text>

  <text x="498" y="142" font-size="20" fill="#94a3b8" text-anchor="middle">→</text>

  <!-- Step 3 -->
  <rect x="520" y="92" width="200" height="92" rx="10" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1"/>
  <circle cx="544" cy="116" r="12" fill="#be123c"/>
  <text x="544" y="120" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="564" y="120" font-size="13" font-weight="700" fill="#9f1239">Съд</text>
  <text x="536" y="144" font-size="12" fill="#1e293b">Остане ли достъпен,</text>
  <text x="536" y="161" font-size="12" fill="#1e293b">НАП сезира Софийския</text>
  <text x="536" y="178" font-size="12" fill="#1e293b">районен съд.</text>

  <!-- down arrow from step 3 to step 4 -->
  <text x="620" y="212" font-size="20" fill="#94a3b8" text-anchor="middle">↓</text>

  <!-- Step 4 (wide) -->
  <rect x="280" y="224" width="440" height="80" rx="10" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1"/>
  <circle cx="304" cy="250" r="12" fill="#15803d"/>
  <text x="304" y="254" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="324" y="250" font-size="13" font-weight="700" fill="#166534">Блокиране от доставчиците</text>
  <text x="296" y="274" font-size="12" fill="#1e293b">Българските доставчици спират достъпа до</text>
  <text x="296" y="291" font-size="12" fill="#1e293b">домейна и поддомейните му.</text>

  <!-- Обявяване note (left of step 4) -->
  <rect x="40" y="224" width="220" height="80" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="250" font-size="12" font-weight="700" fill="#334155">Обявяване</text>
  <text x="56" y="274" font-size="12" fill="#475569">Решенията се обявяват</text>
  <text x="56" y="291" font-size="12" fill="#475569">в „Онлайн хазарт“ на nra.bg.</text>

  <text x="40" y="336" font-size="11.5" fill="#94a3b8">Оператор, който утре може да изчезне зад блокировка, е тънка основа да държи парите ви. 18+</text>
  <text x="40" y="356" font-size="11" fill="#cbd5e1">Точният член от Закона за хазарта за процедурата подлежи на проверка.</text>
</svg>
