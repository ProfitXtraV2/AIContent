<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Обявени RTP на популярни заглавия на Belatra: Beauty and the Beast 97.11%, Chief's Sticky Fruits 96.56%, Mummyland Treasures 96.36%, Voodoo Coins 96.31%, Make It Gold 96.13%, Big Wild Buffalo 2 96.07%, спрямо ориентир около 96% за модерните слотове">
  <title>Обявени RTP на популярни заглавия на Belatra спрямо ~96%</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" rx="12" ry="12" fill="url(#bg)"/>

  <text x="320" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">Обявен RTP на популярни заглавия на Belatra</text>
  <text x="320" y="53" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">флагманите седят около или над средното за модерните слотове (~96%)</text>

  <!-- 96% reference line: track 180..560 maps RTP 95.50..97.50; 96.00 at x = 180 + (96.00-95.50)/2.0*380 = 275 -->
  <line x1="275" y1="82" x2="275" y2="310" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="275" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4b5563" text-anchor="middle">~96%</text>

  <!-- Row 1: Beauty and the Beast 97.11% -> w = (97.11-95.50)/2.0*380 = 306 -->
  <text x="172" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151" font-weight="600" text-anchor="end">Beauty and the Beast</text>
  <rect x="180" y="80" width="380" height="24" rx="5" fill="#e5e7eb"/>
  <rect x="180" y="80" width="306" height="24" rx="5" fill="url(#bar)"/>
  <text x="572" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#15803d" text-anchor="start">97.11%</text>

  <!-- Row 2: Chief's Sticky Fruits 96.56% -> w = (96.56-95.50)/2.0*380 = 201 -->
  <text x="172" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151" font-weight="600" text-anchor="end">Chief's Sticky Fruits</text>
  <rect x="180" y="120" width="380" height="24" rx="5" fill="#e5e7eb"/>
  <rect x="180" y="120" width="201" height="24" rx="5" fill="url(#bar)"/>
  <text x="572" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#15803d" text-anchor="start">96.56%</text>

  <!-- Row 3: Mummyland Treasures 96.36% -> w = (96.36-95.50)/2.0*380 = 163 -->
  <text x="172" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151" font-weight="600" text-anchor="end">Mummyland Treasures</text>
  <rect x="180" y="160" width="380" height="24" rx="5" fill="#e5e7eb"/>
  <rect x="180" y="160" width="163" height="24" rx="5" fill="url(#bar)"/>
  <text x="572" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#15803d" text-anchor="start">96.36%</text>

  <!-- Row 4: Voodoo Coins 96.31% -> w = (96.31-95.50)/2.0*380 = 154 -->
  <text x="172" y="216" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151" font-weight="600" text-anchor="end">Voodoo Coins</text>
  <rect x="180" y="200" width="380" height="24" rx="5" fill="#e5e7eb"/>
  <rect x="180" y="200" width="154" height="24" rx="5" fill="url(#bar)"/>
  <text x="572" y="216" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#15803d" text-anchor="start">96.31%</text>

  <!-- Row 5: Make It Gold 96.13% -> w = (96.13-95.50)/2.0*380 = 120 -->
  <text x="172" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151" font-weight="600" text-anchor="end">Make It Gold</text>
  <rect x="180" y="240" width="380" height="24" rx="5" fill="#e5e7eb"/>
  <rect x="180" y="240" width="120" height="24" rx="5" fill="url(#bar)"/>
  <text x="572" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#15803d" text-anchor="start">96.13%</text>

  <!-- Row 6: Big Wild Buffalo 2 96.07% -> w = (96.07-95.50)/2.0*380 = 108 -->
  <text x="172" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151" font-weight="600" text-anchor="end">Big Wild Buffalo 2</text>
  <rect x="180" y="280" width="380" height="24" rx="5" fill="#e5e7eb"/>
  <rect x="180" y="280" width="108" height="24" rx="5" fill="url(#bar)"/>
  <text x="572" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#15803d" text-anchor="start">96.07%</text>

  <line x1="40" y1="325" x2="600" y2="325" stroke="#d1d5db" stroke-width="1"/>
  <text x="320" y="347" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Скала 95.50%–97.50%</text>
  <text x="320" y="369" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">За целия каталог RTP варира от ~86% до 97% · операторът избира коя версия да пусне</text>
  <text x="320" y="391" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · Провери реалния RTP в инфо-панела на конкретното казино</text>
</svg>
