<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Таван 5 000x при три размера залог</title>
  <desc id="d">Gates of Olympus с таван 5 000x плаща най-много €1 000 при залог €0.20, €5 000 при €1 и €500 000 при €100.</desc>
  <rect x="0" y="0" width="760" height="420" rx="16" fill="#F4F6FA"/>
  <text x="380" y="52" text-anchor="middle" font-size="24" font-weight="700" fill="#14213D">Един таван, три размера залог</text>
  <text x="380" y="82" text-anchor="middle" font-size="16" fill="#44506B">Gates of Olympus · таван 5 000x · по публикувани данни</text>

  <g font-size="20">
    <rect x="32" y="112" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#C5CCDC"/>
    <text x="117" y="152" text-anchor="middle" fill="#14213D">Залог €0.20</text>
    <text x="266" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#44506B">× 5 000x</text>
    <rect x="330" y="112" width="398" height="64" rx="10" fill="#E3ECFA" stroke="#9DB4DE"/>
    <text x="529" y="155" text-anchor="middle" font-size="30" font-weight="700" fill="#14213D">€1 000</text>

    <rect x="32" y="192" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#C5CCDC"/>
    <text x="117" y="232" text-anchor="middle" fill="#14213D">Залог €1</text>
    <text x="266" y="232" text-anchor="middle" font-size="20" font-weight="700" fill="#44506B">× 5 000x</text>
    <rect x="330" y="192" width="398" height="64" rx="10" fill="#E3ECFA" stroke="#9DB4DE"/>
    <text x="529" y="235" text-anchor="middle" font-size="30" font-weight="700" fill="#14213D">€5 000</text>

    <rect x="32" y="272" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#C5CCDC"/>
    <text x="117" y="312" text-anchor="middle" fill="#14213D">Залог €100</text>
    <text x="266" y="312" text-anchor="middle" font-size="20" font-weight="700" fill="#44506B">× 5 000x</text>
    <rect x="330" y="272" width="398" height="64" rx="10" fill="#E3ECFA" stroke="#9DB4DE"/>
    <text x="529" y="315" text-anchor="middle" font-size="30" font-weight="700" fill="#14213D">€500 000</text>
  </g>

  <text x="380" y="368" text-anchor="middle" font-size="16" fill="#44506B">Максимум за един рунд; средно 1 на 718 391 завъртания</text>
  <text x="380" y="396" text-anchor="middle" font-size="14" fill="#44506B">Размерите на залога са примерни. 18+ Играйте отговорно.</text>
</svg>
