<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Абстрактна илюстрация на мрежа от клетки с четири цветни птици-колектори (червена, синя, зелена, лилава), които събират кехлибарени символи, вдъхновена от механиката на Pirots 2 на ELK Studios">
  <title>Pirots 2: мрежа с птици-колектори</title>
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="760" height="300" rx="14" ry="14" fill="url(#heroBg)"/>
  <rect width="760" height="300" rx="14" ry="14" fill="url(#glow)"/>

  <!-- Grid of cells (6 columns x 4 rows), amber symbols scattered -->
  <g>
    <!-- row generator done by hand for clean spacing; cell 64x50, gap 8, origin x=232 y=60 -->
    <!-- Base grid cells -->
    <g fill="#1e293b" stroke="#334155" stroke-width="1.5">
      <rect x="232" y="60" width="64" height="50" rx="8"/>
      <rect x="304" y="60" width="64" height="50" rx="8"/>
      <rect x="376" y="60" width="64" height="50" rx="8"/>
      <rect x="448" y="60" width="64" height="50" rx="8"/>
      <rect x="520" y="60" width="64" height="50" rx="8"/>
      <rect x="232" y="118" width="64" height="50" rx="8"/>
      <rect x="304" y="118" width="64" height="50" rx="8"/>
      <rect x="376" y="118" width="64" height="50" rx="8"/>
      <rect x="448" y="118" width="64" height="50" rx="8"/>
      <rect x="520" y="118" width="64" height="50" rx="8"/>
      <rect x="232" y="176" width="64" height="50" rx="8"/>
      <rect x="304" y="176" width="64" height="50" rx="8"/>
      <rect x="376" y="176" width="64" height="50" rx="8"/>
      <rect x="448" y="176" width="64" height="50" rx="8"/>
      <rect x="520" y="176" width="64" height="50" rx="8"/>
    </g>

    <!-- Amber collectible symbols -->
    <g fill="#f59e0b">
      <circle cx="264" cy="85" r="10"/>
      <circle cx="408" cy="85" r="10"/>
      <circle cx="552" cy="143" r="10"/>
      <circle cx="336" cy="201" r="10"/>
      <circle cx="480" cy="201" r="10"/>
    </g>
    <g fill="#fbbf24" opacity="0.55">
      <circle cx="336" cy="85" r="7"/>
      <circle cx="480" cy="143" r="7"/>
      <circle cx="264" cy="201" r="7"/>
      <circle cx="552" cy="85" r="7"/>
    </g>

    <!-- Four collector birds as coloured orbs with a small beak wedge -->
    <!-- red -->
    <circle cx="336" cy="143" r="18" fill="#ef4444"/>
    <circle cx="341" cy="138" r="4" fill="#fca5a5"/>
    <!-- blue -->
    <circle cx="408" cy="201" r="18" fill="#3b82f6"/>
    <circle cx="413" cy="196" r="4" fill="#93c5fd"/>
    <!-- green -->
    <circle cx="480" cy="85" r="18" fill="#22c55e"/>
    <circle cx="485" cy="80" r="4" fill="#86efac"/>
    <!-- purple -->
    <circle cx="552" cy="201" r="18" fill="#a855f7"/>
    <circle cx="557" cy="196" r="4" fill="#d8b4fe"/>
  </g>

  <!-- Expansion motif: dashed frame growing beyond the base grid -->
  <rect x="216" y="44" width="384" height="198" rx="10" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.7"/>
  <rect x="200" y="30" width="416" height="226" rx="12" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,8" opacity="0.45"/>

  <!-- Left label mark (brand-neutral, no operator) -->
  <text x="40" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="#e2e8f0">Pirots 2</text>
  <text x="40" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">птици-колектори</text>
  <text x="40" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">върху растяща мрежа</text>
  <text x="40" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">ELK Studios · 18+ Играйте отговорно</text>
</svg>
