<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-label="Инфографика за Side Bet City на Evolution. Залагаш преди раздаването на 3, 5 или 7 карти, плюс залог All Lose, който плаща 0,70 към 1, когато и трите ръце са без плащаща комбинация. RTP по вид залог: 3 карти около 96,69 процента, най-високо; All Lose около 96,29 процента; 5 карти около 95,21 процента; 7 карти около 94,34 процента, най-ниско. Водещи изплащания: роял флош 100 към 1 при 3 карти, 1000 към 1 при 5 карти, което е най-голямото в играта, и 500 към 1 при 7 карти. Колкото повече карти трябва да се подредят за залога, толкова по-лоша е сделката. Числата са примерни и зависят от версията и масата.">
  <rect x="8" y="8" width="704" height="504" rx="18" fill="#0f172a"/>

  <text x="32" y="42" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">Side Bet City: изплащания и RTP</text>
  <text x="32" y="64" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Залагаш преди раздаването на 3, 5 или 7 карти (плюс залог All Lose 0,70:1).</text>

  <text x="32" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">RTP по вид залог</text>

  <g stroke="#1e293b" stroke-width="1">
    <line x1="32" y1="110" x2="688" y2="110"/>
    <line x1="32" y1="140" x2="688" y2="140"/>
    <line x1="32" y1="170" x2="688" y2="170"/>
    <line x1="32" y1="200" x2="688" y2="200"/>
  </g>
  <text x="48" y="129" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">3 карти (най-високо)</text>
  <text x="688" y="129" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="end">≈ 96,69%</text>
  <text x="48" y="159" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">All Lose</text>
  <text x="688" y="159" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">≈ 96,29%</text>
  <text x="48" y="189" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">5 карти</text>
  <text x="688" y="189" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">≈ 95,21%</text>
  <text x="48" y="219" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">7 карти (най-ниско)</text>
  <text x="688" y="219" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="end">≈ 94,34%</text>

  <text x="32" y="256" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">Водещо изплащане (роял флош)</text>
  <g stroke="#1e293b" stroke-width="1">
    <line x1="32" y1="268" x2="688" y2="268"/>
    <line x1="32" y1="298" x2="688" y2="298"/>
    <line x1="32" y1="328" x2="688" y2="328"/>
  </g>
  <text x="48" y="287" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">5 карти (най-голямото в играта)</text>
  <text x="688" y="287" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="end">1000:1</text>
  <text x="48" y="317" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">7 карти</text>
  <text x="688" y="317" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">500:1</text>
  <text x="48" y="347" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">3 карти</text>
  <text x="688" y="347" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">100:1</text>

  <rect x="32" y="366" width="656" height="70" rx="8" fill="#111f38"/>
  <text x="48" y="390" font-family="Arial, sans-serif" font-size="12.5" fill="#cbd5e1">Колкото повече карти трябва да се подредят за залога, толкова по-лоша е сделката:</text>
  <text x="48" y="410" font-family="Arial, sans-serif" font-size="12.5" fill="#fbbf24">залогът на 7 карти има най-едрите множители, но връща най-малко.</text>
  <text x="48" y="428" font-family="Arial, sans-serif" font-size="12.5" fill="#cbd5e1">Залагаш на сляпо, преди раздаването — няма стратегия, която мени резултата.</text>

  <text x="32" y="466" font-family="Arial, sans-serif" font-size="12.5" fill="#cbd5e1">Едно тесте (52 карти), разбърквано наново всеки рунд. Роял флош се пада изключително рядко.</text>

  <rect x="32" y="480" width="656" height="24" rx="6" fill="#111f38"/>
  <text x="44" y="496" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Примерни стойности; зависят от версията и масата. 18+ Играйте отговорно.</text>
</svg>
