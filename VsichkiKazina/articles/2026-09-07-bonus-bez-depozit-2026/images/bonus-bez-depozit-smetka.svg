<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img" aria-label="Инфографика: как работи изчисляването на бонус без депозит — оборот, таван и принос на игрите">
  <title>Бонус без депозит: математиката зад офертата</title>
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="680" height="380" rx="12" ry="12" fill="#f9f9fb"/>

  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">Бонус без депозит: математиката зад офертата</text>
  <text x="340" y="48" text-anchor="middle" font-size="11" fill="#888">Примерна оферта: 10 € бонус · ×40 превъртане · 7 дни · таван 50 €</text>
  <line x1="40" y1="58" x2="640" y2="58" stroke="#e0e0e8" stroke-width="1"/>

  <!-- Step 1: Wagering calculation -->
  <rect x="40" y="68" width="180" height="120" rx="9" fill="#eef4ff" stroke="#b8d0f8" stroke-width="1.5"/>
  <text x="130" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#1a5ac8">① Оборот</text>
  <text x="130" y="108" text-anchor="middle" font-size="13" fill="#333">×40 · €10</text>
  <line x1="68" y1="116" x2="192" y2="116" stroke="#1a5ac8" stroke-width="1.5"/>
  <text x="130" y="137" text-anchor="middle" font-size="22" font-weight="700" fill="#1a5ac8">€400</text>
  <text x="130" y="154" text-anchor="middle" font-size="10" fill="#777">изискван оборот</text>
  <text x="130" y="170" text-anchor="middle" font-size="10" fill="#aaa">преди теглене</text>

  <!-- Arrow 1 → 2 -->
  <text x="236" y="135" text-anchor="middle" font-size="18" fill="#bbb">→</text>

  <!-- Step 2: Time limit -->
  <rect x="254" y="68" width="172" height="120" rx="9" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="340" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">② Срок: 7 дни</text>
  <text x="340" y="110" text-anchor="middle" font-size="12" fill="#333">€400 ÷ 7</text>
  <line x1="278" y1="118" x2="402" y2="118" stroke="#166534" stroke-width="1.5"/>
  <text x="340" y="139" text-anchor="middle" font-size="20" font-weight="700" fill="#166534">≈ €57</text>
  <text x="340" y="157" text-anchor="middle" font-size="10" fill="#777">залози на ден</text>
  <text x="340" y="172" text-anchor="middle" font-size="10" fill="#aaa">при макс. залог ≈ €5</text>

  <!-- Arrow 2 → 3 -->
  <text x="442" y="135" text-anchor="middle" font-size="18" fill="#bbb">→</text>

  <!-- Step 3: Withdrawal cap -->
  <rect x="458" y="68" width="184" height="120" rx="9" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="550" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">③ Таван на тегленето</text>
  <text x="550" y="108" text-anchor="middle" font-size="12" fill="#555">Печалба: €120</text>
  <line x1="478" y1="116" x2="622" y2="116" stroke="#9a3412" stroke-width="1.5"/>
  <text x="550" y="137" text-anchor="middle" font-size="22" font-weight="700" fill="#9a3412">€50</text>
  <text x="550" y="154" text-anchor="middle" font-size="10" fill="#777">максимум за теглене</text>
  <text x="550" y="170" text-anchor="middle" font-size="10" fill="#aaa">€70 се отрязват</text>

  <!-- Game contribution section -->
  <rect x="40" y="208" width="600" height="96" rx="9" fill="#f8f8fc" stroke="#d0d0e0" stroke-width="1"/>
  <text x="340" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Принос на игрите към €400 оборот</text>

  <!-- Slots row -->
  <rect x="60" y="237" width="260" height="26" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="190" y="255" text-anchor="middle" font-size="11" fill="#1d4ed8">Ротативки (100%) → €400 залози</text>

  <!-- Tables row -->
  <rect x="360" y="237" width="260" height="26" rx="5" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="490" y="255" text-anchor="middle" font-size="11" fill="#991b1b">Маси 10–20% → €2,000+ залози</text>

  <text x="340" y="292" text-anchor="middle" font-size="10" fill="#888">При 10–20% принос: €400 изискване → €2,000+ реален оборот (масите понякога са забранени при активен бонус)</text>

  <!-- RG footer -->
  <text x="340" y="354" text-anchor="middle" font-size="9" fill="#bbb">18+ Играйте отговорно · числата са примерни за целите на илюстрацията</text>

  <!-- Typical sizes note -->
  <text x="340" y="336" text-anchor="middle" font-size="10" fill="#999">Типичен бонус без депозит: 5–20 € кредит или 20–50 безплатни завъртания</text>
  <text x="340" y="323" text-anchor="middle" font-size="10" fill="#999">Пример 30 завъртания × €0,10 = €3 игра; таванът на тегленето важи и тук</text>
</svg>
