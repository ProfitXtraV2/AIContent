<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-label="Ключови факти за Synot Games: онлайн студио от 2016 г. под SYNOT Group, основана 1991; портфолио над 200, около 250 заглавия; регулирани пазари UKGC, Швеция, Дания, Белгия, Малта MGA, Гърция, Италия, Испания, Перу; сертификат ISO/IEC 27001; 10-годишен български лиценз от ноември 2024 г.; сигнатурни механики Book of Secrets и Respin Joker; официален RTP диапазон на Respin Joker от 85.02% до 98.02%, който операторът настройва">
  <rect x="8" y="8" width="704" height="524" rx="18" fill="#0f172a"/>

