<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-label="Инфографика за Super Sic Bo на Evolution. Класическо сик бо с три зара и случайни множители от 2x до 1000x върху избрани позиции преди хвърлянето. Базови изплащания преди множител: малко 4 до 10 или голямо 11 до 17 плаща 1 към 1 и е с най-висок RTP до 97,22 процента; чет или нечет 1 към 1; конкретен сбор от 6 към 1 до 50 към 1; едно число 1 към 1 до 3 към 1; комбинация 5 към 1; двойка 8 към 1; коя да е тройка 30 към 1; конкретна тройка 150 към 1. Максимална печалба 1000x на рунд. Множителите са платени от свалените базови изплащания и не оправят слабите залози. Числата са примерни и зависят от версията и масата.">
  <rect x="8" y="8" width="704" height="524" rx="18" fill="#0f172a"/>

  <text x="32" y="42" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">Super Sic Bo: залози, множители и RTP</text>
  <text x="32" y="64" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Класическо сик бо с три зара. Случайни множители кацат върху позиции преди хвърлянето.</text>

  <text x="32" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">Базово изплащане (преди множител)</text>

  <g stroke="#1e293b" stroke-width="1">
    <line x1="32" y1="110" x2="688" y2="110"/>
    <line x1="32" y1="138" x2="688" y2="138"/>
    <line x1="32" y1="166" x2="688" y2="166"/>
    <line x1="32" y1="194" x2="688" y2="194"/>
    <line x1="32" y1="222" x2="688" y2="222"/>
    <line x1="32" y1="250" x2="688" y2="250"/>
    <line x1="32" y1="278" x2="688" y2="278"/>
    <line x1="32" y1="306" x2="688" y2="306"/>
  </g>

  <text x="48" y="128" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Малко (4–10) / Голямо (11–17) · RTP до 97,22%</text>
  <text x="688" y="128" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="end">1:1</text>

  <text x="48" y="156" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Чет / Нечет</text>
  <text x="688" y="156" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="end">1:1</text>

  <text x="48" y="184" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Едно число (според броя зара)</text>
  <text x="688" y="184" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">1:1 – 3:1</text>

  <text x="48" y="212" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Комбинация (два различни зара)</text>
  <text x="688" y="212" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">5:1</text>

  <text x="48" y="240" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Двойка</text>
  <text x="688" y="240" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">8:1</text>

  <text x="48" y="268" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Конкретен сбор (4–17)</text>
  <text x="688" y="268" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">6:1 – 50:1</text>

  <text x="48" y="296" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Коя да е тройка</text>
  <text x="688" y="296" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">30:1</text>

  <text x="48" y="324" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Конкретна тройка (най-рядка)</text>
  <text x="688" y="324" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="end">150:1</text>

  <text x="32" y="360" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">Множителите</text>
  <text x="32" y="382" font-family="Arial, sans-serif" font-size="12.5" fill="#cbd5e1">Случайни стойности от 2x до 1000x върху избрани позиции всеки рунд.</text>
  <text x="32" y="402" font-family="Arial, sans-serif" font-size="12.5" fill="#cbd5e1">Максимална печалба 1000x на рунд.</text>

  <text x="32" y="436" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">Кое си струва</text>
  <text x="32" y="458" font-family="Arial, sans-serif" font-size="12.5" fill="#f8fafc">Малко и голямо са най-икономичните залози (RTP до 97,22%).</text>
  <text x="32" y="478" font-family="Arial, sans-serif" font-size="12.5" fill="#fbbf24">Множителите са платени от свалените изплащания и не оправят слабите залози.</text>

  <rect x="32" y="502" width="656" height="24" rx="6" fill="#111f38"/>
  <text x="44" y="518" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Примерни стойности; зависят от версията и масата. 18+ Играйте отговорно.</text>
</svg>
