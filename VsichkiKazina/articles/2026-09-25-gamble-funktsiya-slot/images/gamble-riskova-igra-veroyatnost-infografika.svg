<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-label="Стълбовидна инфографика: вероятност да запазиш печалбата след 1 до 5 поредни честни 50/50 удвоявания в gamble функцията на слот, тоест 50%, 25%, 12,5%, 6,25% и 3,125%. Числата са математически и примерни, при честно 50/50 удвояване.">
  <rect x="0" y="0" width="720" height="410" rx="20" fill="#0f172a"/>
  <text x="36" y="52" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#f8fafc">Стълбица на оцеляването</text>
  <text x="36" y="80" font-family="Arial, sans-serif" font-size="15" fill="#94a3b8">Шанс да запазиш печалбата след N поредни честни 50/50 удвоявания</text>
  <text x="36" y="102" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Всяко удвояване намалява този шанс наполовина.</text>
  <text x="684" y="42" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#f59e0b">18+</text>

  <!-- baseline -->
  <line x1="60" y1="340" x2="656" y2="340" stroke="#334155" stroke-width="1.5"/>

  <!-- bars: height = probability * 3.8 px/% ; baseline y=340 -->
  <!-- N=1 : 50%  h=190 top=150 center=110 -->
  <rect x="74" y="150" width="72" height="190" rx="6" fill="#38bdf8"/>
  <text x="110" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">50%</text>
  <text x="110" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">1</text>

  <!-- N=2 : 25%  h=95 top=245 center=230 -->
  <rect x="194" y="245" width="72" height="95" rx="6" fill="#38bdf8"/>
  <text x="230" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">25%</text>
  <text x="230" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">2</text>

  <!-- N=3 : 12,5%  h=47.5 top=292.5 center=350 -->
  <rect x="314" y="292.5" width="72" height="47.5" rx="6" fill="#38bdf8"/>
  <text x="350" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">12,5%</text>
  <text x="350" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">3</text>

  <!-- N=4 : 6,25%  h=23.75 top=316.25 center=470 -->
  <rect x="434" y="316.25" width="72" height="23.75" rx="6" fill="#38bdf8"/>
  <text x="470" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">6,25%</text>
  <text x="470" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">4</text>

  <!-- N=5 : 3,125%  h=11.875 top=328.125 center=590 -->
  <rect x="554" y="328.125" width="72" height="11.875" rx="4" fill="#38bdf8"/>
  <text x="590" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">3,125%</text>
  <text x="590" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">5</text>

  <text x="358" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">Брой поредни удвоявания</text>
  <text x="36" y="400" font-family="Arial, sans-serif" font-size="11.5" fill="#64748b">Числата са математически (примерни), при честно 50/50 удвояване.</text>
</svg>
