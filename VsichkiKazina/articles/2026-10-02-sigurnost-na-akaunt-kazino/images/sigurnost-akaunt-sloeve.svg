<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" font-family="'Segoe UI',Arial,sans-serif" role="img" aria-label="Четири слоя на защитата на акаунта в казино: уникална парола, двуфакторна автентикация, разпознаване на фишинг и сигурно устройство и имейл, около ядрото акаунт с баланс, документи и метод на плащане">
  <rect x="2" y="2" width="716" height="516" rx="18" fill="#ffffff" stroke="#d8dee9"/>
  <text x="360" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2a44">Четири слоя на защитата на акаунта</text>
  <text x="360" y="74" text-anchor="middle" font-size="15" fill="#5b6678">Всеки сам по себе си не стига; заедно спират повечето опити за превземане.</text>

  <!-- Layer 1 -->
  <rect x="40" y="96" width="640" height="60" rx="12" fill="#eaf2fb" stroke="#b9d3ef"/>
  <circle cx="78" cy="126" r="18" fill="#2f6fb3"/>
  <text x="78" y="133" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">1</text>
  <text x="112" y="132" font-size="20" font-weight="600" fill="#1f2a44">Уникална парола (в мениджър)</text>

  <!-- Layer 2 -->
  <rect x="40" y="166" width="640" height="60" rx="12" fill="#e4eefb" stroke="#aecbec"/>
  <circle cx="78" cy="196" r="18" fill="#2b62a8"/>
  <text x="78" y="203" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">2</text>
  <text x="112" y="202" font-size="20" font-weight="600" fill="#1f2a44">Двуфакторна автентикация (приложение)</text>

  <!-- Layer 3 -->
  <rect x="40" y="236" width="640" height="60" rx="12" fill="#dde9f8" stroke="#a3c3e7"/>
  <circle cx="78" cy="266" r="18" fill="#27559a"/>
  <text x="78" y="273" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">3</text>
  <text x="112" y="272" font-size="20" font-weight="600" fill="#1f2a44">Разпознаване на фишинг</text>

  <!-- Layer 4 -->
  <rect x="40" y="306" width="640" height="60" rx="12" fill="#d6e4f6" stroke="#98bce2"/>
  <circle cx="78" cy="336" r="18" fill="#22488b"/>
  <text x="78" y="343" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">4</text>
  <text x="112" y="342" font-size="20" font-weight="600" fill="#1f2a44">Сигурно устройство и имейл</text>

  <!-- Core account -->
  <rect x="40" y="384" width="640" height="78" rx="12" fill="#1f2a44"/>
  <text x="360" y="416" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Акаунтът</text>
  <text x="360" y="444" text-anchor="middle" font-size="15" fill="#c7d2e6">баланс · документи · метод на плащане</text>

  <text x="360" y="492" text-anchor="middle" font-size="15" font-style="italic" fill="#5b6678">Падне ли един слой, следващият печели време.</text>
  <text x="360" y="511" text-anchor="middle" font-size="12" fill="#8a94a6">18+ Играйте отговорно</text>
</svg>
