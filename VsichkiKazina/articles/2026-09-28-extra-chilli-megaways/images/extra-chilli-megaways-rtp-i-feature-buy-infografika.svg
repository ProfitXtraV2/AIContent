  <text x="688" y="356" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="end">≈ 50x залога</text>

  <text x="32" y="392" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">RTP по версия</text>
