  <text x="32" y="64" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Megaways слот на Big Time Gaming с растящ множител в бонуса и опция за покупка.</text>

  <text x="32" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">Основни числа</text>
  <g stroke="#1e293b" stroke-width="1">
    <line x1="32" y1="112" x2="688" y2="112"/>
    <line x1="32" y1="140" x2="688" y2="140"/>
    <line x1="32" y1="168" x2="688" y2="168"/>
    <line x1="32" y1="196" x2="688" y2="196"/>
  </g>
  <text x="48" y="132" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Барабани / начини</text>
  <text x="688" y="132" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">6 / до 117 649</text>
