<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 508" role="img" aria-label="Инфографика за Extra Chilli Megaways на Big Time Gaming. Шест барабана и до 117 649 начина за печалба. Максимална печалба 20 000 пъти залога, висока волатилност, залог от 0,20 до 50 евро. Бонус: 3 скатера H.O.T дават 8 безплатни завъртания, всеки допълнителен скатер добавя по 4; множителят расте с 1 при всяка печеливша реакция без таван; колело за хазарт до 24 завъртания. Feature Drop покупка на бонуса за около 50 пъти залога. RTP на стандартната версия между 96,15 и 96,41 процента, с покупка между 96,26 и 96,82 процента. Стойностите зависят от версията и оператора.">
  <rect x="8" y="8" width="704" height="492" rx="18" fill="#0f172a"/>

