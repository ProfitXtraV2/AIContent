    <line x1="32" y1="266" x2="688" y2="266"/>
    <line x1="32" y1="294" x2="688" y2="294"/>
  </g>
  <text x="48" y="258" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">3 скатера H.O.T (+4 за всеки допълнителен)</text>
  <text x="688" y="258" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="end">8 завъртания</text>
