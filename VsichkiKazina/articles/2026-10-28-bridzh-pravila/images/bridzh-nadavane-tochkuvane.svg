<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="'Segoe UI',Arial,sans-serif" role="img" aria-label="Инфографика с правилата на бриджа: ред на деноминациите при наддаване и точки за взятка, праг за манш и нивата за малък и голям шлем">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a9690"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="744" height="464" rx="16" fill="#f7f5f0" stroke="#d8d2c4" stroke-width="1.5"/>

  <text x="380" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f3a2e">Бридж: наддаване и точкуване</text>
  <text x="380" y="70" text-anchor="middle" font-size="13" fill="#5a6b60">Ред на деноминациите по сила и точки за всяка договорена взятка</text>

  <!-- denomination boxes -->
  <!-- box1 трефа -->
  <rect x="31" y="92" width="130" height="94" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="96" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#222222">♣ трефа</text>
  <text x="96" y="156" text-anchor="middle" font-size="27" font-weight="700" fill="#1f3a2e">20</text>
  <text x="96" y="176" text-anchor="middle" font-size="11" fill="#777777">на взятка</text>

  <!-- box2 каро -->
  <rect x="173" y="92" width="130" height="94" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="238" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">♦ каро</text>
  <text x="238" y="156" text-anchor="middle" font-size="27" font-weight="700" fill="#1f3a2e">20</text>
  <text x="238" y="176" text-anchor="middle" font-size="11" fill="#777777">на взятка</text>

  <!-- box3 купа -->
  <rect x="315" y="92" width="130" height="94" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="380" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">♥ купа</text>
  <text x="380" y="156" text-anchor="middle" font-size="27" font-weight="700" fill="#1f3a2e">30</text>
  <text x="380" y="176" text-anchor="middle" font-size="11" fill="#777777">на взятка</text>

  <!-- box4 пика -->
  <rect x="457" y="92" width="130" height="94" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="522" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#222222">♠ пика</text>
  <text x="522" y="156" text-anchor="middle" font-size="27" font-weight="700" fill="#1f3a2e">30</text>
  <text x="522" y="176" text-anchor="middle" font-size="11" fill="#777777">на взятка</text>

  <!-- box5 без коз -->
  <rect x="599" y="92" width="130" height="94" rx="10" fill="#ffffff" stroke="#2c3e7a" stroke-width="1.5"/>
  <text x="664" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e7a">без коз</text>
  <text x="664" y="156" text-anchor="middle" font-size="24" font-weight="700" fill="#1f3a2e">40 + 30</text>
  <text x="664" y="176" text-anchor="middle" font-size="11" fill="#777777">първа + следващи</text>

  <!-- strength arrow -->
  <line x1="96" y1="204" x2="664" y2="204" stroke="#8a9690" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="380" y="224" text-anchor="middle" font-size="11" fill="#5a6b60">подреждане по сила при наддаване (най-ниско: трефа · най-високо: без коз)</text>

  <line x1="40" y1="244" x2="720" y2="244" stroke="#ddd6c7" stroke-width="1.2"/>

  <!-- facts -->
  <text x="40" y="276" font-size="15" fill="#1f3a2e"><tspan font-weight="700">Договор на ниво N</tspan> = 6 + N взятки, напр. 4 пика = 10 взятки</text>
  <text x="40" y="308" font-size="15" fill="#1f3a2e"><tspan font-weight="700">Манш (game)</tspan> се печели при 100 точки от взятки</text>
  <text x="40" y="340" font-size="15" fill="#1f3a2e"><tspan font-weight="700">Малък шлем</tspan> = ниво 6 (12 взятки)</text>
  <text x="400" y="340" font-size="15" fill="#1f3a2e"><tspan font-weight="700">Голям шлем</tspan> = ниво 7 (13 взятки)</text>
  <text x="40" y="376" font-size="13" fill="#444444">Типичен манш: 3 без коз = 100 · 4 купа/пика = 120 · 5 трефа/каро = 100</text>

  <line x1="40" y1="402" x2="720" y2="402" stroke="#ddd6c7" stroke-width="1.2"/>
  <text x="40" y="430" font-size="11" fill="#888888">Всички числа са по стандартните правила на контрактния бридж.</text>
  <text x="720" y="430" text-anchor="end" font-size="11" fill="#888888">18+ Играйте отговорно</text>
</svg>
