<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-label="Инфографика за Funky Time на Evolution. Съставът на колелото от 64 полета: число 1 на 28 полета, букви на 24 полета, бонус Bar на 6 полета, Disco на 3 полета, Stayin' Alive на 2 полета, VIP Disco на 1 поле. Общо 12 бонус полета от 64; числото 1 плаща 1 към 1, буквите 25 към 1. RTP по залог в дълъг период: най-висок на число 1 около 95,99 процента, най-нисък на VIP Disco около 95,38 процента. Таван на печалбата 500 000 евро на залог. Съставът и процентите зависят от версията.">
  <rect x="8" y="8" width="704" height="374" rx="18" fill="#0f172a"/>

  <text x="32" y="42" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">Funky Time: колелото и RTP</text>
  <text x="32" y="64" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Числото „1" заема повечето полета; бонусите връщат най-малко в дълъг период</text>

  <text x="32" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">64 полета на колелото</text>

  <text x="48" y="126" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Число „1"</text>
  <text x="350" y="126" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">28 полета</text>
  <text x="48" y="150" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Букви</text>
  <text x="350" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">24 полета</text>
  <text x="48" y="174" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Bar (бонус)</text>
  <text x="350" y="174" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">6 полета</text>

  <text x="384" y="126" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Disco (бонус)</text>
  <text x="688" y="126" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">3 полета</text>
  <text x="384" y="150" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Stayin' Alive (бонус)</text>
  <text x="688" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">2 полета</text>
  <text x="384" y="174" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">VIP Disco (бонус)</text>
  <text x="688" y="174" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">1 поле</text>

  <text x="48" y="200" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">12 бонус полета от 64 · число „1" плаща 1:1, буквите 25:1</text>

  <text x="32" y="232" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">RTP и таван (в дълъг период)</text>

  <g stroke="#1e293b" stroke-width="1">
    <line x1="32" y1="244" x2="688" y2="244"/>
    <line x1="32" y1="272" x2="688" y2="272"/>
    <line x1="32" y1="300" x2="688" y2="300"/>
  </g>

  <text x="48" y="264" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Число „1" (най-висок RTP)</text>
  <text x="688" y="264" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">≈ 95,99%</text>
  <text x="48" y="292" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">VIP Disco (най-нисък RTP)</text>
  <text x="688" y="292" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">≈ 95,38%</text>
  <text x="48" y="320" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Таван на печалбата</text>
  <text x="688" y="320" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">500 000 € на залог</text>

  <rect x="32" y="336" width="656" height="24" rx="6" fill="#111f38"/>
  <text x="44" y="352" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Процентите зависят от версията. Множителите са примерни. 18+ Играйте отговорно.</text>
</svg>
