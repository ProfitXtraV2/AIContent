<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="Сравнение на God Mode в Zeus vs Hades: Olympus пуска бонуса по-често, но със среден резултат по-нисък, таван веднъж на 1 766 784 завъртания; Hades пуска бонуса по-рядко, но със среден резултат по-висок, таван веднъж на 1 335 113 завъртания; и двата режима имат еднакво дългосрочно RTP">
  <title>Zeus vs Hades: God Mode — Olympus срещу Hades</title>
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
  </defs>
  <rect width="640" height="340" rx="12" ry="12" fill="url(#bgg)"/>
  <text x="320" y="36" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">God Mode: Olympus срещу Hades</text>

  <!-- Olympus card -->
  <rect x="30" y="56" width="275" height="212" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="30" y="56" width="275" height="38" rx="10" fill="#3b82f6"/>
  <rect x="30" y="80" width="275" height="14" fill="#3b82f6"/>
  <text x="167" y="82" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">OLYMPUS</text>
  <text x="167" y="118" font-family="system-ui, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">Бонусът се пуска</text>
  <text x="167" y="140" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#1d4ed8" text-anchor="middle">по-често</text>
  <text x="167" y="174" font-family="system-ui, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">Среден резултат от бонуса</text>
  <text x="167" y="196" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#1d4ed8" text-anchor="middle">по-нисък</text>
  <text x="167" y="230" font-family="system-ui, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">Таванът пада веднъж на</text>
  <text x="167" y="252" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#334155" text-anchor="middle">1 766 784 завъртания</text>

  <!-- Hades card -->
  <rect x="335" y="56" width="275" height="212" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="335" y="56" width="275" height="38" rx="10" fill="#b91c1c"/>
  <rect x="335" y="80" width="275" height="14" fill="#b91c1c"/>
  <text x="472" y="82" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">HADES</text>
  <text x="472" y="118" font-family="system-ui, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">Бонусът се пуска</text>
  <text x="472" y="140" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#dc2626" text-anchor="middle">по-рядко</text>
  <text x="472" y="174" font-family="system-ui, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">Среден резултат от бонуса</text>
  <text x="472" y="196" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#dc2626" text-anchor="middle">по-висок</text>
  <text x="472" y="230" font-family="system-ui, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">Таванът пада веднъж на</text>
  <text x="472" y="252" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#334155" text-anchor="middle">1 335 113 завъртания</text>

  <text x="320" y="294" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155" text-anchor="middle" font-weight="600">Еднакво дългосрочно RTP — изборът мести темперамента, не предимството на казиното.</text>
  <text x="320" y="322" font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · висока волатилност и в двата режима</text>
</svg>
