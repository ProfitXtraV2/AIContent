<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Gates of Olympus 1000 RTP 96.50% и домашно предимство 3.50%: при €1000 оборот средно €965 се връщат на играча, €35 остават за казиното; възможни версии 95.51% и 94.50%">
  <title>Gates of Olympus 1000: RTP 96.50% и домашно предимство 3.50%</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="playerBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="houseBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" rx="12" ry="12" fill="url(#bg)"/>
  <text x="300" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#78350f" text-anchor="middle">Gates of Olympus 1000: RTP и домашно предимство</text>

  <text x="50" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600">Връщане към играча (RTP)</text>
  <text x="550" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#374151" font-weight="600" text-anchor="end">Домашно предимство</text>

  <rect x="50" y="90" width="500" height="48" rx="8" fill="#e5e7eb"/>
  <rect x="50" y="90" width="500" height="48" rx="8" fill="url(#playerBar)"/>
  <!-- House portion: 3.50% of 500px = 17.5 ≈ 18px, flush right -->
  <rect x="532" y="90" width="18" height="48" rx="4" fill="url(#houseBar)"/>

  <text x="291" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">96.50%</text>
  <text x="541" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">3.50%</text>

  <line x1="50" y1="165" x2="550" y2="165" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="300" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Пример: €1000 оборот (версия по подразбиране 96.50%)</text>

  <rect x="50" y="205" width="220" height="76" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="160" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="600">Обратно към играча</text>
  <text x="160" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="800" fill="#b45309" text-anchor="middle">~€965</text>

  <rect x="330" y="205" width="220" height="76" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="440" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="600">Остават за казиното</text>
  <text x="440" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="800" fill="#2563eb" text-anchor="middle">~€35</text>

  <text x="300" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Възможни са и версии 95.51% и 94.50% — провери инфо-панела на казиното.</text>
  <text x="300" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">RTP е дългосрочна статистика, не обещание за сесията. 18+ Играйте отговорно.</text>
</svg>
