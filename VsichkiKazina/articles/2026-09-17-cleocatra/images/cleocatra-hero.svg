<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Абстрактен банер в египетски стил с пирамиди, слънчев диск, папирусни колони и стилизирана котешка глава, вдъхновен от темата на ротативката Cleocatra">
  <title>Cleocatra: абстрактен египетски банер</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b2a5a"/>
      <stop offset="45%" stop-color="#8a5a3c"/>
      <stop offset="100%" stop-color="#d9a566"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6b877"/>
      <stop offset="100%" stop-color="#c9954f"/>
    </linearGradient>
    <linearGradient id="pyr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b5813f"/>
      <stop offset="100%" stop-color="#8a5f2a"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="70%" stop-color="#ffcf5c"/>
      <stop offset="100%" stop-color="#f0a93a"/>
    </radialGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#sky)"/>

  <!-- sun disc -->
  <circle cx="600" cy="180" r="92" fill="url(#sun)"/>

  <!-- pyramids on the horizon -->
  <polygon points="250,300 430,300 340,150" fill="url(#pyr)"/>
  <polygon points="760,300 980,300 870,120" fill="url(#pyr)"/>
  <polygon points="120,300 250,300 185,205" fill="url(#pyr)" opacity="0.85"/>

  <!-- sand foreground -->
  <rect x="0" y="300" width="1200" height="120" fill="url(#sand)"/>
  <path d="M0,300 Q300,282 600,300 T1200,300 L1200,320 L0,320 Z" fill="#d6a561" opacity="0.6"/>

  <!-- papyrus columns -->
  <g fill="#8a5f2a" opacity="0.9">
    <rect x="60" y="150" width="26" height="150" rx="6"/>
    <ellipse cx="73" cy="148" rx="24" ry="16"/>
    <rect x="1114" y="150" width="26" height="150" rx="6"/>
    <ellipse cx="1127" cy="148" rx="24" ry="16"/>
  </g>

  <!-- stylised cat head motif (animal, no human face) -->
  <g transform="translate(600,196)">
    <polygon points="-52,-30 -30,-62 -14,-34" fill="#20304f"/>
    <polygon points="52,-30 30,-62 14,-34" fill="#20304f"/>
    <path d="M-54,-30 Q0,-52 54,-30 Q60,42 0,58 Q-60,42 -54,-30 Z" fill="#2a3d63"/>
    <ellipse cx="-20" cy="-2" rx="8" ry="12" fill="#ffcf5c"/>
    <ellipse cx="20" cy="-2" rx="8" ry="12" fill="#ffcf5c"/>
    <ellipse cx="-20" cy="-2" rx="3" ry="9" fill="#1f2937"/>
    <ellipse cx="20" cy="-2" rx="3" ry="9" fill="#1f2937"/>
    <polygon points="0,18 -8,28 8,28" fill="#e6b877"/>
  </g>

  <!-- decorative multiplier orbs (no numbers) -->
  <circle cx="360" cy="120" r="20" fill="url(#orb)" opacity="0.9"/>
  <circle cx="840" cy="150" r="26" fill="url(#orb)" opacity="0.9"/>
  <circle cx="470" cy="230" r="15" fill="url(#orb)" opacity="0.8"/>
  <circle cx="740" cy="240" r="17" fill="url(#orb)" opacity="0.8"/>
  <circle cx="930" cy="230" r="13" fill="url(#orb)" opacity="0.75"/>

  <!-- subtle starfield in the night portion -->
  <g fill="#ffe9a8" opacity="0.7">
    <circle cx="150" cy="70" r="2"/>
    <circle cx="300" cy="45" r="2.5"/>
    <circle cx="520" cy="60" r="2"/>
    <circle cx="700" cy="50" r="2.5"/>
    <circle cx="1050" cy="75" r="2"/>
    <circle cx="990" cy="55" r="2"/>
  </g>
</svg>
