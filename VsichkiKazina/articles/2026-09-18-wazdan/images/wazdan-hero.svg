<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="Абстрактна метафора за Wazdan: селектор с три нива на волатилност - ниска, стандартна и висока - с плъзгач, до стилизирани барабани и две вълни (плавна за ниска и назъбена за висока волатилност), без лога и без числа">
  <title>Wazdan: изборът на волатилност е на бутон</title>
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#241033"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="reel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <rect width="760" height="320" rx="16" ry="16" fill="url(#bgg)"/>

  <!-- stylised reel columns (abstract slot, no symbols/logos) -->
  <g opacity="0.9">
    <rect x="40" y="150" width="46" height="120" rx="8" fill="url(#reel)" opacity="0.55"/>
    <rect x="98" y="132" width="46" height="138" rx="8" fill="url(#reel)" opacity="0.7"/>
    <rect x="156" y="150" width="46" height="120" rx="8" fill="url(#reel)" opacity="0.55"/>
    <rect x="52" y="164" width="22" height="22" rx="5" fill="#c7d2fe" opacity="0.7"/>
    <rect x="52" y="196" width="22" height="22" rx="5" fill="#c7d2fe" opacity="0.5"/>
    <rect x="110" y="150" width="22" height="22" rx="5" fill="#e0e7ff" opacity="0.85"/>
    <rect x="110" y="182" width="22" height="22" rx="5" fill="#c7d2fe" opacity="0.6"/>
    <rect x="168" y="164" width="22" height="22" rx="5" fill="#c7d2fe" opacity="0.7"/>
    <rect x="168" y="196" width="22" height="22" rx="5" fill="#c7d2fe" opacity="0.5"/>
  </g>

  <!-- smooth wave (low volatility) vs jagged wave (high volatility) -->
  <polyline points="272,120 300,114 330,120 360,114 390,120 420,114 450,120"
            fill="none" stroke="#22d3ee" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>
  <polyline points="470,120 500,120 512,78 524,120 560,120 588,120 600,150 612,120 640,120 668,120 690,90 704,120 720,120"
            fill="none" stroke="#f43f5e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>

  <!-- volatility selector track -->
  <rect x="272" y="230" width="448" height="12" rx="6" fill="url(#track)"/>
  <circle cx="272" cy="236" r="7" fill="#0b1020" stroke="#22d3ee" stroke-width="3"/>
  <circle cx="496" cy="236" r="7" fill="#0b1020" stroke="#6366f1" stroke-width="3"/>
  <circle cx="720" cy="236" r="7" fill="#0b1020" stroke="#f43f5e" stroke-width="3"/>
  <!-- selector knob on the middle (standard) stop -->
  <circle cx="496" cy="236" r="15" fill="#e0e7ff" stroke="#6366f1" stroke-width="4"/>

  <text x="272" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">ниска</text>
  <text x="496" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">стандартна</text>
  <text x="720" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">висока</text>

  <text x="272" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Wazdan</text>
  <text x="272" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">изборът на волатилност е на бутон</text>

  <text x="720" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">18+ Играйте отговорно</text>
</svg>
