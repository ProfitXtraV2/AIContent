<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-label="Инфографика: домашно предимство при Три карти покер. Ante &amp; Play около 3.37% спрямо Антето, с element of risk 2.01%. Pair Plus между 2.32% и 7.28% според таблицата. Правилото дама-6-4: залагаш Play с дама-6-4 или по-добра ръка, под нея пасуваш. Числата за залог от 10 евро са примерни.">
  <rect x="8" y="8" width="704" height="394" rx="18" fill="#0f172a"/>

  <text x="32" y="42" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">Три карти покер: цена на залозите</text>
  <text x="32" y="64" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Домашно предимство по залог и правилото дама-6-4 за игра или пас</text>

  <text x="32" y="104" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">Домашно предимство по залог (%)</text>

  <!-- gridlines -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="200" y1="122" x2="200" y2="236"/>
    <line x1="320" y1="122" x2="320" y2="236"/>
    <line x1="440" y1="122" x2="440" y2="236"/>
    <line x1="560" y1="122" x2="560" y2="236"/>
    <line x1="680" y1="122" x2="680" y2="236"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">
    <text x="200" y="250">0%</text>
    <text x="320" y="250">2%</text>
    <text x="440" y="250">4%</text>
    <text x="560" y="250">6%</text>
    <text x="680" y="250">8%</text>
  </g>

  <!-- Ante & Play bar: 3.37% -->
  <text x="32" y="153" font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0">Ante &amp; Play</text>
  <rect x="200" y="135" width="202" height="26" rx="4" fill="#38bdf8"/>
  <text x="412" y="153" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">3.37% спрямо Антето</text>
  <!-- element of risk marker at 2.01% -->
  <line x1="320.6" y1="131" x2="320.6" y2="165" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="200" y="180" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">element of risk (спрямо оборота): 2.01%</text>

  <!-- Pair Plus range bar: 2.32% to 7.28% -->
  <text x="32" y="213" font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0">Pair Plus</text>
  <rect x="339.2" y="196" width="297.6" height="26" rx="4" fill="#f59e0b"/>
  <text x="488" y="214" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">2.32% до 7.28%</text>

  <!-- Q-6-4 rule box -->
  <rect x="32" y="286" width="656" height="66" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="48" y="313" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">Правилото дама-6-4</text>
  <text x="48" y="337" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1">Дама-6-4 или по-добра ръка: залагаш Play. Под нея: пасуваш.</text>

  <!-- footer -->
  <text x="32" y="384" font-family="Arial, sans-serif" font-size="11" fill="#64748b">18+ Играйте отговорно</text>
  <text x="688" y="384" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="end">числата за залог от €10 са примерни</text>
</svg>
