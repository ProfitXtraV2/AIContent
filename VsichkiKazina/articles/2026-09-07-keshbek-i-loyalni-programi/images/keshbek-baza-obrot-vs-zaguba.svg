<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" width="660" height="380" role="img" aria-label="Кешбек 10%: база оборот €2 000 връща €200, база нетна загуба €200 връща €20 — разликата в изчислението">
  <title>Кешбек: база оборот срещу база нетна загуба</title>

  <!-- Background -->
  <rect width="660" height="380" fill="#f8f9fa" rx="12"/>

  <!-- Title -->
  <text x="330" y="34" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1a1a2e" text-anchor="middle">Кешбек 10%: базата е всичко (числата са примерни)</text>
  <text x="330" y="54" font-family="Arial,sans-serif" font-size="12" fill="#666" text-anchor="middle">Играч с €2 000 оборот, нетна загуба €200 за седмицата</text>

  <!-- Column headers -->
  <rect x="40" y="70" width="270" height="36" rx="8" fill="#8b4513"/>
  <text x="175" y="93" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">База: оборот</text>

  <rect x="350" y="70" width="270" height="36" rx="8" fill="#1a6b2e"/>
  <text x="485" y="93" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">База: нетна загуба</text>

  <!-- Row 1: Кешбек база -->
  <rect x="40" y="118" width="270" height="60" rx="7" fill="#fdf3eb" stroke="#8b4513" stroke-width="1.5"/>
  <text x="175" y="140" font-family="Arial,sans-serif" font-size="12" fill="#8b4513" text-anchor="middle" font-weight="600">Кешбек основа</text>
  <text x="175" y="166" font-family="Arial,sans-serif" font-size="30" font-weight="900" fill="#8b4513" text-anchor="middle">€2 000</text>

  <rect x="350" y="118" width="270" height="60" rx="7" fill="#e8f5ec" stroke="#1a6b2e" stroke-width="1.5"/>
  <text x="485" y="140" font-family="Arial,sans-serif" font-size="12" fill="#1a6b2e" text-anchor="middle" font-weight="600">Кешбек основа</text>
  <text x="485" y="166" font-family="Arial,sans-serif" font-size="30" font-weight="900" fill="#1a6b2e" text-anchor="middle">€200</text>

  <!-- Row 2: Percentage applied -->
  <rect x="40" y="190" width="270" height="44" rx="7" fill="#fdf3eb" stroke="#8b4513" stroke-width="1.5"/>
  <text x="175" y="217" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#8b4513" text-anchor="middle">× 10% кешбек</text>

  <rect x="350" y="190" width="270" height="44" rx="7" fill="#e8f5ec" stroke="#1a6b2e" stroke-width="1.5"/>
  <text x="485" y="217" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1a6b2e" text-anchor="middle">× 10% кешбек</text>

  <!-- VS separator -->
  <circle cx="330" cy="212" r="22" fill="#444"/>
  <text x="330" y="218" font-family="Arial,sans-serif" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">VS</text>

  <!-- Row 3: Result -->
  <rect x="40" y="246" width="270" height="72" rx="8" fill="#8b4513" opacity="0.9"/>
  <text x="175" y="271" font-family="Arial,sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">Получаваш кешбек</text>
  <text x="175" y="306" font-family="Arial,sans-serif" font-size="44" font-weight="900" fill="#fff" text-anchor="middle">€200</text>

  <rect x="350" y="246" width="270" height="72" rx="8" fill="#1a6b2e" opacity="0.9"/>
  <text x="485" y="271" font-family="Arial,sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">Получаваш кешбек</text>
  <text x="485" y="306" font-family="Arial,sans-serif" font-size="44" font-weight="900" fill="#fff" text-anchor="middle">€20</text>


  <!-- Bottom note -->
  <rect x="40" y="330" width="580" height="34" rx="7" fill="#fff3cd" stroke="#e0c070" stroke-width="1"/>
  <text x="330" y="348" font-family="Arial,sans-serif" font-size="12" fill="#856404" text-anchor="middle" font-weight="600">⚠ Същият процент, различна база = 10× разлика във върнатата сума.</text>
  <text x="330" y="363" font-family="Arial,sans-serif" font-size="11" fill="#856404" text-anchor="middle">Въпросът не е „колко процента", а „процент върху какво".</text>

  <!-- RG note -->
  <text x="330" y="376" font-family="Arial,sans-serif" font-size="9.5" fill="#aaa" text-anchor="middle">18+ Играйте отговорно · vsichkikazina.bg</text>
</svg>
