<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" width="740" height="360" role="img" aria-label="Стат карта за Duck Hunters на Nolimit City: RTP 96.05% с алтернативни версии 94.03% и 92.04%, екстремна волатилност, максимална печалба 30 000x залога, формат 6x5 със scatter pays, залог от 0,20 до 100 евро; операторът може да зареди по-нисък RTP, проверявай в инфо-панела">
  <title>Duck Hunters (Nolimit City): ключови числа</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7faf9"/>
      <stop offset="100%" stop-color="#eaf1ef"/>
    </linearGradient>
    <linearGradient id="rtpBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="edgeBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="740" height="360" rx="14" ry="14" fill="url(#bg2)"/>

  <text x="370" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f5a54" text-anchor="middle">Duck Hunters (Nolimit City): ключови числа</text>
  <text x="370" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">операторът може да зареди по-нисък RTP, провери реалната версия в инфо-панела</text>

  <text x="40" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#374151" font-weight="600">Връщане към играча (RTP)</text>
  <text x="700" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#374151" font-weight="600" text-anchor="end">Домашно предимство</text>

  <rect x="40" y="108" width="660" height="46" rx="8" fill="#e5e7eb"/>
  <!-- RTP 96.05% -> 634px; house 26px; 634+26=660 flush, no overlap -->
  <rect x="40" y="108" width="634" height="46" rx="8" fill="url(#rtpBar)"/>
  <rect x="674" y="108" width="26" height="46" rx="4" fill="url(#edgeBar)"/>
  <text x="357" y="137" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">96.05%</text>

  <text x="370" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">алтернативни версии: 94.03% / 92.04% · домашно предимство при 96.05% е 3.95%</text>

  <!-- four stat tiles: x=40,209,378,547 ; w=151 ; gap 18 ; ends at 698 -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="40" y="202" width="151" height="104" rx="10" fill="#ffffff" stroke="#cbd5cf" stroke-width="1.5"/>
    <text x="115.5" y="230" font-size="12" fill="#6b7280" text-anchor="middle">Волатилност</text>
    <text x="115.5" y="264" font-size="20" font-weight="800" fill="#0f5a54" text-anchor="middle">екстремна</text>
    <text x="115.5" y="290" font-size="10.5" fill="#9ca3af" text-anchor="middle">рядко, но едро</text>

    <rect x="209" y="202" width="151" height="104" rx="10" fill="#ffffff" stroke="#cbd5cf" stroke-width="1.5"/>
    <text x="284.5" y="230" font-size="12" fill="#6b7280" text-anchor="middle">Макс. печалба</text>
    <text x="284.5" y="264" font-size="21" font-weight="800" fill="#0f5a54" text-anchor="middle">30 000x</text>
    <text x="284.5" y="290" font-size="10.5" fill="#9ca3af" text-anchor="middle">~1 на 22 млн. спина</text>

    <rect x="378" y="202" width="151" height="104" rx="10" fill="#ffffff" stroke="#cbd5cf" stroke-width="1.5"/>
    <text x="453.5" y="230" font-size="12" fill="#6b7280" text-anchor="middle">Формат</text>
    <text x="453.5" y="264" font-size="22" font-weight="800" fill="#0f5a54" text-anchor="middle">6x5</text>
    <text x="453.5" y="290" font-size="10.5" fill="#9ca3af" text-anchor="middle">scatter pays, 8+ символа</text>

    <rect x="547" y="202" width="151" height="104" rx="10" fill="#ffffff" stroke="#cbd5cf" stroke-width="1.5"/>
    <text x="622.5" y="230" font-size="12" fill="#6b7280" text-anchor="middle">Залог</text>
    <text x="622.5" y="264" font-size="18" font-weight="800" fill="#0f5a54" text-anchor="middle">€0,20 - €100</text>
    <text x="622.5" y="290" font-size="10.5" fill="#9ca3af" text-anchor="middle">Nolimit City, 2025</text>
  </g>

  <text x="370" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · Провери реалния RTP в инфо-панела на конкретното казино</text>
</svg>
