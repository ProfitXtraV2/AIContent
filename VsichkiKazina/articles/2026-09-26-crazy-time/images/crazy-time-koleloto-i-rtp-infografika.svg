<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-label="Инфографика за Crazy Time на Evolution. Съставът на колелото от 54 полета: число 1 на 21 полета, число 2 на 13 полета, число 5 на 7 полета, число 10 на 4 полета, Coin Flip на 4 полета, Cash Hunt на 2 полета, Pachinko на 2 полета, Crazy Time на 1 поле. Общо 45 полета за числата, около 83 процента, и 9 за бонусите, около 17 процента. RTP по залог в дълъг период: най-висок на число 1 около 96,08 процента, най-нисък на Pachinko около 94,33 и на бонуса Crazy Time около 94,41 процента, средно за всички залози около 95,41 процента. Таван на печалбата около 20 000x, рекламиран до около 25 000x. Играта е на Evolution от 2020 година.">
  <rect x="8" y="8" width="704" height="434" rx="18" fill="#0f172a"/>

  <text x="32" y="42" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">Crazy Time: съставът на колелото и RTP</text>
  <text x="32" y="64" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Числата заемат повечето полета; бонусите връщат най-малко в дълъг период</text>

  <text x="32" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">54 полета на колелото</text>

  <text x="48" y="128" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Число 1</text>
  <text x="350" y="128" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">21 полета</text>
  <text x="48" y="152" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Число 2</text>
  <text x="350" y="152" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">13 полета</text>
  <text x="48" y="176" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Число 5</text>
  <text x="350" y="176" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">7 полета</text>
  <text x="48" y="200" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Число 10</text>
  <text x="350" y="200" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">4 полета</text>

  <text x="384" y="128" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Coin Flip</text>
  <text x="688" y="128" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">4 полета</text>
  <text x="384" y="152" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Cash Hunt</text>
  <text x="688" y="152" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">2 полета</text>
  <text x="384" y="176" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Pachinko</text>
  <text x="688" y="176" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">2 полета</text>
  <text x="384" y="200" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Crazy Time</text>
  <text x="688" y="200" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">1 поле</text>

  <text x="48" y="228" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">45 полета за числата (~83%) · 9 за бонусите (~17%)</text>

  <text x="32" y="260" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">RTP по залог (в дълъг период)</text>

  <g stroke="#1e293b" stroke-width="1">
    <line x1="32" y1="288" x2="688" y2="288"/>
    <line x1="32" y1="316" x2="688" y2="316"/>
  </g>

  <text x="48" y="280" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Число 1 (най-висок RTP)</text>
  <text x="688" y="280" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">≈ 96,08%</text>

  <text x="48" y="308" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Pachinko / Crazy Time (най-нисък)</text>
  <text x="688" y="308" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">≈ 94,33% / 94,41%</text>

  <text x="48" y="336" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Средно за всички залози</text>
  <text x="688" y="336" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="end">≈ 95,41%</text>

  <rect x="32" y="352" width="656" height="56" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="48" y="377" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">Таван на печалбата ≈ 20 000x, рекламиран до ≈ 25 000x</text>
  <text x="48" y="397" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">Гигантските множители са рядка опашка. Играта е на Evolution (2020).</text>

  <text x="32" y="428" font-family="Arial, sans-serif" font-size="11" fill="#64748b">18+ Играйте отговорно</text>
  <text x="688" y="428" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="end">числата за множителите са примерни · зависят от версията</text>
</svg>
