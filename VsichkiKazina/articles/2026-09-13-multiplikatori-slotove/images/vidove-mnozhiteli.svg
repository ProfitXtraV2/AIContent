<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="'Segoe UI',Roboto,Arial,sans-serif" role="img" aria-label="Петте вида множители в ротативките и накратко как работи всеки">
  <rect x="0" y="0" width="720" height="420" rx="16" fill="#0f1b2d"/>
  <rect x="16" y="16" width="688" height="388" rx="12" fill="#152238"/>
  <text x="40" y="52" fill="#f4f7fb" font-size="22" font-weight="700">Петте вида множители</text>
  <text x="40" y="76" fill="#8aa0be" font-size="13">Коефициентът винаги умножава печалбата, не залога</text>

  <g>
    <rect x="40" y="94" width="6" height="42" rx="3" fill="#e0a43b"/>
    <text x="60" y="113" fill="#eaf0f8" font-size="16.5" font-weight="600">Множител на печалбата</text>
    <text x="60" y="131" fill="#9fb4d0" font-size="13.5">умножава резултата от завъртане или отделна комбинация</text>
  </g>
  <g>
    <rect x="40" y="148" width="6" height="42" rx="3" fill="#e0a43b"/>
    <text x="60" y="167" fill="#eaf0f8" font-size="16.5" font-weight="600">Символ-множител (wild ×N)</text>
    <text x="60" y="185" fill="#9fb4d0" font-size="13.5">wild, който допълва комбинацията и вдига стойността ѝ</text>
  </g>
  <g>
    <rect x="40" y="202" width="6" height="42" rx="3" fill="#4fa3d1"/>
    <text x="60" y="221" fill="#eaf0f8" font-size="16.5" font-weight="600">Нарастващ (прогресивен)</text>
    <text x="60" y="239" fill="#9fb4d0" font-size="13.5">качва се стъпка по стъпка във функция или каскадна верига</text>
  </g>
  <g>
    <rect x="40" y="256" width="6" height="42" rx="3" fill="#4fa3d1"/>
    <text x="60" y="275" fill="#eaf0f8" font-size="16.5" font-weight="600">Случаен (бомба/кълбо)</text>
    <text x="60" y="293" fill="#9fb4d0" font-size="13.5">пада без правило, почти винаги в безплатните завъртания</text>
  </g>
  <g>
    <rect x="40" y="310" width="6" height="42" rx="3" fill="#57b98a"/>
    <text x="60" y="329" fill="#eaf0f8" font-size="16.5" font-weight="600">Множител в бонуса</text>
    <text x="60" y="347" fill="#9fb4d0" font-size="13.5">тръгва по-високо от основната игра или се натрупва</text>
  </g>

  <text x="40" y="384" fill="#6f86a6" font-size="12">18+ Играйте отговорно</text>
</svg>
