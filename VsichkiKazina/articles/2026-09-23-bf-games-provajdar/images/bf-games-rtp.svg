<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" width="640" height="396" role="img" aria-label="Обявени RTP на топ заглавия на BF Games: Lucky Tropics 97.00%, Aztec Adventure 96.22%, Buffalo Trail 96.16%, Book of Gods 96.12%, Cave of Fortune 96.04%, Book of Gates 96.03%, спрямо ориентир около 96% за модерните слотове; повечето седят на или малко над средното">
  <title>Обявени RTP на топ заглавия на BF Games спрямо ~96%</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#22a3bd"/>
    </linearGradient>
  </defs>

  <rect width="640" height="396" rx="12" ry="12" fill="url(#bg)"/>

  <text x="320" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f766e" text-anchor="middle">Обявен RTP на топ заглавия на BF Games</text>
  <text x="320" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">повечето седят на или малко над ориентира за модерните слотове (~96%)</text>

  <!-- 96% reference line: track 150..560 maps RTP 95.50..97.50 (205 px per %); 96.00 at x = 150 + 0.50*205 = 253 -->
  <line x1="253" y1="70" x2="253" y2="285" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="253" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4b5563" text-anchor="middle">~96%</text>

  <!-- Row 1: Lucky Tropics 97.00% -> width = (97.00-95.50)*205 = 308 -->
  <text x="142" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#374151" font-weight="600" text-anchor="end">Lucky Tropics</text>
  <rect x="150" y="85" width="410" height="22" rx="5" fill="#e5e7eb"/>
  <rect x="150" y="85" width="308" height="22" rx="5" fill="url(#bar)"/>
  <text x="575" y="101" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f766e" text-anchor="start">97.00%</text>

  <!-- Row 2: Aztec Adventure 96.22% -> width = 0.72*205 = 148 -->
  <text x="142" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#374151" font-weight="600" text-anchor="end">Aztec Adventure</text>
  <rect x="150" y="119" width="410" height="22" rx="5" fill="#e5e7eb"/>
  <rect x="150" y="119" width="148" height="22" rx="5" fill="url(#bar)"/>
  <text x="575" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f766e" text-anchor="start">96.22%</text>

  <!-- Row 3: Buffalo Trail 96.16% -> width = 0.66*205 = 135 -->
  <text x="142" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#374151" font-weight="600" text-anchor="end">Buffalo Trail</text>
  <rect x="150" y="153" width="410" height="22" rx="5" fill="#e5e7eb"/>
  <rect x="150" y="153" width="135" height="22" rx="5" fill="url(#bar)"/>
  <text x="575" y="169" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f766e" text-anchor="start">96.16%</text>

  <!-- Row 4: Book of Gods 96.12% -> width = 0.62*205 = 127 -->
  <text x="142" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#374151" font-weight="600" text-anchor="end">Book of Gods</text>
  <rect x="150" y="187" width="410" height="22" rx="5" fill="#e5e7eb"/>
  <rect x="150" y="187" width="127" height="22" rx="5" fill="url(#bar)"/>
  <text x="575" y="203" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f766e" text-anchor="start">96.12%</text>

  <!-- Row 5: Cave of Fortune 96.04% -> width = 0.54*205 = 111 -->
  <text x="142" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#374151" font-weight="600" text-anchor="end">Cave of Fortune</text>
  <rect x="150" y="221" width="410" height="22" rx="5" fill="#e5e7eb"/>
  <rect x="150" y="221" width="111" height="22" rx="5" fill="url(#bar)"/>
  <text x="575" y="237" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f766e" text-anchor="start">96.04%</text>

  <!-- Row 6: Book of Gates 96.03% -> width = 0.53*205 = 109 -->
  <text x="142" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#374151" font-weight="600" text-anchor="end">Book of Gates</text>
  <rect x="150" y="255" width="410" height="22" rx="5" fill="#e5e7eb"/>
  <rect x="150" y="255" width="109" height="22" rx="5" fill="url(#bar)"/>
  <text x="575" y="271" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f766e" text-anchor="start">96.03%</text>

  <text x="320" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Скала 95.50%–97.50% · източник: игрални бази</text>

  <line x1="60" y1="318" x2="580" y2="318" stroke="#d1d5db" stroke-width="1"/>
  <text x="320" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Част от заглавията имат няколко версии с различен RTP (напр. Magic Hunter 94.19%–98.14%)</text>
  <text x="320" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">операторът избира коя версия да пусне</text>
  <text x="320" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · Провери реалния RTP в инфо-панела на конкретното казино</text>
</svg>
