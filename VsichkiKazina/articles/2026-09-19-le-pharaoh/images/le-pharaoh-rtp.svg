<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-label="Илюстративно: официалният RTP на Le Pharaoh е 96.18%; при обявен RTP около 96% и €1000 оборот средно €960 се връщат на играча, €40 остават за казиното; реалната версия се проверява в инфо-панела">
  <title>Илюстративно: RTP на Le Pharaoh 96.18%</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf7ee"/>
      <stop offset="100%" stop-color="#f2e9d6"/>
    </linearGradient>
    <linearGradient id="playerBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#e0b036"/>
    </linearGradient>
    <linearGradient id="houseBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a6a2f"/>
      <stop offset="100%" stop-color="#c08a4a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="330" rx="12" ry="12" fill="url(#bg)"/>

  <text x="300" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#7a5c14" text-anchor="middle">Le Pharaoh: официален RTP 96.18% (Hacksaw Gaming)</text>
  <text x="300" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8a7a5a" text-anchor="middle">илюстративен пример при обявен RTP ~96%; операторът може да пусне и по-ниска версия</text>

  <text x="50" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4a3d20" font-weight="600">Връщане към играча (RTP)</text>
  <text x="550" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4a3d20" font-weight="600" text-anchor="end">Домашно предимство</text>

  <rect x="50" y="98" width="500" height="48" rx="8" fill="#e7dcc4"/>
  <!-- Player bar 480px + house bar 20px = 500px, flush (no overlap) -->
  <rect x="50" y="98" width="480" height="48" rx="8" fill="url(#playerBar)"/>
  <rect x="530" y="98" width="20" height="48" rx="4" fill="url(#houseBar)"/>

  <text x="290" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">~96%</text>

  <line x1="50" y1="172" x2="550" y2="172" stroke="#d8c9a6" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="300" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8a7a5a" text-anchor="middle" font-style="italic">Пример: €1000 оборот</text>

  <rect x="50" y="211" width="220" height="74" rx="10" fill="#fdf6e3" stroke="#d0a53a" stroke-width="1.5"/>
  <text x="160" y="237" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#7a5c14" text-anchor="middle" font-weight="600">Обратно към играча</text>
  <text x="160" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#a5781a" text-anchor="middle">~€960</text>
  <text x="160" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#b8860b" text-anchor="middle">(средно, дългосрочно)</text>

  <rect x="330" y="211" width="220" height="74" rx="10" fill="#f6ede0" stroke="#a5732f" stroke-width="1.5"/>
  <text x="440" y="237" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#7a4f1c" text-anchor="middle" font-weight="600">За казиното</text>
  <text x="440" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#93601f" text-anchor="middle">~€40</text>
  <text x="440" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#a5732f" text-anchor="middle">(домашно предимство ~4%)</text>

  <text x="300" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#c3b189" text-anchor="middle">+</text>

  <text x="300" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#b0a079" text-anchor="middle">18+ Играйте отговорно · Провери реалния RTP в инфо-панела на конкретното казино</text>
</svg>
