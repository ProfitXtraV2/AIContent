<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 772" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Инфографика: пътят към възстановяване от хазартна зависимост — степени по DSM-5, маршрут за помощ в България и дефиниция на ремисия">
  <rect x="0" y="0" width="720" height="772" fill="#ffffff"/>
  <rect x="12" y="12" width="696" height="748" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Title -->
  <text x="360" y="58" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">Пътят към възстановяване</text>
  <text x="360" y="86" text-anchor="middle" font-size="15" fill="#475569">Хазартното разстройство се лекува, а ремисията е измерима.</text>

  <!-- Key stat -->
  <rect x="36" y="106" width="648" height="58" rx="12" fill="#e0f2fe"/>
  <text x="360" y="133" text-anchor="middle" font-size="16" font-weight="600" fill="#0c4a6e">Около 9 от 10 души не търсят помощ.</text>
  <text x="360" y="153" text-anchor="middle" font-size="13.5" fill="#0369a1">Да я потърсите е най-силната крачка, не изключението.</text>

  <!-- Severity (DSM-5) -->
  <text x="36" y="200" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a">Степен на разстройството (по DSM-5)</text>
  <text x="36" y="220" text-anchor="start" font-size="12.5" fill="#64748b">Диагноза при поне 4 от 9 критерия в рамките на 12 месеца.</text>
  <g font-size="14" font-weight="600">
    <rect x="36" y="232" width="206" height="46" rx="10" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.5"/>
    <text x="139" y="255" text-anchor="middle" fill="#0f766e">лека</text>
    <text x="139" y="272" text-anchor="middle" font-size="13" fill="#334155">4–5 критерия</text>
    <rect x="257" y="232" width="206" height="46" rx="10" fill="#fef9c3" stroke="#fde68a" stroke-width="1.5"/>
    <text x="360" y="255" text-anchor="middle" fill="#92400e">умерена</text>
    <text x="360" y="272" text-anchor="middle" font-size="13" fill="#334155">6–7 критерия</text>
    <rect x="478" y="232" width="206" height="46" rx="10" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1.5"/>
    <text x="581" y="255" text-anchor="middle" fill="#9f1239">тежка</text>
    <text x="581" y="272" text-anchor="middle" font-size="13" fill="#334155">8–9 критерия</text>
  </g>

  <!-- Care pathway BG -->
  <text x="36" y="322" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a">Маршрут за помощ в България</text>

  <g>
    <circle cx="58" cy="356" r="15" fill="#0369a1"/>
    <text x="58" y="361" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
    <text x="84" y="352" text-anchor="start" font-size="14.5" font-weight="600" fill="#0f172a">Личен лекар</text>
    <text x="84" y="371" text-anchor="start" font-size="13" fill="#475569">насочва към психиатър или районен център за психично здраве</text>
  </g>
  <g>
    <circle cx="58" cy="410" r="15" fill="#0369a1"/>
    <text x="58" y="415" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
    <text x="84" y="406" text-anchor="start" font-size="14.5" font-weight="600" fill="#0f172a">Психиатър или център</text>
    <text x="84" y="425" text-anchor="start" font-size="13" fill="#475569">поема оценката и лечението; част от помощта минава през НЗОК</text>
  </g>
  <g>
    <circle cx="58" cy="464" r="15" fill="#0369a1"/>
    <text x="58" y="469" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
    <text x="84" y="460" text-anchor="start" font-size="14.5" font-weight="600" fill="#0f172a">Група за взаимопомощ</text>
    <text x="84" y="479" text-anchor="start" font-size="13" fill="#475569">върви успоредно с индивидуалната работа (12-стъпков модел)</text>
  </g>

  <rect x="36" y="500" width="648" height="44" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="360" y="521" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">Отрязване на достъпа до хазарт, докато контролът се връща</text>
  <text x="360" y="537" text-anchor="middle" font-size="12.5" fill="#475569">лимити, а при нужда самоизключване чрез регистъра на уязвимите лица към НАП</text>

  <!-- Remission goal -->
  <text x="36" y="588" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a">Целта: ремисия</text>
  <g>
    <rect x="36" y="600" width="318" height="62" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="195" y="626" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Ранна ремисия</text>
    <text x="195" y="647" text-anchor="middle" font-size="12.5" fill="#334155">без нито един критерий поне 3 месеца</text>
    <rect x="366" y="600" width="318" height="62" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="525" y="626" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">Устойчива ремисия</text>
    <text x="525" y="647" text-anchor="middle" font-size="12.5" fill="#334155">задържано 12 месеца или повече</text>
  </g>

  <!-- Footer -->
  <text x="36" y="704" text-anchor="start" font-size="12.5" fill="#64748b">Рецидивът по пътя е очакван завой и не отменя напредъка.</text>
  <text x="36" y="736" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a">18+ Играйте отговорно</text>
  <text x="684" y="736" text-anchor="end" font-size="11.5" fill="#94a3b8">Образователни данни по DSM-5 · Всички Казина</text>
</svg>
