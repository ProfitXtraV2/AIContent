<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" width="720" height="452" role="img" aria-label="Кога картовият chargeback при онлайн казино е основателен и кога не. Основателен: неоторизирана или открадната карта, удържан но непостъпил депозит, двойно таксуване заради техническа грешка. Не е основателен: доброволна загуба от игра, разкаяние след сесия, неразбрани условия на бонуса. Срокът е обикновено 60 до 120 дни от транзакцията. При лицензиран оператор защитата минава през НАП, а не през картовия спор.">
  <title>Кога картовият chargeback при онлайн казино работи и кога не</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
  </defs>

  <rect width="720" height="452" rx="14" ry="14" fill="url(#bg)"/>

  <text x="360" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700" fill="#1f2937" text-anchor="middle">Chargeback при онлайн казино: кога работи</text>
  <text x="360" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">картовото оспорване е за дефект на плащането, не за загуба от игра</text>

  <!-- Left column: works -->
  <rect x="40" y="74" width="300" height="208" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="190" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">Основателен е, когато</text>
  <text x="60" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#065f46">• Неоторизирана/открадната карта</text>
  <text x="60" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#065f46">• Удържан, но непостъпил депозит</text>
  <text x="60" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#065f46">• Двойно таксуване (тех. грешка)</text>
  <text x="60" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#059669">Оспорваш дефект на транзакцията,</text>
  <text x="60" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#059669">не резултата от играта.</text>

  <!-- Right column: doesn't work -->
  <rect x="380" y="74" width="300" height="208" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="530" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">Не е основателен при</text>
  <text x="400" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#991b1b">• Доброволна загуба от игра</text>
  <text x="400" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#991b1b">• Разкаяние след сесия</text>
  <text x="400" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#991b1b">• „Не разбрах условията"</text>
  <text x="400" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#dc2626">Услугата е предоставена както е</text>
  <text x="400" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#dc2626">описана; злоупотребата се връща срещу теб.</text>

  <!-- Time window note -->
  <rect x="40" y="296" width="640" height="40" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="360" y="321" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">Срок за подаване: обикновено 60 до 120 дни от датата на транзакцията</text>

  <!-- НАП banner -->
  <rect x="40" y="348" width="640" height="48" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="360" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#047857" text-anchor="middle">При лицензиран оператор защитата е регулаторът (НАП), не картовият спор</text>
  <text x="360" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#059669" text-anchor="middle">провери лиценза в публичния регистър, преди да депозираш</text>

  <text x="360" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · chargeback не е билет за връщане на загуби</text>
</svg>
