<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'DejaVu Sans','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="720" height="380" fill="#ffffff"/>
  <text x="360" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2933">Клондайк: началната подредба</text>

  <!-- info pills -->
  <g>
    <rect x="150" y="54" width="180" height="30" rx="15" fill="#eef2f7" stroke="#d9e1e8"/>
    <text x="240" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2933">Талон: 24 карти</text>
    <rect x="392" y="54" width="200" height="30" rx="15" fill="#eef2f7" stroke="#d9e1e8"/>
    <text x="492" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2933">Основи: 4 (асо до поп)</text>
  </g>

  <!-- 7 tableau columns: column i has i cards; top card face up -->
  <g>
    <!-- column centers at 70,160,...,610 (pitch 90), card width 70 -->
    <!-- col 1 -->
    <g>
      <rect x="35" y="120" width="70" height="20" rx="4" fill="#1f7a4d" stroke="#176139"/>
      <text x="70" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">1</text>
    </g>
    <!-- col 2 -->
    <g>
      <rect x="125" y="120" width="70" height="20" rx="4" fill="#c7d2cc" stroke="#aab7b0"/>
      <rect x="125" y="134" width="70" height="20" rx="4" fill="#1f7a4d" stroke="#176139"/>
      <text x="160" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">2</text>
    </g>
    <!-- col 3 -->
    <g>
      <rect x="215" y="120" width="70" height="20" rx="4" fill="#c7d2cc" stroke="#aab7b0"/>
      <rect x="215" y="134" width="70" height="20" rx="4" fill="#c7d2cc" stroke="#aab7b0"/>
      <rect x="215" y="148" width="70" height="20" rx="4" fill="#1f7a4d" stroke="#176139"/>
      <text x="250" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">3</text>
    </g>
    <!-- col 4 -->
    <g>
      <rect x="305" y="120" width="70" height="20" rx="4" fill="#c7d2cc" stroke="#aab7b0"/>
      <rect x="305" y="134" width="70" height="20" rx="4" fill="#c7d2cc" stroke="#aab7b0"/>
      <rect x="305" y="148" width="70" height="20" rx="4" fill="#c7d2cc" stroke="#aab7b0"/>
      <rect x="305" y="162" width="70" height="20" rx="4" fill="#1f7a4d" stroke="#176139"/>
      <text x="340" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">4</text>
    </g>
    <!-- col 5 -->
    <g>
      <rect x="395" y="120" width="70" height="20" rx="4" fill="#c7d2cc" stroke="#aab7b0"/>
      <rect x="395" y="134" width="70" height="20" rx="4" fill="#c7d2cc" stroke="#aab7b0"/>
      <rect x="395" y="148" width="70" height="20" rx="4" fill="#c7d2cc" stroke="#aab7b0"/>
      <rect x="395" y="162" width="70" height="20" rx="4" fill="#c7d2cc" stroke="#aab7b0"/>
      <rect x="395" y="176" width="70" height="20" rx="4" fill="#1f7a4d" stroke="#176139"/>
      <text x="430" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">5</text>
    </g>
    <!-- col 6 -->
    <g>
      <rect x="485" y="120" width="70" height="20" rx="4" fill="#c7d2cc" stroke="#aab7b0"/>
      <rect x="485" y="134" width="70" height="20" rx="4" fill="#c7d2cc" stroke="#aab7b0"/>
      <rect x="485" y="148" width="70" height="20" rx="4" fill="#c7d2cc" stroke="#aab7b0"/>
      <rect x="485" y="162" width="70" height="20" rx="4" fill="#c7d2cc" stroke="#aab7b0"/>
      <rect x="485" y="176" width="70" height="20" rx="4" fill="#c7d2cc" stroke="#aab7b0"/>
      <rect x="485" y="190" width="70" height="20" rx="4" fill="#1f7a4d" stroke="#176139"/>
      <text x="520" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">6</text>
    </g>
    <!-- col 7 -->
    <g>
      <rect x="575" y="120" width="70" height="20" rx="4" fill="#c7d2cc" stroke="#aab7b0"/>
      <rect x="575" y="134" width="70" height="20" rx="4" fill="#c7d2cc" stroke="#aab7b0"/>
      <rect x="575" y="148" width="70" height="20" rx="4" fill="#c7d2cc" stroke="#aab7b0"/>
      <rect x="575" y="162" width="70" height="20" rx="4" fill="#c7d2cc" stroke="#aab7b0"/>
      <rect x="575" y="176" width="70" height="20" rx="4" fill="#c7d2cc" stroke="#aab7b0"/>
      <rect x="575" y="190" width="70" height="20" rx="4" fill="#c7d2cc" stroke="#aab7b0"/>
      <rect x="575" y="204" width="70" height="20" rx="4" fill="#1f7a4d" stroke="#176139"/>
      <text x="610" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">7</text>
    </g>
  </g>

  <!-- legend -->
  <g>
    <rect x="215" y="276" width="18" height="14" rx="3" fill="#1f7a4d"/>
    <text x="239" y="288" font-size="12" fill="#4a5568">открита карта</text>
    <rect x="360" y="276" width="18" height="14" rx="3" fill="#c7d2cc"/>
    <text x="384" y="288" font-size="12" fill="#4a5568">карта с лицето надолу</text>
  </g>

  <!-- breakdown bar -->
  <text x="360" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">52 карти = 28 на масата (1+2+3+4+5+6+7) + 24 в талона</text>
  <text x="360" y="356" text-anchor="middle" font-size="11.5" fill="#9aa5b1">7 колони, по една открита карта във всяка; останалите стоят с лицето надолу.</text>
</svg>
