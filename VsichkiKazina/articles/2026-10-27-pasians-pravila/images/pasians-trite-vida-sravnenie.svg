<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'DejaVu Sans','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2933">Пасианс: трите най-играни вида</text>
  <text x="380" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Една и съща идея, различни тесте, колони и цел</text>

  <!-- Card 1: Клондайк -->
  <g>
    <rect x="25" y="78" width="220" height="318" rx="12" fill="#f4f8f5" stroke="#cfe0d5"/>
    <rect x="25" y="78" width="220" height="40" rx="12" fill="#1f7a4d"/>
    <rect x="25" y="104" width="220" height="14" fill="#1f7a4d"/>
    <text x="135" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Клондайк (Косинка)</text>

    <text x="39" y="146" font-size="10.5" fill="#6b7280" letter-spacing="0.5">ТЕСТЕ</text>
    <text x="39" y="164" font-size="13" font-weight="600" fill="#1f2933">1 (52 карти)</text>

    <text x="39" y="192" font-size="10.5" fill="#6b7280" letter-spacing="0.5">КОЛОНИ</text>
    <text x="39" y="210" font-size="13" font-weight="600" fill="#1f2933">7</text>

    <text x="39" y="238" font-size="10.5" fill="#6b7280" letter-spacing="0.5">НАРЕЖДАНЕ В КОЛОНИТЕ</text>
    <text x="39" y="256" font-size="13" font-weight="600" fill="#1f2933">надолу, с редуване</text>
    <text x="39" y="273" font-size="13" font-weight="600" fill="#1f2933">на цветовете</text>

    <text x="39" y="301" font-size="10.5" fill="#6b7280" letter-spacing="0.5">ПОБЕДА</text>
    <text x="39" y="319" font-size="13" font-weight="600" fill="#1f2933">4 основи, асо до поп</text>
  </g>

  <!-- Card 2: Паяк -->
  <g>
    <rect x="270" y="78" width="220" height="318" rx="12" fill="#f4f5fb" stroke="#d2d7ea"/>
    <rect x="270" y="78" width="220" height="40" rx="12" fill="#3b4b8a"/>
    <rect x="270" y="104" width="220" height="14" fill="#3b4b8a"/>
    <text x="380" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Паяк (Spider)</text>

    <text x="284" y="146" font-size="10.5" fill="#6b7280" letter-spacing="0.5">ТЕСТЕ</text>
    <text x="284" y="164" font-size="13" font-weight="600" fill="#1f2933">2 (104 карти)</text>

    <text x="284" y="192" font-size="10.5" fill="#6b7280" letter-spacing="0.5">КОЛОНИ</text>
    <text x="284" y="210" font-size="13" font-weight="600" fill="#1f2933">10</text>

    <text x="284" y="238" font-size="10.5" fill="#6b7280" letter-spacing="0.5">НАРЕЖДАНЕ В КОЛОНИТЕ</text>
    <text x="284" y="256" font-size="13" font-weight="600" fill="#1f2933">надолу, без значение</text>
    <text x="284" y="273" font-size="13" font-weight="600" fill="#1f2933">на боята</text>

    <text x="284" y="301" font-size="10.5" fill="#6b7280" letter-spacing="0.5">ПОБЕДА</text>
    <text x="284" y="319" font-size="13" font-weight="600" fill="#1f2933">8 поредици, поп до асо</text>
  </g>

  <!-- Card 3: FreeCell -->
  <g>
    <rect x="515" y="78" width="220" height="318" rx="12" fill="#f1f8f8" stroke="#cfe3e3"/>
    <rect x="515" y="78" width="220" height="40" rx="12" fill="#0f6b6b"/>
    <rect x="515" y="104" width="220" height="14" fill="#0f6b6b"/>
    <text x="625" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">FreeCell</text>

    <text x="529" y="146" font-size="10.5" fill="#6b7280" letter-spacing="0.5">ТЕСТЕ</text>
    <text x="529" y="164" font-size="13" font-weight="600" fill="#1f2933">1 (52 карти)</text>

    <text x="529" y="192" font-size="10.5" fill="#6b7280" letter-spacing="0.5">КОЛОНИ</text>
    <text x="529" y="210" font-size="13" font-weight="600" fill="#1f2933">8 + 4 свободни клетки</text>

    <text x="529" y="238" font-size="10.5" fill="#6b7280" letter-spacing="0.5">НАРЕЖДАНЕ В КОЛОНИТЕ</text>
    <text x="529" y="256" font-size="13" font-weight="600" fill="#1f2933">надолу, с редуване</text>
    <text x="529" y="273" font-size="13" font-weight="600" fill="#1f2933">на цветовете</text>

    <text x="529" y="301" font-size="10.5" fill="#6b7280" letter-spacing="0.5">ПОБЕДА</text>
    <text x="529" y="319" font-size="13" font-weight="600" fill="#1f2933">4 основи, асо до поп</text>
  </g>

  <text x="380" y="418" text-anchor="middle" font-size="11.5" fill="#9aa5b1">При всички цел е да подредиш цялото тесте в основите по ред.</text>
</svg>
