<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 680" width="760" height="680" role="img" aria-labelledby="t d">
<title id="t">Тото Зодиак: как се смята шансът за печалба</title>
<desc id="d">5 числа от 1 до 50 и 1 зодия от 12 дават 25 425 120 възможни комбинации; шансът за всяка от десетте печеливши групи за една комбинация, от 1 на 25 425 120 за джакпота до 1 на 16,3 за 2 числа; каквато и да е печалба около 14,9%, приблизително 1 на 6,7.</desc>
