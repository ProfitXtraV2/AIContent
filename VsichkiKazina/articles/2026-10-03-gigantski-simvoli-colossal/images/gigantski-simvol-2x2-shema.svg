<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-label="Примерна барабанна решетка 5 на 3 с гигантски блок 2 на 2 вляво, който покрива четири позиции и се брои като четири еднакви символа. Числата и подредбата са примерни.">
  <style>
    .card{fill:#f7f8fa;stroke:#d9dee5;stroke-width:1.5}
    .title{font-family:'Segoe UI',Arial,sans-serif;font-size:23px;font-weight:700;fill:#1f2733}
    .sub{font-family:'Segoe UI',Arial,sans-serif;font-size:14px;fill:#6b7684}
    .cell{fill:#eef1f4;stroke:#cdd4dc;stroke-width:1.5}
    .giant{fill:#cfe8d6;stroke:#6fb98a;stroke-width:2}
    .dot{fill:#c3cad3}
    .gt{font-family:'Segoe UI',Arial,sans-serif;font-size:34px;font-weight:700;fill:#2f7d4f}
    .gs{font-family:'Segoe UI',Arial,sans-serif;font-size:16px;font-weight:700;fill:#2f7d4f}
    .note{font-family:'Segoe UI',Arial,sans-serif;font-size:15px;fill:#3a4452}
    .tag{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;fill:#6b7684}
  </style>
  <rect class="card" x="8" y="8" width="704" height="394" rx="16"/>
  <text class="title" x="360" y="52" text-anchor="middle">Блок 2x2 заема 4 позиции</text>
  <text class="sub" x="360" y="76" text-anchor="middle">барабанна решетка; подредбата е примерна</text>

  <!-- single cells (all except the 2x2 top-left block) -->
  <!-- row 0: cols 2,3,4 -->
  <rect class="cell" x="310" y="104" width="100" height="70" rx="6"/>
  <rect class="cell" x="420" y="104" width="100" height="70" rx="6"/>
  <rect class="cell" x="530" y="104" width="100" height="70" rx="6"/>
  <!-- row 1: cols 2,3,4 -->
  <rect class="cell" x="310" y="184" width="100" height="70" rx="6"/>
  <rect class="cell" x="420" y="184" width="100" height="70" rx="6"/>
  <rect class="cell" x="530" y="184" width="100" height="70" rx="6"/>
  <!-- row 2: cols 0,1,2,3,4 -->
  <rect class="cell" x="90"  y="264" width="100" height="70" rx="6"/>
  <rect class="cell" x="200" y="264" width="100" height="70" rx="6"/>
  <rect class="cell" x="310" y="264" width="100" height="70" rx="6"/>
  <rect class="cell" x="420" y="264" width="100" height="70" rx="6"/>
  <rect class="cell" x="530" y="264" width="100" height="70" rx="6"/>
  <!-- dots in single cells -->
  <circle class="dot" cx="360" cy="139" r="9"/><circle class="dot" cx="470" cy="139" r="9"/><circle class="dot" cx="580" cy="139" r="9"/>
  <circle class="dot" cx="360" cy="219" r="9"/><circle class="dot" cx="470" cy="219" r="9"/><circle class="dot" cx="580" cy="219" r="9"/>
  <circle class="dot" cx="140" cy="299" r="9"/><circle class="dot" cx="250" cy="299" r="9"/><circle class="dot" cx="360" cy="299" r="9"/><circle class="dot" cx="470" cy="299" r="9"/><circle class="dot" cx="580" cy="299" r="9"/>

  <!-- colossal 2x2 block covering cols 0-1, rows 0-1 -->
  <rect class="giant" x="90" y="104" width="210" height="150" rx="8"/>
  <text class="gt" x="195" y="178" text-anchor="middle">2x2</text>
  <text class="gs" x="195" y="206" text-anchor="middle">= 4 позиции</text>

  <text class="note" x="360" y="372" text-anchor="middle">Един блок 2x2 се чете като 4 еднакви символа.</text>
  <text class="tag"  x="360" y="394" text-anchor="middle">18+ Играйте отговорно</text>
</svg>
