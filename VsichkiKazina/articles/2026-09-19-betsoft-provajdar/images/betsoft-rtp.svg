<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Илюстративно разпределение при обявен RTP около 96 процента и 1000 евро оборот: около 960 евро се връщат на играча, около 40 евро остават за казиното. Триизмерната визия не променя този баланс.">
  <rect x="0" y="0" width="720" height="320" fill="#0f1720"/>
  <rect x="16" y="16" width="688" height="288" rx="14" fill="#16212e"/>

  <text x="40" y="56" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#f4f7fb">Визията е за окото, не за шансовете</text>
  <text x="40" y="82" font-family="Arial, sans-serif" font-size="15" fill="#9fb2c6">Илюстративно при €1000 оборот и обявен RTP ~96%</text>

  <!-- bar -->
  <rect x="40" y="110" width="640" height="52" fill="#24384c"/>
  <rect x="40" y="110" width="614" height="52" fill="#2e9e6b"/>
  <rect x="654" y="110" width="26" height="52" fill="#d98236"/>

  <text x="52" y="142" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Връща се на играча ~€960</text>

  <text x="680" y="186" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#e9b184">За казиното ~€40 (~4%)</text>

  <text x="40" y="228" font-family="Arial, sans-serif" font-size="15" fill="#c7d5e3">Кинематографичната 3D визия и кътсцените не променят</text>
  <text x="40" y="250" font-family="Arial, sans-serif" font-size="15" fill="#c7d5e3">RTP или домашното предимство.</text>

  <text x="40" y="286" font-family="Arial, sans-serif" font-size="13" fill="#8598ab">Числата са примерни · провери реалния RTP в инфо-панела · 18+ Играйте отговорно</text>
</svg>
