<svg viewBox="0 0 640 442" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="640" height="442" fill="#F8F6F2" rx="12"/>

  <!-- Title -->
  <text x="320" y="34" font-size="16" font-weight="700" fill="#1A1A2E" text-anchor="middle">Как работи Hold &amp; Win (респин с монети)</text>
  <text x="320" y="52" font-size="10" fill="#999999" text-anchor="middle">числата са примерни — конкретните ги пише в правилата на играта</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#666666"/>
    </marker>
  </defs>

  <!-- ===== SECTION 1: flow ===== -->
  <text x="28" y="78" font-size="12" font-weight="700" fill="#1A1A2E">Потокът на рунда</text>

  <!-- Box 1 -->
  <rect x="28" y="90" width="168" height="64" fill="#1A1A2E" rx="8"/>
  <text x="112" y="118" font-size="12" font-weight="700" fill="#F5D060" text-anchor="middle">Монети падат</text>
  <text x="112" y="136" font-size="11" fill="#CCCCCC" text-anchor="middle">и се заключват</text>

  <!-- Arrow 1 -->
  <line x1="200" y1="122" x2="232" y2="122" stroke="#666666" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Box 2 -->
  <rect x="236" y="90" width="168" height="64" fill="#EEF2FF" stroke="#2952C7" stroke-width="1.5" rx="8"/>
  <text x="320" y="112" font-size="12" font-weight="700" fill="#2952C7" text-anchor="middle">3 респина</text>
  <text x="320" y="128" font-size="10" fill="#555555" text-anchor="middle">всяка нова монета</text>
  <text x="320" y="142" font-size="10" fill="#555555" text-anchor="middle">нулира брояча на 3</text>

  <!-- Arrow 2 -->
  <line x1="408" y1="122" x2="440" y2="122" stroke="#666666" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Box 3 -->
  <rect x="444" y="90" width="168" height="64" fill="#FFF8DC" stroke="#C7A020" stroke-width="1.5" rx="8"/>
  <text x="528" y="112" font-size="11" font-weight="700" fill="#C7A020" text-anchor="middle">Пълна решетка</text>
  <text x="528" y="128" font-size="10" fill="#7A6410" text-anchor="middle">= горен фиксиран</text>
  <text x="528" y="142" font-size="10" fill="#7A6410" text-anchor="middle">джакпот</text>

  <!-- Grid note -->
  <text x="320" y="176" font-size="10.5" fill="#555555" text-anchor="middle">Пример: решетка 5×3 = 15 позиции за запълване</text>

  <!-- Divider -->
  <line x1="28" y1="192" x2="612" y2="192" stroke="#DDDDDD" stroke-width="1"/>

  <!-- ===== SECTION 2: jackpot ladder ===== -->
  <text x="28" y="214" font-size="12" font-weight="700" fill="#1A1A2E">Примерна джакпот стълбица (кратни на залога)</text>
  <text x="612" y="214" font-size="9.5" fill="#AAAAAA" text-anchor="end">лентите не са в мащаб</text>

  <!-- Row: Мини 20x -->
  <text x="28" y="245" font-size="11" fill="#333333">Мини</text>
  <rect x="120" y="230" width="86" height="24" fill="#F5D060" rx="4"/>
  <text x="214" y="247" font-size="11" font-weight="700" fill="#1A1A2E">20x</text>

  <!-- Row: Минор 50x -->
  <text x="28" y="281" font-size="11" fill="#333333">Минор</text>
  <rect x="120" y="266" width="150" height="24" fill="#F0C840" rx="4"/>
  <text x="278" y="283" font-size="11" font-weight="700" fill="#1A1A2E">50x</text>

  <!-- Row: Мейджър 500x -->
  <text x="28" y="317" font-size="11" fill="#333333">Мейджър</text>
  <rect x="120" y="302" width="252" height="24" fill="#D8AC28" rx="4"/>
  <text x="380" y="319" font-size="11" font-weight="700" fill="#1A1A2E">500x</text>

  <!-- Row: Гранд 2000x -->
  <text x="28" y="353" font-size="11" fill="#333333">Гранд</text>
  <rect x="120" y="338" width="372" height="24" fill="#C7A020" rx="4"/>
  <text x="500" y="355" font-size="11" font-weight="700" fill="#1A1A2E">2000x</text>

  <!-- Fixed-not-progressive note -->
  <rect x="28" y="378" width="584" height="34" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" rx="6"/>
  <text x="320" y="399" font-size="10.5" fill="#555555" text-anchor="middle">Фиксиран джакпот: вграден в RTP на играта, не мрежов прогресивен пул, който расте.</text>

  <!-- Footer -->
  <text x="320" y="432" font-size="9.5" fill="#BBBBBB" text-anchor="middle">18+ Играйте отговорно · vsichkikazina.bg</text>
</svg>
