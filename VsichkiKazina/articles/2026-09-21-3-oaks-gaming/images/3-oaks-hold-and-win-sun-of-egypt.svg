<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="Как работи Hold and Win на 3 Oaks Gaming и сравнение на Sun of Egypt 3 и 4: бонусът тръгва при 6 символа със слънце, които залепват; следват 3 повторни завъртания, които се нулират при нов символ; при запълнени 15 позиции печелиш Royal джакпота, който при Sun of Egypt 3 е 10 000 пъти залога. Sun of Egypt 3 е с RTP 95.61% и барабани 5x3, Sun of Egypt 4 е с RTP 95.47% и барабани 5x4, и двете с максимум 10 000 пъти залога.">
  <title>3 Oaks Gaming: Hold and Win и серията Sun of Egypt</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f7fb"/>
      <stop offset="100%" stop-color="#e8edf6"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="760" height="470" rx="14" ry="14" fill="url(#bg)"/>
  <text x="380" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#1e293b" text-anchor="middle">3 Oaks Gaming: Hold and Win и серията Sun of Egypt</text>
  <text x="380" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">бонусът, около който е изградено почти цялото портфолио на студиото</text>

  <text x="40" y="88" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569">Как тръгва бонусът</text>

  <!-- Step 1 -->
  <rect x="40" y="100" width="200" height="64" rx="10" fill="url(#step)"/>
  <text x="140" y="128" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">6 символа</text>
  <text x="140" y="150" font-family="system-ui, sans-serif" font-size="12" fill="#dbeafe" text-anchor="middle">със слънце · залепват</text>
  <text x="256" y="140" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#94a3b8" text-anchor="middle">›</text>

  <!-- Step 2 -->
  <rect x="280" y="100" width="200" height="64" rx="10" fill="url(#step)"/>
  <text x="380" y="128" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">3 завъртания</text>
  <text x="380" y="150" font-family="system-ui, sans-serif" font-size="12" fill="#dbeafe" text-anchor="middle">нулират се при нов символ</text>
  <text x="496" y="140" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#94a3b8" text-anchor="middle">›</text>

  <!-- Step 3 -->
  <rect x="520" y="100" width="200" height="64" rx="10" fill="url(#gold)"/>
  <text x="620" y="128" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">15 позиции</text>
  <text x="620" y="150" font-family="system-ui, sans-serif" font-size="12" fill="#fef3c7" text-anchor="middle">пълен екран = Royal</text>

  <text x="380" y="192" font-family="system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Пълен екран печели Royal джакпота: при Sun of Egypt 3 това е 10 000 пъти залога.</text>

  <text x="40" y="228" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569">Двете последни части на серията</text>

  <!-- Card 1: Sun of Egypt 3 -->
  <rect x="30" y="242" width="330" height="188" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="30" y="242" width="330" height="40" rx="11" fill="url(#step)"/>
  <text x="46" y="268" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Sun of Egypt 3</text>
  <text x="46" y="316" font-family="system-ui, sans-serif" font-size="13" fill="#475569">RTP</text>
  <text x="344" y="316" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="end">95.61%</text>
  <text x="46" y="354" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Барабани</text>
  <text x="344" y="354" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e293b" text-anchor="end">5x3 · 25 начина</text>
  <text x="46" y="392" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Макс. печалба</text>
  <text x="344" y="392" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#b45309" text-anchor="end">10 000 пъти</text>

  <!-- Card 2: Sun of Egypt 4 -->
  <rect x="400" y="242" width="330" height="188" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="400" y="242" width="330" height="40" rx="11" fill="url(#step)"/>
  <text x="416" y="268" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Sun of Egypt 4</text>
  <text x="416" y="316" font-family="system-ui, sans-serif" font-size="13" fill="#475569">RTP</text>
  <text x="714" y="316" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="end">95.47%</text>
  <text x="416" y="354" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Барабани</text>
  <text x="714" y="354" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e293b" text-anchor="end">5x4</text>
  <text x="416" y="392" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Макс. печалба</text>
  <text x="714" y="392" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#b45309" text-anchor="end">10 000 пъти</text>

  <text x="380" y="452" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">RTP-то се мени по версия; числата са от инфо-панела на всяка игра. 18+ Играйте отговорно.</text>
</svg>
