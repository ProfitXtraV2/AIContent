<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Петте вида хазартни игри по Закона за хазарта и кои може да се играят онлайн</title>
<desc id="d">Таблица с петте вида хазартни игри по чл. 41, ал. 1 ЗХ, примери, дали се допускат онлайн и правното основание. Онлайн не се допускат томболата и моментната лотария.</desc>
<rect x="0" y="0" width="760" height="580" fill="#f7f8fb"/>
<rect x="16" y="16" width="728" height="548" rx="14" fill="#ffffff" stroke="#d9dee8"/>
<text x="36" y="56" font-size="22" font-weight="700" fill="#1b2a41">Петте вида хазартни игри по Закона за хазарта</text>
<text x="36" y="80" font-size="14" fill="#55627a">и кои от тях може да се играят онлайн (чл. 41 ЗХ)</text>
<text x="80" y="110" font-size="12" font-weight="700" fill="#55627a">ВИД ХАЗАРТНА ИГРА</text>
<text x="580" y="110" font-size="12" font-weight="700" fill="#55627a" text-anchor="middle">ОНЛАЙН?</text>
<text x="676" y="110" font-size="12" font-weight="700" fill="#55627a" text-anchor="middle">ОСНОВАНИЕ</text>
<rect x="32" y="122" width="696" height="60" rx="8" fill="#f1f4f9"/>
<circle cx="56" cy="152" r="14" fill="#1b2a41"/>
<text x="56" y="157" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="82" y="148" font-size="15" font-weight="700" fill="#1b2a41">Лотарийни игри</text>
<text x="82" y="168" font-size="12.5" fill="#55627a">лото, тото, бинго, кено, томбола, скреч</text>
<rect x="548" y="138" width="64" height="28" rx="14" fill="#fdf3e1"/>
<text x="580" y="157" font-size="14" font-weight="700" fill="#b7791f" text-anchor="middle">Да*</text>
<text x="676" y="157" font-size="14" fill="#1b2a41" text-anchor="middle">чл. 48–49</text>
<rect x="32" y="192" width="696" height="60" rx="8" fill="#f1f4f9"/>
<circle cx="56" cy="222" r="14" fill="#1b2a41"/>
<text x="56" y="227" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="82" y="218" font-size="15" font-weight="700" fill="#1b2a41">Залагания на спорт и надбягвания</text>
<text x="82" y="238" font-size="12.5" fill="#55627a">спортни състезания, надбягвания с коне и кучета</text>
<rect x="548" y="208" width="64" height="28" rx="14" fill="#e6f4ec"/>
<text x="580" y="227" font-size="14" font-weight="700" fill="#2f855a" text-anchor="middle">Да</text>
<text x="676" y="227" font-size="14" fill="#1b2a41" text-anchor="middle">чл. 60</text>
<rect x="32" y="262" width="696" height="60" rx="8" fill="#f1f4f9"/>
<circle cx="56" cy="292" r="14" fill="#1b2a41"/>
<text x="56" y="297" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="82" y="288" font-size="15" font-weight="700" fill="#1b2a41">Залагания на случайни събития</text>
<text x="82" y="308" font-size="12.5" fill="#55627a">и залагания, свързани с познаване на факти</text>
<rect x="548" y="278" width="64" height="28" rx="14" fill="#e6f4ec"/>
<text x="580" y="297" font-size="14" font-weight="700" fill="#2f855a" text-anchor="middle">Да</text>
<text x="676" y="297" font-size="14" fill="#1b2a41" text-anchor="middle">чл. 62</text>
<rect x="32" y="332" width="696" height="60" rx="8" fill="#f1f4f9"/>
<circle cx="56" cy="362" r="14" fill="#1b2a41"/>
<text x="56" y="367" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="82" y="358" font-size="15" font-weight="700" fill="#1b2a41">Игри с игрални автомати</text>
<text x="82" y="378" font-size="12.5" fill="#55627a">слот машини в игрални зали</text>
<rect x="548" y="348" width="64" height="28" rx="14" fill="#e6f4ec"/>
<text x="580" y="367" font-size="14" font-weight="700" fill="#2f855a" text-anchor="middle">Да</text>
<text x="676" y="367" font-size="14" fill="#1b2a41" text-anchor="middle">чл. 64</text>
<rect x="32" y="402" width="696" height="60" rx="8" fill="#f1f4f9"/>
<circle cx="56" cy="432" r="14" fill="#1b2a41"/>
<text x="56" y="437" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="82" y="428" font-size="15" font-weight="700" fill="#1b2a41">Игри в игрално казино</text>
<text x="82" y="448" font-size="12.5" fill="#55627a">рулетка, блекджек, бакара, покер, зарове</text>
<rect x="548" y="418" width="64" height="28" rx="14" fill="#e6f4ec"/>
<text x="580" y="437" font-size="14" font-weight="700" fill="#2f855a" text-anchor="middle">Да</text>
<text x="676" y="437" font-size="14" fill="#1b2a41" text-anchor="middle">чл. 71</text>
<text x="36" y="478" font-size="12.5" fill="#b7791f">* Онлайн не се допускат томболата и моментната лотария (чл. 41, ал. 2 ЗХ).</text>
<text x="36" y="500" font-size="12.5" fill="#1b2a41">Каналът не променя вида на играта (чл. 41, ал. 1 ЗХ).</text>
<text x="36" y="520" font-size="12.5" fill="#1b2a41">Лицензът е само за изрично посочената игра (чл. 3, ал. 3 ЗХ). Лицензи издава НАП.</text>
<text x="36" y="544" font-size="12" font-weight="700" fill="#55627a">18+ Хазартът може да пристрасти. Играйте отговорно.</text>
</svg>
