<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Обявени RTP на топ заглавия на Push Gaming: Jammin' Jars 96.83%, Razor Shark 96.70%, Fat Rabbit 96.45%, Big Bamboo 96.13%, спрямо ориентир около 96% за модерните слотове; повечето седят около и малко над средното">
  <title>Обявени RTP на топ заглавия на Push Gaming спрямо ~96%</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="above" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" rx="12" ry="12" fill="url(#bg)"/>

  <text x="300" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#075985" text-anchor="middle">Обявен RTP на топ заглавия на Push Gaming</text>
  <text x="300" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">повечето седят около и малко над средното за модерните слотове (~96%)</text>

  <!-- 96% reference line: track 120..520 maps RTP 95.50..97.00; 96.00 at x = 120 + (96.00-95.50)*266.67 = 253 -->
  <line x1="253" y1="70" x2="253" y2="220" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="253" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4b5563" text-anchor="middle">~96%</text>

  <!-- Row 1: Jammin' Jars 96.83% -> width = (96.83-95.50)*266.67 = 355 -->
  <text x="112" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#374151" font-weight="600" text-anchor="end">Jammin' Jars</text>
  <rect x="120" y="80" width="400" height="22" rx="5" fill="#e5e7eb"/>
  <rect x="120" y="80" width="355" height="22" rx="5" fill="url(#above)"/>
  <text x="533" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0369a1" text-anchor="start">96.83%</text>

  <!-- Row 2: Razor Shark 96.70% -> width = 1.20*266.67 = 320 -->
  <text x="112" y="127" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#374151" font-weight="600" text-anchor="end">Razor Shark</text>
  <rect x="120" y="114" width="400" height="22" rx="5" fill="#e5e7eb"/>
  <rect x="120" y="114" width="320" height="22" rx="5" fill="url(#above)"/>
  <text x="533" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0369a1" text-anchor="start">96.70%</text>

  <!-- Row 3: Fat Rabbit 96.45% -> width = 0.95*266.67 = 253 -->
  <text x="112" y="161" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#374151" font-weight="600" text-anchor="end">Fat Rabbit</text>
  <rect x="120" y="148" width="400" height="22" rx="5" fill="#e5e7eb"/>
  <rect x="120" y="148" width="253" height="22" rx="5" fill="url(#above)"/>
  <text x="533" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0369a1" text-anchor="start">96.45%</text>

  <!-- Row 4: Big Bamboo 96.13% -> width = 0.63*266.67 = 168 -->
  <text x="112" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#374151" font-weight="600" text-anchor="end">Big Bamboo</text>
  <rect x="120" y="182" width="400" height="22" rx="5" fill="#e5e7eb"/>
  <rect x="120" y="182" width="168" height="22" rx="5" fill="url(#above)"/>
  <text x="533" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0369a1" text-anchor="start">96.13%</text>

  <text x="300" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Скала 95.50%–97.00% · източник: провайдър + международни игрални бази</text>

  <line x1="60" y1="262" x2="540" y2="262" stroke="#d1d5db" stroke-width="1"/>
  <text x="300" y="284" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Много заглавия се доставят в няколко версии с различен RTP · операторът избира коя да пусне</text>
  <text x="300" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">18+ Играйте отговорно · Провери реалния RTP в инфо-панела на конкретното казино</text>
</svg>
