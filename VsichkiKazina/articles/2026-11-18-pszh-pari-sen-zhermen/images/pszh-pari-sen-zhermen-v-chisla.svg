<svg xmlns="http://www.w3.org/2000/svg" width="820" height="712" viewBox="0 0 820 712" font-family="'DejaVu Sans','Segoe UI',Arial,sans-serif" role="img" aria-label="Инфографика: Пари Сен Жермен в числа, основаване, трофеи във Франция и европейският път">
  <rect width="820" height="712" fill="#f6f7f9"/>

  <!-- header -->
  <rect x="0" y="0" width="820" height="88" fill="#0b1b3a"/>
  <rect x="0" y="0" width="8" height="88" fill="#d01a2b"/>
  <text x="32" y="40" fill="#ffffff" font-size="24" font-weight="700">Пари Сен Жермен в числа</text>
  <text x="32" y="67" fill="#9fb0c9" font-size="14">Всички стойности следват текста на статията и са към 2026 г.</text>

  <!-- hero stat -->
  <rect x="24" y="104" width="772" height="80" rx="8" fill="#ffffff" stroke="#e2e6ee"/>
  <rect x="24" y="104" width="7" height="80" rx="3" fill="#d01a2b"/>
  <text x="52" y="158" fill="#0b1b3a" font-size="38" font-weight="800">2 поредни</text>
  <text x="300" y="140" fill="#0b1b3a" font-size="18" font-weight="700">титли в Шампионската лига</text>
  <text x="300" y="166" fill="#5a6b85" font-size="14">2025 г. и 2026 г., първи такъв клуб след „Реал" Мадрид (2018 г.)</text>

  <!-- club in brief -->
  <text x="24" y="212" fill="#0b1b3a" font-size="16" font-weight="700">Клубът накратко</text>
  <rect x="24" y="222" width="376" height="62" rx="8" fill="#ffffff" stroke="#e2e6ee"/>
  <text x="44" y="252" fill="#1d3f6e" font-size="22" font-weight="800">Основан 1970 г.</text>
  <text x="44" y="273" fill="#44526a" font-size="13">сливане на „Пари ФК" и „Стад Сен Жермен"</text>
  <rect x="420" y="222" width="376" height="62" rx="8" fill="#ffffff" stroke="#e2e6ee"/>
  <text x="440" y="252" fill="#1d3f6e" font-size="22" font-weight="800">„Парк де пренс"</text>
  <text x="440" y="273" fill="#44526a" font-size="13">дом на клуба от 1974 г., Париж</text>

  <!-- domestic trophies -->
  <text x="24" y="316" fill="#0b1b3a" font-size="16" font-weight="700">Трофеи във Франция (към 2026 г.)</text>
  <rect x="24" y="326" width="248" height="92" rx="8" fill="#ffffff" stroke="#e2e6ee"/>
  <text x="42" y="366" fill="#1d3f6e" font-size="30" font-weight="800">14</text>
  <text x="42" y="392" fill="#44526a" font-size="13">титли в Лига 1</text>
  <rect x="286" y="326" width="248" height="92" rx="8" fill="#ffffff" stroke="#e2e6ee"/>
  <text x="304" y="366" fill="#1d3f6e" font-size="30" font-weight="800">16</text>
  <text x="304" y="392" fill="#44526a" font-size="13">купи на Франция</text>
  <rect x="548" y="326" width="248" height="92" rx="8" fill="#ffffff" stroke="#e2e6ee"/>
  <text x="566" y="366" fill="#1d3f6e" font-size="30" font-weight="800">14</text>
  <text x="566" y="392" fill="#44526a" font-size="13">трофея на шампионите</text>

  <!-- european path -->
  <text x="24" y="450" fill="#0b1b3a" font-size="16" font-weight="700">Европейският път</text>

  <rect x="24" y="460" width="772" height="56" rx="8" fill="#ffffff" stroke="#e2e6ee"/>
  <text x="44" y="494" fill="#1d3f6e" font-size="15" font-weight="700">КНК 1996 г.</text>
  <text x="310" y="494" fill="#2a3547" font-size="15">финал 1:0 срещу „Рапид" Виена, Брюксел</text>
  <rect x="686" y="476" width="90" height="26" rx="13" fill="#e4f0e6"/>
  <text x="731" y="494" fill="#1f7a3d" font-size="14" font-weight="700" text-anchor="middle">трофей</text>

  <rect x="24" y="526" width="772" height="56" rx="8" fill="#ffffff" stroke="#e2e6ee"/>
  <text x="44" y="560" fill="#1d3f6e" font-size="15" font-weight="700">Шампионска лига 2025 г.</text>
  <text x="310" y="560" fill="#2a3547" font-size="15">финал 5:0 срещу „Интер", Мюнхен</text>
  <rect x="686" y="542" width="90" height="26" rx="13" fill="#e4f0e6"/>
  <text x="731" y="560" fill="#1f7a3d" font-size="14" font-weight="700" text-anchor="middle">трофей</text>

  <rect x="24" y="592" width="772" height="56" rx="8" fill="#ffffff" stroke="#e2e6ee"/>
  <text x="44" y="626" fill="#1d3f6e" font-size="15" font-weight="700">Шампионска лига 2026 г.</text>
  <text x="310" y="626" fill="#2a3547" font-size="15">финал с „Арсенал", 4:3 след дузпи, Будапеща</text>
  <rect x="686" y="608" width="90" height="26" rx="13" fill="#e4f0e6"/>
  <text x="731" y="626" fill="#1f7a3d" font-size="14" font-weight="700" text-anchor="middle">трофей</text>

  <!-- footer -->
  <text x="24" y="684" fill="#8591a6" font-size="12">18+ Играйте отговорно. Исторически данни, без прогнози.</text>
</svg>
