<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Илюстративно: официалният RTP на Gold Party е 96.50%; при €1000 оборот средно €965 се връщат на играча, €35 остават за казиното; има и версии с RTP 95.48% и 94.47%, които се проверяват в инфо-панела">
  <title>Илюстративно: RTP на Gold Party 96.50%</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f8f1"/>
      <stop offset="100%" stop-color="#e3efe0"/>
    </linearGradient>
    <linearGradient id="playerBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f7a3d"/>
      <stop offset="100%" stop-color="#3fa860"/>
    </linearGradient>
    <linearGradient id="houseBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#e0b036"/>
    </linearGradient>
    <clipPath id="barClip">
      <rect x="50" y="98" width="500" height="48" rx="8"/>
    </clipPath>
  </defs>

  <rect width="600" height="340" rx="12" ry="12" fill="url(#bg)"/>

  <text x="300" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1f6b38" text-anchor="middle">Gold Party: официален RTP 96.50% (Pragmatic Play)</text>
  <text x="300" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#5c7a5f" text-anchor="middle">илюстративен пример; операторът може да пусне версия с 95.48% или 94.47%</text>

  <text x="50" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#2f4a34" font-weight="600">Връщане към играча (RTP)</text>
  <text x="550" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#2f4a34" font-weight="600" text-anchor="end">Домашно предимство</text>

  <g clip-path="url(#barClip)">
    <rect x="50" y="98" width="500" height="48" fill="#d6e6d3"/>
    <rect x="50" y="98" width="483" height="48" fill="url(#playerBar)"/>
    <rect x="533" y="98" width="17" height="48" fill="url(#houseBar)"/>
  </g>

  <text x="291" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">96.50%</text>

  <line x1="50" y1="172" x2="550" y2="172" stroke="#c4dabf" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="300" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#5c7a5f" text-anchor="middle" font-style="italic">Пример: €1000 оборот</text>

  <rect x="50" y="211" width="220" height="86" rx="10" fill="#f0f8ee" stroke="#3fa860" stroke-width="1.5"/>
  <text x="160" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#1f6b38" text-anchor="middle" font-weight="600">Обратно към играча</text>
  <text x="160" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#1f7a3d" text-anchor="middle">~€965</text>
  <text x="160" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#2f8a4d" text-anchor="middle">(средно, дългосрочно)</text>

  <rect x="330" y="211" width="220" height="86" rx="10" fill="#fdf6e3" stroke="#d0a53a" stroke-width="1.5"/>
  <text x="440" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#7a5c14" text-anchor="middle" font-weight="600">За казиното</text>
  <text x="440" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#a5781a" text-anchor="middle">~€35</text>
  <text x="440" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#b8860b" text-anchor="middle">(домашно предимство ~3.5%)</text>

  <text x="300" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#a9c4a3" text-anchor="middle">+</text>

  <text x="300" y="326" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8aa085" text-anchor="middle">18+ Играйте отговорно · Провери реалния RTP в инфо-панела на конкретното казино</text>
</svg>
