<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 432" width="760" height="432" role="img" aria-label="Сравнение на топ слотове на ELK Studios по RTP, максимална печалба и година: Pirots 2 RTP 94.0% макс 10 000× 2023, Nitropolis 4 RTP 94.0% макс 50 000× 2023, Wild Toro 2 RTP 95.0% макс 10 000× 2021, Katmandu Gold RTP 96.2% макс 10 000× 2020, Cygnus 4 RTP 94.0% макс 50 000× 2024, Lake's Five RTP 96.3% макс 2160× 2018">
